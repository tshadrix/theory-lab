/* Common misconceptions (myth → reality) */
const MISC={
 behaviorism:[["Behaviorism is mostly about punishment.","Skinner argued reinforcement is far more powerful and reliable than punishment; positive reinforcement is the engine of operant conditioning."],["Behaviorism is dead.","Its applications — PBIS, ABA, direct instruction, habit design — are everywhere; what died was the claim that conditioning explains all learning."]],
 piaget:[["Students can't learn anything beyond their stage.","Piaget described typical tendencies of thought, not instructional ceilings; readiness can be nudged, and stages are more gradual and domain-specific than the labels imply."],["Piaget said discovery means leaving kids alone.","His constructivism is about active mental construction — which structured tasks and well-chosen provocations serve better than pure free exploration."]],
 vygotsky:[["Scaffolding means any kind of help.","Scaffolding is contingent, temporary support within the ZPD — calibrated to what the learner almost can do, and deliberately removed as competence grows."],["The ZPD is just 'challenge them a little.'","The ZPD is defined by what a learner can do WITH a more knowledgeable other — it's about assisted performance, not difficulty settings."]],
 cogload:[["Reducing cognitive load means making everything easy.","CLT targets extraneous load (bad design) so capacity is free for germane load (schema building); desirable difficulty and low extraneous load coexist."],["Worked examples create dependence.","For novices they outperform problem solving; the expertise reversal effect tells you when to fade them — it's a sequence, not a crutch."]],
 socialcognitive:[["Self-efficacy is just confidence.","It's a task-specific capability judgment with four identified sources; general confidence or self-esteem predicts far less than task-level efficacy."],["Modeling means students copy behavior.","Observers abstract rules and strategies from models — which is why think-alouds that expose invisible reasoning beat silent demonstrations."]],
 sdt:[["Rewards always destroy motivation.","The undermining effect applies mainly to expected, tangible rewards for already-interesting tasks; informational feedback and unexpected recognition don't carry the same risk."],["Autonomy support means letting students do whatever they want.","Autonomy support pairs meaningful choice and rationale WITH structure; SDT research finds structure and autonomy support work best together."]],
 mindset:[["Praising effort is the whole intervention.","Praising ineffective effort backfires; the target is process — strategies, choices, progress — and Dweck herself calls empty effort-praise a 'false growth mindset.'"],["Growth mindset explains most achievement differences.","Meta-analyses find small average effects, concentrated among struggling students; mindset is a modest lever, not a master key."]],
 bloom:[["The taxonomy is a ladder you must climb in order.","The hierarchy is heuristic; creating and analyzing often develop remembering, and experts move fluidly across levels."],["'Higher order' means avoiding recall.","Analysis and evaluation run ON knowledge; starving students of facts starves the higher levels too."]],
 udl:[["UDL means making separate versions for each student.","UDL builds flexible options into ONE design from the start — the opposite of retrofitting individual accommodations."],["UDL is only for students with disabilities.","Variability is universal; the framework claims (and evidence suggests) options benefit the full range of learners."]],
 desirable:[["If practice feels hard, something is wrong.","Effortful retrieval, spacing, and interleaving feel worse but produce more durable learning; fluent ease is often an illusion of competence."],["Testing is just for measuring learning.","Retrieval is a learning event — often more potent than restudying — which reframes low-stakes quizzing as instruction."]],
 multimedia:[["More engaging visuals always help.","Seductive details hurt learning; the coherence principle says cut interesting-but-irrelevant material."],["Reading slides aloud reinforces the message.","Identical narration and on-screen text overload the verbal channel (redundancy effect); pair graphics with narration instead."]],
 svr:[["Phonics is everything in the science of reading.","Decoding is necessary, not sufficient — comprehension equally requires vocabulary and background knowledge (the LC factor)."],["Comprehension is a general skill you can drill.","Comprehension depends heavily on knowledge of the topic; strategy instruction helps briefly, knowledge building compounds."]],
 flowerhayes:[["Writing means plan, draft, revise — in that order.","Flower and Hayes showed composing is recursive: planning, translating, and reviewing interleave constantly under an executive monitor."],["Good writers get it right the first time.","Experts revise more, and more globally, than novices — revision is where expert writing happens."]],
 transfer:[["Transfer happens automatically once something is learned well.","A century of research says otherwise: far transfer is rare without explicit abstraction (bridging) and contextual similarity (hugging)."],["Teaching general 'thinking skills' guarantees transfer.","Skills stay welded to content and context unless instruction deliberately connects them across contexts."]],
 knowles:[["Adults and children learn in completely different ways.","The adult/child dichotomy is overdrawn; andragogy's assumptions are design heuristics, and children can be self-directed while adults often aren't."],["Adult learners don't need structure.","Self-direction thrives WITH negotiated structure — contracts, milestones, feedback — not in its absence."]],
 kolb:[["Everyone has a fixed learning style to match.","Style-matching lacks evidence (Kolb's included); the cycle's value is ensuring ALL learners experience, reflect, conceptualize, and experiment."]],
 gardner_mi:[["MI means teaching each child in their 'intelligence.'","Gardner explicitly rejects learning-styles matching; MI argues for multiple entry points to the same rigorous content."],["MI is established cognitive science.","Psychometric support for autonomous intelligences is weak; treat MI as a values framework about breadth, not settled measurement."]],
 barkley:[["ADHD is a deficit of knowledge or effort.","It's a performance difference: knowing-doing gaps rooted in self-regulation, best addressed by structure at the point of performance, not lectures about trying harder."],["Everyone with ADHD has the same executive profile.","EF-test deficits appear in only a subset; profiles vary, so supports must be fitted, not prescribed."]],
 freire:[["Critical pedagogy means teachers can't teach content.","Freire opposed depositing, not expertise; he insisted rigor and directive teaching coexist with dialogue — he criticized permissive laissez-faire teaching too."]],
 dbr:[["DBR is just trying things and seeing what happens.","Each cycle tests explicit theoretical conjectures embodied in the design; conjecture mapping and systematic data separate DBR from tinkering."]],
 attribution:[["The lesson of attribution theory is 'always praise effort.'","Praising effort after genuine effort has failed quietly signals low ability; the safer, truer cause to offer is usually strategy — controllable, unstable, and actionable."],["Students' explanations for failure are just excuses.","Attributions are causal beliefs that drive future behavior; 'the test was unfair' versus 'I studied wrong' predict different futures, which makes them diagnostic data, not deflection."]],
 crp:[["Culturally relevant pedagogy means adding multicultural heroes and holidays.","Ladson-Billings calls that the shallow 'remix' — the actual pillars are academic success, cultural competence, AND critical consciousness, held together."],["CRP means lowering academic expectations to be 'sensitive.'","The founding studies documented the opposite: warm demanders pair high expectations with high support. Rigor is a pillar of the theory, not a casualty of it."]],
 situated:[["Situated learning means everything must be 'real-world.'","The claim is subtler: all learning is participation in some practice — including classroom practice. The design question is whether the practices students are joining resemble anything worth becoming good at."],["Legitimate peripheral participation is just watching from the sidelines.","Peripherality is active: sanctioned, low-risk, genuinely consequential contribution that grows — an apprentice's first real seam, not a spectator's seat."]],
 mezirow:[["Transformative learning means any powerful or memorable learning experience.","Mezirow's term is specific: revision of the frames of reference through which experience is interpreted — premise-level change, not a moving lesson."],["Discomfort itself transforms people.","Unsupported disorientation entrenches defenses. Transformation requires what follows the dilemma: critical reflection, discourse, and support through reintegration."]],
 schema:[["Activating prior knowledge is enough.","Activation is a pump and a pump needs a well: when the schema doesn't exist, the intervention is building knowledge over weeks of connected content, not a five-minute warm-up."],["Some students just have no background knowledge.","Everyone has rich schemas — the question is whether school texts and tests happen to draw on theirs. The deficit is often in the match, not the student."]],
 chall:[["Reading is basically mastered by the end of third grade.","Chall's entire point: after grade 3 the demands change in kind — reading to learn, weighing viewpoints, constructing knowledge — and development continues into adulthood."],["The fourth-grade slump means fourth-grade teachers are failing.","The slump is a demand shift colliding with vocabulary and knowledge that either accrued (or didn't) for years beforehand — a curriculum-long responsibility, not a grade-4 event."]],
 infoprocessing:[["Memory works like a recording you play back.","Memory is reconstructive: recall rebuilds the event from schemas each time, which is why it distorts — and why retrieval practice strengthens memory while passive replay doesn't."],["If students were paying attention, they'll remember it.","Attention is necessary, not sufficient. Without encoding work (connection, elaboration) and later retrieval practice, attended information still fades on schedule."]],
 backward:[["Backward design means teaching to the test.","It means designing an assessment worth teaching to — a genuine performance of understanding — before planning lessons. The sequence disciplines purpose; it doesn't drill items."],["Starting from objectives kills creativity and spontaneity.","Stages one and two fix the destination; stage three is wide open — creativity lives in designing the experiences. Purposeless activity isn't creativity; it's drift with good production values."]],
 hcd:[["Design thinking is brainstorming with sticky notes.","The notes are the least of it: the discipline is empathy research, problem framing, and tested iteration. HCD without users and prototypes is decoration."],["Empathy means asking people what they want and building it.","Stated wants, actual behaviors, and underlying needs routinely diverge — empathy work triangulates all three before the problem is even defined."]],
 srl:[["Self-regulated learners are just naturally organized students.","The cycle — planning, monitoring, reflecting — is teachable skill, not temperament; interventions reliably improve it, most when embedded in real content rather than taught as generic study skills."],["More effort is the answer to poor performance.","Zimmerman's research shows equally able students diverge on strategy and self-monitoring, not hours — time spent practicing errors consolidates the errors."]],
 expectancyvalue:[["Motivation is one thing students have more or less of.","EVT splits it into a decision: expectancy ('can I?') times value ('worth it?'), with cost holding veto power. Different components fail differently and need different repairs."],["Telling students the content is useful raises its value.","Asserted utility is weak and can backfire for low-confidence students; the replicated intervention has students generate their OWN connections in brief writing."]],
 nls:[["New Literacy Studies is about digital technology.","The 'new' names a theoretical turn from the 1980s — literacy as plural social practices, established through ethnographies of villages and neighborhoods; digital literacies are one later application."],["Valuing home literacies means lowering academic standards.","The tradition's own resolution (with Delpit) is both/and: bridge from the literacies students command TO explicit mastery of powerful academic codes — addition, never substitution."]],
 rosenblatt:[["Reader-response means every interpretation is equally valid.","Rosenblatt insisted the text constrains valid readings — interpretations are plural but warranted. 'Disciplined response' was her standard, not anything-goes."],["Efferent and aesthetic are types of texts.","They are stances the READER adopts — any text can be read either way. The tragedy is teaching students to read poems efferently by quizzing them to death."]],
 writing_sociocultural:[["A genre is a format to fill in.","A genre is a social action — a typified response to a recurring situation. Teach the moves with their purposes, or the format ossifies into the five-paragraph ghost."],["Good writing is good writing, everywhere.","Every community defines 'good' by its own purposes: the lab report and the historical argument reward different moves — which is why the A-essayist can honestly fail the lab report."]],
 connectivism:[["Connectivism says memorization no longer matters.","Even its friendliest reading keeps foundations: evaluating and integrating networked information runs on stored knowledge. The claim is that currency and connection-seeing joined the curriculum — not that memory left it."],["Using technology in class is connectivist learning.","The theory is about network formation — nodes, ties, curation, evaluation — not tool use. A worksheet on a tablet is still a worksheet."]]
};

/* One switcher used by the nav AND the hash router, so both stay in sync. */
function goTab(name, opts){
  opts=opts||{};
  document.querySelectorAll('#nav button').forEach(x=>{
    const on = x.dataset.tab===name;
    x.classList.toggle('active', on);
    if(on){ x.setAttribute('aria-current','page'); } else { x.removeAttribute('aria-current'); }
  });
  ['library','cards','compare','scenarios','framework','index'].forEach(t=>$('#tab-'+t).classList.toggle('hidden', t!==name));
  currentTab=name;
  if(name==='cards') buildDeck();
  if(name==='compare') renderCompare();
  if(name==='index') renderIndex();
  if(name==='framework') renderFramework();
  const TT={library:'Library',cards:'Flashcards',compare:'Compare',scenarios:'Scenarios',framework:'My Framework',index:'Master Index'};
  if(!opts.silent) document.title=(TT[name]||'The Theory Lab')+' — The Theory Lab';
  if(!opts.fromHash) location.hash='#'+name;
}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>goTab(b.dataset.tab)));

function renderChips(){
  $('#vtog').innerHTML=[['subject','📚 By subject'],['question','🧑‍🏫 By teaching question'],['problem','🩺 By classroom problem']].map(([v,l])=>`<button class="chip ${viewMode===v?'active':''}" data-v="${v}">${l}</button>`).join('');
  document.querySelectorAll('#vtog .chip').forEach(c=>c.addEventListener('click',()=>{viewMode=c.dataset.v; activeQ=0; renderChips(); renderList();}));
  if(viewMode==='subject'){
    $('#chips').innerHTML=['All','★ Shadrix Matrix',...ALLCATS].map(d=>`<button class="chip ${d===activeDisc?'active':''}" data-d="${esc(d)}">${esc(d)}</button>`).join('');
    document.querySelectorAll('#chips .chip').forEach(c=>c.addEventListener('click',()=>{activeDisc=c.dataset.d; renderChips(); renderList();}));
  }else{
    const bank=viewMode==='question'?TEACH:PROB;
    $('#chips').innerHTML=bank.map((t,i)=>`<button class="chip ${i===activeQ?'active':''}" data-i="${i}">${esc(t.label)}</button>`).join('');
    document.querySelectorAll('#chips .chip').forEach(c=>c.addEventListener('click',()=>{activeQ=+c.dataset.i; renderChips(); renderList();}));
  }
}
function matches(t,q){
  if(!q) return true; q=q.toLowerCase();
  const hay=[t.name,t.theorists,t.tagline,t.discipline,(t.constructs||[]).map(c=>c.term+' '+c.def).join(' '),(t.claims||[]).join(' ')].join(' ').toLowerCase();
  return hay.includes(q);
}
function renderList(){
  $('#detail').classList.add('hidden'); $('#list').classList.remove('hidden'); $('.toolbar').classList.remove('hidden'); $('#chips').classList.remove('hidden'); $('#vtog').classList.remove('hidden');
  const q=$('#q').value.trim();
  const card=t=>`
    <div class="tcard" data-id="${t.id}">
      <div class="disc">${esc(t.discipline)}</div>
      <h3>${esc(t.name)}${kindBadge(t)}${t.dis?'<span class="badge" style="background:var(--accent-soft);color:#134441;">★ matrix</span>':''}${t.depth==='starter'?'<span class="badge">starter</span>':''}</h3>
      <div class="who">${esc(t.theorists)}</div>
      <p>${esc(t.tagline)}</p>
    </div>`;
  const stubCard=(cat,s,si)=>`
    <div class="tcard stub2" data-cat="${esc(cat)}" data-si="${si}">
      <div class="disc">${esc(cat)}</div>
      <h3>${esc(s[0])}<span class="badge horizon">on the horizon</span></h3>
      <p>${esc(s[1])}</p>
    </div>`;
  const stubMatch=(s)=>!q||((s[0]+' '+s[1]).toLowerCase().includes(q.toLowerCase()));
  let html='', count=0, lead='';
  if(viewMode==='question'||viewMode==='problem'){
    const cl=(viewMode==='question'?TEACH:PROB)[activeQ];
    const items=cl.ids.map(id=>byId(id)).filter(Boolean).filter(t=>matches(t,q));
    count=items.length;
    lead=`<div class="qlead"><b>${esc(cl.q)}</b><br>${esc(cl.why)}</div>`;
    html=items.map(card).join('');
  }else if(activeDisc==='★ Shadrix Matrix'){
    const items=THEORIES.filter(t=>t.dis&&matches(t,q));
    count=items.length; html=items.map(card).join('');
  }else{
    const cats=activeDisc==='All'?ALLCATS:[activeDisc];
    cats.forEach(cat=>{
      const built=THEORIES.filter(t=>t.discipline===cat&&matches(t,q));
      const stubs=(STUBS[cat]||[]).map((s,si)=>[s,si]).filter(([s])=>stubMatch(s));
      count+=built.length+stubs.length;
      html+=built.map(card).join('')+stubs.map(([s,si])=>stubCard(cat,s,si)).join('');
    });
  }
  $('#list').innerHTML=lead+(count?html:'<div class="empty">No theories match that search.</div>');
  document.querySelectorAll('.tcard:not(.stub2)').forEach(c=>c.addEventListener('click',()=>showDetail(c.dataset.id)));
  document.querySelectorAll('.tcard.stub2').forEach(c=>c.addEventListener('click',()=>showStub(c.dataset.cat,+c.dataset.si)));
}
function showStub(cat,si){
  const s=(STUBS[cat]||[])[si]; if(!s) return;
  $('#list').classList.add('hidden'); $('.toolbar').classList.add('hidden'); $('#chips').classList.add('hidden'); $('#vtog').classList.add('hidden');
  const d=$('#detail'); d.classList.remove('hidden');
  d.innerHTML=`<div class="detail">
    <button class="backbtn">← All theories</button>
    <div style="font-family:'Helvetica Neue',Arial,sans-serif;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;">${esc(cat)}</div>
    <h2>${esc(s[0])}</h2>
    <p style="font-size:.98rem;"><em>${esc(s[1])}</em></p>
    <section><h4>Status</h4>
      <p style="font-size:.94rem;">This theory is mapped but not yet built out. To add the full entry — origins, core claims, key constructs, applications, critiques, and APA references — ask Claude: <b>"Build out ${esc(s[0])}"</b>, then upload the updated file to GitHub. It will join the flashcards and comparisons automatically.</p>
    </section>
  </div>`;

  const hh=d.querySelector('h2'); if(hh) hh.focus({preventScroll:true});

  d.querySelector('.backbtn').addEventListener('click',()=>{
    if(location.hash.indexOf('#t/')===0){ history.replaceState(null,'','#library'); document.title='The Theory Lab — EdD Study Companion'; }

}
/* v23: references may be a plain string or {r, url}. Every reference gets a
   way to reach the source — a verified link where we have one, otherwise a
   Google Scholar search built from the citation itself (never a guessed DOI). */
function refText(r){ return (typeof r==='string') ? r : (r && r.r) || ''; }
function refLine(r){
  const txt = refText(r);
  const url = (typeof r==='object' && r && r.url) ? r.url : null;
  const plain = txt.replace(/<[^>]*>/g,'');
  const scholar = 'https://scholar.google.com/scholar?q=' + encodeURIComponent(plain.slice(0,300));
  const label = url ? 'source ↗' : 'find it ↗';
  return '<li>'+txt+' <a class="reflink" href="'+(url||scholar)+'" target="_blank" rel="noopener">'+label+'</a></li>';
}

/* ===== MY FRAMEWORK (v24) =========================================
   Lets a doctoral student tag each theory by the role it plays in their
   study, add a private rationale note, and export the whole map with APA
   references. Everything is stored in this browser only. ============== */
const FW_ROLES = [
  ['framework','Theoretical framework'],
  ['method','Methodology'],
  ['lit','Related literature'],
  ['considered','Considered & set aside']
];
function fwAll(){ return store.get('framework', {}); }
function fwGet(id){ return fwAll()[id] || null; }
function fwSet(id, role){
  const m = fwAll();
  if(!role){ delete m[id]; } else { m[id] = Object.assign({}, m[id]||{}, {role:role}); }
  store.set('framework', m);
}
function fwNote(id, txt){
  const m = fwAll();
  if(!m[id]) m[id] = {role:'lit'};
  m[id].note = txt; store.set('framework', m);
}
function fwControls(t){
  const cur = fwGet(t.id);
  const role = cur && cur.role;
  return '<div class="fwlabel">My dissertation map</div>'
    + '<div class="fwrow">'
    + FW_ROLES.map(([k,l])=>'<button class="fwbtn fw-'+k+(role===k?' on':'')+'" data-fw="'+k+'">'+l+'</button>').join('')
    + (role?'<button class="fwbtn" data-fw="">Clear</button>':'')
    + '</div>'
    + (role?'<textarea class="fwnote" data-fwnote="1" placeholder="Why this theory earns a place in your study — one or two sentences you can lift into a chapter.">'+esc((cur&&cur.note)||'')+'</textarea>':'')
    + '<div class="note" style="font-size:.72rem;color:#6B7280;">Saved on this device only.</div>';
}
function renderFramework(){
  const area=$('#fw-area');
  const m=fwAll();
  const ids=Object.keys(m);
  if(!ids.length){
    area.innerHTML='<div class="detail"><h2 tabindex="-1">My Framework</h2>'
      +'<p style="font-size:.96rem;">Open any theory and tag it by the role it plays in your study — theoretical framework, methodology, related literature, or considered and set aside. Tagged theories gather here, with your notes, ready to export with APA references.</p>'
      +'<p class="note" style="font-size:.8rem;">Recording what you considered <i>and rejected</i> is not busywork: committees ask why you chose this lens over its neighbors, and the answer is much easier to write down now than to reconstruct later.</p>'
      +'<p class="note" style="font-size:.8rem;">Everything is stored in this browser only — nothing is uploaded, and clearing browser data clears it.</p></div>';
    return;
  }
  let html='<div class="detail"><h2 tabindex="-1">My Framework</h2>'
    +'<p class="note" style="font-size:.8rem;">'+ids.length+' theories mapped. Stored on this device only.</p>'
    +'<div class="fwrow"><button class="fwbtn" id="fwcopy">Copy the whole map (with references)</button>'
    +'<button class="fwbtn" id="fwcopyrefs">Copy references only (APA)</button></div>';
  FW_ROLES.forEach(([k,l])=>{
    const items=ids.filter(id=>m[id].role===k).map(id=>byId(id)).filter(Boolean);
    if(!items.length) return;
    html+='<div class="fwgroup"><h3>'+l+' <span style="opacity:.6;font-weight:400;">('+items.length+')</span></h3>';
    items.forEach(t=>{
      html+='<div class="fwitem"><div><b>'+esc(t.name)+'</b>'
        +'<div class="note" style="font-size:.75rem;">'+esc(t.theorists||'')+'</div>'
        +((m[t.id].note)?'<div style="font-size:.85rem;margin-top:5px;">'+esc(m[t.id].note)+'</div>':'')
        +'</div><button class="rm" data-fwrm="'+t.id+'">remove</button></div>';
    });
    html+='</div>';
  });
  html+='</div>';
  area.innerHTML=html;
  const hh=area.querySelector('h2'); if(hh) hh.focus({preventScroll:true});
  area.querySelectorAll('[data-fwrm]').forEach(b=>b.addEventListener('click',()=>{ fwSet(b.dataset.fwrm,null); renderFramework(); }));
  const mk=(withNotes)=>{
    let out='MY DISSERTATION FRAMEWORK MAP\n\n';
    FW_ROLES.forEach(([k,l])=>{
      const items=ids.filter(id=>m[id].role===k).map(id=>byId(id)).filter(Boolean);
      if(!items.length) return;
      out+=l.toUpperCase()+'\n';
      items.forEach(t=>{
        out+='\n• '+t.name+' ('+(t.theorists||'')+')';
        if(withNotes && m[t.id].note) out+='\n  Rationale: '+m[t.id].note;
        out+='\n  References:\n';
        (t.refs||[]).forEach(r=>{ out+='    '+refText(r).replace(/<[^>]*>/g,'')+'\n'; });
      });
      out+='\n';
    });
    return out;
  };
  const mkRefs=()=>{
    const seen=new Set(); const lines=[];
    ids.map(id=>byId(id)).filter(Boolean).forEach(t=>(t.refs||[]).forEach(r=>{
      const s=refText(r).replace(/<[^>]*>/g,''); if(!seen.has(s)){seen.add(s);lines.push(s);}
    }));
    return lines.sort().join('\n\n');
  };
  const btn1=$('#fwcopy'), btn2=$('#fwcopyrefs');
  if(btn1) btn1.addEventListener('click',()=>{ if(navigator.clipboard) navigator.clipboard.writeText(mk(true)).then(()=>{btn1.textContent='✓ Copied';btn1.classList.add('on');}).catch(()=>{}); });

/* --- flashcards --- */
let deck=[], deckPos=0, seen=0, flipped=false;
function fcPool(){
  const disc=$('#fc-disc').value, mode=$('#fc-mode').value;
  const pool=[];
  THEORIES.filter(t=>disc==='All'||t.discipline===disc).forEach(t=>{
    if(mode==='construct') (t.constructs||[]).forEach(c=>pool.push({f:`${c.term}\n\n(${t.name})`, b:c.def, k:`c|${t.id}|${c.term}`}));
    if(mode==='theorist') pool.push({f:`Who is most associated with:\n\n${t.name}?`, b:t.theorists, k:`t|${t.id}`});
    if(mode==='claim') (t.claims||[]).slice(0,2).forEach((cl,i)=>pool.push({f:`Which theory claims:\n\n“${cl}”`, b:`${t.name} — ${t.theorists}`, k:`cl|${t.id}|${i}`}));
    if(mode==='myth') (MISC[t.id]||[]).forEach((p,i)=>pool.push({f:`Bust the myth:\n\n“${p[0]}”\n\n(${t.name})`, b:p[1], k:`m|${t.id}|${i}`}));
  });
  return pool;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildDeck(){
  const dsel=$('#fc-disc');
  if(!dsel.options.length){ dsel.innerHTML=['All',...DISCS].map(d=>`<option>${esc(d)}</option>`).join(''); dsel.addEventListener('change',buildDeck); $('#fc-mode').addEventListener('change',buildDeck); $('#fc-size').addEventListener('change',buildDeck); }
  const pool=fcPool(), n=+$('#fc-size').value, now=Date.now(), rec=store.get('srs',{});
  const due=[], fresh=[], later=[];
  pool.forEach(c=>{ const r=rec[c.k]; if(!r) fresh.push(c); else if(r.due<=now) due.push(c); else later.push(c); });
  shuffle(due); shuffle(fresh); shuffle(later);
  const ordered=[...due,...fresh,...later];
  deck=n?ordered.slice(0,n):ordered; deckPos=0; seen=0;
  const s=store.get('stats',{total:0,streak:0});
  $('#fc-stats').textContent=`Due now: ${due.length} · New: ${fresh.length} · Streak: ${s.streak||0} day${s.streak===1?'':'s'} · ${s.total||0} lifetime reviews`;
  renderCard();
}
function renderCard(){
  const area=$('#fc-area'); flipped=false;
  if(!deck.length){area.innerHTML='<div class="empty">No cards for this filter.</div>';return;}
  if(deckPos>=deck.length){area.innerHTML=`<div class="empty">Deck done — ${seen} reviews. That's a real win; retrieval now beats rereading later. 🎓<br><br><button class="rellink" onclick="buildDeck()">New round</button></div>`;return;}
  const c=deck[deckPos];
  area.innerHTML=`
    <div class="fcstage"><div class="fcard" id="fc">
      <div class="face front"><div class="lbl">Prompt — tap to flip</div><div class="txt">${esc(c.f).replace(/\n/g,'<br>')}</div></div>
      <div class="face back"><div class="lbl">Answer</div><div class="txt">${esc(c.b)}</div></div>
    </div></div>
    <div class="fcbtns">
      <button class="again">↺ Again</button>
      <button class="good">✓ Got it</button>
    </div>
    <div class="fcmeta">Card ${Math.min(deckPos+1,deck.length)} of ${deck.length}</div>`;
  $('#fc').addEventListener('click',()=>{flipped=!flipped;$('#fc').classList.toggle('flip');});
  area.querySelector('.again').addEventListener('click',()=>{seen++; grade(c.k,false); deck.push(deck[deckPos]); deckPos++; renderCard();});
  area.querySelector('.good').addEventListener('click',()=>{seen++; grade(c.k,true); deckPos++; renderCard();});
}

/* --- scenarios --- */
let sIdx=0, sScore=0, sAnswered=0;
function renderScenario(){
  const area=$('#scen-area');
  if(!window._scenOrder || window._scenOrder.length!==SCENARIOS.length) window._scenOrder=shuffle(SCENARIOS.map((_,i)=>i));
  if(sIdx>=SCENARIOS.length){
    const best=Math.max(sScore,store.get('scenBest',0)); store.set('scenBest',best);
    area.innerHTML=`<div class="scen"><div class="stext">Round complete: <b>${sScore} / ${SCENARIOS.length}</b> correct. Personal best: <b>${best}</b>.</div>
    <div class="scen-nav"><span class="scorepill">Repetition builds transfer — run it again.</span><button onclick="sIdx=0;sScore=0;sAnswered=0;window._scenOrder=null;renderScenario()">Restart</button></div></div>`;
    return;
  }
  const s=SCENARIOS[window._scenOrder[sIdx]];
  /* Randomize option order every time a scenario is shown, so answer position
     never carries information and repeat rounds stay honest. data-i keeps the
     ORIGINAL index, so scoring against s.answer is unchanged. */
  const sOrder=shuffle(s.options.map((_,i)=>i));
  area.innerHTML=`<div class="scen">
    <div class="scorepill" style="margin-bottom:8px;">Scenario ${sIdx+1} of ${SCENARIOS.length} · Score ${sScore}</div>
    <div class="stext">${esc(s.scene)}</div>
    ${sOrder.map(i=>`<button class="opt" data-i="${i}">${esc(s.options[i])}</button>`).join('')}
    <div id="why"></div>
    <div class="scen-nav"><span></span><button id="nextS" disabled>Next →</button></div>
  </div>`;
  let done=false;
  area.querySelectorAll('.opt').forEach(btn=>btn.addEventListener('click',()=>{
    if(done) return; done=true;
    const i=+btn.dataset.i;
    if(i===s.answer){btn.classList.add('correct'); sScore++;}
    else{btn.classList.add('wrong'); area.querySelector(`.opt[data-i="${s.answer}"]`).classList.add('correct');}
    $('#why').innerHTML=`<div class="why"><b>Why:</b> ${esc(s.why)}</div>`
      + (s.near?`<div class="why" style="margin-top:8px;"><b>Why not the others:</b> ${esc(s.near)}</div>`:'');
    $('#nextS').disabled=false;
  }));
  $('#nextS').addEventListener('click',()=>{sIdx++;renderScenario();});
}

const ALLCATS=[...DISCS, ...Object.keys(STUBS).filter(k=>!DISCS.includes(k))];
function renderIndex(){
  const area=$('#index-area');
  let builtT=0, allT=0, html='';
  ALLCATS.forEach(d=>{
    const built=THEORIES.filter(t=>t.discipline===d);
    const stubs=STUBS[d]||[];
    builtT+=built.length; allT+=built.length+stubs.length;
    html+=`<div class="idx"><h3>${esc(d)}<span>${built.length} of ${built.length+stubs.length} built</span></h3>`;
    html+=built.map(t=>`<button class="idx-item built" data-id="${t.id}">✓ ${esc(t.name)}${t.dis?' ★':''}</button>`).join('');
    html+=stubs.map(s=>`<div class="idx-item stub"><b>${esc(s[0])}</b> — ${esc(s[1])}</div>`).join('');
    html+='</div>';
  });
  area.innerHTML=html;
  area.querySelectorAll('.idx-item.built').forEach(b=>b.addEventListener('click',()=>{
    goTab('library',{silent:true,fromHash:true});
    showDetail(b.dataset.id);
  }));
}

/* --- hash router (v23) -------------------------------------------------
   #t/<theory-id>  → opens that theory directly (shareable deep link)
   #library #cards #compare #scenarios #index → opens that tab
   Enables: linking a cohort straight to one theory, browser back/forward,
   and precise cross-links from The Instructional Studio.                */
function routeFromHash(){
  const raw=(location.hash||'').slice(1);
  if(!raw) return false;
  if(raw.indexOf('t/')===0){
    const id=raw.slice(2);
    if(byId(id)){ goTab('library',{silent:true,fromHash:true}); showDetail(id,{fromHash:true}); return true; }
    return false;
  }
  if(['library','cards','compare','scenarios','framework','index'].indexOf(raw)>=0){
    goTab(raw,{fromHash:true}); return true;
  }
  return false;
}
window.addEventListener('hashchange',()=>{ if(!routeFromHash()) goTab('library',{fromHash:true}); });

renderChips(); renderList(); fillCmp(); renderScenario();
routeFromHash();
