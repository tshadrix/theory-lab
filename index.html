{
 id:"bloom", name:"Bloom's Taxonomy (Revised)", discipline:"Education & Pedagogy", depth:"deep",
 theorists:"Benjamin Bloom (1956); revised by Lorin Anderson & David Krathwohl (2001)",
 tagline:"A hierarchy of cognitive processes — remember, understand, apply, analyze, evaluate, create — for classifying objectives, instruction, and assessment.",
 problem:"A syllabus promises analysis and critical thinking; the exam asks for definitions. A district demands 'rigor' and nobody in the meeting can say what the word measures. A lesson's objective says students will evaluate — the worksheet says list three. Education runs on claims about thinking that nothing audits. Bloom's committee built the audit tool: a shared classification of cognitive demand so that objectives, activities, and assessments could be compared honestly — and so 'rigor' could mean something you can point to in the task, not a feeling about the teacher.",
 asks:["Can cognitive demand be classified consistently enough to plan and audit with?","What is rigor, operationally — in the task, not the tone?","Do objectives, activities, and assessments in a given unit actually ask for the same thinking?","How do types of knowledge (factual, conceptual, procedural, metacognitive) cross with types of processing?"],
 iftrue:{
  teachers:"Write objectives as verb plus knowledge type, then audit ruthlessly: does the assessment demand what the verb promised? Plan question ladders on purpose — recitation gravity pulls everything toward remember unless you climb deliberately. And respect the floor: remember-level knowledge is not the enemy of higher-order thinking; it is its raw material — analysis runs on things known.",
  coaches:"The alignment audit is your highest-leverage artifact review: put the unit's objective, its central task, and its assessment side by side and classify each — the mismatches do the coaching for you. Bring question-stem tallies from observations (what percentage of today's questions lived at remember?). And name verb theater kindly when you see it: a glamorous verb attached to a recall task.",
  leaders:"Before the next rigor initiative, audit the assessments — demand distribution across a semester's tests tells you what the school actually values, whatever the vision statement says. Build shared demand-language (Bloom's or DOK) so 'rigorous' means something in curriculum adoption, walkthroughs, and PLC talk — and so the word stops being a compliment and starts being a claim.",
  researchers:"The taxonomy's research life is as an instrument: coding tasks, questions, and assessments for cognitive demand with reliable rubrics. The hierarchy itself is a testable claim that has fared modestly — treat levels as categories, not a validated staircase, and the taxonomy table (process × knowledge) as the analytically interesting object."},
 reasoning:{
  notice:["The verb–task gap: what the objective says versus what the task can be completed by doing — the gap is where rigor claims go to die.","Your own question distribution: record fifteen minutes of class talk and classify; most rooms are humbled by the tally.","Students who recall perfectly and freeze at application — the missing middle rungs between knowing and using.","Assessments that cap below instruction (taught analysis, tested recall) — or above it (taught recall, tested synthesis, blamed students)."],
  assume:["That the hierarchy is a strict ladder — the levels interact and loop; creating can drive remembering, and experts bounce across levels constantly.","That higher is always the goal: automatized factual and procedural knowledge is what frees capacity for the higher levels (the cognitive-load connection).","That the verb guarantees the thinking — a 'create' task can be cognitively trivial (the diorama problem), and a 'recall' question can hide genuine analysis. Classify the demand, not the vocabulary."],
  decide:["Audit each unit on the taxonomy table: process level crossed with knowledge type, for objective, activities, and assessment.","Design tasks where the demanded thinking is the graded thinking — rubric criteria at the level the objective claims.","Build question ladders into discussion plans, with the top rungs written in advance (they don't improvise well).","When misalignment is deliberate (recall drill before analysis), say so out loud — conscious misalignment is sequencing; unconscious misalignment is drift."],
  avoid:["Verb decoration — upgrading the objective's vocabulary without touching the task.","Skipping knowledge-building in rigor's name: analysis without knowledge is opinion with formatting.","One-level teaching in either direction — all recall or all 'projects.'","Rubrics that grade effort, neatness, and completion while the objective claimed evaluation."]},
 competing:[
  {scenario:"The big 'rigorous' project produced beautiful artifacts and shallow learning.", thisView:"Classify the actual demand: assembling, decorating, and presenting mostly lived at remember-and-understand — the poster was gorgeous and the thinking was low. Redesign so the deliverable requires the analysis it advertised.", other:"Cognitive Load Theory (Sweller)", otherView:"Or the demand was genuinely high and unmanaged: novices given a complex open task drowned in load, coped by decorating, and the shallow learning was overload's signature, not laziness's.", agree:"Both insist rigor lives in the thinking actually demanded — and both prescribe the same audit: what did the task require, of whom, with what support? High demand plus managed load is the target; either alone fails."},
  {scenario:"Is the hierarchy even real?", thisView:"As pedagogy's working model: the categories are teachable, auditable, and shared — and distinguishing recall from analysis in a task is a skill that measurably improves planning and assessment.", other:"The empirical critique (Marzano and others)", otherView:"The strict cumulative ladder lacks support: levels overlap, order varies by domain and learner, and 'higher' isn't uniformly harder. A taxonomy this influential should rest on more than committee consensus.", agree:"Both can be right at once: weak as a psychological staircase, strong as a classification instrument. Use it to audit alignment and vary demand — not to sequence learning as if thinking climbed one rung at a time."}],
 research:{
  questions:["How reliably can cognitive demand be coded in tasks, questions, and assessments?","What is the actual demand distribution in typical classrooms and tests — and what shifts it?","Does aligning objective, task, and assessment demand improve learning?","Does the process-by-knowledge matrix predict distinct learning outcomes?"],
  methods:"Content analysis of curricula and assessments with demand-coding rubrics; classroom discourse studies classifying question levels; alignment studies (the Webb DOK tradition is kin); occasional experimental tests of the hierarchy's ordering.",
  variables:"Coded demand levels of objectives, tasks, questions, and assessments; alignment indices among them; and student outcomes by demand exposure.",
  support:"As an instrument, ubiquitous and serviceable: demand coding achieves respectable reliability, and alignment auditing has real practical yield. As psychology, modest: the strict hierarchy was never strongly validated, levels blur at the borders, and the revision's improvements (verbs, the knowledge dimension) are organizational rather than empirical. A sixty-year-old committee product that survives because the audit it enables keeps being needed."},
 reflect:["Pull your current unit's objective, main task, and assessment. Classify all three honestly. Do they agree — and if not, which one is lying?","Record and tally your questions for one class period. What did the distribution teach your students about what thinking is for?","Where in your course does a fancy verb decorate a recall task — and what would the task look like if the verb were true?","Which knowledge floor are you skipping in rigor's name, and what is the analysis running on instead?","When your school says 'rigor,' what could someone point to in an actual task as evidence? If nothing — what would you propose they point to?"],
 constellation:{complements:["backward","infoprocessing"],pairs:["fallacies","toulmin"]},
 origins:"Developed by a committee of examiners to standardize educational objectives, the 1956 handbook classified cognitive goals from knowledge to evaluation. The 2001 revision converted categories to verbs, placed 'create' at the top, and added a knowledge dimension (factual, conceptual, procedural, metacognitive).",
 claims:["Educational objectives can be classified by cognitive process and by type of knowledge.","Alignment among objectives, activities, and assessment is the backbone of coherent instruction.","Higher-order processes (analyze, evaluate, create) build on but are not reducible to recall.","Making objectives explicit enables valid assessment and curriculum mapping."],
 constructs:[
  {term:"Cognitive process dimension", def:"Remember, understand, apply, analyze, evaluate, create (revised order)."},
  {term:"Knowledge dimension", def:"Factual, conceptual, procedural, and metacognitive knowledge (2001 revision)."},
  {term:"Higher-order thinking (HOT)", def:"Shorthand for the upper taxonomy levels; a staple of standards and rubrics."},
  {term:"Taxonomy table", def:"Matrix crossing process and knowledge dimensions to audit alignment."},
  {term:"Mastery learning", def:"Bloom's related program: most students can master objectives given time and feedback (Bloom, 1968)."}],
 applications:["Writing measurable objectives and exam blueprints.","Auditing whether assessments actually demand the level objectives claim.","Scaffolding questioning and discussion prompts across levels.","Foundation for depth-of-knowledge and standards frameworks."],
 critiques:["The strict hierarchy lacks strong empirical support; levels overlap and interact.","Verb lists get applied mechanically, reducing rigor to word choice.","Cognitive focus sidelines affect, culture, and disciplinary differences (Marzano, Wineburg critiques)."],
 related:["backward","infoprocessing","srl"],
 refs:["Bloom, B. S. (Ed.). (1956). Taxonomy of educational objectives: The classification of educational goals. Handbook I: Cognitive domain. David McKay.","Anderson, L. W., & Krathwohl, D. R. (Eds.). (2001). A taxonomy for learning, teaching, and assessing: A revision of Bloom's taxonomy of educational objectives. Longman.","Bloom, B. S. (1968). Learning for mastery. Evaluation Comment, 1(2), 1–12."],
 compare:{learner:"A thinker who can operate at increasingly complex cognitive levels", mechanism:"Progressive mastery of objectives aligned to cognitive demands", instructor:"Aligner of objectives, activities, and assessments", knowledge:"Classifiable by type and by the cognitive process applied to it", critique:"Hierarchy is heuristic, not empirical; often applied mechanically"}
},
{
 id:"freire", name:"Critical Pedagogy", discipline:"Education & Pedagogy", depth:"deep",
 theorists:"Paulo Freire (1921–1997); bell hooks, Henry Giroux, Peter McLaren",
 tagline:"Education is never neutral: it either domesticates or liberates. Learning should be dialogic praxis through which people read the word and the world.",
 problem:"Watch a classroom where students have learned that school is something done TO them: they receive, store, and return deposits of information about a world they are apparently only spectators of — while their actual lives, questions, and communities wait outside the curriculum's door. Some children learn content this way; all of them learn their place. Freire, teaching Brazilian farmworkers to read, discovered that literacy arrived fastest through words that named their own reality — and built a theory around the discovery: education either trains people to fit a world made by others, or equips them to remake it, and there is no neutral option, only the choice unexamined.",
 asks:["Is education ever neutral — and what is the 'banking' model actually teaching beneath its content?","What happens to learners taught to receive knowledge rather than produce it?","How does learning connect to power — whose questions, whose knowledge, whose world?","Can teaching be rigorous and liberating at once — dialogue without abdication?"],
 iftrue:{
  teachers:"Practice problem-posing: build at least some units around real contradictions in students' lives and communities, where the content becomes a tool for examining something that matters. Make dialogue the method — not soft conversation, but rigorous co-investigation where students generate questions, not just answers. And read word and world together: literacy taught through issues students have a stake in arrives with force that worksheets never find.",
  coaches:"Audit whose questions live in classrooms — count who asks, who answers, whose knowledge enters the room, and show teachers the deposit ratio. Help them move from delivery toward dialogue without losing rigor, because Freire condemned permissiveness as firmly as banking: the teacher's authority and expertise remain; what changes is whether students are subjects or containers. Generative-theme protocols give unit planning a concrete entry point.",
  leaders:"Make student voice governance, not decoration — surveys nobody reads teach cynicism more efficiently than silence. Review curriculum for banking assumptions (where could students investigate rather than receive?), treat the community as a curriculum source, and expect critical work to need political protection; budget your capital for it in advance.",
  researchers:"The methodological kin is participatory action research — inquiry WITH rather than ON — and youth PAR operationalizes the theory directly. Critical-consciousness measurement (the Diemer line) is young but real, linking sociopolitical awareness to engagement and achievement for marginalized youth; praxis-oriented designs that include an action component are the tradition's own standard."},
 reasoning:{
  notice:["The deposit ratio in any lesson: who talks, who questions, whose knowledge is admissible — count it and the pedagogy names itself.","Students who have concluded school is done to them: compliance without authorship is the banking model's report card.","Generative themes announcing themselves — the topics where the room suddenly has opinions, stakes, and questions; most expire unused.","Moments where learning could connect to action and doesn't: the letter never sent, the analysis never shared, the finding never used."],
  assume:["That dialogue means anything-goes: Freire insisted on rigor, preparation, and the teacher's directive responsibility — laissez-faire teaching was, to him, another abandonment of students.","That critical consciousness can be delivered — lecturing students into liberation is banking with better politics, the irony that kills most implementations.","That your reading of students' oppression matches their lived priorities; problem-posing starts from THEIR contradictions, not your syllabus of them."],
  decide:["Build one unit this year from a genuine community contradiction, with the discipline's tools as the means of investigating it.","Install question-generation routines: students producing the questions is the smallest real transfer of intellectual authority.","Pair texts with lived issues systematically — word and world on the same desk.","Include a praxis component, however small: an audience, an action, a use for what was learned."],
  avoid:["Banking about banking — the lecture on liberation.","Imposing your politics as the new deposit; problem-posing poses, it doesn't pre-answer.","Confusing student voice with curriculum abdication — the teacher who won't teach has just found a nobler excuse.","Critique without hope: denunciation without annunciation, in Freire's terms, teaches despair as the final lesson."]},
 competing:[
  {scenario:"A class has gone flat — compliant, disengaged, waiting to be told.", thisView:"The curriculum has nothing to do with their lives and everything about the room says their role is receipt: this is banking's harvest. Problem-pose from generative themes and watch agency return with the stakes.", other:"Self-Determination Theory (Deci & Ryan)", otherView:"Needs are being starved — autonomy absent, relevance unestablished, competence unfed. The repair is need-supportive structure: choice, rationale, optimal challenge — no political analysis required.", agree:"Overlapping prescriptions — agency, relevance, voice — from different depths. SDT repairs the classroom's motivational conditions; Freire asks who built the conditions and for whose benefit. Many classrooms need both questions asked, in that order or the other."},
  {scenario:"Doesn't critical pedagogy sacrifice skills the least-powerful students most need?", thisView:"A false opposition: Freire taught reading — fiercely, technically, fast — through meaningful content; rigor was the vehicle of liberation, not its rival. The banking critique targets passivity, not phonics.", other:"Delpit's power-codes critique", otherView:"Progressive pedagogies have historically shortchanged children of the dominated on explicit access to the codes of power — grammar, genre, standard registers — that gatekeepers demand. Implicit induction serves those already inducted at home.", agree:"This is an internal debate among allies with the same goal: Delpit's demand for explicit skill-teaching AND critical consciousness is now the mainstream synthesis — access to the codes, plus the analysis of why they're codes."}],
 research:{
  questions:["Does critical/problem-posing pedagogy move engagement, literacy, and achievement — for whom, in which conditions?","Can critical consciousness be measured well, and what does it predict?","What happens when students conduct participatory action research — to them, and to their settings?","What distinguishes rigorous implementations from performative ones?"],
  methods:"The tradition's own methods are its message: participatory action research, youth PAR, qualitative and ethnographic study of culture circles and their descendants; the newer strand adds validated critical-consciousness scales to longitudinal and quasi-experimental designs.",
  variables:"Dialogue and question-authorship patterns, critical-consciousness measures (reflection, motivation, action), literacy outcomes, engagement, and action components actually enacted.",
  support:"Historically demonstrated (the Brazilian literacy circles' speed became legend) and descriptively rich for five decades; the quantitative strand is young but promising — critical-consciousness measures correlate with engagement, achievement, and civic outcomes for marginalized youth, and YPAR studies show developmental effects. Honest limits: small-scale and qualitative predominate, implementation quality varies enormously, and the theory's own logic resists the controlled designs that would satisfy its critics."},
 reflect:["Count one lesson honestly: how many minutes were deposit, how many dialogue — and who asked the questions that mattered?","What generative theme is alive in your students' community right now that your discipline's tools could investigate?","Where do you hold authority as expertise (Freire kept it) versus authority as control (he refused it) — and can your students tell the difference?","What did your schooling teach you about your place — and where are you passing the same lesson forward?","If your most disengaged class learned their questions could drive real inquiry with real consequences, what would Monday look like?"],
 constellation:{builds:["dewey"],complements:["crp","mezirow","funds"],contrasts:["behaviorism"],pairs:["nls","practitioner"]},
 origins:"Freire's literacy work with Brazilian peasants, and his exile after the 1964 coup, produced Pedagogy of the Oppressed (1970). Rejecting 'banking' education, he founded a tradition linking literacy, consciousness, and social transformation that shaped critical pedagogy worldwide.",
 claims:["Banking education — depositing knowledge into passive students — reproduces oppression.","Genuine education is problem-posing: dialogic co-investigation of the world.","Conscientização (critical consciousness) develops as learners perceive contradictions and act on them.","Praxis — reflection and action together — is the goal; word and world are read jointly."],
 constructs:[
  {term:"Banking model", def:"Teacher deposits, students receive: a metaphor for transmissive, oppressive education."},
  {term:"Problem-posing education", def:"Curriculum built from learners' generative themes, examined dialogically."},
  {term:"Conscientização", def:"Critical consciousness: perceiving social, political, economic contradictions and taking action against oppressive elements."},
  {term:"Praxis", def:"Reflection and action upon the world in order to transform it."},
  {term:"Generative themes", def:"Issues drawn from learners' lives that carry existential and political significance."},
  {term:"Dialogue", def:"Horizontal, loving, humble communication as the method of education."}],
 applications:["Adult and community literacy programs; participatory action research (a common EdD methodology pairing).","Curriculum built from students' lived experience and community issues.","Critical media literacy and civic education.","Equity-focused leadership and school transformation frameworks."],
 critiques:["Abstract prescriptions; little concrete guidance for classroom management or skills instruction.","Critics allege political imposition can replace one orthodoxy with another.","Feminist and postcolonial scholars (e.g., Ellsworth, hooks) pushed back on its universalism and rationalism."],
 related:["mezirow","crp","vygotsky","bourdieu"],
 refs:["Freire, P. (1970). Pedagogy of the oppressed (M. B. Ramos, Trans.). Herder and Herder.","Freire, P. (1998). Pedagogy of freedom: Ethics, democracy, and civic courage. Rowman & Littlefield.","hooks, b. (1994). Teaching to transgress: Education as the practice of freedom. Routledge."],
 compare:{learner:"A subject capable of reading and transforming their world", mechanism:"Dialogic problem-posing that develops critical consciousness", instructor:"Co-learner and problem-poser, never a depositor", knowledge:"Co-constructed, political, and tied to action", critique:"Programmatically thin; risk of substituting new orthodoxies"}
},
{
 id:"crp", name:"Culturally Relevant & Responsive Pedagogy", discipline:"Education & Pedagogy", depth:"deep",
 theorists:"Gloria Ladson-Billings (1995); Geneva Gay (2000); Django Paris (culturally sustaining, 2012)",
 tagline:"Teaching that leverages students' cultures as assets, pursuing academic success, cultural competence, and critical consciousness together.",
 problem:"Some classrooms quietly require certain students to check their identities at the door as the price of success — while the failure that follows gets explained as something wrong with the students, their families, or their 'culture.' Curriculum rolls on in which some students never see themselves as authors, protagonists, or knowers. Ladson-Billings began from the opposite question: instead of asking why Black children fail, she studied teachers in whose classrooms they demonstrably flourished — and asked what those teachers were doing. The theory exists to answer that question, and to reject the deficit story it replaced.",
 asks:["Why do schools so reliably fail students whose home cultures differ from school culture — and why do deficit explanations persist despite the evidence?","What do demonstrably successful teachers of marginalized students actually do?","What is culture's role in cognition, motivation, and engagement — asset or obstacle?","Can academic rigor and cultural identity reinforce each other rather than compete?"],
 iftrue:{
  teachers:"Learn your students' communities firsthand rather than by reputation — the funds-of-knowledge stance is CRP's fieldwork. Audit your curriculum with three questions: who appears, who authors, whose questions get asked? Hold the 'warm demander' line: high demands wrapped in high support and unmistakable belief. And treat critical consciousness as the application layer of your content — analyzing a local housing dispute IS argument writing; interrogating a data set about their own community IS statistics.",
  coaches:"Your highest-leverage move is language: when team meetings say 'these kids can't,' the pedagogy is already lost. Facilitate asset inventories that make community knowledge visible to teachers, support colleagues in examining their own cultural lenses without shame spirals, and make CRP concrete in every discipline — it is not a literature-unit garnish; there is culturally relevant mathematics.",
  leaders:"Your data already measure CRP whether you call it that or not: discipline disproportionality, gifted and AP placement patterns, who's in remediation. Hiring and retaining teachers of color is an instructional strategy, not just an HR goal. Redesign family engagement as reciprocal — families as sources of knowledge, not audiences for it. And expect the critical-consciousness pillar to need political protection; plan for that rather than being surprised by it.",
  researchers:"The field's task is operationalization: the three pillars are conceptually crisp and empirically slippery. Build and validate observation protocols, measure outcomes beyond test scores (engagement, identity, civic reasoning), and design without essentializing — culture is dynamic and individual, and studies that treat it as a fixed group trait recreate the problem in method form."},
 reasoning:{
  notice:["Participation patterns: who speaks, who has gone silent, and in which activities the silence breaks.","Your own data cut by demographic: discipline referrals, honors placement, whose names fill the intervention lists.","Whether students' home and community knowledge ever surfaces as academic capital in your class — or only ever as 'background.'","Which topics make YOU comfortable and uncomfortable; your avoidances are curriculum decisions students can read."],
  assume:["That culture equals race or ethnicity as a checklist — culture is layered, dynamic, and individual; the theory demands knowing students, not applying group templates.","That celebration is the pedagogy — heroes-and-holidays multiculturalism is precisely the shallow 'remix' Ladson-Billings later critiqued; the pillars are success, competence, AND critique, together.","That relevance and rigor trade off — the founding studies documented the opposite: relevance was the vehicle for rigor."],
  decide:["Audit and diversify texts, examples, and assessment contexts — then go further and let community issues become the objects of disciplinary analysis.","Build assignments where local and family knowledge functions as evidence, not decoration.","Pair explicit success criteria with explicit belief messaging — clarity is an equity practice.","Invest in sustained relationships as instructional infrastructure, because the warm demander's demands only work atop genuine knowledge of the student."],
  avoid:["Deficit language anywhere adults talk — it is the load-bearing wall of the problem.","Colorblind claims ('I don't see color'), which in practice mean the dominant culture stays invisible and mandatory.","Cultural celebration without academic press — affirmation that asks nothing is its own quiet deficit message.","Essentializing pedagogy ('collectivist learners prefer…') that swaps one stereotype for a friendlier one."]},
 competing:[
  {scenario:"A persistent achievement gap divides a school.", thisView:"The gap is manufactured by cultural mismatch, deficit framing, and curriculum exclusion — and it closes when teaching leverages students' cultures while holding rigorous expectations, as the founding cases and the ethnic-studies experiments show.", other:"Cultural Capital (Bourdieu)", otherView:"Schools reward the dominant class's capital and call it merit; the game is structured upstream of any classroom. Pedagogy alone cannot fix what admissions, funding, and credentialing continually reproduce.", agree:"Total agreement on the diagnosis's first line — the deficit explanation is false. The live tension is optimism about pedagogy's reach; Yosso's community cultural wealth deliberately bridges the two, naming the assets Bourdieu's frame overlooks."},
  {scenario:"Marginalized students are disengaged in a class.", thisView:"Engagement collapses where identity is threatened or invisible: irrelevant curriculum and low expectations read as messages about who belongs in academic work.", other:"Self-Determination Theory (Deci & Ryan)", otherView:"Diagnose the needs: belonging (relatedness) frustrated, autonomy absent, competence signals mixed. Disengagement is need-starvation, whatever the content.", agree:"Convergent prescriptions from different premises — culturally relevant practice is need-supportive practice: it manufactures belonging, grants meaningful choice, and communicates competence. The theories describe the same classroom from sociology's side and psychology's side."}],
 research:{
  questions:["How can the three pillars be operationalized and observed reliably?","What are the effects of culturally relevant instruction on achievement, engagement, and identity?","Which professional development actually changes practice rather than vocabulary?","How do culturally sustaining extensions reshape outcomes for multilingual and immigrant communities?"],
  methods:"Ethnography and case study built the theory (Ladson-Billings' The Dreamkeepers); the current wave adds observation protocols, quasi-experiments, and natural experiments — most famously the San Francisco ethnic-studies course studies — plus youth participatory action research consistent with the theory's own commitments.",
  variables:"Teacher practices and expectations, curriculum representation, discipline and placement data, student engagement, ethnic-racial identity measures, and achievement — with implementation fidelity as the field's haunting moderator.",
  support:"A rich qualitative foundation with quantitative support now arriving: the ethnic-studies natural experiments found strikingly large effects on attendance, GPA, and credits for at-risk students. Honest limits: pillar-level measurement is immature, many published implementations are shallow (the 'remix' problem), and effects hinge on depth of implementation — which is exactly what the theory predicts."},
 reflect:["Whose knowledge counts as evidence in your classroom — and when did a student's community last teach the class something the textbook couldn't?","Pull your own discipline and honors data. What story do they tell, and what explanation have you been living with?","Where is the warm-demander balance in your practice right now — high-warmth-low-demand, high-demand-low-warmth, or the real thing?","Which parts of your curriculum would a student from your school's least-served community recognize themselves in? Name the units.","What would the critical-consciousness pillar look like in YOUR content area this month — not as an add-on, but as the application of the discipline itself?"],
 constellation:{builds:["freire","vygotsky"],complements:["funds","nls","udl"],contrasts:["bourdieu"],pairs:["sdt","agency"]},
 origins:"Ladson-Billings' studies of successful teachers of African American students yielded culturally relevant pedagogy's three pillars. Gay elaborated responsive teaching practice; Paris and Alim extended it to sustaining students' linguistic and cultural pluralism rather than merely referencing it.",
 claims:["Culture is central, not incidental, to learning; deficit framings of students are both wrong and harmful.","Effective teaching produces academic success AND cultural competence AND critical consciousness.","Curriculum and instruction should connect to students' funds of knowledge and community realities.","Schools should sustain — not subtract — students' languages and cultures."],
 constructs:[
  {term:"Academic success", def:"Non-negotiable intellectual growth; high expectations are a pillar, not an add-on."},
  {term:"Cultural competence", def:"Fluency in one's own culture and at least one other; identity affirmed in school."},
  {term:"Sociopolitical/critical consciousness", def:"Ability to critique social inequities that shape students' lives."},
  {term:"Deficit thinking", def:"Attributing school failure to students' cultures/families rather than to systems — the stance CRP rejects."},
  {term:"Culturally sustaining pedagogy", def:"Paris & Alim's extension: sustain linguistic and cultural pluralism as an explicit goal."}],
 applications:["Curriculum audits for representation and asset framing.","Family/community partnership designs drawing on funds of knowledge.","Professional development on expectations, discourse, and discipline disparities.","A leading conceptual framework for equity-focused EdD dissertations."],
 critiques:["Ladson-Billings (2014) herself critiqued shallow 'remix' implementations that celebrate culture but drop critical consciousness.","Operationalizing and measuring the three pillars is difficult.","Risk of essentializing cultures as static traits of groups."],

{
 id:"udl", name:"Universal Design for Learning", discipline:"Education & Pedagogy", depth:"deep",
 theorists:"David Rose & Anne Meyer (CAST, 1990s–present)",
 tagline:"Design learning environments with flexible options from the start — multiple means of engagement, representation, and action/expression — so barriers, not learners, are remediated.",
 problem:"The lesson was designed for a student who does not exist — the mythical average — and then the accommodations began: one bolted on per diagnosed student, each a retrofit to a design that failed them by default. Meanwhile the same lecture trips one student at hearing, another at pacing, a third at sustained attention, and the fixes arrive late, stigmatized, and one at a time. UDL exists to relocate the problem: disability of access lives in inflexible environments more than in learners, variability is the norm rather than the exception, and a curb cut designed once serves everyone who was ever going to trip.",
 asks:["Where does the barrier actually live — in the learner or in the design?","Can design anticipate variability instead of remediating it one accommodation at a time?","What stays fixed (the goal) and what should flex (the route) — and who decides?","What would it mean to aim not at access but at expert learners?"],
 iftrue:{
  teachers:"Separate the goal from the means, then defend the goal and flex the means: if the objective is analysis, essay-only is a habit, not a requirement. Build two or three strategic options per principle — how students take in, work through, and show learning — rather than infinite buffets. Make accessibility the default (captions on, text-to-speech available) so no one has to ask. And check each design element with one question: whose barrier is this?",
  coaches:"Give teams the reframe as a sentence: change 'this student can't' to 'this design assumes.' Run barrier audits on real lessons — where does this plan assume decoding speed, sustained silence, one modality, one pace? And help teachers spot the pattern that matters: an accommodation you write repeatedly is a design flaw filing paperwork.",
  leaders:"Make built-in accessibility an adoption criterion for every curriculum and platform purchase — retrofit is the expensive path in money and in dignity. Align UDL with MTSS and IEP processes so proactive design shrinks the reactive load. And model it in adult learning: PD offered one way, at one pace, in one modality, teaches faculty exactly what the school really believes about variability.",
  researchers:"The field's honest gap is yours to work: principle-level components (multimodal presentation, meaningful choice, accessibility supports) are well evidenced; whole-framework causal trials lag far behind policy adoption. Build fidelity instruments, measure barrier reduction directly, and test the expert-learner claim — does UDL practice actually grow self-directed learners?"},
 reasoning:{
  notice:["Which students the single-pathway lesson silently excludes: the read-only input, the essay-only output, the one-speed pacing — each an assumption wearing the costume of a standard.","Repeated accommodations for the same barrier across students — the design is telling you where it's broken.","Engagement that shifts dramatically when format shifts: that variability is data about your options, not their attention spans.","Who never needs the options — and whether the goal's rigor actually survived the flexible routes (it must)."],
  assume:["That options mean rigor loss — the goal stays fixed; only the route flexes, and a goal that only survives one route was probably a method, not a goal.","That variability means disability: the framework's claim is that variability is universal, and the supports built for the margins routinely help the middle.","That more choice is always better — options carry cognitive load, and UDL done well is strategic, not infinite (see the cognitive-load exchange below)."],
  decide:["Write the goal precisely, then interrogate every constraint: which are the goal, and which are habit?","Build a small set of genuine options per principle, each with scaffolds — choice with support, not choice as abandonment.","Turn accessibility features on by default for everyone; asking is a barrier too.","Teach learners to choose and evaluate their own tools — the expert-learner endgame is students who know how they learn."],
  avoid:["Option buffets without scaffolds, which tax exactly the executive functions some learners are working hardest to manage.","Letting the goal flex along with the route — rigor drift is UDL's characteristic failure mode.","Checklist compliance ('I offered a video, therefore UDL') without asking whether any actual barrier fell.","Waiting for diagnoses to design well; the variability is already in the room."]},
 competing:[
  {scenario:"A student is struggling despite a lesson full of options.", thisView:"Look again for the barrier: perhaps the options themselves are inaccessible, the goal is entangled with a method, or the real obstacle (pacing, engagement, executive demand) has no option addressing it.", other:"Cognitive Load Theory (Sweller)", otherView:"Consider that the option-rich environment IS the barrier: choices, multiple formats, and novel supports all cost working memory, and for a novice the flexible lesson may be the overloaded one. Strategic simplicity is also a design.", agree:"Both locate failure in design rather than the learner, and both prescribe intentional architecture. The synthesis is UDL's own best practice: few, well-scaffolded, load-aware options — flexibility without chaos."},
  {scenario:"Is this just differentiation with new vocabulary?", thisView:"No — the direction of travel differs: UDL designs one flexible environment proactively, before knowing who arrives; barriers are removed at the blueprint stage, for everyone, without diagnosis or stigma.", other:"Differentiated Instruction (Tomlinson)", otherView:"Design must also respond to the actual students present: readiness, interest, and profile differences call for tailored content, process, and product — reactive precision that no advance blueprint replaces.", agree:"Fully complementary layers: UDL first shrinks the need for differentiation; differentiation then handles what no blueprint could anticipate. The error is doing neither and calling the average lesson 'fair.'"}],
 research:{
  questions:["Does whole-framework UDL implementation improve achievement and engagement — beyond its individual components?","Which options reduce which barriers for whom, and at what cognitive cost?","Can implementation fidelity be measured well enough to make trials meaningful?","Does sustained UDL practice produce the framework's stated aim — expert learners?"],
  methods:"Principle-level experiments (modality, choice, accessibility supports) inherited from cognitive and multimedia research; design-based studies of UDL units; implementation research with emerging fidelity instruments; policy analysis of adoption-versus-evidence gaps.",
  variables:"Barrier counts in materials and tasks, option use patterns, access and engagement measures, achievement across learner profiles, and self-regulation measures for the expert-learner claim.",
  support:"Split honestly: the components rest on solid cognitive and accessibility evidence, and the equity logic (proactive beats retrofit) is compelling on cost and dignity grounds alike. But whole-framework causal evidence remains thin relative to its policy embrace — UDL is codified in U.S. law more firmly than in trial data. Treat it as a well-reasoned design stance whose parts are proven and whose whole is still being tested."},
 reflect:["Take tomorrow's lesson: list every assumption it makes about the learner — reading speed, hearing, attention span, home support. Which assumption fails first, for whom?","Which accommodation do you keep writing that a better default design would erase?","Where has a goal in your course quietly fused with one method of demonstrating it? What else could count as evidence?","Which UDL option would have changed your own schooling — and who in your room is waiting for its equivalent?","If your students left as expert learners — knowing how they learn and what they need — what would you have to start letting them decide?"],
 constellation:{complements:["crp","sdt","multimedia"],contrasts:["cogload"],pairs:["backward","barkley"]},
 origins:"Borrowing universal design from architecture (curb cuts) and grounded in neuroscience of affective, recognition, and strategic brain networks, CAST developed UDL to move accessibility from retrofit accommodation to proactive curriculum design. It is codified in U.S. policy (ESSA, HEOA).",
 claims:["Learner variability is the norm; the 'average learner' is a myth.","Barriers reside in inflexible curricula, not in students.","Providing options for engagement, representation, and expression benefits all learners, not only those with disabilities.","Expert learning — purposeful, resourceful, strategic — is the goal of design."],
 constructs:[
  {term:"Multiple means of engagement", def:"Options for recruiting interest, sustaining effort, and self-regulation (the 'why' of learning)."},
  {term:"Multiple means of representation", def:"Options for perception, language, and comprehension (the 'what')."},
  {term:"Multiple means of action & expression", def:"Options for physical action, communication, and executive function (the 'how')."},
  {term:"Learner variability", def:"Predictable, systematic diversity in how people learn, mapped to brain networks."},
  {term:"Expert learner", def:"UDL's aim: learners who know how to learn — motivated, resourceful, goal-directed."}],
 applications:["Course and lesson design offering flexible materials, supports, and assessment formats.","Digital accessibility decisions (captions, text-to-speech, multiple formats).","District MTSS and inclusion frameworks.","EdD studies of implementation fidelity and outcomes in inclusive settings."],
 critiques:["Empirical evidence for whole-framework effects lags behind adoption enthusiasm.","Checklist-style implementation can add options without removing real barriers.","Demands significant design time and resources; scalability concerns."],
 related:["multimedia","cogload","sdt"],
 refs:["Meyer, A., Rose, D. H., & Gordon, D. (2014). Universal design for learning: Theory and practice. CAST Professional Publishing.","Rose, D. H., & Meyer, A. (2002). Teaching every student in the digital age: Universal design for learning. ASCD.","CAST. (2018). Universal design for learning guidelines version 2.2. https://udlguidelines.cast.org"],
 compare:{learner:"A variable learner whose barriers are environmental, not personal", mechanism:"Flexible pathways let each learner engage, perceive, and express", instructor:"Proactive designer who removes barriers before they appear", knowledge:"Reachable through multiple representations and demonstrable in multiple forms", critique:"Framework-level evidence still thin relative to adoption"}
},
{
 id:"mindset", dis:true, name:"Mindset Theory (Implicit Theories of Intelligence)", discipline:"Education & Pedagogy", depth:"deep",
 theorists:"Carol Dweck (b. 1946)",
 tagline:"Beliefs about whether ability is fixed or malleable shape goals, responses to failure, and ultimately achievement.",
 problem:"Two students earn the same failing grade on the same quiz. One asks about retakes before leaving the room; the other quietly concludes 'I'm just not a math person' and stops raising her hand for the rest of the year. Meanwhile a teacher's kindest sentence — 'you're so smart!' — somehow produces a student who now avoids anything that might disprove it. Mindset theory exists to explain why equally capable learners diverge so sharply at the moment of difficulty, and why well-intended praise can install exactly the belief that makes challenge feel dangerous.",
 asks:["Why do students of equal ability respond so differently to the same setback?","What do beliefs about the nature of ability do to the goals students pursue and the risks they'll take?","Can those beliefs be changed — and does changing them actually change achievement?","Which everyday classroom messages install which beliefs?"],
 iftrue:{
  teachers:"Audit your feedback: praise strategies, choices, and progress — not the person ('smart') and not raw effort detached from method. Build structures that make growth literal rather than rhetorical: retakes that require new studying, revision that earns credit, error-analysis as routine work. And frame challenge as the point of school, because students read task difficulty as a message about what you believe they can become.",
  coaches:"The mindset culture of a classroom lives in its structures, not its posters — grading policies, who gets called on after wrong answers, what happens to early finishers. Focus coaching on failure moments: how a teacher responds in the thirty seconds after a public mistake teaches the whole room what mistakes mean. And attend to teacher beliefs about students, which research increasingly suggests matter more than student beliefs.",
  leaders:"Institutional signals teach entity beliefs at scale: permanent tracking labels, 'gifted' as an identity rather than a service, honor rituals that rank rather than recognize growth. Watch for mindset's dark side too — 'they just need grit' is deficit thinking in motivational clothing, and Dweck herself insists belief change is no substitute for opportunity and resources.",
  researchers:"Measure mindset domain-specifically, expect small average effects with meaningful heterogeneity, and design for moderators: the national-study lesson is that growth-mindset interventions pay off mainly for lower-achieving students in contexts that afford growth. An intervention plus an unsupportive school equals a belief with nowhere to go."},
 reasoning:{
  notice:["What a student does in the first sixty seconds of difficulty: strategy-shifting and question-asking versus withdrawal and self-blame — the helpless and mastery patterns are visible behavior, not hidden traits.","Self-talk after errors: 'I'm dumb' and 'that approach failed' predict different futures.","Challenge-avoidance among your highest achievers — fixed mindset's signature often hides inside straight-A comfort zones.","How students respond to a peer's success: as threat or as information about what's possible."],
  assume:["That belief is the bottleneck — a student with genuine skill gaps needs instruction, not inspiration, and a student facing structural obstacles needs resources.","That announcing 'we have growth mindset in this class' changes anything; students detect false growth mindset instantly, especially when grading contradicts it.","That praise is neutral — every piece of praise carries a theory of ability inside it."],
  decide:["Attach feedback to specific, repeatable strategies ('your plan of testing the easy cases first — that worked').","Make error analysis a graded routine, not a punishment.","Let grades move when learning moves: revision and retake policies are mindset theory in structural form.","Teach the malleability evidence briefly and factually once — then let structures do the preaching."],
  avoid:["'Just believe in yourself' moralizing — belief without strategy is cruelty with a smile.","Praising effort that isn't working; 'you tried so hard' after failure, with no strategy change, quietly signals low ability.","Using mindset to explain away inequity — the theory describes a lever, not an alibi.","Public ability ranking, which converts every task into evidence-gathering about a fixed trait."]},
 competing:[
  {scenario:"A student gives up completely after one failure.", thisView:"An entity belief is at work: if failure proves fixed inability, quitting protects the self — helplessness is a rational response to a bad theory of ability.", other:"Attribution Theory (Weiner)", otherView:"The operative cause is the student's explanation — a stable, uncontrollable attribution ('I'm not smart enough') kills expectancy regardless of any general belief about ability. Change the causal story for THIS failure and behavior changes.", agree:"These theories are cousins, not rivals: mindsets are attribution factories, and both locate the lever in how failure is interpreted. Interventions blend them — re-attribution training and mindset messaging are often the same sentences."},
  {scenario:"'Our disadvantaged students need growth mindset.'", thisView:"Properly stated: belief interventions offer modest gains precisely for structurally disadvantaged students — but only in contexts that afford growth; belief cannot metabolize what opportunity doesn't provide.", other:"Cultural Capital (Bourdieu)", otherView:"Achievement gaps track resources, curriculum access, and whose capital schools reward. A psychology of belief aimed at inequality's victims mistakes the symptom for the disease.", agree:"Both reject fixed-ability explanations of gaps. Dweck concurs with the structural critique explicitly: mindset is a complement to opportunity, never a substitute — anything else is blaming students politely."}],
 research:{
  questions:["Do mindset interventions improve achievement — for whom, and in which contexts?","How do teacher mindsets and classroom structures shape student belief and performance?","Are mindsets domain-specific, and how stable are they across time?","What distinguishes contexts where growth beliefs pay off from those where they can't?"],
  methods:"Large-scale randomized trials (including national samples), longitudinal surveys, and the classic experimental praise-manipulation paradigms; increasingly, heterogeneity-focused designs treating context as the star variable.",
  variables:"Implicit theory scales (domain-specific), goal orientation, challenge-seeking choices, helpless-versus-mastery behavioral responses, GPA and course-taking, with prior achievement and school norms as moderators.",
  support:"Mixed and worth stating honestly: foundational lab effects are real but replicate unevenly; meta-analyses find small average intervention effects; the strongest modern evidence (a national experiment) shows ~0.1 GPA gains concentrated among lower-achieving students in supportive schools. Read it as a cheap, targeted, modest lever with genuine boundary conditions — not the revolution the posters promised."},
 reflect:["Recall the last time you praised a student. What theory of ability was hiding inside the sentence?","Which of your classroom structures — grading, retakes, participation, displays — would a fixed-mindset observer say confirms their worldview?","Where in your own professional life do you avoid challenge to protect a 'natural talent' identity — and what would you tell a student doing the same?","When a student's effort isn't working, what do you actually say? What would strategy-focused honesty sound like?","If mindset explains only a modest slice of achievement, what are the bigger levers in your context — and is mindset talk ever standing in for them?"],
 constellation:{builds:["attribution"],complements:["socialcognitive","sdt","expectancyvalue"],contrasts:["bourdieu"],pairs:["desirable","srl"]},
 origins:"Dweck's attribution research on learned helplessness in the 1970s evolved into implicit theories: entity (fixed) versus incremental (growth) beliefs about intelligence. Popularized by Mindset (2006), it became one of education's most influential — and most debated — ideas.",
 claims:["Learners holding a growth mindset pursue learning goals, embrace challenge, and persist after setbacks.","Fixed-mindset learners favor performance goals and interpret effort and failure as evidence of low ability.","Praise for process (strategies, effort) fosters growth mindset; praise for ability fosters fixed mindset.","Mindsets are domain-specific beliefs that interventions can shift, modestly."],
 constructs:[
  {term:"Entity theory (fixed mindset)", def:"Belief that ability is a fixed trait; failure signals lack of it."},
  {term:"Incremental theory (growth mindset)", def:"Belief that ability grows through effort and strategy."},
  {term:"Learning vs. performance goals", def:"Seeking to develop competence versus to demonstrate it (with Elliott & Leggett)."},
  {term:"Process praise", def:"Feedback targeting strategy and effort rather than person or talent (Mueller & Dweck, 1998)."},
  {term:"Helpless vs. mastery-oriented responses", def:"Characteristic reactions to failure under each mindset."}],
 applications:["Feedback and grading language in classrooms.","Brief, targeted mindset interventions for students at transition points.","Teacher beliefs about students — arguably more consequential than student mindsets.","Framing for studies of persistence, gatekeeper courses, and equity gaps."],
 critiques:["Large replications (e.g., Sisk et al., 2018) find small average effects, concentrated among at-risk students.","'Mindset culture' can slide into blaming students while ignoring structures.","Measurement and intervention fidelity vary widely; publication-bias debates continue (though Yeager's 2019 national study found targeted benefits)."],
 related:["attribution","sdt","socialcognitive","expectancyvalue"],
 refs:["Dweck, C. S. (2006). Mindset: The new psychology of success. Random House.","Dweck, C. S., & Leggett, E. L. (1988). A social-cognitive approach to motivation and personality. Psychological Review, 95(2), 256–273.","Yeager, D. S., et al. (2019). A national experiment reveals where a growth mindset improves achievement. Nature, 573, 364–369.","Sisk, V. F., Burgoyne, A. P., Sun, J., Butler, J. L., & Macnamara, B. N. (2018). To what extent and under which circumstances are growth mind-sets important to academic achievement? Psychological Science, 29(4), 549–571."],
 compare:{learner:"A believer whose implicit theory of ability filters every setback", mechanism:"Beliefs shape goals, effort attributions, and persistence", instructor:"Shaper of belief through process feedback and challenge framing", knowledge:"Competence seen as expandable through strategy and effort", critique:"Replication effects are small; risk of ignoring structural causes"}
},
{
 id:"expectancyvalue", name:"Expectancy-Value Theory", discipline:"Education & Pedagogy", depth:"deep",
 theorists:"Jacquelynne Eccles & Allan Wigfield (1983–present); roots in John Atkinson",
 tagline:"Achievement choices and persistence are driven by two questions: Can I do this? and Do I want to — is it worth it?",
 problem:"The student with the A- in math declines the advanced course. Nothing is wrong with her skills; something has answered 'no' to a question nobody asked out loud. Pipelines leak students who were succeeding — by gender, by group, by zip code — and skill-building interventions keep missing because skill was never the leak. 'I could, but why would I?' is the sentence achievement tests can't hear. Expectancy-value theory exists to model the choice itself: persistence and course-taking run on two multiplied beliefs — can I succeed, and is it worth it — with cost holding veto power, and socializers writing both beliefs long before the choice arrives.",
 asks:["What drives achievement CHOICES — not just performance on tasks already assigned?","How do expectancy and value combine, and why does either at zero kill the product?","Where do these beliefs come from — and what role do parents, teachers, and counselors play as socializers?","What is cost, and why does the newest construct explain so many departures?"],
 iftrue:{
  teachers:"Diagnose disengagement by component before treating it: boredom is an intrinsic-value problem, 'this is pointless' is utility, 'this isn't me' is attainment, 'it's too much' is cost — and each has a different repair. For utility, the evidence is specific: students briefly writing their OWN connections between content and their lives outperforms teachers asserting relevance — and asserted utility can actually backfire for low-confidence students. Protect expectancy with mastery structure, and watch what your classroom signals about who belongs.",
  coaches:"Give teams the four-value diagnostic as case-review language: which component failed for this student? Help teachers see recruitment conversations (into advanced courses, into majors) as socializer work — the offhand 'are you sure you want the hard one?' is expectancy-writing in real time.",
  leaders:"Run your pipeline data through this lens: who opts out DESPITE competence, where, and after which junctures? That pattern is a value-and-cost map, not an ability map. Train the socializers — counselors, families, teachers — because their messages are the levers. And audit the cost side of demanding programs: workload signals, scheduling collisions, and belonging threats decline students who would have succeeded.",
  researchers:"The utility-value intervention line (Hulleman & Harackiewicz) is a model of theory-to-trial translation — brief, cheap, replicated including at scale, with real moderators to respect. Cost measurement is the young frontier; situated expectancy-value (the 2020 revision) reframes everything as in-the-moment and context-dependent, which invites the designs your cohort could run."},
 reasoning:{
  notice:["The competent decliner: grades fine, opts out anyway — interrogate value and cost, not skill.","Which component is speaking: bored (intrinsic), 'pointless' (utility), 'not me' (attainment), 'too much' (cost) — students name the failing term if you listen by category.","Socializer echoes: students repeating verbatim what a parent, counselor, or former teacher said about who takes which classes.","Belonging signals as cost: who's pictured, who's called on, who populates the advanced track — the psychological price list is posted on the walls."],
  assume:["That performance predicts persistence — choices run on value, and the pipeline literature is a graveyard of that assumption.","That value can be asserted: 'this matters, trust me' is weak, and for low-expectancy students, documented to backfire — value is built, and best self-generated.","That cost objections are laziness: cost is a rational ledger of effort, alternatives foregone, and psychological risk — respect it or lose the student."],
  decide:["Run brief self-generated utility writing ('how does this connect to your life?') at strategic points — the intervention with actual receipts.","Build attainment hooks: images, examples, and testimony that people like this student do this work.","Repair expectancy with structured early wins before making the value pitch.","Reduce psychological cost deliberately: belonging cues, workload honesty, and exit ramps that aren't humiliations."],
  avoid:["Utility lectures — especially at students whose expectancy is shaky; the backfire is in the literature.","Piling value messaging on what is actually an expectancy collapse (or vice versa) — misdiagnosis wastes the intervention.","Adding demands while ignoring the cost ledger, then reading the withdrawal as apathy.","Treating opt-outs as ability verdicts in your gradebook's face."]},
 competing:[
  {scenario:"A capable student declines the advanced course.", thisView:"Read the equation: expectancy may be intact while value is thin or cost too high — 'worth it' failed, not 'can I.' Build utility and attainment value, lower the psychological cost, and the same equation outputs yes.", other:"Cultural Capital (Bourdieu)", otherView:"The 'choice' was structured upstream: habitus whispers 'not for people like us' long before any cost-benefit runs. Individual value-repair without changing who the track is FOR treats the symptom of a sorting machine.", agree:"Both reject the ability reading entirely — and EVT's attainment value (identity fit) is precisely where Bourdieu's structure enters the psychology. The joint program: change the signals about who belongs AND run the value interventions; either alone under-delivers."},
  {scenario:"A student is visibly not trying in class.", thisView:"Audit the four values and expectancy: somewhere the equation has a zero, and each term points to a different intervention — this is a diagnosis chart, not a character judgment.", other:"Self-Determination Theory (Deci & Ryan)", otherView:"Look beneath the equation to the needs: competence starvation, no autonomy, thin belonging — the values EVT measures are downstream of needs the environment isn't meeting.", agree:"Deeply compatible layers: SDT explains the soil, EVT models the decision growing from it. Practically, need-supportive teaching (SDT) plus targeted value-building (EVT) is one coherent playbook — and both flatly reject 'lazy' as an explanation."}],
 research:{
  questions:["Do expectancies and values predict course-taking, majors, and careers beyond ability — and how early do the trajectories set?","Which value interventions work, for whom, at what dose — and where do they backfire?","How should cost be measured, and how much departure does it explain?","How do socializers' beliefs transmit into students' expectancies and values?"],
  methods:"The longitudinal survey tradition (Eccles' childhood-through-career studies) with structural modeling; randomized utility-value intervention trials from lab to scale; measurement development for cost; situated designs sampling beliefs in the moment.",
  variables:"Expectancies for success, the four value components, perceived cost, socializer messages, and the criterion that distinguishes this theory: actual choices — enrollment, persistence, majors, careers.",
  support:"Strong where it matters most: expectancies and values predict achievement choices longitudinally beyond prior performance — the theory's home turf — and the utility-value intervention has replicated across contexts including large-scale trials, with honest moderators (backfire risks for low-expectancy students). Limits: expectancy and value measures correlate heavily, cost research is young, and full-model tests are rare because the model is an ecosystem. The 2020 situated revision is the field updating itself in public — a model of theoretical honesty worth citing."},
 reflect:["Name your competent decliner — the student who could but won't. Which term of their equation failed, and what evidence do you have beyond a guess?","What does your classroom broadcast about who belongs in the hard version of your subject? Walk in tomorrow and look at the walls.","When did you last assert relevance ('you'll need this someday') — and what would the self-generated version of that moment look like?","What does the advanced path in your school actually cost — in workload, schedule, and belonging risk — and who is quietly declining to pay?","Your own doctoral persistence runs on this equation too: which value component is carrying you right now, and what's the cost term doing?"],
 constellation:{complements:["sdt","socialcognitive","attribution"],contrasts:["bourdieu"],pairs:["mindset"]},
 origins:"Developed to explain gendered differences in math course-taking, the Eccles et al. model linked expectancies for success and subjective task values to choices, showing how socializers and cultural stereotypes shape both. It is now a workhorse model of academic motivation and STEM persistence.",
 claims:["Expectancies for success and subjective task value jointly predict achievement choices, effort, and persistence.","Task value has four components: intrinsic, attainment, utility, and cost.","Expectancies and values are shaped by socializers, stereotypes, prior experience, and self-schemas.","Perceived cost (effort, lost alternatives, psychological risk) can veto otherwise valued pursuits."],
 constructs:[
  {term:"Expectancy for success", def:"Belief about how well one will do on an upcoming task (close cousin of self-efficacy)."},
  {term:"Intrinsic value", def:"Enjoyment gained from doing the task."},
  {term:"Attainment value", def:"Importance of doing well for one's identity."},
  {term:"Utility value", def:"Usefulness of the task for future goals — the most intervention-friendly component."},
  {term:"Cost", def:"Perceived effort, emotional toll, and foregone alternatives of engagement."}],
 applications:["Utility-value interventions ('write how this connects to your life') improving STEM outcomes.","Advising and program design addressing cost, not just interest.","Explaining course-taking, major choice, and career pipelines in EdD research.","Family and counselor messaging as socializer levers."],
 critiques:["Expectancy and value measures correlate highly, complicating unique effects.","Model breadth makes full tests rare; most studies examine slices.","Cultural generalizability of value components is still under study (situated expectancy-value revision, 2020, addresses context)."],
 related:["sdt","mindset","attribution","socialcognitive"],
 refs:["Eccles, J. S., et al. (1983). Expectancies, values, and academic behaviors. In J. T. Spence (Ed.), Achievement and achievement motivation (pp. 75–146). W. H. Freeman.","Wigfield, A., & Eccles, J. S. (2000). Expectancy–value theory of achievement motivation. Contemporary Educational Psychology, 25(1), 68–81.","Eccles, J. S., & Wigfield, A. (2020). From expectancy-value theory to situated expectancy-value theory. Contemporary Educational Psychology, 61, 101859."],
 compare:{learner:"A chooser weighing 'Can I?' against 'Is it worth it?'", mechanism:"Expectancies and task values, shaped by socializers, drive choices", instructor:"Builder of success expectancy and salient task value", knowledge:"Pursued when valued and attainable; cost can veto", critique:"Constructs intercorrelate; full-model tests are rare"}
},
{
 id:"attribution", name:"Attribution Theory", discipline:"Education & Pedagogy", depth:"deep",
 theorists:"Bernard Weiner (b. 1935); roots in Fritz Heider",
 tagline:"How learners explain success and failure — by causes varying in locus, stability, and controllability — determines emotion, expectancy, and future effort.",
 problem:"Three students fail the same test. One says the test was unfair, one says 'I'm stupid,' one says 'I studied the wrong things.' Same grade — three different emotional aftermaths, three different next moves, three different futures. Meanwhile a teacher's sympathetic 'that's okay, this is hard for some people' lands as a verdict, and lavish praise for an easy task whispers 'I expected less of you.' Attribution theory exists to explain why the causal story a learner tells about an outcome matters more than the outcome itself — and how teachers write those stories without knowing it.",
 asks:["Why do identical outcomes produce opposite reactions in different learners?","Which properties of a perceived cause — its locus, stability, controllability — drive which emotions and expectations?","How do teachers' feedback, sympathy, and praise unintentionally communicate causes to students?","Can maladaptive explanations be retrained, and does retraining change performance?"],
 iftrue:{
  teachers:"Feedback should hand students controllable, unstable causes with evidence attached: 'your thesis improved when you outlined first — that's the method working.' Watch your sympathy and your praise, because both leak attributions: pity for failure and applause for easy success each signal low ability. And engineer tasks where effort visibly changes outcomes, since no attributional message survives contact with a rigged game.",
  coaches:"Teach teachers to hear the attributional content of their own talk — record five minutes of feedback and code it together for locus, stability, controllability. When reviewing a demoralized student, map the causal story the student has built before planning any intervention, because instruction aimed at skill won't touch an explanation problem.",
  leaders:"Organizations make attributions too. After disappointing results, 'our kids can't' and 'our strategies didn't' launch different faculties — one toward resignation, one toward redesign. The causal language leaders model in data meetings becomes the school's explanatory style, and it shows up later in every classroom's response to failure.",
  researchers:"Code attributions along dimensions rather than surface categories (the same word 'effort' can be controllable-unstable or a euphemism for ability). Attributional retraining is a mature intervention paradigm — test it against and alongside skill instruction, and attend to cultural variation in attribution patterns before exporting findings."},
 reasoning:{
  notice:["Spontaneous causal talk when work comes back — students announce their attributions out loud if you listen for dimensions, not just words.","Shame versus guilt: shame follows uncontrollable causes and shuts learners down; guilt follows controllable ones and can mobilize — the emotion tells you which story the student is living.","Repeated-failure students drifting toward stable explanations: the earlier you catch the drift, the cheaper the repair.","Your OWN attributions for each student's failures — teacher explanations predict teacher behavior, from wait time to warmth."],
  assume:["That the stated attribution is the operative one — 'the test was dumb' is sometimes armor over 'I'm dumb.'","That effort attributions are always safe: telling a student who genuinely tried that failure came from too little effort is both false and ability-implying; the honest, useful cause is usually strategy.","That one conversation rewrites an explanatory style built over years — retraining is a campaign, not a memo."],
  decide:["Pair every strategy attribution with actual strategy instruction; retraining without a real alternative method is just talk.","Structure early wins whose causes are unmistakable, and narrate the causal link explicitly.","Teach students the vocabulary of causes — stable/unstable, in-my-control/not — and have them re-explain outcomes in it.","After failures, ask 'what will you do differently?' before 'what happened?' — the question itself asserts controllability."],
  avoid:["Public pity — the kindest-feeling, most ability-damning move in teaching.","Praising success on easy tasks, which tells students exactly where you set their ceiling.","Effort lectures attached to unwinnable tasks.","Stable-ability language in professional talk ('my low babies,' 'she's just not a reader') — it scripts everyone's expectations, including the student's."]},
 competing:[
  {scenario:"A student has stopped trying entirely.", thisView:"Trace the causal history: repeated failures explained by stable, uncontrollable causes have collapsed expectancy — hopelessness is the rational endpoint of a bad explanation, and the repair is a new causal story with evidence.", other:"Self-Determination Theory (Deci & Ryan)", otherView:"Look at the environment's needs ledger: chronic competence frustration, no autonomy, thin relatedness. The student isn't explaining failure badly; the setting is starving motivation at the root.", agree:"Both predict disengagement when learners can't see a path to competence, and both prescribe feedback that restores a sense of effective agency. In practice, re-attribution and need support are usually delivered in the same conversation."},
  {scenario:"After enough failure, a learner goes passive everywhere — even where success is possible.", thisView:"The attributional reformulation: it isn't the failure history itself but its explanation — global, stable, internal causes generalize helplessness beyond the original domain.", other:"Behaviorism (Seligman's original learned helplessness)", otherView:"A history of noncontingent outcomes — nothing I do changes what happens — extinguishes responding directly; no cognitive story required.", agree:"This is the rare debate with a formal resolution: Abramson, Seligman, and Teasdale merged the accounts in 1978. Contingency history creates the conditions; attribution decides how far the damage spreads."}],
 research:{
  questions:["Which feedback behaviors communicate which attributions to students?","Does attributional retraining improve persistence and achievement, and for whom?","How do teacher attributions for student failure shape instructional behavior?","How do attribution patterns vary across cultures and domains?"],
  methods:"Experimental manipulations of feedback and vignettes; classroom observation with dimensional coding; attributional retraining trials (best developed in higher education); longitudinal studies linking explanatory style to outcomes.",
  variables:"Attribution dimensions (locus, stability, controllability), expectancy of success, discrete emotions (shame, guilt, hope), persistence and choice, and teacher-behavior measures (wait time, feedback type, warmth).",
  support:"A strong classic experimental foundation and positive meta-analytic support for attributional retraining, especially with struggling college students. Honest limits: attributions are measured after the fact by self-report, dimensions blur in real speech, and the construct overlaps heavily with self-efficacy and mindset — the field's job is often deciding which name a finding wears."},
 reflect:["Listen to yourself hand back the next set of graded work. What causes do your sentences assign, and would you accept those causes for your own setbacks?","Think of a student you feel sorry for. What might your sympathy be teaching them about why they struggle?","What's your causal story for your least successful class this year — and is it stable and uncontrollable, or strategic and revisable?","Which student in your room has quietly concluded a stable cause about themselves? What evidence could disturb that conclusion?","When your school's scores disappoint, what explanation does leadership reach for first — and what does that explanation license everyone to stop trying?"],
 constellation:{complements:["mindset","socialcognitive","expectancyvalue"],contrasts:["bourdieu"],pairs:["srl","sdt"]},
 origins:"Heider's common-sense psychology and Weiner's achievement research produced a taxonomy of causal attributions. Ability, effort, task difficulty, and luck differ along three dimensions that predict distinct emotional and motivational consequences, informing feedback and re-attribution training.",
 claims:["After outcomes, people search for causes; the dimensions of those causes drive consequences.","Stable attributions for failure (low ability) lower expectancy; unstable ones (effort, strategy) preserve it.","Controllability shapes emotion: guilt (controllable) mobilizes; shame (uncontrollable) demobilizes.","Teacher feedback communicates attributions — sometimes unintentionally (pity can signal low ability)."],
 constructs:[
  {term:"Locus", def:"Whether a cause is internal (ability, effort) or external (task, luck)."},
  {term:"Stability", def:"Whether a cause is fixed or variable over time; drives expectancy change."},
  {term:"Controllability", def:"Whether the cause is subject to volitional influence; drives guilt/shame and social judgments."},
  {term:"Learned helplessness", def:"Passivity following repeated uncontrollable failure (Seligman); attributionally reformulated by Abramson et al."},
  {term:"Attributional retraining", def:"Interventions shifting failure explanations toward controllable, unstable causes (strategy, effort)."}],
 applications:["Feedback that attributes failure to strategy rather than ability.","Attributional retraining programs for struggling college students.","Understanding demoralization and re-engagement in turnaround schools.","Analysis of teacher expectation effects and sympathy cues."],
 critiques:["Attributions are measured post hoc and are culturally variable (self-serving bias differs across cultures).","Classroom emotions involve more than attribution (control-value theory extends it).","Overlaps substantially with mindset and self-efficacy constructs."],
 related:["mindset","socialcognitive","expectancyvalue","srl"],
 refs:["Weiner, B. (1985). An attributional theory of achievement motivation and emotion. Psychological Review, 92(4), 548–573.","Weiner, B. (2010). The development of an attribution-based theory of motivation: A history of ideas. Educational Psychologist, 45(1), 28–36.","Abramson, L. Y., Seligman, M. E. P., & Teasdale, J. D. (1978). Learned helplessness in humans: Critique and reformulation. Journal of Abnormal Psychology, 87(1), 49–74."],
 compare:{learner:"A sense-maker explaining every success and failure", mechanism:"Causal dimensions (locus, stability, controllability) shape emotion and expectancy", instructor:"Feedback-giver whose cues signal attributions to students", knowledge:"Beliefs about causes of performance guide future engagement", critique:"Post hoc measurement; heavy overlap with adjacent theories"}
