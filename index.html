{
 id:"barkley", name:"Executive Function Model of ADHD", discipline:"Learning & ADHD", depth:"deep",
 theorists:"Russell Barkley (1997, 2012); Edmund Sonuga-Barke; Erik Willcutt (meta-analytic evidence)",
 tagline:"ADHD is not a knowledge problem but a performance problem: a difference in self-regulation and executive function that makes doing what you know inconsistent — and that responds to externalized structure, not willpower.",
 problem:"The homework is done — completed, in the backpack — and never turned in. The student who aced the lab-safety quiz walks past the goggles. Every adult in the building has explained, consequenced, and pep-talked, and the most repeated sentence in the file is 'he just needs to apply himself' — the least effective sentence in education. And the cruelest evidence keeps arriving: he DID it beautifully yesterday, so today's failure reads as choice. Barkley's model exists to explain the knowing-doing gap: for some learners the machinery that turns knowledge into timely action — inhibition, working memory, time sense, self-motivation — runs differently, insight doesn't fix it, and the help that works is structure at the point of performance, not speeches after it.",
 asks:["Why does knowing so reliably fail to become doing for some learners — in every subject, with every consequence?","What is actually different: knowledge, character, or the executive machinery of self-regulation?","Why don't consequences, insight, and motivation talks change it?","What supports actually work — and why do they look like 'crutches' to people who don't need them?"],
 iftrue:{
  teachers:"Externalize at the point of performance: the support must live where and when the action happens — visible timers, posted step sequences, the reminder ON the door, not in the lecture from Tuesday. Shorten the distance between action and consequence; break entry points to first-action size; and treat day-to-day variability as the condition's signature rather than its disproof — 'he did it yesterday' is evidence FOR the diagnosis, not against it.",
  coaches:"Your leverage is the reframe: help teachers move case conversations from character ('lazy, unmotivated') to machinery ('where in the chain does it break — initiation, sustaining, completion, turning in?'). Audit classrooms for EF load: invisible time, multi-step verbal directions, materials chaos, transition cliffs. Environmental redesign beats consequence escalation every time it's actually tried.",
  leaders:"Write EF-informed discipline policy: punishing executive failures teaches nothing and escalates everything — support plans belong where consequence ladders currently stand. Train staff on the performance-versus-knowledge distinction, design schedules and transitions as if time blindness exists (it does, in every building), and never let movement or recess be confiscated as punishment — you are removing treatment.",
  researchers:"The field's humbling finding is yours to build on: EF lab tests correlate weakly with daily functioning — ecological measures (ratings, direct observation, real-world outcomes) tell a different and truer story. Point-of-performance intervention trials, heterogeneity-respecting designs, and the combination question (behavioral supports with and without medication, the MTA lineage) are the live fronts."},
 reasoning:{
  notice:["Knowing-doing gaps as data: the aced quiz plus the forgotten goggles locates the problem in performance machinery, not comprehension.","Time blindness signatures: genuinely shocked by the same deadline pattern, repeatedly — the future isn't visible from where they stand.","The variability everyone misreads: brilliant Tuesday, absent Thursday — interest and context change available regulation; character didn't flicker.","Where exactly the chain breaks: initiation, sustaining, completing, or handing in are different failures needing different supports."],
  assume:["That inconsistency proves choice — 'he can when he wants to' mistakes interest's neurochemical effect for willpower; engagement changes the machinery's output, not the person's worth.","That insight fixes it: knowing about executive function doesn't supply executive function — the disorder is not ignorance of what to do.","That one profile fits all: EF-test deficits appear in only a subset, presentations differ wildly, and supports must be fitted per learner, not prescribed per label."],
  decide:["Externalize time: visible countdowns, time-marked task lists, artificial mini-deadlines with fast feedback.","Engineer the point of performance — supports physically and temporally AT the action: checklist on the lab bench, turn-in bin by the door, launch step written on the desk.","Shrink initiation: define the first two minutes of every large task, because starting is the bottleneck, not capacity.","Harness interest where the curriculum allows it — the best-documented 'medication-free' performance enhancer in the file."],
  avoid:["Consequence escalation for executive failures — punishing time blindness teaches hopelessness with a paper trail.","'Try harder' speeches; effort was never the broken part.","Confiscating recess and movement as punishment.","Withdrawing supports the moment they work — 'he doesn't need the timer anymore' is the crutch fallacy; the support working IS the system working."]},
 competing:[
  {scenario:"A student demonstrably knows the material and reliably fails to produce the work.", thisView:"A performance disorder: the gap lives between knowing and doing, and it closes with externalized structure at the point of performance — timers, launch steps, immediate loops — not with more knowing.", other:"Self-Regulated Learning (Zimmerman)", otherView:"Teach the cycle itself: planning, monitoring, reflection are learnable strategies, and this student may never have been taught them — instruction, not just accommodation.", agree:"The synthesis is the evidence-backed middle: SRL instruction works for ADHD learners precisely when it is externalized, scaffolded, and faded slowly — strategy teaching delivered through environmental support. Structure now, internalization gradually, dignity throughout."},
  {scenario:"The behavior plan isn't working — consequences seem to bounce off.", thisView:"Standard contingencies assume standard delay tolerance: ADHD steepens delay discounting, so consequences must be faster, more frequent, more salient — and antecedent redesign beats consequence design anyway.", other:"Behaviorism (Skinner)", otherView:"Then the plan was behaviorally naive, not behaviorally wrong: check function, immediacy, and reinforcement quality — a contingency that isn't working isn't a contingency the learner is experiencing.", agree:"Allies, fully: Barkley's prescriptions ARE behavioral engineering tuned to a different nervous system. Both reject character explanations; both redesign the environment; the tuning parameters differ, and that difference is the accommodation."}],
 research:{
  questions:["Why do EF lab measures predict daily functioning so weakly, and what ecological assessment should replace reliance on them?","Which point-of-performance supports move real academic outcomes, at what intensity?","How do behavioral supports and medication combine (the MTA lineage) — for whom, on which outcomes, over what horizon?","How heterogeneous is the EF profile across the ADHD population, and what does fitting supports to profiles yield?"],
  methods:"Longitudinal cohort studies of developmental trajectories and adult outcomes; randomized trials of behavioral classroom and parent training; the multimodal-treatment paradigm; neuropsychological batteries paired (and contrasted) with ecological ratings and direct observation.",
  variables:"EF ratings versus test scores, functional academic outcomes (work completion, grades, retention), symptom trajectories, support fidelity and fading schedules, and moderators of heterogeneity.",
  support:"Strong where it matters for schools: the performance-not-knowledge reframe is well established, behavioral classroom supports carry solid meta-analytic backing, and the EF-test/daily-function gap is thoroughly documented — which itself vindicates ecological over clinic-based assessment. Honest limits: Barkley's unified inhibition-first model is one contender among several (the dual-pathway model adds motivation's route), profiles are heterogeneous enough to humble any single theory, and long-term intervention evidence remains thinner than the condition's prevalence deserves."},
 reflect:["Who in your class 'just needs to apply himself'? Trace one week of his knowing-doing gaps: where exactly does the chain break, and what support lives at that point now — honestly, none?","What does your classroom externalize — time, steps, launch points — and what does it still expect students to hold invisibly in their heads?","When a student performs brilliantly one day and fails the next, what story do you tell yourself — and what would change if variability were the symptom rather than the verdict?","Which 'crutch' are you planning to remove because it's working — and would you say the same about eyeglasses?","Where does your school punish executive failure as moral failure — and what would the support-plan version of that consequence ladder look like?"],
 constellation:{builds:["behaviorism","infoprocessing"],complements:["adhd_strategies","implementation","dualpathway_adhd"],pairs:["srl","udl"]},
 origins:"Barkley's 1997 unifying theory recast ADHD as a disorder of behavioral inhibition that cascades into four executive functions: nonverbal working memory, internalized speech, self-regulation of affect and motivation, and reconstitution (planning). This reframing moved intervention from 'try harder' toward engineering the environment at the point of performance, and it explains patterns familiar to many adult learners: brilliance on interesting tasks, stalling on important-but-boring ones.",
 claims:["ADHD centrally involves self-regulation and executive function, with attention as a downstream symptom.","It is a performance disorder, not a knowledge or ability disorder — the gap is between knowing and reliably doing.","Working memory and time perception differences produce 'time blindness': the future feels less real, so distant deadlines exert weak pull.","Interventions work best at the point of performance — externalizing time, motivation, and information in the environment where the task happens — rather than through insight alone.","EF profiles vary: meta-analytically, EF-test deficits appear in only a subset of people with ADHD, so individual strategy-fitting beats one-size-fits-all."],
 constructs:[
  {term:"Behavioral inhibition", def:"The capacity to pause before responding — Barkley's foundation on which the other EFs depend."},
  {term:"Executive functions", def:"Self-directed actions (working memory, self-talk, emotion/motivation regulation, planning) that enable goal pursuit across time."},
  {term:"Time blindness", def:"Weakened sense of future time; deadlines gain force only when near — arguing for artificial nearness (mini-deadlines, visible timers)."},
  {term:"Point of performance", def:"The place and moment a behavior should occur — where supports (timers, checklists, visible cues) actually change outcomes."},
  {term:"Externalization", def:"Moving working memory and motivation out of the head: visible plans, alarms, accountability structures, written next-actions."},
  {term:"Performance vs. knowledge gap", def:"'ADHD is not a disorder of knowing what to do, but of doing what you know' — the design principle behind every effective support."}],
 applications:["Doctoral-study design: break the dissertation into visible mini-deadlines with external accountability (advisor check-ins, writing groups).","Externalize everything: one visible task list, timers you can see, next-action notes left where you'll resume work.","Work at the point of performance: set up tomorrow's writing session tonight — document open, one sentence of instructions to yourself.","Instructional design lens: EF-aware course design (chunking, frequent low-stakes deadlines) is UDL for executive function."],
 critiques:["Competing models: Brown emphasizes activation/arousal; Sonuga-Barke's dual-pathway adds a motivational (delay-aversion) route independent of inhibition.","EF tests only modestly predict real-world functioning; ecological measures diverge from lab measures.","Deficit language is contested — neurodiversity perspectives emphasize context-fit and strengths (interest-driven engagement) alongside impairment."],
 related:["adhd_strategies","implementation","dualpathway_adhd","srl","sdt","udl"],
 refs:["Barkley, R. A. (1997). Behavioral inhibition, sustained attention, and executive functions: Constructing a unifying theory of ADHD. Psychological Bulletin, 121(1), 65–94.","Barkley, R. A. (2012). Executive functions: What they are, how they work, and why they evolved. Guilford Press.","Willcutt, E. G., Doyle, A. E., Nigg, J. T., Faraone, S. V., & Pennington, B. F. (2005). Validity of the executive function theory of attention-deficit/hyperactivity disorder: A meta-analytic review. Biological Psychiatry, 57(11), 1336–1346."],
 compare:{learner:"A capable knower whose doing depends on self-regulation support", mechanism:"Inhibition and EF differences gate performance; external structure closes the gap", instructor:"Environment engineer who externalizes time, cues, and accountability", knowledge:"Intact — the challenge is consistent deployment, not acquisition", critique:"EF deficits aren't universal in ADHD; rival models stress motivation and arousal"}
},
{
 id:"dualpathway_adhd", name:"Dual-Pathway Model & Interest-Based Engagement", discipline:"Learning & ADHD", depth:"starter",
 theorists:"Edmund Sonuga-Barke (2003); hyperfocus research (Hupfeld, Abagis, & Shah, 2019)",
 tagline:"ADHD runs on (at least) two routes — executive/inhibitory differences and delay aversion — which is why motivation and immediacy change performance as much as 'focus' does.",
 claims:["Beyond EF differences, a motivational pathway (delay aversion — steep discounting of delayed rewards) independently produces ADHD behaviors.","Engagement is interest- and immediacy-sensitive: the same person who can't start a dull task may sustain intense absorption (hyperfocus) on a compelling one.","Effective support therefore manipulates reward timing and interest, not just distraction control."],
 constructs:[{term:"Delay aversion", def:"Preference for smaller-sooner over larger-later rewards; waiting itself is aversive."},{term:"Hyperfocus", def:"Intense, sustained absorption in intrinsically engaging tasks — an ADHD-common experience related to flow, with costs (time loss) and assets (deep work)."},{term:"Reward immediacy", def:"Shortening the distance between action and payoff (mini-goals, visible progress, streaks) as a design lever."}],

 id:"adhd_strategies", name:"Studying with ADHD: Evidence-Based Supports", discipline:"Learning & ADHD", depth:"starter",
 theorists:"George DuPaul & Lisa Weyandt (college ADHD research); Joshua Langberg (organization interventions); Frances Prevatt (ADHD coaching)",

{
 id:"formative", name:"Formative Assessment", discipline:"Education & Pedagogy", depth:"deep", dis:true,
 theorists:"Paul Black, Dylan Wiliam; Siobhán Leahy, Christine Lyon, Marnie Thompson; earlier: Michael Scriven, Benjamin Bloom",
 tagline:"Assessment is formative only when the evidence it produces actually changes what happens next — for the teacher, the peer, or the learner.",
 problem:"A teacher gives a quiz, records the scores, and teaches the next unit on schedule. A district calls its three-times-yearly benchmark test 'formative' because the results arrive before the state test. A department writes beautiful rubrics that students never use to revise anything. In every case assessment happened and instruction did not change — which is precisely the condition this theory exists to name. Black and Wiliam's contribution was to define formative assessment not by an instrument, a timing, or a label, but by a consequence: evidence is formative to the extent that it is elicited, interpreted, and used to make a better-founded decision about what to do next. That definition disqualifies most of what schools call formative, which is exactly why it is worth teaching.",
 asks:["What makes assessment formative — the instrument, the timing, or the use of the evidence?","How can teachers gather evidence from every student rather than the confident few?","What kinds of feedback move learning forward, and which reliably do not?","Can students and peers act as legitimate sources and users of assessment evidence?","Why does the label 'formative' migrate so easily onto practices that change nothing?"],
 origins:"Michael Scriven coined the formative/summative distinction for program evaluation in 1967; Benjamin Bloom imported it to classrooms through mastery learning. The modern research program begins with Black and Wiliam's 1998 review in Assessment in Education, which synthesized roughly 250 studies and argued that strengthening classroom formative practice produces learning gains among the largest reported for any educational intervention — and their companion Phi Delta Kappan article, 'Inside the Black Box,' which put the argument in practitioners' hands. The 2009 theory paper tightened the definition to a decision-consequence test, and the five-strategies framework (Leahy, Lyon, Thompson & Wiliam, 2005) converted it into classroom practice.",
 claims:["Assessment is formative by consequence, not by format: evidence must be elicited, interpreted, and used to make a better-founded instructional decision than would otherwise have been made.","Frequent, low-stakes evidence from ALL students beats high-quality evidence from a self-selected few — steering by volunteers is steering by a biased sample.","Feedback functions formatively only when it causes learning-directed action; feedback with no next attempt is an autopsy.","Grades and comments together tend to nullify the comments: attention goes to the score.","Students and peers are not just objects of assessment but agents of it — activating them is a strategy, not a courtesy.","Learners cannot close a gap toward quality they cannot yet perceive, so sharing intentions and criteria is a precondition, not a nicety."],
 constructs:["<b>The five key strategies</b> — clarifying and sharing learning intentions and success criteria; engineering effective discussions, tasks, and questions that elicit evidence; providing feedback that moves learners forward; activating students as instructional resources for one another; activating students as owners of their own learning.","<b>Elicit → interpret → use</b> — the three-step test that decides whether a practice is formative at all.","<b>All-student response</b> — mini-whiteboards, exit tickets, ABCD cards: techniques whose point is the sample, not the novelty.","<b>Comment-only marking</b> — feedback without a grade attached, so the comment is what gets attended to.","<b>Short-cycle vs. long-cycle</b> — minute-by-minute and day-by-day practice, distinguished from the interim testing that borrowed the name.","<b>Sadler's three conditions</b> — the learner must hold a concept of quality, compare current work to it, and act to close the gap."],
 iftrue:{
  teachers:"Ask the disqualifying question of every assessment you give: what decision will this change? If the honest answer is none, the instrument is summative regardless of its label. Build all-student response into the middle of lessons rather than sampling volunteers, and treat a 50/50 split as an instruction to branch, not to proceed. Separate comments from grades where you can — and where you cannot, put the comment on a draft that will be revised. Give students the criteria before the work, examined against real examples rather than announced.",
  coaches:"The highest-leverage coaching question is not 'what did you assess?' but 'what did you change?' Help teachers see that the evidence-gathering half is the easy half; the steering is where the practice lives or dies. When a teacher says formative assessment 'didn't work,' check three things in order: was evidence gathered from everyone, was it interpreted before the next decision, and did any decision actually differ. Expect the diagnosis to be in the third.",
  leaders:"Guard the vocabulary. When 'formative' is applied to interim benchmark testing, the term stops meaning anything and the practice with the strong evidence base gets confused with the practice that has little. Protect short-cycle classroom practice from being displaced by data systems that report to adults on a six-week delay. And resist mandating formative assessment as a compliance artifact — a required exit ticket that no one reads is the failure mode this theory predicts.",
  researchers:"Formative assessment is a family of practices, not a single treatment, which makes clean effect estimation genuinely difficult — a limitation the field now acknowledges openly. Fruitful designs specify which of the five strategies is being manipulated, measure implementation fidelity, and treat the responsive decision as the mediating variable rather than assuming it. Practitioner-researchers are unusually well positioned here: the unit of study is a decision, and you are the one making it."},
 reasoning:{
  notice:["Whether evidence is being gathered from every student or only from those who volunteer it.","What happens in the ten minutes AFTER evidence arrives — that interval is where formative practice actually lives.","Whether feedback lands before a next attempt exists, or after the work is finished and filed.","Whether students can state what quality looks like in their own words, or only where the rubric is posted.","Whether 'formative' in your building names a classroom practice or a testing calendar."],
  assume:["That giving the assessment is the intervention. It is the input; the decision is the intervention.","That more frequent testing is more formative. Frequency without responsiveness is just more testing.","That students understand criteria because they were distributed.","That the 1998 review's headline effect sizes are settled science — later analyses report considerably smaller and more variable effects."],
  decide:["Whether to proceed, re-teach, or branch — and to make that call from the distribution rather than the loudest signal.","Which single next step feedback should name, given that one actionable move outperforms ten corrections.","Whether the assessment you are about to give will change anything; if not, whether it is worth the minutes.","Whether to spend scarce time on better instruments or on better use of the instruments you have. The evidence favors use."],
  avoid:["Calling interim benchmark testing formative assessment — the definitional slide that has done the most damage to this literature's usefulness.","Attaching grades to work you want students to learn from.","Collecting exit tickets you will not read; students learn quickly which artifacts are decorative.","Treating the effect-size claim as a promise rather than as a contested estimate."]},
 competing:[
  {scenario:"A school adopts three benchmark assessments a year and calls it a formative assessment system.",
   thisView:"Almost none of the mechanism is present: the cycle is far too long to change instruction for these students on this content, the evidence rarely reaches the learner in usable form, and no one is activated as an owner of their own learning. The name has migrated; the practice has not.",
   other:"Data-Driven Decision Making / Improvement Science",
   otherView:"Interim data serve a real and different purpose: they reveal patterns across classrooms and cohorts that no single teacher can see, and they inform system-level decisions about curriculum, staffing, and support. The error is not in collecting them but in expecting them to do a job they were never designed for.",
   agree:"Both agree the two practices operate on different clocks and answer different questions — and both regard collapsing them under one word as the source of the confusion. Short-cycle assessment steers a lesson; interim data steer a system."},
  {scenario:"A teacher's careful written feedback is read and ignored, draft after draft.",
   thisView:"Check the conditions before blaming the student: was there a next attempt for the feedback to land on, was a grade attached that captured the attention, and did the comment name one actionable move or ten corrections?",
   other:"Feedback research (Hattie & Timperley; Kluger & DeNisi)",
   otherView:"Feedback is not reliably beneficial at all — over a third of studied interventions made performance worse, and the strongest predictor of harm is feedback directed at the self rather than the task. The question is not only whether feedback is used but whether it should have been given in that form.",
   agree:"Complete convergence in practice: feedback must be task-focused, actionable, and delivered while a next attempt exists. Formative assessment supplies the timing condition; the feedback literature supplies the content condition, and both are necessary."}],
 applications:["Replacing hands-up questioning with all-student response so the evidence stops sampling confidence.","Exit tickets that are read the same day and visibly change the next lesson's opening.","Comment-only marking on drafts, with the revision assessed partly on what the feedback produced.","Co-constructing success criteria by sorting strong and weak anonymous work samples before students begin.","Peer feedback trained against explicit criteria, which activates students as resources for one another.","Self-assessment against criteria at closure — the practice that eventually makes the teacher's role smaller."],
 critiques:["<b>The effect size problem.</b> The 1998 review reported gains of roughly 0.4–0.7 standard deviations, a figure that entered policy discourse as settled fact. It was a narrative synthesis, not a meta-analysis, and Bennett (2011) and Kingston and Nash (2011) argued the estimate is not well founded — the latter's meta-analysis reported closer to 0.20. Wiliam himself has since called the original figures unhelpfully imprecise. The practice retains strong warrant; the headline number does not.","<b>Definitional slipperiness.</b> If formative assessment is defined by consequence, its boundaries are hard to fix and almost any responsive teaching qualifies — which makes the construct difficult to study cleanly and easy to co-opt.","<b>Co-optation in practice.</b> The term has been attached to commercial interim testing products whose cycle length makes the mechanism impossible.","<b>Implementation burden.</b> The five strategies ask for real changes in questioning, marking, and planning; mandated shallowly, they produce compliance artifacts rather than responsive teaching.","<b>Equity caution.</b> Responsive teaching can widen gaps if responsiveness tracks teacher expectations — the evidence must actually come from every student, including those a teacher has quietly stopped calling on."],
 research:{
  questions:["Which of the five strategies carries the most weight, and does that vary by content area or grade band?","What distinguishes teachers whose formative practice changes decisions from those whose practice changes only paperwork?","How does the responsive decision mediate between evidence collection and student outcomes?","What conditions cause feedback to be used rather than read?","How do interim testing systems affect the quality of short-cycle practice in the same building?"],
  methods:["Classroom observation with fidelity measures for named strategies rather than for 'formative assessment' generally.","Teacher decision logs paired with student work — a design well suited to practitioner research.","Design-based research iterating on a specific strategy in an authentic setting.","Discourse analysis of questioning patterns to examine whose evidence is actually gathered."],
  variables:["Independent: presence and quality of a specific strategy; cycle length; grade attachment.","Mediating: the instructional decision made after evidence (the theory's core mechanism, and the most frequently unmeasured).","Dependent: student achievement, revision quality, self-assessment accuracy, participation distribution.","Control: prior achievement, content, teacher experience, implementation fidelity."],
  support:"Robust in principle, contested in magnitude. Black and Wiliam's reviews established formative practice as one of the more promising levers available inside ordinary classrooms, and the component mechanisms — feedback that is task-focused and actionable, all-student response, criteria made visible through examples — each carry independent support. The honest caveats are that the widely quoted effect sizes have not survived scrutiny, that the construct's breadth makes clean estimation difficult, and that effects run entirely through the teacher's responsive decision, which most studies infer rather than measure."},
 reflect:["Take the last assessment you gave. What decision did it change? If none, what would have had to be different?","Whose evidence does your questioning routine actually gather — and who has learned that they will not be asked?","Where in your practice do grades and comments arrive together, and what would it cost to separate them?","When your school says 'formative,' which practice does it mean? Does the vocabulary help or hide?","If you removed every assessment that changes no decision, how much time would you recover — and what would you spend it on?"],

 refs:[
  {r:"Black, P., & Wiliam, D. (1998). Assessment and classroom learning. <i>Assessment in Education: Principles, Policy & Practice, 5</i>(1), 7–74.", url:"https://doi.org/10.1080/0969595980050102"},

{
 id:"improvement", name:"Improvement Science", discipline:"Research & Methodology", depth:"deep", dis:true,
 theorists:"Anthony S. Bryk, Louis M. Gomez, Alicia Grunow, Paul G. LeMahieu (Carnegie Foundation); lineage: Walter Shewhart, W. Edwards Deming, Donald Berwick and the healthcare improvement tradition",
 tagline:"Getting better at getting better: disciplined, rapid inquiry into the system that produces current results — rather than another initiative aimed at people inside it.",
 problem:"A district adopts a promising program that worked elsewhere. Implementation is uneven, results disappoint, and within three years it is replaced by the next promising program. Nobody learns why it failed here, because nobody studied the system it landed in. Improvement science exists to break that cycle. Its founding observation is that education has an implementation problem more than a knowledge problem: we know a great deal about what can work and remarkably little about how to make it work reliably, at scale, across variable conditions. It reframes the question from 'what works?' to 'what works, for whom, under what conditions — and how would we know?'",
 asks:["Why do interventions that work in one setting fail to travel to another?","What is the system currently producing, and what about it produces that?","How can practitioners test changes fast enough to learn before the year ends?","What measures would tell us whether a change is an improvement — as opposed to whether we complied?","How does knowledge accumulate across schools rather than being rediscovered in each one?"],
 origins:"The methods descend from industrial quality improvement — Shewhart's control charts, Deming's system view and Plan–Do–Study–Act cycles — routed through healthcare, where the Institute for Healthcare Improvement demonstrated that rapid-cycle testing could reduce mortality in ways program evaluation could not. Anthony Bryk and colleagues at the Carnegie Foundation adapted the tradition for education in the 2010s, arguing in <i>Learning to Improve</i> (2015) that education's chronic failure to scale reforms was a methodological problem with a methodological answer. Carnegie's networked improvement communities — beginning with the community-college developmental mathematics pathways — were the proof case.",
 claims:["<b>Every system is perfectly designed to get the results it gets.</b> Outcomes are produced by systems, not by the will or virtue of the people inside them.","Variation in performance is the central problem to study, not noise to average away — 'what works' is the wrong question without 'for whom, under what conditions.'","Improvement requires disciplined inquiry: change ideas are hypotheses to be tested in small, fast cycles, not decisions to be implemented and defended.","You cannot improve at scale what you cannot measure — but the measurement must be practical (usable by practitioners in real time), not the accountability measurement schools already drown in.","Improvement work must be problem-specific and user-centered: begin with the people doing the work and the problem as they experience it.","Knowledge accumulates faster through networked improvement communities than through isolated sites, because variation across sites becomes data rather than noise."],
 constructs:["<b>The six core principles</b> — make the work problem-specific and user-centered; focus on variation in performance; see the system that produces current outcomes; measure what matters for improvement; anchor practice in disciplined inquiry; accelerate learning through networked communities.","<b>PDSA cycle</b> — Plan, Do, Study, Act: a small test of change, run fast, studied against a prediction.","<b>Driver diagram</b> — a working theory of improvement: aim → primary drivers → secondary drivers → change ideas, revised as evidence arrives.","<b>Practical measurement</b> — brief, embedded measures for learning within cycles, distinguished from accountability and research measurement.","<b>Networked Improvement Community (NIC)</b> — sites bound by a common aim, a shared working theory, and disciplined methods, so learning compounds across them.","<b>90-day cycle</b> — a bounded scan-and-synthesize inquiry used before committing to a direction.","<b>See the system</b> — process mapping, root-cause analysis, and fishbone diagrams applied to a local problem of practice."],
 iftrue:{
  teachers:"Your classroom is a system, and the results it produces are being produced by something — sequence, routine, timing, materials — not by student character. Improvement science gives you permission to test one small change against a prediction rather than overhaul everything: change one thing, in one class, for two weeks, with a measure you can actually collect. A change that fails and teaches you something is a successful cycle, which is a genuinely different relationship to failure than most school cultures offer.",
  coaches:"This is the methodology that makes coaching cumulative rather than episodic. Help teams state an aim with a number and a date, build a driver diagram so the theory is visible and arguable, and run small tests instead of launching initiatives. Guard the discipline that gets dropped first: the prediction. Without 'by ___ I expect ___ because ___,' a PDSA cycle degenerates into trying things. And insist on practical measurement — if the measure requires the data office, the cycle is too slow to learn from.",
  leaders:"The central discipline is refusing to blame people for a system's output — and the central temptation is to keep launching initiatives because initiatives are visible and system study is not. Improvement science asks leaders to slow down at the start (understand the problem and the system before choosing a solution) in order to move faster afterward. It also asks for a real tolerance for tested failure; if failed cycles are career-costly, teams will report only successes and the method dies quietly.",
  researchers:"Improvement science is a methodology, not a theory of learning — a distinction dissertation committees will press. It is well suited to practitioner-scholars studying their own contexts, and it pairs naturally with design-based research, though the two aim at different products: DBR generates theory, improvement science generates reliable process. Expect to defend measurement quality, the warrant for causal claims from small tests, and the boundary between improvement work and generalizable research — including, in most institutions, whether your work requires IRB review at all."},
 reasoning:{
  notice:["What the system currently produces, in numbers, before proposing any change.","Where the variation is — across classrooms, sections, subgroups, times of year. Variation is the finding, not the noise.","Whether the problem was defined by the people who experience it or by the people proposing the solution.","Whether anyone wrote down a prediction before the change was tried.","How long the feedback loop is: if you learn whether a change worked in June, you cannot improve during the year."],
  assume:["That the solution is known and only implementation is lacking. That assumption skips the system study where the actual problem usually lives.","That a program that worked elsewhere will work here — the conditions that made it work are rarely part of what gets transferred.","That measuring more is measuring better. Accountability data are usually the wrong instrument for learning within cycles.","That improvement science, being a methodology, is neutral about what counts as a worthy aim. Aims encode values; whose problem gets solved is a choice."],
  decide:["What single small change to test next, at the smallest scale that could teach you something.","What you predict will happen, by when, and why — written before the test.","Whether an observed change is signal or ordinary variation.","Whether to adopt, adapt, or abandon after a cycle — all three being legitimate outcomes.","Whether this problem needs a system study or genuinely needs a solution you already trust."],
  avoid:["Launching an initiative when you could run a test — the difference is scale, reversibility, and whether anyone will learn.","Skipping the prediction, which converts inquiry into activity.","Studying only the sites where things went well; the variation is the data.","Importing industrial vocabulary into a school culture without translating it — 'defect' and 'production' land badly in rooms full of children.","Treating equity as a downstream outcome of better processes rather than as a design commitment in the aim itself."]},
 competing:[
  {scenario:"A doctoral candidate wants to study a change she is making in her own school.",
   thisView:"Frame an aim with a measure, map the system producing current results, build a driver diagram, and run PDSA cycles — the product is a reliable local process and knowledge about the conditions it depends on.",

   agree:"The most defensible practice holds both: name the equity commitment inside the aim rather than treating it as an outcome, let critical analysis identify what to look at, and let improvement methods test whether anything actually changed. Carnegie's later work moves in this direction — a response to precisely this critique."}],
 applications:["A ninth-grade team running two-week PDSA cycles on a single attendance driver rather than adopting an attendance program.","A driver diagram built with teachers to make a team's working theory of a problem visible and arguable.","Practical measures — a three-item exit survey, a weekly work-sample count — designed for the cycle, not for the state.","A networked improvement community across schools sharing one aim and one measurement system.","A 90-day scan before committing to a direction on a stubborn problem.","Process mapping the referral pathway before designing any discipline intervention."],
 critiques:["<b>Industrial provenance.</b> The methods came from manufacturing and healthcare, where outputs are more standardized and causality shorter. Whether they translate to teaching — where the 'product' is contested and the causal chains are long — remains genuinely disputed.","<b>Technocratic risk.</b> Framing educational problems as system-design problems can obscure questions of power, politics, and purpose. A more efficient path to a bad aim is not an improvement, and improvement science's own vocabulary offers limited resources for arguing about aims.","<b>Equity as afterthought.</b> Early applications were criticized for treating equity as an outcome to be measured rather than a commitment to be designed in; the field has responded, but the critique shaped it.","<b>Resource intensity.</b> NICs need hubs, facilitation, measurement infrastructure, and protected time. Schools attempt them without any of these and conclude the method does not work.","<b>Evidentiary standing.</b> Small, fast tests support local learning but warrant causal claims weakly; improvement work and generalizable research are not the same product, and conflating them invites methodological objections.","<b>Vocabulary friction.</b> Deming's language can read as dehumanizing in schools, and adoption often stalls on the words before it reaches the ideas."],
 research:{
  questions:["Under what conditions do improvements achieved in one site transfer to another?","What distinguishes networked improvement communities that produce cumulative knowledge from those that produce meetings?","How does practical measurement affect the quality of practitioner decisions relative to accountability measurement?","Does making equity explicit in the aim change what improvement cycles actually surface?","What is the appropriate warrant for causal claims arising from iterative small tests?"],
  methods:["PDSA cycles with documented predictions and run charts.","Run and control charts to distinguish signal from ordinary variation.","Driver diagrams as explicit, revisable theories of improvement.","Process mapping and root-cause analysis of local systems.","Mixed methods across a network, treating site variation as the object of study."],
  variables:["Independent: the change idea being tested; the driver it targets.","Mediating: fidelity, local conditions, and the practitioner decisions the measures inform.","Dependent: the practical measure tied to the aim, plus balancing measures for unintended effects.","Contextual: the site conditions that determine whether a change travels — the variables improvement science treats as primary rather than as controls."],
  support:"Strong in healthcare, promising and less settled in education. Carnegie's developmental mathematics pathways (Statway and Quantway) are the most cited education case, reporting substantially improved completion rates relative to traditional sequences. Beyond such flagship cases the evidence base is younger and thinner, and reviews note that improvement work's own methods — small, local, iterative — are not designed to produce the kind of causal evidence that would settle its effectiveness by conventional standards. That tension is intrinsic rather than accidental, and it is worth naming plainly in a methods chapter."},
 reflect:["Name a problem in your building that has survived at least two solutions. What about the system keeps producing it?","Where does variation in your results live — and have you ever studied the variation instead of averaging it?","When did you last write a prediction down before trying something? What did it cost you not to?","Whose problem is your current improvement effort solving — and were they in the room when it was defined?","What would it take, in your setting, for a failed test to be safe to report?"],

const SCENARIOS = [
{scene:"A third-grade teacher gives points redeemable for prizes whenever students turn in homework. Completion jumps immediately — but when the point system ends in spring, completion falls BELOW where it started. Which account best explains both the rise and the below-baseline fall?",
 options:["Behaviorism explains the rise; extinction explains the fall — the behavior simply returns to its unreinforced rate","Behaviorism explains the rise; Self-Determination Theory's undermining effect explains the fall","Expectancy-Value Theory explains both: the reward raised task value, and its removal lowered value further","Self-Determination Theory explains both: the reward was experienced as controlling from the first day"],
 answer:1, why:"Operant reinforcement predicts the immediate increase. But SDT's undermining effect is what predicts a fall BELOW baseline: expected, contingent rewards can crowd out the intrinsic or internalized motivation that was doing the work before, so removal leaves less than there was.",
 near:"Extinction is the sharpest competitor — and the discriminating detail is in the scenario: extinction predicts a return TO baseline, not below it. SDT-explains-both fails on the rise (rewards demonstrably worked at first). Expectancy-value is a real rival account of the fall, but it has no mechanism for value ending up lower than it began."},

{scene:"A doctoral student can recite the definition of 'zone of proximal development' perfectly but cannot recognize it operating in a classroom video. Which concept most precisely names this problem?",
 options:["Transfer of learning: no bridging or hugging was designed into her coursework","Inert knowledge (situated learning)","Schema theory: the concept was learned without an adequate set of exemplars","Expertise reversal: the definition was pitched above her current level"],
 answer:1, why:"Situated learning theorists call knowledge that can be recited but not used 'inert' — a predicted result of learning concepts apart from authentic activity. The remedy is applying concepts within practice, exactly what this scenario tab is for.",
 near:"Transfer is the closest call, and it is not wrong — but it names the mechanism that failed rather than the condition of the knowledge itself. Schema theory correctly diagnoses the missing exemplars but doesn't name the phenomenon. Expertise reversal is about support becoming counterproductive for experts — the wrong direction entirely."},

{scene:"A middle-school math teacher demonstrates a new procedure while students watch, then has them study several fully worked solutions before trying problems on their own. Struggling students improve markedly. Which framework most directly predicts this specific result?",
 options:["Social Cognitive Theory: students learned vicariously by observing a model","Sociocultural Theory: the teacher scaffolded within the zone of proximal development","Cognitive Load Theory: the worked-example effect","Cognitive apprenticeship: modeling, coaching, and fading"],
 answer:2, why:"CLT's worked-example effect: novices learn more from studying worked solutions than from unsupported problem solving, because problem search overloads working memory before schemas exist. The expertise reversal effect predicts this support should fade as students advance.",
 near:"All four are defensible readings of the lesson, which is the point. Modeling and scaffolding describe the demonstration accurately — but the result to be explained is that studying WORKED SOLUTIONS outperformed solving, and the worked-example effect is the finding that predicts exactly that, with a stated mechanism (reduced problem-search load) and a stated boundary (it reverses with expertise)."},

{scene:"After a unit on seasons, most students still explain that summer is warmer because Earth moves closer to the sun — despite having been told otherwise twice. Which theory best explains the persistence and prescribes the remedy?",
 options:["Dual-process theory: the intuitive System 1 answer arrives first and goes unchecked","Cognitive Load Theory: reduce extraneous load and reteach with a worked example","Schema theory: activate prior knowledge more thoroughly before reteaching","Conceptual change: create dissatisfaction with the misconception, then offer an intelligible, plausible, fruitful alternative"],
 answer:3, why:"Intuitive theories resist mere telling. Posner and colleagues argue accommodation requires dissatisfaction (a discrepant event — both hemispheres would be close simultaneously) plus a more fruitful alternative (axial tilt), not repetition.",
 near:"Dual-process correctly describes why the wrong answer is generated so fluently, but offers no account of why it survives instruction. Schema theory is close — assimilation without accommodation is the same event in different vocabulary — but its prescription here is backwards: activating a misconception more thoroughly entrenches it. Load is not the barrier; conviction is."},

{scene:"A principal notices that students labeled 'low readers' in September receive fewer open-ended questions and less wait time all year, and end further behind. Which lens most directly names this dynamic?",
 options:["Attribution theory: the teachers attribute low performance to stable, uncontrollable ability","Cognitive Load Theory: open-ended questions would overload struggling readers","Labeling and the self-fulfilling prophecy (symbolic interactionism)","Expectancy-Value Theory: the students' own expectancy of success declined"],
 answer:2, why:"Symbolic interactionism and labeling theory (Becker; Rist's classic classroom study) describe how institutional labels alter treatment and expectations, producing the very outcomes they predict. Attribution and expectation research supplies the micro-mechanisms.",
 near:"Attribution theory is genuinely operating and is the best distractor here — but it names what happens inside a teacher's head, while the scenario's subject is an institutional label producing a measurable outcome. Expectancy-value moves the action into the students, whom the scenario never quotes. The load answer is the one worth sitting with: it is a real rationalization teachers offer, and it converts a differentiated expectation into a pedagogical justification."},

{scene:"An EdD student designs professional development where teachers first try a new discussion protocol with their own students, then meet to reflect, extract principles, and plan a revised attempt next month. Which framework is the cycle itself built on?",
 options:["Improvement science: Plan–Do–Study–Act cycles","Kolb's experiential learning cycle","Design-based research: iterative enact–analyze–redesign cycles","Andragogy: adults need experience-based, problem-centered learning"],
 answer:1, why:"Concrete experience (trying the protocol) → reflective observation (debrief) → abstract conceptualization (principles) → active experimentation (revised plan): Kolb's four modes in sequence, applied to adult professional learning.",
 near:"This item is deliberately hard, because three of the four describe cycles. PDSA and DBR share Kolb's shape but answer different questions: PDSA is a method for improving a system, DBR a methodology for testing design conjectures as research. Neither is what the scenario describes — individual practitioners learning from their own experience. Andragogy explains why the design suits adults, but names conditions, not a cycle."},

{scene:"A fifth grader decodes a passage about cricket fluently but comprehends almost nothing; a classmate who just arrived from another country understands cricket deeply but stumbles on the words. Which framework best distinguishes what each child needs?",
 options:["Schema theory: the first child lacks a cricket schema to comprehend with","Scarborough's Reading Rope: many strands weave into skilled reading","Chall's stages: one child is learning to read, the other reading to learn","Simple View of Reading: comprehension = decoding × language comprehension, so each child has a different weak factor"],
 answer:3, why:"RC = D × LC. The first child has strong D but weak background knowledge for cricket (the LC side); the newcomer has strong LC for this topic but needs decoding support. The multiplicative model is what makes each child's different weak factor explicit — and explains why one intervention would fail both.",
 near:"Schema theory explains the first child completely and the second not at all — that asymmetry is the tell. The Reading Rope is the same territory, more elaborated, but its many strands make it a poorer instrument for this particular contrast than the two-factor product. Chall's stages describe typical development, not two children with mirror-image profiles at the same age."},

{scene:"A university simplifies its aid-renewal form from twelve steps to three and sends two text reminders before the deadline. Renewals among first-generation students rise noticeably. Which framework best accounts for the result?",
 options:["Nudge theory / choice architecture — reducing friction (sludge) and adding timely salience","Cognitive Load Theory — the twelve-step form imposed heavy extraneous load","Implementation intentions — the texts supplied the missing if–then cue","Self-Determination Theory — the simpler process felt less controlling and more autonomy-supportive"],
 answer:0, why:"Removing friction and adding timely salience are classic choice-architecture moves (Thaler & Sunstein; Castleman & Page's summer-melt studies). No preferences and no knowledge changed — the path to an already-intended action was cleared.",
 near:"Load and implementation intentions are both partially right, and both are strong distractors: the form was cognitively demanding, and the texts did function as cues. The discriminator is that nobody in this scenario is LEARNING anything — no schema is built, no intention is formed. The intention already existed; only the architecture around it changed."},

{scene:"Two students fail the same statistics exam. One says, 'I'm just not a math person.' The other says, 'I only did massed rereading — I should space my practice and self-test.' Which pairing best captures the difference in their EXPLANATIONS?",
 options:["Self-efficacy theory and metacognitive monitoring","Learned helplessness and desirable difficulties","Attribution theory (stable/uncontrollable vs. unstable/controllable causes) and mindset theory","Expectancy-Value Theory and self-regulated learning"],
 answer:2, why:"Weiner: 'not a math person' is internal, stable, uncontrollable — it lowers expectancy and invites helplessness. The strategy explanation is unstable and controllable, preserving expectancy. The contrast maps directly onto Dweck's fixed and growth mindsets.",
 near:"Every option here is defensible, and that is deliberate — this item tests precision, not recognition. Learned helplessness and desirable difficulties are both genuinely present, but they name where each student is HEADED, not how each explains. The question asks specifically about the explanations, and causal explanation is attribution theory's exact object of study."},

{scene:"A teacher-education program moves methods courses into partner schools, where candidates begin by leading small-group routines alongside mentor teachers before gradually taking on whole-class instruction. Which theory most directly informs this design?",
 options:["Cognitive apprenticeship: modeling, coaching, scaffolding, and fading","Situated learning: legitimate peripheral participation in a community of practice","Sociocultural theory: gradual release of responsibility within the ZPD","Deliberate practice: progressively harder tasks with expert feedback"],
 answer:1, why:"Lave and Wenger: newcomers learn through sanctioned, low-stakes participation at the edge of authentic practice, moving centripetally toward full participation — the residency logic exactly, with mentors as old-timers granting access.",
 near:"All four describe supported entry into complex skill, and any would be defensible in a paper. The discriminator is the unit of analysis. Cognitive apprenticeship and gradual release describe what an expert does TO a novice; deliberate practice describes designed task difficulty. Only LPP makes the community itself the learning environment and locates the candidate's trajectory as movement within it — which is what 'move the courses into schools' actually changes."},

{scene:"An instructional designer's training video shows dense on-screen text while a narrator reads the identical words aloud over decorative stock footage. Learners perform worse than with a simpler version. Which principles were violated?",
 options:["Split-attention and modality principles","Redundancy and coherence principles","The seductive details effect alone","Extraneous load, without any more specific principle"],
 answer:1, why:"Mayer: narration plus identical on-screen text overloads the verbal channel (redundancy), and decorative footage adds seductive details that harm learning (coherence). The fix is graphics with narration alone, minus the decoration.",
 near:"This item tests precision INSIDE multimedia learning rather than recognition of the field. Split-attention applies when related material is separated and must be integrated — here the text is not separated but duplicated. Modality would apply if text should have been narrated; it already was. Seductive details is genuinely half the answer (the footage) but misses the duplication, and 'extraneous load' is true of all four options, which is why it is not an answer."},

{scene:"A veteran teacher in a doctoral seminar reads equity audit data from her own school that contradicts her belief that 'discipline here is colorblind.' Shaken, she begins questioning assumptions she has held for twenty years, discusses them intensely with critical friends, and ultimately redesigns her referral practices. Which theory best describes this full arc?",
 options:["Cognitive dissonance: contradiction produces discomfort that drives resolution","Conceptual change: dissatisfaction with an existing conception plus a more fruitful alternative","Critical pedagogy: the development of critical consciousness","Transformative learning: disorienting dilemma → critical reflection → discourse → action"],
 answer:3, why:"Mezirow's sequence exactly: a disorienting dilemma (the data), critical premise reflection, rational discourse with peers, and reintegration through changed action.",
 near:"All three distractors are genuinely operating, which makes this a fair doctoral item. Dissonance names the mechanics of the shaken moment but is agnostic about which resolution route she takes — discrediting the data would also have reduced dissonance. Conceptual change is structurally parallel but developed for scientific concepts, not identity-level frames. Freire would push the endpoint toward collective action rather than one teacher's redesigned practice — a real critique of Mezirow worth knowing, but not a description of this arc."},

{scene:"Students write lab reports that earn high marks in biology but are marked down in chemistry for 'wrong format,' though the writing quality seems identical. Which framework best explains what the students still need to learn?",
 options:["Genre theory: each discipline's report is a distinct genre serving a distinct discourse community","Transfer of learning: near transfer failed between adjacent contexts","Situated learning: writing competence is bound to the practice in which it was learned","Threshold concepts: the students have not yet crossed a disciplinary portal"],
 answer:0, why:"Genres are typified social actions of particular discourse communities (Miller; Swales). 'Good writing' is community-relative: these students have general skills but lack genre knowledge — the purposes, moves, and conventions each discipline's community expects.",
 near:"Situated learning is nearly the same claim in different vocabulary and is the strongest distractor; the discriminator is that genre theory specifies WHAT is community-bound (the text type and its conventions) rather than competence in general. Transfer correctly describes the failure but treats format as a portable skill that didn't move, when the point is that there was nothing to move — the chemistry genre was never learned."},

{scene:"Designing her dissertation study, an EdD candidate must justify why she will use interviews to explore how first-year teachers 'make meaning' of mentoring, rather than running an experiment. Which foundation is she being asked to articulate?",
 options:["Her theoretical framework — the body of theory that frames her constructs","Her positionality as a practitioner-researcher in her own setting","Her epistemological paradigm — an interpretivist/constructivist stance on what counts as knowledge","Her research design and sampling strategy"],
 answer:2, why:"Methodology follows epistemology. Studying constructed meaning presumes knowledge is contextual and co-constructed (interpretivism), warranting qualitative interviews; a positivist stance would warrant controlled measurement. Committees expect this alignment argued explicitly.",
 near:"These four get conflated constantly in proposals, which is why they are here together. A theoretical framework names which theories frame the constructs — necessary, but it cannot justify a METHOD. Positionality is genuinely required for insider research but answers 'who is asking,' not 'what counts as knowing.' Design and sampling are downstream consequences of the paradigm, not its justification."},

{scene:"A high school revises its American history course so students corroborate conflicting primary sources about the same strike, asking who wrote each account, when, and why — instead of memorizing the textbook narrative. Which shift does this represent?",
 options:["Toward inquiry-based learning replacing direct instruction","Toward disciplinary historical thinking — sourcing, contextualization, corroboration — and an epistemological shift from received to evaluated knowledge","Toward critical pedagogy: reading the word and the world","Toward expert schema organization: chunking historical knowledge into larger units"],
 answer:1, why:"Wineburg's heuristics define the move: treating texts as evidence authored by positioned humans rather than as neutral information. It is simultaneously an epistemological shift — from certain, given knowledge toward evaluativist judgment among competing accounts.",
 near:"'Inquiry-based learning' is the answer most students pick and the least precise: inquiry describes the format, not the specific cognitive heuristics of the discipline, and plenty of inquiry lessons never source anything. Critical pedagogy fits the labor-strike content but names a political project rather than a method of historical reasoning. Expert schema organization is about how knowledge is stored, not how evidence is weighed."},

{scene:"Students write strong Toulmin-style arguments in English class, but their posts in a civics forum and their science conclusions show none of that structure. Their teacher starts having them abstract the claim–evidence–warrant principle explicitly, then forecast where else they will use it — and assigns argument tasks in three different classes. Which framework names her two moves?",
 options:["Situated learning: the argument practice was bound to English class","Interleaving and varied practice across contexts","Metacognition: making the strategy explicit for self-regulated use","Transfer of learning: bridging (mindful abstraction) and hugging (practicing near the target contexts)"],
 answer:3, why:"Perkins and Salomon's high-road/low-road account prescribes exactly this pair: bridging builds mindful abstraction of the principle for far transfer, while hugging makes practice resemble the civic and scientific target contexts for near transfer.",
 near:"Situated learning is the best DIAGNOSIS of the problem here and a legitimate answer to a different question — but it names why the failure happened, not the two moves she made. Interleaving describes the multi-class assignment but not the explicit abstraction; metacognition describes the abstraction but not the varied contexts. Only bridging-and-hugging names both, as a matched pair."},

{scene:"An EdD candidate pilots a writing intervention in her own school: she designs it from teacher-empathy interviews, runs a cycle, analyzes student argument samples and engagement data, revises the design, and runs it again — documenting how each revision tests her framework's conjectures. Which methodological pairing is she enacting?",
 options:["Action research supplying the cycle; practitioner inquiry supplying the insider stance","Improvement science: PDSA cycles inside a networked improvement community","Human-centered design supplying the design moves; design-based research supplying the iterative research architecture","Formative experiment methodology, with grounded theory analysis of the interviews"],
 answer:2, why:"Empathy research and prototyping are HCD; studying theoretically motivated design conjectures through iterative enact–analyze–redesign cycles in an authentic setting is DBR (Brown; Cobb et al.). Because she is studying her own context, practitioner-inquiry positionality work also belongs in her methods chapter.",
 near:"These are real methodological neighbors that doctoral committees expect candidates to distinguish. Action research and practitioner inquiry are genuinely present but do not require the theory-testing conjectures the scenario specifies. Improvement science shares the iterative shape but aims at system reliability rather than at generating design principles. The decisive words in the scenario are 'tests her framework's conjectures' — that is DBR's defining commitment."},

{scene:"A biology teacher replaces end-of-unit summary sheets with weekly explanatory paragraphs in which students must justify a claim from lab evidence. Content test scores rise. Which theory most fully explains the gain?",
 options:["Retrieval practice: weekly writing functions as repeated low-stakes testing","Writing to learn: composing is epistemic — knowledge-transforming writing restructures understanding","Self-explanation effect: generating explanations while studying deepens comprehension","Argumentation instruction: claim–evidence–reasoning improves both explanation and content learning"],
 answer:1, why:"Writing-to-learn research distinguishes knowledge-TELLING (summary sheets) from knowledge-TRANSFORMING (justifying a claim). The transformation demand is what restructures understanding — which is why replacing summaries with argument changed the outcome while the amount of writing did not.",
 near:"This is the hardest item in the set, because all four mechanisms are genuinely operating and all four are defensible. The discriminating detail is what CHANGED: students were already writing weekly. Retrieval and self-explanation would have been present in the summary sheets too. What the swap introduced was the demand to transform knowledge into a warranted claim — writing-to-learn's central distinction, with CER as the instructional vehicle rather than the explanation."},

{scene:"A doctoral student keeps postponing her literature review — she knows exactly what to do but cannot get started, and each delay makes the task feel larger. Which pairing best addresses the actual failure point?",
 options:["Self-efficacy: rebuild through mastery experiences on smaller writing tasks","Expectancy-Value Theory: the cost term has grown too high relative to value","Self-regulated learning: a forethought-phase goal-setting and planning deficit","Implementation intentions (if–then planning) plus externalizing executive function at the point of performance"],
 answer:3, why:"The gap is not knowledge, motivation, or planning in the abstract — she knows what to do. Gollwitzer's implementation intentions close intention–action gaps by binding a specific cue to a specific action ('when I sit down Tuesday at 9, I open the matrix and code one article'), and Barkley's point-of-performance principle says the supports must exist where and when the action occurs, not in advance.",
 near:"Every distractor is a real theory of procrastination and each would be right about a different student. Self-efficacy fits someone who doubts she CAN; the scenario says she knows how. Expectancy-value's cost term is the strongest rival and worth arguing. SRL's forethought phase is closest of all — but planning is precisely what she has already done. What is missing is the cue-bound trigger and the external scaffold at the moment of action."}

const store={
  get(k,d){ try{ const v=localStorage.getItem('tl_'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('tl_'+k, JSON.stringify(v)); }catch(e){} }
};
const DAY=86400000, BOX_DAYS=[0,1,3,7,14,30,60];
function today(){ return new Date().toISOString().slice(0,10); }
function bumpStats(){
  const s=store.get('stats',{total:0,last:'',streak:0});
  const t=today();
  if(s.last!==t){
    const y=new Date(Date.now()-DAY).toISOString().slice(0,10);
    s.streak=(s.last===y)?s.streak+1:1; s.last=t;
  }
  s.total++; store.set('stats',s); return s;
}
function grade(key,good){
  const rec=store.get('srs',{});
  const r=rec[key]||{box:0};
  if(good){ r.box=Math.min(r.box+1,BOX_DAYS.length-1); r.due=Date.now()+BOX_DAYS[r.box]*DAY; }
  else{ r.box=1; r.due=Date.now(); }
  rec[key]=r; store.set('srs',rec); bumpStats();
}
