<style>
  :root{
    --ink:#1a2332; --paper:#f7f5f0; --card:#ffffff; --line:#e3ded4;
    --accent:#14524D; --accent-soft:#e3efee; --gold:#F0A500; --gold-soft:#f5edd9;
    --muted:#6b7280; --danger:#9c3d3d;
    --r:14px; --shadow:0 1px 3px rgba(26,35,50,.08), 0 4px 14px rgba(26,35,50,.06);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:Georgia,'Times New Roman',serif; background:var(--paper); color:var(--ink); line-height:1.55;}
  header{background:var(--ink); color:#f2efe8; padding:18px 16px 14px;}
  header h1{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif; font-weight:800; font-size:1.15rem; letter-spacing:.09em; text-transform:uppercase;}
  header h1 .lab{color:var(--gold);}
  header p{font-size:.85rem; opacity:.75; font-family:'Helvetica Neue',Arial,sans-serif; margin-top:2px;}
  nav{display:flex; gap:6px; background:var(--ink); padding:0 10px 12px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  nav button{flex:0 0 auto; font-family:'Helvetica Neue',Arial,sans-serif; font-size:.85rem; padding:8px 14px; border:none; border-radius:999px; background:rgba(255,255,255,.12); color:#e8e4da; cursor:pointer;}
  nav button.active{background:var(--gold); color:#1a1608; font-weight:600;}
  main{max-width:860px; margin:0 auto; padding:16px 14px 80px;}
  .hidden{display:none !important;}
  .toolbar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  input[type=search], select{font-family:'Helvetica Neue',Arial,sans-serif; font-size:.95rem; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); flex:1 1 160px;}
  .chipbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px; -webkit-overflow-scrolling:touch;}
  .chip{flex:0 0 auto; font-family:'Helvetica Neue',Arial,sans-serif; font-size:.78rem; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); cursor:pointer; color:var(--ink);}
  .chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .tcard{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px; box-shadow:var(--shadow); cursor:pointer;}
  .tcard h3{font-size:1.05rem;}
  .tcard .disc{font-family:'Helvetica Neue',Arial,sans-serif; font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:700;}
  .tcard .who{font-size:.85rem; color:var(--muted); font-style:italic;}
  .tcard p{font-size:.9rem; margin-top:4px;}
  .badge{display:inline-block; font-family:'Helvetica Neue',Arial,sans-serif; font-size:.65rem; padding:2px 8px; border-radius:999px; background:var(--gold-soft); color:#7a5a0a; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-left:6px; vertical-align:middle;}
  /* detail view */
  .detail{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:20px 18px; box-shadow:var(--shadow);}
  .backbtn{font-family:'Helvetica Neue',Arial,sans-serif; background:none; border:none; color:var(--accent); font-size:.9rem; font-weight:600; cursor:pointer; padding:0 0 12px;}
  .detail h2{font-size:1.4rem; line-height:1.25;}
  .detail .who{color:var(--muted); font-style:italic; margin:2px 0 10px;}
  .detail section{margin-top:18px;}
  .detail h4{font-family:'Helvetica Neue',Arial,sans-serif; font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; color:var(--accent); margin-bottom:6px; border-bottom:1px solid var(--line); padding-bottom:4px;}
  .detail ul{padding-left:20px;}
  .detail li{margin-bottom:6px; font-size:.94rem;}
  .construct{margin-bottom:8px; font-size:.94rem;}
  .construct b{color:#123c39;}
  .refs li{font-size:.85rem; padding-left:1.5em; text-indent:-1.5em; list-style:none; margin-bottom:7px;}
  .refs{padding-left:4px !important;}
  .relrow{display:flex; flex-wrap:wrap; gap:6px;}
  .rellink{font-family:'Helvetica Neue',Arial,sans-serif; font-size:.8rem; background:var(--accent-soft); color:#134441; border:none; border-radius:999px; padding:6px 12px; cursor:pointer;}
  /* flashcards */
  .fcstage{perspective:1200px; margin:10px 0;}
  .fcard{position:relative; min-height:240px; border-radius:var(--r); cursor:pointer; transition:transform .45s; transform-style:preserve-3d;}
  .fcard.flip{transform:rotateY(180deg);}
  .face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:var(--r); padding:22px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; box-shadow:var(--shadow);}
  .face.front{background:var(--ink); color:#f2efe8;}
  .face.back{background:var(--card); border:1px solid var(--line); transform:rotateY(180deg);}
  .face .lbl{font-family:'Helvetica Neue',Arial,sans-serif; font-size:.65rem; text-transform:uppercase; letter-spacing:.12em; opacity:.6; margin-bottom:10px;}
  .face .txt{font-size:1.05rem; line-height:1.45;}
  .fcbtns{display:flex; gap:8px; margin-top:12px;}
  .fcbtns button{flex:1; font-family:'Helvetica Neue',Arial,sans-serif; font-size:.9rem; font-weight:600; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); cursor:pointer;}
  .fcbtns .again{color:var(--danger); border-color:#e0c9c9;}
  .fcbtns .good{color:#155e28; border-color:#c6dcc9;}
  .fcmeta{font-family:'Helvetica Neue',Arial,sans-serif; font-size:.8rem; color:var(--muted); text-align:center; margin-top:8px;}
  .note{font-family:'Helvetica Neue',Arial,sans-serif; font-size:.75rem; color:var(--muted); text-align:center; margin-top:14px;}
  /* compare */
  .cmp-pick{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .cmp-pick select{flex:1 1 45%;}
  table.cmp{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow);}
  table.cmp th, table.cmp td{border-bottom:1px solid var(--line); padding:10px 10px; vertical-align:top; font-size:.86rem; text-align:left;}
  table.cmp th{font-family:'Helvetica Neue',Arial,sans-serif; font-size:.78rem; background:var(--accent-soft); color:#123c39;}
  table.cmp td:first-child{font-family:'Helvetica Neue',Arial,sans-serif; font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); width:86px; font-weight:700;}
  /* scenarios */
  .scen{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px; box-shadow:var(--shadow);}
  .scen .stext{font-size:.98rem; margin-bottom:14px;}
  .opt{display:block; width:100%; text-align:left; font-family:Georgia,serif; font-size:.92rem; padding:12px 14px; margin-bottom:8px; border:1px solid var(--line); border-radius:10px; background:var(--paper); cursor:pointer; color:var(--ink);}
  .opt.correct{background:#e5f2e7; border-color:#7fae87;}
  .opt.wrong{background:#f6e7e7; border-color:#c99; }
  .why{margin-top:10px; padding:12px 14px; background:var(--gold-soft); border-radius:10px; font-size:.9rem;}
  .scen-nav{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}
  .scen-nav button{font-family:'Helvetica Neue',Arial,sans-serif; font-size:.9rem; font-weight:600; padding:10px 18px; border-radius:10px; border:none; background:var(--accent); color:#fff; cursor:pointer;}
  .scen-nav button:disabled{opacity:.4;}
  .scorepill{font-family:'Helvetica Neue',Arial,sans-serif; font-size:.85rem; color:var(--muted);}
  .empty{color:var(--muted); text-align:center; padding:30px 10px; font-style:italic;}
  .idx{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow);}
  .idx h3{font-size:1rem; margin-bottom:6px;}
  .idx h3 span{font-family:'Helvetica Neue',Arial,sans-serif; font-size:.68rem; color:var(--muted); font-weight:400; float:right; margin-top:4px;}
  .idx-item{display:block; width:100%; text-align:left; font-size:.88rem; padding:7px 4px; border:none; border-bottom:1px solid #f0ece3; background:none; line-height:1.4;}
  .idx-item:last-child{border-bottom:none;}
  .idx-item.built{color:var(--accent); font-weight:bold; cursor:pointer; font-family:Georgia,serif;}
  .idx-item.stub{color:var(--muted);}
  .idx-item.stub b{color:var(--ink); font-weight:normal;}
  .qlead{background:var(--accent-soft); border-radius:var(--r); padding:14px 16px; margin-bottom:12px; font-size:.92rem; color:#12403c; grid-column:1/-1;}
  .qlead b{font-size:1.02rem;}
  @media (min-width:640px){ .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;} .grid .tcard{margin-bottom:0;} }
</style>
</head>
<body>
<header>
  <h1>The Theory <span class="lab">Lab</span></h1>
  <p>An EdD study companion — how people learn, understand, and apply knowledge</p>
</header>
<noscript><div style="background:#9c3d3d;color:#fff;padding:14px 16px;font-family:Arial,sans-serif;font-size:.9rem;">This viewer has JavaScript turned off, so the buttons won't respond. Please open this file in a web browser (Safari or Chrome): tap the share/menu icon and choose "Open in browser," or save the file and open it from your browser.</div></noscript>
<nav id="nav">
  <button data-tab="library" class="active">📚 Library</button>

<main>
  <!-- LIBRARY -->
  <div id="tab-library">
    <div class="toolbar"><input type="search" id="q" placeholder="Search theories, theorists, constructs…"></div>
    <div class="chipbar" id="vtog"></div>
    <div class="chipbar" id="chips"></div>
    <div id="list" class="grid"></div>
    <div id="detail" class="hidden"></div>
  </div>

  <!-- FLASHCARDS -->
  <div id="tab-cards" class="hidden">
    <div class="toolbar">
      <select id="fc-disc"></select>
      <select id="fc-size">
        <option value="10">Quick 10</option>
        <option value="25">Sprint 25</option>
        <option value="0">Full deck</option>
      </select>
      <select id="fc-mode">
        <option value="construct">Key constructs</option>
        <option value="theorist">Name the theorist</option>
        <option value="claim">Core claims</option>
      </select>
    </div>
    <div class="fcmeta" id="fc-stats"></div>
    <div id="fc-area"></div>
    <p class="note">Progress saves on this device. "Got it" schedules a card further out (1 → 3 → 7 → 14 → 30 → 60 days); "Again" brings it back today. Due cards always come first.</p>
  </div>

  <!-- COMPARE -->
  <div id="tab-compare" class="hidden">
    <div class="cmp-pick">
      <select id="cmpA"></select>
      <select id="cmpB"></select>
    </div>
    <div id="cmp-out"></div>
  </div>

  <!-- SCENARIOS -->
  <div id="tab-scenarios" class="hidden">
    <div id="scen-area"></div>
  </div>

  <!-- MASTER INDEX -->
  <div id="tab-index" class="hidden">
    <div id="index-area"></div>
  </div>
</main>

<script>
/* =============== DATA =============== */
const THEORIES = [
{
 id:"behaviorism", name:"Behaviorism", discipline:"Learning Theory", depth:"deep",
 theorists:"Ivan Pavlov, John B. Watson, Edward Thorndike, B. F. Skinner",
 tagline:"Learning is a change in observable behavior produced by conditioning — associations between stimuli, responses, and consequences.",
 origins:"Emerging in the early 20th century as a reaction against introspective psychology, behaviorism restricted the science of learning to observable behavior. Pavlov's classical conditioning, Thorndike's law of effect, and Skinner's operant conditioning formed its experimental core, dominating educational psychology through mid-century.",
 claims:["Learning is demonstrated by measurable changes in behavior, not inferred mental states.","Behavior followed by reinforcement is strengthened; behavior followed by punishment or extinction weakens.","Complex behaviors can be built by shaping — reinforcing successive approximations of a target behavior.","Environmental contingencies, not internal free will, are the primary drivers of behavior."],
 constructs:[
  {term:"Classical conditioning", def:"Pairing a neutral stimulus with an unconditioned stimulus until the neutral stimulus alone evokes the response (Pavlov)."},
  {term:"Operant conditioning", def:"Learning through consequences: reinforcement increases the probability of a behavior; punishment decreases it (Skinner)."},
  {term:"Law of effect", def:"Responses producing satisfying outcomes are more likely to recur (Thorndike)."},
  {term:"Reinforcement schedules", def:"Patterns of reinforcement delivery (fixed/variable, ratio/interval) that shape acquisition rate and resistance to extinction."},
  {term:"Shaping", def:"Reinforcing successive approximations toward a complex target behavior."},
  {term:"Extinction", def:"The weakening of a conditioned response when reinforcement is withheld."}],
 applications:["Classroom management systems, token economies, and PBIS frameworks.","Direct instruction, mastery learning, and programmed instruction sequences.","Behavior intervention plans and applied behavior analysis in special education.","Gamification elements (points, streaks) rest on reinforcement schedules."],
 critiques:["Ignores cognition, meaning-making, and the social context of learning.","Extrinsic reward can undermine intrinsic motivation (the overjustification effect; see Self-Determination Theory).","Chomsky's (1959) review of Skinner's Verbal Behavior argued conditioning cannot explain generative language learning."],
 related:["socialcognitive","infoprocessing","sdt","nudge"],
 refs:["Skinner, B. F. (1953). Science and human behavior. Macmillan.","Thorndike, E. L. (1911). Animal intelligence. Macmillan.","Watson, J. B. (1913). Psychology as the behaviorist views it. Psychological Review, 20(2), 158–177.","Chomsky, N. (1959). A review of B. F. Skinner's Verbal Behavior. Language, 35(1), 26–58."],
 compare:{learner:"A responder whose behavior is shaped by environmental contingencies", mechanism:"Association and reinforcement strengthen stimulus–response bonds", instructor:"Engineer of contingencies: models, cues, reinforces, corrects", knowledge:"A repertoire of conditioned behaviors; knowing is doing", critique:"Cannot account for insight, language generativity, or meaning-making"}
},
{
 id:"infoprocessing", name:"Cognitive Information Processing", discipline:"Learning Theory", depth:"deep",
 theorists:"Richard Atkinson & Richard Shiffrin; George A. Miller; Alan Baddeley",
 tagline:"The mind works like a processing system: information flows through sensory, working, and long-term memory, constrained by attention and capacity.",
 origins:"The cognitive revolution of the 1950s–60s replaced the behaviorist black box with computational models of mind. Atkinson and Shiffrin's (1968) multi-store model and Miller's (1956) capacity findings established the architecture educational psychologists still use, refined by Baddeley's working memory model.",
 claims:["Learning is the encoding, storage, and retrieval of information across memory systems.","Working memory is severely limited (roughly 4–7 chunks); long-term memory is effectively unlimited.","Deeper, more elaborate processing produces more durable, retrievable memory.","Automaticity frees working-memory resources for higher-order thinking."],
 constructs:[
  {term:"Working memory", def:"The limited-capacity workspace where information is consciously held and manipulated (Baddeley: phonological loop, visuospatial sketchpad, central executive, episodic buffer)."},
  {term:"Chunking", def:"Grouping discrete elements into meaningful units to overcome capacity limits (Miller's 'magical number seven')."},
  {term:"Encoding & retrieval", def:"Processes that move information into long-term memory and reconstruct it later; retrieval strength differs from storage strength."},
  {term:"Schema", def:"Organized knowledge structure in long-term memory that guides perception, comprehension, and recall."},
  {term:"Automaticity", def:"Fluent, low-effort execution of well-practiced processes (e.g., decoding), freeing working memory."}],
 applications:["Break instruction into manageable chunks; use advance organizers.","Build fluency/automaticity in foundational skills (math facts, decoding) before complex tasks.","Use elaboration, dual coding, and meaningful connection to strengthen encoding.","Design assessments that practice retrieval, not just recognition."],
 critiques:["The computer metaphor understates embodiment, emotion, and social context.","Describes architecture more than pedagogy; needs bridging theories (e.g., cognitive load) for design.","Multi-store model is oversimplified; memory systems interact more dynamically than serial stages suggest."],
 related:["cogload","multimedia","desirable","schema"],
 refs:["Atkinson, R. C., & Shiffrin, R. M. (1968). Human memory: A proposed system and its control processes. In K. W. Spence & J. T. Spence (Eds.), The psychology of learning and motivation (Vol. 2, pp. 89–195). Academic Press.","Baddeley, A. D., & Hitch, G. (1974). Working memory. In G. H. Bower (Ed.), The psychology of learning and motivation (Vol. 8, pp. 47–89). Academic Press.","Miller, G. A. (1956). The magical number seven, plus or minus two. Psychological Review, 63(2), 81–97."],
 compare:{learner:"A processor with limited working memory and vast long-term memory", mechanism:"Encoding into and retrieval from long-term memory; schema construction", instructor:"Manager of attention and memory load; sequences and chunks input", knowledge:"Organized representations (schemas) stored in long-term memory", critique:"Mechanistic metaphor neglects culture, motivation, and embodiment"}
},
{
 id:"cogload", dis:true, name:"Cognitive Load Theory", discipline:"Learning Theory", depth:"deep",
 theorists:"John Sweller; Paul Ayres; Fred Paas (1980s–present)",
 tagline:"Instruction succeeds or fails by how it manages the limited capacity of working memory relative to the learner's existing schemas.",
 origins:"Sweller's studies of problem solving in the 1980s showed that conventional problem practice can overload working memory and impede schema acquisition. CLT grew into one of the most researched instructional-design frameworks, generating effects such as worked examples, split-attention, and expertise reversal.",
 claims:["Working memory limits are the central bottleneck of instruction; long-term memory schemas circumvent them.","Total load = intrinsic (task complexity relative to expertise) + extraneous (poor design) + germane (schema-building effort).","Reducing extraneous load and managing intrinsic load frees resources for learning.","Effective techniques change with expertise: supports that help novices can hinder experts (expertise reversal effect)."],
 constructs:[
  {term:"Intrinsic load", def:"Load from element interactivity inherent to the material, relative to prior knowledge."},
  {term:"Extraneous load", def:"Load imposed by suboptimal instructional design (e.g., split attention, redundancy)."},
  {term:"Germane load", def:"Effort devoted to schema construction and automation — the productive load."},
  {term:"Worked-example effect", def:"Novices learn more from studying worked solutions than from unsupported problem solving."},
  {term:"Expertise reversal effect", def:"Guidance beneficial for novices becomes redundant or harmful for advanced learners."},
  {term:"Split-attention effect", def:"Learning is impaired when learners must mentally integrate spatially or temporally separated sources."}],
 applications:["Use worked examples and completion problems early; fade to independent practice.","Integrate text with diagrams; eliminate redundant, decorative, or split-source material.","Sequence from low to high element interactivity; pre-teach component skills.","Differentiate scaffolds by learner expertise rather than one-size-fits-all supports."],
 critiques:["Germane load has been criticized as unfalsifiable and was later folded into intrinsic load.","Measuring load types independently remains difficult.","Focuses on efficiency of acquisition, saying little about motivation, identity, or culture; can favor direct instruction over inquiry in contested ways (Kirschner, Sweller, & Clark, 2006 debate)."],
 related:["infoprocessing","multimedia","desirable","math_cra"],
 refs:["Sweller, J. (1988). Cognitive load during problem solving: Effects on learning. Cognitive Science, 12(2), 257–285.","Sweller, J., Ayres, P., & Kalyuga, S. (2011). Cognitive load theory. Springer.","Kirschner, P. A., Sweller, J., & Clark, R. E. (2006). Why minimal guidance during instruction does not work. Educational Psychologist, 41(2), 75–86."],
 compare:{learner:"A novice-to-expert whose working memory is the bottleneck", mechanism:"Schema acquisition and automation when load is well managed", instructor:"Instructional designer who minimizes extraneous and manages intrinsic load", knowledge:"Domain schemas held in long-term memory", critique:"Efficiency focus can undervalue inquiry, motivation, and culture"}
},
{
 id:"piaget", name:"Cognitive Constructivism", discipline:"Learning Theory", depth:"deep",
 theorists:"Jean Piaget (1896–1980)",
 tagline:"Children actively construct knowledge through interaction with the world, progressing through qualitatively distinct stages of thought.",
 origins:"Piaget's genetic epistemology asked how knowledge itself develops. Decades of clinical observation of children (including his own) yielded a stage theory of cognitive development and the equilibration model of how understanding changes — foundational to constructivist education.",
 claims:["Learners construct knowledge by acting on the world, not by passively receiving it.","Cognitive development proceeds through stages: sensorimotor, preoperational, concrete operational, formal operational.","New experience is assimilated into existing schemes or forces accommodation of those schemes.","Disequilibrium — cognitive conflict — is the engine of conceptual growth."],
 constructs:[
  {term:"Schema (scheme)", def:"An organized pattern of thought or action used to interpret experience."},
  {term:"Assimilation", def:"Fitting new information into existing schemes."},
  {term:"Accommodation", def:"Modifying schemes when new information will not fit."},
  {term:"Equilibration", def:"The self-regulating balance of assimilation and accommodation that drives development."},
  {term:"Conservation", def:"Understanding that quantity remains constant despite changes in appearance — a hallmark of concrete operations."},
  {term:"Formal operations", def:"Abstract, hypothetical-deductive reasoning emerging in adolescence."}],
 applications:["Developmentally appropriate practice: match tasks to learners' operational level.","Discovery and inquiry approaches that provoke cognitive conflict.","Use of concrete manipulatives before abstract symbols in math and science.","Readiness considerations in curriculum sequencing."],
 critiques:["Underestimated young children's competence and overestimated stage universality.","Neglects social and cultural mediation of learning (Vygotsky's central objection).","Stage transitions are more gradual and domain-specific than the theory implies."],
 related:["vygotsky","conceptualchange","schema","math_rme"],
 refs:["Piaget, J. (1952). The origins of intelligence in children (M. Cook, Trans.). International Universities Press.","Piaget, J. (1970). Genetic epistemology (E. Duckworth, Trans.). Columbia University Press.","Inhelder, B., & Piaget, J. (1958). The growth of logical thinking from childhood to adolescence. Basic Books."],
 compare:{learner:"An active little scientist constructing understanding through action", mechanism:"Equilibration: assimilation and accommodation resolving cognitive conflict", instructor:"Provider of rich environments and provocations matched to development", knowledge:"Individually constructed structures that develop in stages", critique:"Understates social/cultural mediation and children's early competence"}
},
{
 id:"vygotsky", dis:true, name:"Sociocultural Theory", discipline:"Learning Theory", depth:"deep",
 theorists:"Lev Vygotsky (1896–1934); elaborated by James Wertsch, Barbara Rogoff",
 tagline:"Higher mental functions originate in social interaction and are mediated by cultural tools — above all, language.",
 origins:"Working in post-revolutionary Russia, Vygotsky argued that development cannot be separated from its social and historical context. Suppressed for decades, his work reached the West in the 1960s–70s and reshaped literacy, teaching, and learning research.",
 claims:["Every higher psychological function appears first between people (interpsychological), then within the child (intrapsychological).","Learning leads development: instruction in the zone of proximal development pulls development forward.","Cultural tools and signs — especially language — mediate and transform thinking.","Thought and language merge developmentally; inner speech becomes the medium of self-regulation."],
 constructs:[
  {term:"Zone of proximal development (ZPD)", def:"The distance between what a learner can do alone and what they can do with guidance from a more knowledgeable other."},
  {term:"Mediation", def:"Thinking is shaped through cultural tools, signs, and symbol systems."},
  {term:"More knowledgeable other (MKO)", def:"A teacher, peer, or tool that supports performance within the ZPD."},
  {term:"Internalization", def:"The transformation of social, external activity into internal mental processes."},
  {term:"Private/inner speech", def:"Self-directed talk that regulates behavior and becomes internalized verbal thought."},
  {term:"Scaffolding", def:"Temporary, contingent support withdrawn as competence grows (term from Wood, Bruner, & Ross, 1976, building on Vygotsky)."}],
 applications:["Guided participation, reciprocal teaching, and instructional conversations.","Dynamic assessment: measuring assisted performance, not just independent performance.","Collaborative learning structured so peers mediate one another's thinking.","Framing dissertation work: sociocultural lenses for classroom discourse, coaching, and mentoring studies."],
 critiques:["Vygotsky died at 37; the theory is programmatic and unevenly specified.","ZPD is often trivialized in practice as generic 'help'.","Less attention to individual biological constraints and to power relations within interactions."],
 related:["piaget","situated","socialcognitive","funds","writing_sociocultural"],

 id:"socialcognitive", dis:true, name:"Social Cognitive Theory", discipline:"Learning Theory", depth:"deep",
 theorists:"Albert Bandura (1925–2021)",

 claims:["Learning occurs vicariously through observing models, their behavior, and its consequences.","Behavior, personal factors, and environment influence one another reciprocally (triadic reciprocal determinism).","Self-efficacy beliefs strongly predict effort, persistence, and achievement.","People exercise agency through forethought, self-regulation, and self-reflection."],
 constructs:[

  {term:"Self-efficacy", def:"Belief in one's capability to organize and execute the actions required for a task; sources: mastery experience, vicarious experience, social persuasion, physiological states."},

  {term:"Modeling", def:"Live, symbolic, or verbal demonstration from which observers abstract rules of behavior."},

{
 id:"situated", name:"Situated Learning & Communities of Practice", discipline:"Learning Theory", depth:"deep",
 theorists:"Jean Lave & Étienne Wenger (1991); John Seely Brown, Allan Collins, Paul Duguid",
 tagline:"Learning is not the transmission of abstract knowledge but increasing participation in communities of practice — knowing is doing in context.",
 origins:"Anthropological studies of apprenticeship (tailors, midwives, meat cutters) led Lave and Wenger to reframe learning as changing participation in social practice. Brown, Collins, and Duguid's 'situated cognition' (1989) argued knowledge is inseparable from the activity and culture in which it develops.",
 claims:["Knowledge is fundamentally situated in activity, context, and culture.","Learning is a trajectory from legitimate peripheral participation toward full participation in a community of practice.","Identity formation — becoming a kind of person — is inseparable from learning.","Abstract, decontextualized instruction often produces inert knowledge that fails to transfer."],
 constructs:[

  {term:"Legitimate peripheral participation", def:"Newcomers' sanctioned, low-stakes participation at the edge of practice that grows toward the center."},
  {term:"Cognitive apprenticeship", def:"Making expert thinking visible through modeling, coaching, scaffolding, articulation, reflection, exploration (Collins, Brown, & Newman)."},
  {term:"Inert knowledge", def:"Knowledge that can be recited but not used — a symptom of decontextualized instruction (Whitehead's term)."},
  {term:"Identity trajectory", def:"Learning as becoming — a changing identity within a community."}],
 applications:["Practicum, residency, and induction design in educator preparation.","Professional learning communities and teacher networks.","Authentic, project- and problem-based tasks anchored in real practice.","Analyzing online communities and workplace learning in dissertations."],
 critiques:["Communities can reproduce exclusion, hierarchy, and bad practice as easily as expertise.","Weak account of how deliberate, decontextualized instruction sometimes accelerates learning.","Anderson, Reder, and Simon (1996) challenged strong claims that transfer requires situated instruction."],
 related:["vygotsky","kolb","connectivism","bourdieu"],
 refs:["Lave, J., & Wenger, E. (1991). Situated learning: Legitimate peripheral participation. Cambridge University Press.","Wenger, E. (1998). Communities of practice: Learning, meaning, and identity. Cambridge University Press.","Brown, J. S., Collins, A., & Duguid, P. (1989). Situated cognition and the culture of learning. Educational Researcher, 18(1), 32–42."],
 compare:{learner:"A newcomer moving from periphery to full participation", mechanism:"Increasing participation and identity change within authentic practice", instructor:"Old-timer/master who grants access and makes practice visible", knowledge:"Distributed across people, tools, and activity; inseparable from context", critique:"Communities can entrench exclusion; underplays direct instruction's value"}
},
{
 id:"kolb", name:"Experiential Learning Theory", discipline:"Learning Theory", depth:"deep",
 theorists:"David A. Kolb (b. 1939); roots in John Dewey, Kurt Lewin",
 tagline:"Learning is the process whereby knowledge is created through the transformation of experience, cycling through experiencing, reflecting, conceptualizing, and experimenting.",
 origins:"Synthesizing Dewey's experiential continuum, Lewin's action research, and Piaget, Kolb (1984) proposed a four-mode learning cycle and derived learning-style types from preferences within it. It became a dominant framework in higher, adult, and professional education.",
 claims:["Effective learning cycles through concrete experience, reflective observation, abstract conceptualization, and active experimentation.","Knowledge results from the combination of grasping experience and transforming it.","Learners develop preferences (styles) for particular modes of the cycle.","Education should integrate experience with structured reflection rather than deliver content alone."],
 constructs:[

  {term:"Abstract conceptualization (AC)", def:"Forming concepts and generalizations that integrate observations."},
  {term:"Active experimentation (AE)", def:"Testing concepts in new situations, generating new experience."},
  {term:"Learning styles", def:"Preferred combinations of modes (diverging, assimilating, converging, accommodating)."}],
 applications:["Design of internships, simulations, labs, service learning, and study abroad with built-in reflection.","Debriefing protocols after clinical or field experiences.","Adult and executive education program design.","Reflective journals and portfolios as the RO/AC bridge."],
 critiques:["The style typology has weak psychometric support; 'learning styles' matching lacks evidence.","The tidy cycle oversimplifies messy, concurrent learning processes.","Underplays social, cultural, and power dimensions of experience (later addressed by critical experiential scholars)."],
 related:["dewey","mezirow","knowles","situated"],
 refs:["Kolb, D. A. (1984). Experiential learning: Experience as the source of learning and development. Prentice-Hall.","Dewey, J. (1938). Experience and education. Macmillan.","Kolb, A. Y., & Kolb, D. A. (2005). Learning styles and learning spaces. Academy of Management Learning & Education, 4(2), 193–212."],
 compare:{learner:"An experiencer who converts lived events into concepts through reflection", mechanism:"Cycling: experience → reflection → conceptualization → experimentation", instructor:"Designer and debriefer of experience; facilitator of reflection", knowledge:"Created by transforming experience; provisional and personal", critique:"Cycle is idealized; style claims lack psychometric support"}
},
{
 id:"knowles", name:"Andragogy (Adult Learning Theory)", discipline:"Learning Theory", depth:"deep",
 theorists:"Malcolm Knowles (1913–1997)",
 tagline:"Adults learn differently from children: they are self-directed, experience-rich, problem-centered, and driven by relevance and internal motivation.",
 origins:"Knowles popularized the European term 'andragogy' in the U.S. from 1968, contrasting the art and science of helping adults learn with pedagogy. It became the organizing framework for adult, continuing, and professional education — and for doctoral programs like the EdD itself.",
 claims:["Adults need to know why they are learning something before investing effort.","Adults' self-concept demands self-direction; imposed dependency breeds resistance.","Adults' accumulated experience is a primary resource — and sometimes a source of bias — for learning.","Readiness and orientation are life-task and problem-centered rather than subject-centered; motivation is chiefly internal."],
 constructs:[
  {term:"Self-directed learning", def:"Learners diagnose needs, set goals, find resources, and evaluate outcomes (elaborated by Tough; Garrison)."},
  {term:"Need to know", def:"Adults require the rationale and payoff of learning up front."},
  {term:"Experience as resource", def:"Prior experience anchors new learning through discussion, case method, and peer teaching."},
  {term:"Problem-centered orientation", def:"Adults learn best when content is organized around authentic problems, not topics."},
  {term:"Learning contract", def:"Negotiated agreement specifying objectives, resources, evidence, and criteria."}],
 applications:["Graduate and professional program design (including EdD cohort models).","Needs assessments and learning contracts in workplace training.","Facilitation over lecture; case- and problem-based seminars.","Framing studies of teacher professional development and leadership preparation."],
 critiques:["More a set of assumptions/principles than a tested theory; empirical support is mixed.","The adult/child dichotomy is overdrawn — children can be self-directed, adults often are not.","Its individualism reflects Western, middle-class norms and neglects structural barriers (critiques by Grace, Sandlin)."],

 compare:{learner:"A self-directing adult bringing rich experience and immediate problems", mechanism:"Relevance-driven, problem-centered engagement using prior experience", instructor:"Facilitator and co-designer; negotiates rather than prescribes", knowledge:"Useful know-how organized around life tasks and problems", critique:"Assumption set more than theory; adult/child contrast overdrawn"}

{
 id:"mezirow", name:"Transformative Learning Theory", discipline:"Learning Theory", depth:"deep",
 theorists:"Jack Mezirow (1923–2014); extended by Patricia Cranton, Edward Taylor",
 tagline:"Adults learn most profoundly when a disorienting dilemma leads them to critically examine and revise the assumptions through which they interpret the world.",
 origins:"Mezirow's 1978 study of women returning to college revealed learning as perspective transformation. Drawing on Habermas's domains of learning, the theory became the most-researched framework in adult education, describing how frames of reference become more inclusive, discriminating, and open.",
 claims:["We interpret experience through acquired frames of reference (habits of mind and points of view).","A disorienting dilemma can trigger critical reflection on previously unexamined assumptions.","Rational discourse with others is the medium for testing revised meaning perspectives.","Transformation culminates in acting from the new perspective — not merely holding it."],

  {term:"Critical reflection", def:"Examination of the content, process, and especially premises of one's beliefs."},
  {term:"Rational discourse", def:"Dialogue devoted to assessing reasons and reaching tentative best judgments."},
  {term:"Perspective transformation", def:"A more inclusive, differentiated, permeable, and integrated frame of reference."}],
 applications:["Designing doctoral coursework that surfaces and challenges practitioner assumptions.","Critical incident analysis and structured dialogue in leadership development.","Study-abroad, equity, and diversity education aiming at worldview change.","A common conceptual framework for EdD dissertations on educator belief change."],

 compare:{learner:"An adult whose taken-for-granted assumptions are open to revision", mechanism:"Disorienting dilemma → critical reflection → discourse → reintegration", instructor:"Provocateur and convener of safe, rigorous discourse", knowledge:"Meaning perspectives; validity is tested through reflective discourse", critique:"Overly rational and individualistic; phase evidence is thin"}
},

 id:"sdt", dis:true, name:"Self-Determination Theory", discipline:"Learning Theory", depth:"deep",
 theorists:"Edward Deci & Richard Ryan (1985–present)",
 tagline:"Motivation flourishes when three basic psychological needs are met: autonomy, competence, and relatedness — and quality of motivation matters more than quantity.",
 origins:"Deci's experiments showed extrinsic rewards can undermine intrinsic motivation, contradicting behaviorist prediction. With Ryan, he built a macro-theory distinguishing types of motivation along a continuum of internalization, now among the most cited motivation frameworks in education.",
 claims:["Humans have innate needs for autonomy, competence, and relatedness; environments that satisfy them enhance motivation and well-being.","Motivation varies in kind — from amotivation through external, introjected, identified, and integrated regulation to intrinsic motivation.","Controlling rewards and pressure can crowd out intrinsic motivation (undermining effect).","Autonomy-supportive teaching predicts engagement, persistence, and deeper learning."],

  {term:"Internalization continuum", def:"The process by which external regulations become integrated into the self."},
  {term:"Autonomy support", def:"Offering choice, rationale, and perspective-taking while minimizing controlling language."},

 applications:["Classroom structures offering meaningful choice and rationales.","Rethinking token/points systems in light of the undermining effect.","Teacher retention and student engagement studies in EdD research.","Designing professional development that supports rather than mandates."],
 critiques:["Need universality across cultures is debated (autonomy's meaning varies).","Meta-analytic disputes over the size/boundary conditions of the undermining effect (Cameron & Pierce vs. Deci et al.).","Field interventions show smaller effects than lab studies."],

 compare:{learner:"An organism inclined toward growth when basic needs are met", mechanism:"Need satisfaction fuels intrinsic motivation and internalization", instructor:"Autonomy-supportive guide providing structure, rationale, and warmth", knowledge:"Pursued most deeply under intrinsic and well-internalized motivation", critique:"Cross-cultural universality and reward-effect boundaries contested"}

 id:"srl", dis:true, name:"Self-Regulated Learning", discipline:"Learning Theory", depth:"deep",

 origins:"Growing from Bandura's social cognitive theory in the 1980s–90s, SRL research explained why students with similar ability diverge: differences in goal setting, strategy use, self-monitoring, and attributions. It underpins study-skills, metacognition, and formative assessment work.",
 claims:["Learning success depends on cyclical self-regulation: forethought, performance control, and self-reflection.","Metacognitive monitoring and strategy use are teachable and improve achievement.","Self-efficacy and goal orientation drive the quality of self-regulation.","Feedback loops — internal and external — are the engine of improvement."],

 id:"connectivism", name:"Connectivism", discipline:"Learning Theory", depth:"deep",

{
 id:"multimedia", name:"Cognitive Theory of Multimedia Learning", discipline:"Learning Theory", depth:"deep",
 theorists:"Richard E. Mayer; roots in Allan Paivio's dual coding theory",
 tagline:"People learn more deeply from words and pictures together than from words alone — when design respects dual channels, limited capacity, and active processing.",
 origins:"Paivio's dual coding theory (verbal and imaginal systems) plus working-memory research grounded Mayer's decades of experiments on multimedia messages, yielding evidence-based principles (coherence, contiguity, modality, redundancy, signaling) that govern slide, video, and e-learning design.",
 claims:["Humans process information through separate visual/pictorial and auditory/verbal channels (dual channels).","Each channel has limited capacity; overload in either impairs learning.","Meaningful learning requires actively selecting, organizing, and integrating words and images.","Design principles (e.g., coherence, signaling, contiguity) reliably reduce extraneous processing."],
 constructs:[

  {term:"Contiguity principles", def:"Place corresponding words and pictures near each other in space and time."},
  {term:"Modality principle", def:"Present words as narration rather than on-screen text when paired with graphics."},
  {term:"Redundancy principle", def:"Narration plus identical on-screen text can overload the verbal channel."},
  {term:"Signaling", def:"Cues (highlights, outlines) that guide attention to essential material."}],
 applications:["Designing lecture slides, instructional video, and e-learning modules.","Evaluating edtech products against evidence-based principles.","Improving accessibility choices (narration, captioning trade-offs).","Common framework for EdD studies of online instruction quality."],
 critiques:["Most evidence comes from short lab lessons with college students; classroom transfer is weaker.","Principles interact with prior knowledge (expertise reversal) and motivation.","Focus on efficiency of message design, not curriculum or culture."],

{
 id:"desirable", name:"Desirable Difficulties & the Testing Effect", discipline:"Learning Theory", depth:"deep",
 theorists:"Robert & Elizabeth Bjork; Henry Roediger III & Jeffrey Karpicke; Hermann Ebbinghaus (forerunner)",
 tagline:"Conditions that make practice feel harder and slower — spacing, interleaving, retrieval — produce more durable, flexible learning than fluent, massed study.",
 origins:"Ebbinghaus documented forgetting curves and spacing benefits in 1885. A century later, Bjork's 'new theory of disuse' distinguished retrieval strength from storage strength, and Roediger and Karpicke's 2006 studies showed testing outperforms restudy — launching the applied science of durable learning.",
 claims:["Performance during practice is a poor index of learning; fluency illusions mislead learners and teachers.","Retrieval practice (testing) strengthens memory more than re-exposure.","Spacing and interleaving practice slow acquisition but improve retention and transfer.","Difficulties are desirable only when learners can succeed with effort — otherwise they are just difficulties."],

  {term:"Storage vs. retrieval strength", def:"How well learned versus how accessible now; current accessibility misleads judgments of learning."},
  {term:"Fluency illusion", def:"Mistaking ease of processing (rereading, highlighting) for learning."}],

 critiques:["Effects vary with feedback, retention interval, and material complexity.","Classroom implementations show smaller effects than lab studies.","Overzealous difficulty harms struggling learners; requires calibration to expertise."],

 refs:["Bjork, R. A., & Bjork, E. L. (1992). A new theory of disuse and an old theory of stimulus fluctuation. In A. Healy, S. Kosslyn, & R. Shiffrin (Eds.), From learning processes to cognitive processes (Vol. 2, pp. 35–67). Erlbaum.","Roediger, H. L., III, & Karpicke, J. D. (2006). Test-enhanced learning: Taking memory tests improves long-term retention. Psychological Science, 17(3), 249–255.","Dunlosky, J., Rawson, K. A., Marsh, E. J., Nathan, M. J., & Willingham, D. T. (2013). Improving students' learning with effective learning techniques. Psychological Science in the Public Interest, 14(1), 4–58."],
 compare:{learner:"A memory system that strengthens through effortful retrieval", mechanism:"Spaced, interleaved retrieval builds storage strength and transfer", instructor:"Architect of practice schedules and low-stakes testing", knowledge:"Durable, accessible memory built through effortful practice", critique:"Boundary conditions matter; too much difficulty backfires"}

{
 id:"bloom", name:"Bloom's Taxonomy (Revised)", discipline:"Education & Pedagogy", depth:"deep",
 theorists:"Benjamin Bloom (1956); revised by Lorin Anderson & David Krathwohl (2001)",
