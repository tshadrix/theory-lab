{
 id:"knowles", name:"Andragogy (Adult Learning Theory)", discipline:"Learning Theory", depth:"deep",
 theorists:"Malcolm Knowles (1913–1997)",
 tagline:"Adults learn differently from children: they are self-directed, experience-rich, problem-centered, and driven by relevance and internal motivation.",
 problem:"Picture the average professional development day: experienced educators — people who manage 150 adolescents, budgets, and crises before lunch — seated in rows, receiving slides, treated procedurally like the ninth graders they teach. Attendance is perfect; practice changes not at all. Or picture a doctoral cohort of working professionals asked to absorb content with no visible connection to the problems that brought them back to school. Andragogy exists to explain why teaching adults as if they were children produces compliance without learning — and what respecting adult experience, self-direction, and purpose looks like instead.",
 asks:["Do adults actually learn differently from children — and in what ways that matter for design?","What role does accumulated experience play: resource, filter, or obstacle?","Why do relevance and immediate applicability drive adult engagement so strongly?","How much self-direction do adult learners really want — always, sometimes, or only in familiar territory?"],
 iftrue:{
  teachers:"For anyone teaching adults — PD facilitators, professors, mentor teachers: start from the participants' problems of practice, not from your agenda. Surface the room's experience deliberately (structured case-sharing, peer consultancy) because in adult learning the participants are part of the curriculum — while planning for experience's shadow side, since 'we tried that in 2015' is prior knowledge too. Explain the rationale for everything; adults extend little credit on faith.",
  coaches:"Instructional coaching is andragogy applied one teacher at a time: the teacher's own classroom problem is the syllabus, their experience is the raw material, and their self-direction is the goal. Ask before you tell. Negotiate focus rather than assigning it. A coaching relationship that violates adult-learning assumptions produces the same polite non-learning as bad PD — just more expensively.",
  leaders:"Redesign professional learning from sit-and-get toward problem-centered cycles: learn something Tuesday, apply it Wednesday, debrief it next week — because adults learn for use, and 'later' is where PD goes to die. Offer genuine choice among growth paths with rationale for the non-negotiables. And notice the theory's reflexive bite: micromanaging professionals produces exactly the resistance Knowles predicts, in adults whose self-concept demands being treated as the experts they are.",
  researchers:"Treat the assumptions as hypotheses, not axioms — andragogy's practical fame outruns its evidence base. Measure transfer to practice rather than satisfaction sheets. And map the boundary conditions: when do adults prefer structure over self-direction (novices in new domains often do), and is that preference situational rather than developmental?"},
 reasoning:{
  notice:["The 'why do we need this?' question — it is diagnostic data about an unmet need-to-know, not insubordination.","Who disengages the moment content floats free of their actual problems — and who re-engages when a real case enters the room.","How experience shows up: as rich case knowledge to build on, or as armor against change. Both are the same variable wearing different clothes.","The energy difference between mandated and chosen learning in the same adults — it's the cleanest natural experiment your building runs."],
  assume:["That adults are automatically self-directed: many prefer strong structure, especially as novices in a new domain — self-direction is situational, not a birthright of adulthood.","That experience always helps; it can also entrench misconceptions and outdated practice (conceptual change applies to adults with tenure).","That the adult/child line is sharp — children also flourish with relevance, rationale, and choice; Knowles himself softened the dichotomy into a continuum."],
  decide:["Open every session with the problem it solves, and let the agenda serve the problem rather than the reverse.","Build immediate application into the design: plan Monday's lesson in Tuesday's PD, with feedback before Friday.","Offer structured choice — pathways, not free-for-alls — with rationale attached to whatever stays mandatory.","Use the room's expertise on purpose: rotating case presenters, peer problem-solving protocols, experience as text."],
  avoid:["Transmission-style PD with application deferred to 'later.'","Ignoring or steamrolling the room's experience — nothing loses adults faster than being taught what they already know as if they didn't.","Mandates delivered without why.","Equating attendance, compliance, or satisfaction ratings with learning — adults are expert at polite non-learning."]},
 competing:[
  {scenario:"Veteran teachers resist a new initiative during PD.", thisView:"The design violated adult-learning assumptions: no rationale, no connection to their problems, no respect for their experience, no self-direction. Fix the design and the 'resistance' largely dissolves.", other:"Transformative Learning (Mezirow)", otherView:"The resistance is deeper than logistics — the initiative threatens frames of reference built over careers. Real change requires a disorienting dilemma, critical reflection on assumptions, and discourse; comfort-optimized design can actually prevent it.", agree:"Both center adults' experience and meaning-making and reject transmission. The practical synthesis: andragogy designs the respectful conditions, Mezirow designs the productive discomfort — skilled facilitation needs both hands."},
  {scenario:"Do adults need their own theory of learning at all?", thisView:"Yes — the configuration of self-concept, experience, readiness, orientation, and motivation differs enough in adulthood that design should differ in kind, not just degree.", other:"Self-Determination Theory (Deci & Ryan)", otherView:"No separate theory needed: autonomy, competence, and relatedness are universal needs at every age; andragogy's prescriptions work because they are need-supportive, and SDT explains them with more evidence and fewer assumptions.", agree:"The prescriptions converge almost perfectly — rationale, choice, respect for competence. The genuine dispute is mechanism and parsimony, which is why andragogy survives in practice while borrowing its empirical backbone from theories like SDT."}],
 research:{
  questions:["Do andragogical designs outperform transmission designs for transfer to professional practice?","Which of the six assumptions hold empirically, for whom, and in which domains?","Is self-directed readiness a stable trait, a developable capacity, or a situational state?","What PD design features actually predict classroom practice change?"],
  methods:"Historically descriptive and survey-based — the theory's weakness; the stronger current work uses quasi-experiments in professional development and continuing education, qualitative program studies, and instruments like self-directed learning readiness scales.",
  variables:"Perceived relevance and utility, self-direction readiness, learner control conditions, satisfaction (overused), and — the one that matters — transfer to practice.",
  support:"The most honest rating in this wave: andragogy is a design framework with enduring practical utility but a thin direct empirical base. Individual assumptions borrow support from adjacent literatures — SDT for motivation, transfer research for application, expertise research for experience effects. Treat it as a reliable checklist for designing adult learning, and as a theory still waiting for its evidence."},
 reflect:["Think about the last PD you attended (or led). Which of Knowles' assumptions did it honor, and which did it violate — and what did the room do in response?","As a doctoral student, you are an adult learner studying adult learning: what makes YOU lean in — and does your own coursework practice what the theory preaches?","Where do you currently need structure rather than self-direction? What does that tell you about the learners you lead?","Whose experience goes unused in your building's professional learning — and what would it take to make it the curriculum?","What is one mandate you deliver (to students or colleagues) without a stated why? What is the why — and if you can't state it, what follows?"],
 constellation:{builds:["dewey"],complements:["kolb","sdt","schon"],contrasts:["behaviorism"],pairs:["mezirow","practitioner","situated"]},
 origins:"Knowles popularized the European term 'andragogy' in the U.S. from 1968, contrasting the art and science of helping adults learn with pedagogy. It became the organizing framework for adult, continuing, and professional education — and for doctoral programs like the EdD itself.",
 claims:["Adults need to know why they are learning something before investing effort.","Adults' self-concept demands self-direction; imposed dependency breeds resistance.","Adults' accumulated experience is a primary resource — and sometimes a source of bias — for learning.","Readiness and orientation are life-task and problem-centered rather than subject-centered; motivation is chiefly internal."],
 constructs:[
  {term:"Self-directed learning", def:"Learners diagnose needs, set goals, find resources, and evaluate outcomes (elaborated by Tough; Garrison)."},
  {term:"Need to know", def:"Adults require the rationale and payoff of learning up front."},
  {term:"Experience as resource", def:"Prior experience anchors new learning through discussion, case method, and peer teaching."},
  {term:"Problem-centered orientation", def:"Adults learn best when content is organized around authentic problems, not topics."},
  {term:"Learning contract", def:"Negotiated agreement specifying objectives, resources, evidence, and criteria."}],
 applications:["Graduate and professional program design (including EdD cohort models).","Needs assessments and learning contracts in workplace training.","Facilitation over lecture; case- and problem-based seminars.","Framing studies of teacher professional development and leadership preparation."],
 critiques:["More a set of assumptions/principles than a tested theory; empirical support is mixed.","The adult/child dichotomy is overdrawn — children can be self-directed, adults often are not.","Its individualism reflects Western, middle-class norms and neglects structural barriers (critiques by Grace, Sandlin)."],
 related:["kolb","mezirow","sdt","srl"],
 refs:["Knowles, M. S. (1980). The modern practice of adult education: From pedagogy to andragogy (Rev. ed.). Cambridge Books.","Knowles, M. S., Holton, E. F., III, & Swanson, R. A. (2015). The adult learner (8th ed.). Routledge.","Merriam, S. B., & Baumgartner, L. M. (2020). Learning in adulthood: A comprehensive guide (4th ed.). Jossey-Bass."],
 compare:{learner:"A self-directing adult bringing rich experience and immediate problems", mechanism:"Relevance-driven, problem-centered engagement using prior experience", instructor:"Facilitator and co-designer; negotiates rather than prescribes", knowledge:"Useful know-how organized around life tasks and problems", critique:"Assumption set more than theory; adult/child contrast overdrawn"}
},
{
 id:"mezirow", name:"Transformative Learning Theory", discipline:"Learning Theory", depth:"deep",
 theorists:"Jack Mezirow (1923–2014); extended by Patricia Cranton, Edward Taylor",
 tagline:"Adults learn most profoundly when a disorienting dilemma leads them to critically examine and revise the assumptions through which they interpret the world.",
 problem:"Some beliefs survive every workshop. A teacher attends years of PD and emerges with new vocabulary wrapped around unchanged assumptions; an equity initiative produces polite agreement in the room and untouched practice beyond it; meanwhile, somewhere in the same building, one teacher's worldview actually cracks open — usually after something disorienting: data she couldn't explain away, a shadowed student's day she couldn't unsee. Transformative learning theory exists to explain the difference between adding knowledge and changing the frame that decides what knowledge means — and why the deepest kind of adult learning is rare, uncomfortable, and follows a describable arc.",
 asks:["How do adults change not just what they know but HOW they know — the frames through which experience is interpreted?","What actually triggers examination of assumptions that have been invisible for decades?","What roles do critical reflection and structured dialogue play in validating a new perspective?","When does discomfort open a mind, and when does it slam it shut?"],
 iftrue:{
  teachers:"For those who teach adults: design encounters with disconfirming evidence — a teacher's own disaggregated data, a full day shadowing one student, recordings of their own classroom — because frames don't yield to presentations. Then protect what follows: structured reflection time, dialogue with norms that privilege reasons over rank, and support through the disoriented middle, which is where transformation either happens or gets abandoned.",
  coaches:"Video of one's own teaching is a disorienting dilemma in a controlled dose — use it. Ask premise-level questions ('what would have to be true about these students for that to be the right move?') rather than only technique questions. And resist rescuing too quickly: prematurely restoring comfort aborts the very process you're facilitating. Learn to tell processing from resistance; they look similar on day two.",
  leaders:"Announcements change compliance; architecture changes frames. A real change initiative needs the full sequence — genuine encounter with the problem, structured reflection, discourse where assumptions can be examined without career risk, and support through the dip you should expect and budget for. Psychological safety isn't the soft part of transformation; it is the load-bearing wall.",
  researchers:"The field's known weakness is measurement: perspective transformation is mostly documented by retrospective self-report. Contribute longitudinal designs, triangulate reported transformation against observed practice, test which of the ten phases are actually necessary, and take the affective critique seriously — Dirkx's point that transformation runs on emotion and imagery, not only rational discourse, remains under-tested."},
 reasoning:{
  notice:["The language of certainty — 'that's just how these kids are,' 'we've always done it this way' — marking premises that have never been examined.","Naturally occurring disorienting dilemmas: the lesson that inexplicably failed, the survey data that stung, the student who didn't fit the theory. These are openings; most expire unused.","Defensiveness as diagnostic: when evidence threatens a frame rather than a fact, people defend the frame — the heat tells you what's really under discussion.","Who processes disorientation aloud and who withdraws; both may be transforming, and they need different support."],
  assume:["That discomfort transforms by itself — unsupported disorientation reliably entrenches; the dilemma is the doorway, not the journey.","That rational discourse is a neutral instrument — critics note its norms are cultural, and some frames change through story, art, and relationship instead of argument.","That transformation is always the rightful goal: aiming at someone's worldview is an ethical act requiring consent; not every disagreement is a frame in need of fixing."],
  decide:["Sequence experiences that surface assumptions gently but unavoidably — student shadowing, data self-confrontation, structured perspective-taking.","Build discourse protocols with explicit norms: evidence over anecdote, questions before rebuttals, equal air.","Push reflection to the premise level in writing: not 'what happened' but 'what do I believe that made me expect otherwise?'","Close the loop in action: a transformed perspective that never changes practice evaporates — plan the enactment step."],
  avoid:["Ambush disorientation — shock without support produces casualties and converts, not learners.","Reading compliance vocabulary as changed frames; adults are fluent in performing agreement.","Rushing to comfort ('you're doing fine!') at the first sign of productive struggle.","Treating every colleague who disagrees with you as someone awaiting transformation — the theory describes a process, not a weapon."]},
 competing:[
  {scenario:"A teacher remains unmoved by data that contradicts her beliefs about her students.", thisView:"The data threaten a frame of reference, and frames protect themselves; change requires the fuller arc — dilemma, premise reflection, discourse, supported reintegration — not more data.", other:"Cognitive Dissonance (Festinger)", otherView:"Predictable dissonance-reduction is underway: discredit the data, trivialize the gap, add consonant beliefs. Manage the resolution routes — make dismissal harder and change easier — and behavior can shift before belief does.", agree:"Both agree information alone rarely changes deep belief, and both locate the action in how the contradiction gets resolved. Dissonance describes the moment's mechanics; transformation describes the long arc a good resolution can begin."},
  {scenario:"Equity-focused PD keeps producing defensiveness instead of change.", thisView:"Premise reflection threatens identity-level frames, so defensiveness is expected — the design needs safer discourse, better dilemmas, and support through discomfort, not softer content.", other:"Critical Pedagogy (Freire)", otherView:"The frame is too individual: transformation is collective critical consciousness moving toward action, and organizing the work around the comfort thresholds of the dominant group re-centers exactly whom it shouldn't. Praxis, not personal insight, is the point.", agree:"Both reject transmission-style PD, both give dialogue the central role, and both insist the endpoint is action. The enduring tension — individual meaning-making versus collective social transformation — is itself worth teaching."}],
 research:{
  questions:["Which conditions reliably produce perspective transformation rather than defended frames?","Are all ten phases necessary, or do multiple pathways exist?","How can transformation be measured beyond retrospective self-report?","What is the right 'dosage' of disorientation, and how do support structures change tolerance for it?"],
  methods:"Retrospective interview studies and instruments (King's Learning Activities Survey) dominate; stronger recent work uses longitudinal qualitative designs, case studies of transformative programs, and mixed methods triangulating self-report against observed practice change.",
  variables:"Phases experienced, depth of reflection (content, process, premise), discourse quality, reported and observed frame change, and subsequent action.",
  support:"Hundreds of studies across four decades yield consistent descriptive support: the arc — dilemma, reflection, discourse, reintegration — appears again and again in adults' accounts of deep change. Stated honestly, though: evidence is heavily retrospective and self-reported, phase-sequence causality is untested, and measurement remains the field's admitted soft spot. Treat it as a well-mapped territory awaiting stronger instruments."},
 reflect:["Name a belief about students you once held with certainty and no longer hold. What actually changed it — and how closely does that story match the theory's arc?","What disorienting dilemmas has your context handed you lately that you explained away instead of examined?","When you facilitate hard conversations, what do you do in the first moments of someone's visible discomfort — and does it serve their thinking or your comfort?","Which of your current certainties would most benefit from the question 'what would have to be true for this to be wrong?'","Is there anyone you've been trying to 'transform' who hasn't consented to the project? What would dialogue as equals look like instead?"],
 constellation:{builds:["freire","dewey"],complements:["knowles","kolb","schon"],contrasts:["behaviorism"],pairs:["dissonance","crp","practitioner"]},
 origins:"Mezirow's 1978 study of women returning to college revealed learning as perspective transformation. Drawing on Habermas's domains of learning, the theory became the most-researched framework in adult education, describing how frames of reference become more inclusive, discriminating, and open.",
 claims:["We interpret experience through acquired frames of reference (habits of mind and points of view).","A disorienting dilemma can trigger critical reflection on previously unexamined assumptions.","Rational discourse with others is the medium for testing revised meaning perspectives.","Transformation culminates in acting from the new perspective — not merely holding it."],
 constructs:[
  {term:"Frame of reference", def:"The structure of assumptions through which experience is filtered; comprises habits of mind and resulting points of view."},
  {term:"Disorienting dilemma", def:"An experience that cannot be assimilated into existing meaning structures, initiating the transformative process."},
  {term:"Critical reflection", def:"Examination of the content, process, and especially premises of one's beliefs."},
  {term:"Rational discourse", def:"Dialogue devoted to assessing reasons and reaching tentative best judgments."},
  {term:"Perspective transformation", def:"A more inclusive, differentiated, permeable, and integrated frame of reference."}],
 applications:["Designing doctoral coursework that surfaces and challenges practitioner assumptions.","Critical incident analysis and structured dialogue in leadership development.","Study-abroad, equity, and diversity education aiming at worldview change.","A common conceptual framework for EdD dissertations on educator belief change."],
 critiques:["Overemphasizes rationality; affect, intuition, and relationships matter (Dirkx).","Individual focus underplays social action (Freirean critique) and power in discourse.","The 10-phase model is descriptive; causal evidence for the sequence is thin."],
 related:["knowles","freire","kolb","dissonance"],
 refs:["Mezirow, J. (1991). Transformative dimensions of adult learning. Jossey-Bass.","Mezirow, J. (1997). Transformative learning: Theory to practice. New Directions for Adult and Continuing Education, 1997(74), 5–12.","Taylor, E. W., & Cranton, P. (Eds.). (2012). The handbook of transformative learning. Jossey-Bass."],
 compare:{learner:"An adult whose taken-for-granted assumptions are open to revision", mechanism:"Disorienting dilemma → critical reflection → discourse → reintegration", instructor:"Provocateur and convener of safe, rigorous discourse", knowledge:"Meaning perspectives; validity is tested through reflective discourse", critique:"Overly rational and individualistic; phase evidence is thin"}
},
{
 id:"sdt", dis:true, name:"Self-Determination Theory", discipline:"Learning Theory", depth:"deep",
 theorists:"Edward Deci & Richard Ryan (1985–present)",
 tagline:"Motivation flourishes when three basic psychological needs are met: autonomy, competence, and relatedness — and quality of motivation matters more than quantity.",
 problem:"Classrooms are full of compliance that looks like motivation until the points stop. The same student written off as 'unmotivated' in third period runs sophisticated strategy sessions for a game community at night. Reward systems work brilliantly for a month and then hollow out. And the adults are not exempt: mandate-heavy schools watch capable teachers disengage in exactly the way their students do. Self-Determination Theory exists to explain all of this at once — why the KIND of motivation matters more than the amount, and what conditions convert 'have to' into 'want to.'",
 asks:["Why do rewards sometimes energize behavior and sometimes quietly destroy the interest that was already there?","What is the difference between a student who works for points and one who works because it matters — and does the difference show up in learning?","What conditions help people internalize things they will never find fun but must do anyway?","Do the same motivational laws govern the adults in the building?"],
 iftrue:{
  teachers:"Give the rationale for every requirement — 'because it's on the test' feeds external regulation; 'because this is how you will win an argument that matters to you' feeds internalization. Build real choice inside structure (which text, which order, which format — not whether to learn). Protect competence with optimally hard tasks and feedback that informs rather than ranks. And audit your point systems honestly: are they information about growth, or instruments of control?",
  coaches:"Coach the way you hope teachers will teach: practices a teacher chooses and understands get internalized; practices delivered as mandates get performed while observed. Offer rationale, choice among sound options, and competence-building feedback — autonomy-supportive coaching is the theory applied to adults.",
  leaders:"Teacher motivation runs on the same three needs, and autonomy-supportive leadership predicts retention and well-being. Give the WHY behind every mandate, create genuine voice in decisions that touch practice, and examine schoolwide incentive systems for the same crowding-out risk classroom token economies carry.",
  researchers:"Measure motivation quality, not just quantity — the internalization continuum (external, introjected, identified, integrated, intrinsic) predicts different outcomes than raw engagement counts. Test need satisfaction as the mediating mechanism, and complement self-report with observed autonomy-supportive behaviors."},
 reasoning:{
  notice:["What happens when surveillance or rewards pause: behavior that collapses without them was externally regulated all along.","The language students use — 'do we have to?' versus 'can we?' — as a running gauge of regulation quality.","The same student's engagement across settings: differential energy is diagnostic of unmet needs, not fixed laziness.","Whether feedback is sought or dodged: competence-threatened learners avoid the very information that would grow them."],
  assume:["That the student values the outcome at all — SDT explains how valued actions become self-driven; if there is no value anywhere, expectancy-value theory is the sharper first lens.","That removing rewards will by itself restore motivation: crowding-out is real, but the vacuum must be filled with need support, or nothing improves.","That autonomy means unlimited choice — it means volition and endorsement, which structure, rationale, and even non-negotiables can support."],
  decide:["Attach a rationale to every assignment, rule, and mandate — write it into the task itself.","Convert controlling language ('you must,' 'you should have') into informational language ('here is what this makes possible').","Design tasks with at least one real decision that changes the work, and make early competence wins visible.","When a reward system exists, shift it toward unexpected recognition and information about growth, away from expected, contingent payment for interesting work."],
  avoid:["Escalating rewards and consequences to fix disengagement — it treats the symptom while feeding the disease.","Choice overload with no structure: options without guidance tax the very learners who most need support.","Public ranking that converts every task into a competence threat for half the room.","Reading compliance as motivation; quiet completion under pressure tells you nothing about what happens when the pressure lifts."]},
 competing:[
  {scenario:"The token economy improved behavior schoolwide. Should we expand it?", thisView:"Expect strong short-run compliance — and monitor what happens to already-interesting activities when tokens pause, because expected, contingent rewards can crowd out the intrinsic motivation you eventually need.", other:"Behaviorism (Skinner)", otherView:"Behavior followed by reinforcement strengthens; the system is working exactly as designed. Thin the schedule deliberately and the behavior can persist without payment.", agree:"Both predict rewards change behavior and both reject punishment-heavy systems. The genuine disagreement is about what rewards do to the inner life of the behavior — and even Skinner favored moving from contrived to natural reinforcers."},
  {scenario:"A capable student simply is not trying in math.", thisView:"Look for need frustration: a history of competence threat, no autonomy in how work happens, weak relatedness with the teacher or class — the motivational soil is depleted.", other:"Expectancy-Value Theory (Eccles & Wigfield)", otherView:"Run the decision math: does the student expect success, and does the task hold any value (interest, identity, usefulness) worth its cost? A rational zero on either factor produces exactly this behavior.", agree:"Perceived competence sits at the center of both accounts, and effective interventions — building success expectancy while adding value and rationale — draw on the two theories at once."}],
 research:{
  questions:["Does autonomy-supportive teaching cause gains in engagement, achievement, and persistence — and through need satisfaction as mediator?","How do external requirements become internalized, and what supports move a learner along the continuum?","What are the boundary conditions of reward undermining in real classrooms?","Do the same need dynamics predict teacher motivation, burnout, and retention?"],
  methods:"Longitudinal survey designs with structural equation modeling; randomized trials training teachers in autonomy support; diary and experience-sampling studies; classic experimental paradigms for reward effects.",
  variables:"Need satisfaction and frustration scales, regulation types (Self-Regulation Questionnaires), observed autonomy-supportive versus controlling behaviors, engagement, persistence on optional tasks, and well-being indices.",
  support:"One of the largest evidence bases in motivation science, with supportive meta-analyses for need satisfaction and autonomy-supportive teaching across dozens of countries. Honest limits: heavy reliance on self-report, live debate over the cross-cultural meaning of autonomy, and classroom intervention effects that are reliable but modest — a lever, not a miracle."},
 reflect:["Pick one routine in your classroom or school that runs on points, threats, or surveillance. What would it look like rebuilt on rationale, choice, and competence — and what stops you?","When did YOU last comply with a mandate while privately checked out? What was missing — the why, the voice, or the respect for your competence?","Which student have you labeled unmotivated? In what setting outside your room are they demonstrably not — and what is that setting providing?","Listen to your own classroom language for a day: what is your ratio of controlling phrases to informational ones?","If every extrinsic pressure vanished tomorrow, what parts of your students' current work would survive? Is that answer acceptable to you?"],
 constellation:{builds:["maslow"],complements:["expectancyvalue","mindset","flow"],contrasts:["behaviorism","nudge"],pairs:["srl","udl","knowles"]},
 origins:"Deci's experiments showed extrinsic rewards can undermine intrinsic motivation, contradicting behaviorist prediction. With Ryan, he built a macro-theory distinguishing types of motivation along a continuum of internalization, now among the most cited motivation frameworks in education.",
 claims:["Humans have innate needs for autonomy, competence, and relatedness; environments that satisfy them enhance motivation and well-being.","Motivation varies in kind — from amotivation through external, introjected, identified, and integrated regulation to intrinsic motivation.","Controlling rewards and pressure can crowd out intrinsic motivation (undermining effect).","Autonomy-supportive teaching predicts engagement, persistence, and deeper learning."],
 constructs:[
  {term:"Autonomy", def:"Experiencing one's actions as volitional and self-endorsed, not controlled."},
  {term:"Competence", def:"Feeling effective and capable of growth within optimally challenging tasks."},
  {term:"Relatedness", def:"Feeling connected to and cared for by others in the learning setting."},
  {term:"Internalization continuum", def:"The process by which external regulations become integrated into the self."},
  {term:"Autonomy support", def:"Offering choice, rationale, and perspective-taking while minimizing controlling language."},
  {term:"Undermining effect", def:"Tangible, expected, contingent rewards can reduce intrinsic motivation for interesting tasks."}],
 applications:["Classroom structures offering meaningful choice and rationales.","Rethinking token/points systems in light of the undermining effect.","Teacher retention and student engagement studies in EdD research.","Designing professional development that supports rather than mandates."],
 critiques:["Need universality across cultures is debated (autonomy's meaning varies).","Meta-analytic disputes over the size/boundary conditions of the undermining effect (Cameron & Pierce vs. Deci et al.).","Field interventions show smaller effects than lab studies."],
 related:["behaviorism","expectancyvalue","mindset","socialcognitive"],
 refs:["Deci, E. L., & Ryan, R. M. (1985). Intrinsic motivation and self-determination in human behavior. Plenum.","Ryan, R. M., & Deci, E. L. (2000). Self-determination theory and the facilitation of intrinsic motivation, social development, and well-being. American Psychologist, 55(1), 68–78.","Ryan, R. M., & Deci, E. L. (2017). Self-determination theory: Basic psychological needs in motivation, development, and wellness. Guilford Press."],
 compare:{learner:"An organism inclined toward growth when basic needs are met", mechanism:"Need satisfaction fuels intrinsic motivation and internalization", instructor:"Autonomy-supportive guide providing structure, rationale, and warmth", knowledge:"Pursued most deeply under intrinsic and well-internalized motivation", critique:"Cross-cultural universality and reward-effect boundaries contested"}
},
{
 id:"srl", dis:true, name:"Self-Regulated Learning", discipline:"Learning Theory", depth:"deep",
 theorists:"Barry Zimmerman; Paul Pintrich; Philip Winne",
 tagline:"Expert learners plan, monitor, and evaluate their own learning in cyclical phases of forethought, performance, and self-reflection.",
 problem:"The student studied for hours and failed — genuinely studied, genuinely hours — because the hours were spent rereading familiar pages and practicing errors without noticing. Another aced everything until the first course that required managing her own learning, and discovered she had never learned how. 'Just study more' is the most common academic advice in the world, and it is advice about quantity for a problem of method. Self-regulated learning research exists to explain what actually separates equally able learners: not effort, but the invisible cycle of planning, monitoring, and adjusting — and the uncomfortable finding that most learners judge their own knowing badly.",
 asks:["What separates self-regulated learners from equally able, equally hardworking peers?","Can the cycle — forethought, performance monitoring, self-reflection — actually be taught?","Why is self-judgment of learning so poorly calibrated, and can calibration improve?","Where does the capacity for self-regulation come from developmentally?"],
 iftrue:{
  teachers:"Teach strategies WITH their conditions — when this works, why, and how you'd know it's working — because a strategy without conditions is a ritual. Model the full cycle aloud on real tasks: watch me plan, watch me notice I'm confused, watch me change approach. Require brief plans before major tasks and reflections after, tied to the next attempt. And run calibration checks: predict your score, then compare — the gap is the curriculum.",
  coaches:"Move teams from assigning work to teaching how to work: the difference between 'study for the test' and teaching a study protocol is the difference between hoping and instructing. Embed SRL inside content — standalone study-skills units transfer notoriously badly — and analyze student work for phase failures: was that a planning gap, a monitoring gap, or a never-looked-back gap? Each needs different coaching.",
  leaders:"Adopt an evidence-based learning-strategies scope across the school — retrieval, spacing, self-testing, calibration — and retire the folklore (styles inventories, highlighting tutorials). Make advisory time do real SRL work: goal-setting cycles with plans, evidence, and revision, not aspiration posters. And notice which students never needed self-regulation until suddenly they do — the 'smart kid wall' is an SRL emergency, not an ability verdict.",
  researchers:"The measurement story is the methodological lesson: self-report questionnaires (MSLQ) diverge from trace data — logs, timestamps, actual strategy behavior — so instrument the doing, not just the saying. Phase-targeted interventions, calibration training, and the co-regulation developmental route are all active, publishable fronts."},
 reasoning:{
  notice:["Effort without strategy: hours logged with the least effective techniques — the hardest-working students are often the worst-served by their methods.","Calibration gaps: confident and wrong is a diagnosis, and prediction-versus-performance makes it visible.","Missing phases in work habits: no plan before, no monitoring during, no revision of approach after — the cycle broken at specific joints.","Help-seeking patterns: adaptive (targeted, after attempt) versus avoidant or dependent — each a self-regulation signature."],
  assume:["That telling students a strategy teaches it — strategies need modeling, guided practice, and fading, like any other skill.","That what looks like a motivation problem isn't a strategy problem (and vice versa): the student who 'doesn't care' may have quit caring after methods that never worked.","That capable students self-regulate naturally — many coasted on ability until the first context that demanded management, and arrive at it (often in college, sometimes in doctoral programs) unequipped."],
  decide:["Install forethought routines: goal plus strategy choice plus time plan, sixty seconds, before major work.","Give monitoring tools — error logs, checklists, mid-task 'is this working?' checkpoints.","Tie reflection to the next attempt: what will you do differently Tuesday, specifically?","Teach calibration explicitly: predict, perform, compare, adjust — the loop that repairs self-judgment."],
  avoid:["Generic study-skills units divorced from content — the transfer record is dismal.","Grading planning theater: compliance plans filled in to satisfy you teach exactly nothing.","Assuming your honors students have this; ask for their study methods and brace yourself.","Mistaking compliance for self-regulation — the student who does everything assigned may be regulated entirely from outside."]},
 competing:[
  {scenario:"A hardworking student keeps failing despite genuine effort.", thisView:"A strategy-and-monitoring deficit: the hours are real and misdirected — rereading, no self-testing, no error analysis. Teach the cycle and the same effort starts compounding.", other:"Attribution Theory (Weiner)", otherView:"Watch what the failures are teaching her: repeated effort-plus-failure invites a stable-ability conclusion ('I'm just not smart enough'), which ends the effort. The explanation, not the method, is the emergency.", agree:"Fully joined in practice: teach the strategy AND attribute the failure to it — 'your method failed, not your mind' — which is both accurate and the only attribution that preserves the next attempt. SRL instruction is attributional retraining with tools."},
  {scenario:"Whose job is regulation — the learner's skill or the environment's structure?", thisView:"Ultimately the learner's: the cycle is an individual capability, teachable and portable, and the goal is students who run it anywhere.", other:"Sociocultural Theory (Vygotsky)", otherView:"Regulation is social before it is individual: co-regulation with teachers and peers — shared goals, external monitoring, borrowed reflection — is the developmental route; classrooms that never scaffold it are demanding a destination while withholding the road.", agree:"The synthesis is developmental: other-regulation → co-regulation → self-regulation, deliberately faded — Vygotsky's arc with Zimmerman's phases as the curriculum. Independence is the endpoint of support, not its alternative."}],
 research:{
  questions:["Which phase-targeted interventions (forethought, monitoring, reflection) move achievement most, for whom?","How badly calibrated are learners' judgments, and what training improves calibration durably?","Do trace/log measures of regulation predict outcomes better than self-report — and what do the divergences mean?","How does co-regulation develop into self-regulation, and what fading schedules work?"],
  methods:"Intervention experiments embedded in real courses; microanalytic protocols (asking regulation questions during task phases); trace methodologies — logs, timestamps, revision histories; calibration paradigms comparing prediction with performance.",
  variables:"Strategy repertoire and conditional knowledge, phase behaviors (plans, checks, revisions), calibration accuracy, help-seeking type, and achievement.",
  support:"Strong and practical: SRL interventions carry solid meta-analytic effects, largest when embedded in content rather than taught generically; calibration is robustly poor and demonstrably trainable; the phase model organizes intervention design well. Honest limits: self-report instruments diverge from behavior, phases are less tidy in traces than in diagrams, and the field's own critique stands — locating regulation entirely in the learner can quietly excuse unsupportive environments."},
 reflect:["Ask three students tomorrow HOW they studied last week — methods, not minutes. What will you likely hear, and who taught them that?","Where does your course require a plan, a monitoring check, or a revision of approach — anywhere at all?","Run the calibration test on yourself: predict your comfort with each theory in this Lab, then open three entries. How's your calibration?","Which of your strongest students is one demanding context away from the wall — and what would you teach them now if you believed that?","When you 'taught' a strategy last, did anyone watch you use it, practice it with fading support, and learn when NOT to use it? Or did you mention it?"],
 constellation:{builds:["socialcognitive"],complements:["desirable","implementation"],pairs:["vygotsky","barkley"]},
 origins:"Growing from Bandura's social cognitive theory in the 1980s–90s, SRL research explained why students with similar ability diverge: differences in goal setting, strategy use, self-monitoring, and attributions. It underpins study-skills, metacognition, and formative assessment work.",
 claims:["Learning success depends on cyclical self-regulation: forethought, performance control, and self-reflection.","Metacognitive monitoring and strategy use are teachable and improve achievement.","Self-efficacy and goal orientation drive the quality of self-regulation.","Feedback loops — internal and external — are the engine of improvement."],
 constructs:[
  {term:"Forethought phase", def:"Task analysis, goal setting, strategic planning, and motivational beliefs before acting."},
  {term:"Performance phase", def:"Self-control (strategies, attention) and self-observation during the task."},
  {term:"Self-reflection phase", def:"Self-judgment (evaluation, attribution) and self-reaction that feed the next cycle."},
  {term:"Metacognition", def:"Knowledge and regulation of one's own cognition (Flavell's term)."},
  {term:"Calibration", def:"Accuracy of self-judgments of learning relative to actual performance — novices are typically overconfident."}],
 applications:["Teaching study strategies with the conditions of their use (when/why, not just how).","Formative assessment and feedback design (see Hattie & Timperley).","Goal-setting and reflection protocols in advising and coaching.","Online/distance learning success research — a heavily used EdD framework."],
 critiques:["Phase models can imply more linearity than real regulation shows.","Self-report instruments (e.g., MSLQ) diverge from traces of actual behavior.","Risks locating failure in the learner while ignoring context and opportunity."],
 related:["socialcognitive","infoprocessing","desirable","attribution"],
 refs:["Zimmerman, B. J. (2002). Becoming a self-regulated learner: An overview. Theory Into Practice, 41(2), 64–70.","Pintrich, P. R. (2004). A conceptual framework for assessing motivation and self-regulated learning in college students. Educational Psychology Review, 16(4), 385–407.","Winne, P. H., & Hadwin, A. F. (1998). Studying as self-regulated learning. In D. J. Hacker et al. (Eds.), Metacognition in educational theory and practice (pp. 277–304). Erlbaum."],
 compare:{learner:"A strategic agent who sets goals and monitors own progress", mechanism:"Cyclical feedback: forethought → performance → self-reflection", instructor:"Coach who models strategies and structures feedback loops", knowledge:"Includes knowledge about one's own cognition (metacognition)", critique:"Self-reports unreliable; can individualize structural problems"}
},
{
 id:"connectivism", name:"Connectivism", discipline:"Learning Theory", depth:"deep",
 theorists:"George Siemens & Stephen Downes (2005)",
 tagline:"In a networked, digital age, learning is the process of building and traversing connections across people, information sources, and technologies.",
 problem:"Half of what a computer science graduate learned is aging out before the loans are paid. The student stuck on a math problem consults a tutorial, a Discord server, and a forum thread before ever considering the textbook — and usually gets better help. Professional knowledge now updates faster than any curriculum, credential, or brain can store it, and the learners navigating this best are running personal networks the school never sees, never teaches, and never credits. Connectivism exists to ask what learning means under these conditions: when knowing-where and knowing-who rival knowing-what, when currency beats storage in fast-moving fields, and when the network — not just the node — may be where the knowing lives.",
 asks:["What is learning when knowledge outdates faster than it can be stored?","Can a network 'know' — and what does it mean that competence now includes one's connections?","Which capabilities matter most when currency rivals accumulation: evaluation, curation, connection-seeing?","Is this a genuine learning theory or a compelling pedagogy for networked conditions?"],
 iftrue:{
  teachers:"Teach network literacy as seriously as content: evaluating nodes and sources (the lateral-reading move from civic online reasoning), curating feeds deliberately, distinguishing signal from engagement bait. Build class knowledge networks — shared annotation, collaborative curation, durable wikis — so students practice knowledge-building as a networked act. And model your own learning network openly: show them where YOU learn now.",
  coaches:"The isolated classroom is a network failure with a human cost: help teachers build professional learning networks deliberately — curated follows, cross-school ties, communities worth their attention — and teach curation over consumption, because the networked teacher's problem is noise, not scarcity. Your own coaching network is the demonstration.",
  leaders:"Treat PD as network cultivation: connect teachers across buildings and districts rather than only broadcasting to them, and build knowledge-management so institutional memory survives turnover — the school that can't remember is a broken network. Mind the equity ledger: access means devices and bandwidth, but also network capital — who students and staff can actually reach.",
  researchers:"The empirical toolkit is network analysis: ties, centrality, and flow as learning measures; cMOOC and PLN studies as the natural sites; teacher-network effects on practice change as the consequential question. The theory-status debate itself is researchable — what do connectivist designs produce that prior frameworks don't predict?"},
 reasoning:{
  notice:["Where students actually learn things: the tutorials, servers, and communities they consult first — an invisible curriculum running parallel to yours.","Network quality differences among students: who can reach working expertise and who is marinating in noise — a new axis of inequality.","Curation versus consumption behaviors: who builds and prunes their information environment, and who just scrolls what arrives.","What your course requires to be stored versus what it could teach students to source — and whether that line was drawn on purpose."],
  assume:["That access equals capability: network literacy is unevenly distributed on top of the device divide — connection without evaluation is just exposure.","That connectivity is learning: a thousand tabs is not a network; ties without judgment transmit noise and worse.","That storage no longer matters — the theory's most oversold reading: evaluating and integrating found information runs ON stored knowledge, and a searcher with an empty head cannot judge what the search returns."],
  decide:["Teach source-network evaluation explicitly — who is this node, who links to it, what does lateral reading reveal?","Build durable class knowledge artifacts: wikis, annotated collections, curated resource maps that outlive the unit.","Assign network-building as coursework: follow, curate, synthesize, and defend your sources.","Balance deliberately: foundations stored (the field's stable core), frontiers sourced (its moving edge) — and name which is which for your discipline."],
  avoid:["Outsourcing foundations to lookup: novices cannot evaluate what they cannot understand — the Google-it curriculum eats its own preconditions.","Network romanticism: filter bubbles, engagement-optimized feeds, and confident nonsense are networks too.","Equating tool use with connectivist learning — a worksheet on a tablet is still a worksheet.","Grading connectivity theater: follows and posts counted, judgment never assessed."]},
 competing:[
  {scenario:"'Why memorize anything when you can Google it?'", thisView:"Because the question is half right: in fast-moving fields, currency, sourcing, and connection-seeing ARE core competencies, and curricula that pretend all knowledge must be stored are training for a world that left.", other:"Cognitive Load Theory & the knowledge tradition", otherView:"Because the question is half wrong: comprehension, evaluation, and search itself run on long-term memory — the expert Googles better precisely because of what's stored. You cannot outsource what thinking is made of.", agree:"Both halves survive contact: store the foundations that make judgment possible; source the frontier that won't hold still — and the mix shifts with each field's velocity. The failure modes are symmetric: the memorization-only course and the lookup-only course both graduate the helpless."},
  {scenario:"Is connectivism actually a learning theory?", thisView:"New conditions demand new theory: when knowledge lives in networks and half-lives shrink, the unit of analysis — the network, not the individual mind — genuinely changes, and no prior theory centers that.", other:"The critics (Verhagen; Kop & Hill)", otherView:"It's a pedagogy, not a theory: distributed cognition, situated learning, and Vygotsky already cover the phenomena, and connectivism supplies no testable mechanism of its own — inspiration wearing theory's clothes.", agree:"Even the critics concede the design questions are real and under-taught: network literacy, PLN cultivation, currency management. Whatever wins the taxonomy fight, the syllabus implications survive it — which is why this entry exists."}],
 research:{
  questions:["Do deliberately built learning networks (PLNs) change professional practice — and what network features predict it?","Which network-literacy instruction improves source evaluation and knowledge-building?","What did cMOOCs actually produce for whom — and why did participation stratify?","Can network measures (ties, centrality, flow) serve as learning outcomes?"],
  methods:"Social network analysis of learning communities; learning analytics on participation and flow; case studies of cMOOCs and teacher PLNs; intervention studies of network-literacy instruction (adjacent: the civic online reasoning trials).",
  variables:"Network structure (ties, reach, diversity), curation and evaluation behaviors, participation trajectories, practice change for professionals, and learning outcomes where designs permit.",
  support:"The thinnest evidence base of any theory at this depth in the Lab — worth saying plainly: largely descriptive, definitionally contested, with the founding cMOOC experiments showing stratified participation that favored the already-skilled. Yet the phenomena are real and growing, adjacent literatures (network science, online-reasoning instruction) are solid, and the questions it forces — what must be stored, what can be sourced, who teaches the network — belong on every curriculum committee's table. A provocation whose homework is still due."},
 reflect:["Map your own learning network honestly: where did your last five professional insights actually come from — and would your students recognize any of those channels from how you teach?","What in your course must be stored, and what could be sourced — and is that line drawn by design or by tradition?","Which of your students has the richest learning network, and which the poorest — and what is school doing about that gap?","When did you last teach anyone how to evaluate a node — a channel, a thread, an account — rather than a single text?","Your doctoral cohort is a learning network by design: what does it give you that no course content could, and what does that imply for the schools you lead?"],
 constellation:{builds:["vygotsky","situated"],complements:["nls","digital_writing"],contrasts:["infoprocessing","cogload"],pairs:["srl"]},
 origins:"Proposed as 'a learning theory for the digital age', connectivism argued that knowing where and knowing who now rival knowing what. It inspired the first MOOCs (cMOOCs) and frames learning analytics and networked professional learning.",
 claims:["Learning is the formation of connections in networks that span brains, devices, and communities.","Knowledge can reside in non-human appliances; the pipe matters more than the content in the pipe.","Capacity to know more is more critical than what is currently known.","Currency (up-to-date knowledge) and the ability to see connections across fields are core competencies."],
 constructs:[
  {term:"Network node & tie", def:"Learners, resources, and tools as nodes; learning strengthens or prunes ties among them."},
  {term:"Distributed knowledge", def:"Knowledge existing across a network rather than solely within an individual mind (Downes)."},
  {term:"cMOOC", def:"Connectivist massive open online course built on participant networking rather than content delivery."},
  {term:"Personal learning network (PLN)", def:"The self-curated web of people and sources through which a professional learns continuously."},
  {term:"Currency", def:"The premium on keeping knowledge current in rapidly changing fields."}],
 applications:["Designing networked professional development and PLNs for educators.","MOOC and online course architecture; social knowledge building.","Learning analytics on network participation.","Framing studies of Twitter/X, LMS discussion, or open education communities."],
 critiques:["Critics argue it describes a pedagogy or context, not a distinct learning theory (Verhagen; Kop & Hill).","Underspecifies mechanism: how connections become understanding.","Equity concerns — presumes access, bandwidth, and self-direction."],
 related:["situated","srl","vygotsky"],
 refs:["Siemens, G. (2005). Connectivism: A learning theory for the digital age. International Journal of Instructional Technology and Distance Learning, 2(1), 3–10.","Downes, S. (2012). Connectivism and connective knowledge. National Research Council Canada.","Kop, R., & Hill, A. (2008). Connectivism: Learning theory of the future or vestige of the past? International Review of Research in Open and Distributed Learning, 9(3), 1–13."],
 compare:{learner:"A node cultivating a network of people, sources, and tools", mechanism:"Forming, pruning, and traversing network connections", instructor:"Curator and network gardener; models connection-making", knowledge:"Distributed across the network; partly resides in tools", critique:"May be a pedagogy, not a theory; mechanism underspecified"}
},
{
 id:"multimedia", name:"Cognitive Theory of Multimedia Learning", discipline:"Learning Theory", depth:"deep",
 theorists:"Richard E. Mayer; roots in Allan Paivio's dual coding theory",
 tagline:"People learn more deeply from words and pictures together than from words alone — when design respects dual channels, limited capacity, and active processing.",
 problem:"Every educator became a message designer without ever being trained as one: slides, videos, LMS pages, handouts — thousands of design decisions a year, each one silently helping or taxing the minds on the receiving end. So the deck gets read aloud word for word while students' verbal channels collide; the video gets decorated with animations that entertain the eyes and evict the content; the diagram sits on one page with its explanation on another, and learners burn capacity stitching them together. Mayer's research program exists to replace those accidents with principles: how words and pictures actually combine in the mind, and which design choices decide whether media teaches or merely plays.",
 asks:["How do words and pictures combine — and interfere — in a limited-capacity mind?","Why do seemingly small design choices swing learning outcomes so dramatically?","When do media enhance learning, and when do they decorate it?","Do the same designs serve novices and experts alike?"],
 iftrue:{
  teachers:"Adopt the core moves: graphics explained by narration — not narration plus identical on-screen text; interesting-but-irrelevant material cut, however charming; labels placed inside diagrams, not across the page; long videos segmented with pauses and questions. The principles are free, immediate, and apply to every slide you will ever make again.",
  coaches:"The slide-deck makeover is the most concrete PD you can run: take a real teacher deck, apply coherence, redundancy, and contiguity live, and show the before/after — principles stick when teachers watch their own materials improve. Extend the audit beyond slides to LMS pages, handouts, and anchor charts; it's all message design.",
  leaders:"Make the principles a procurement lens: digital curricula and video products violate redundancy and coherence constantly, and the district license fee does not exempt them from working memory's limits. Set light guidance for school-made video (segmenting, narration-over-text), and model the principles in every staff presentation — the medium is the PD.",
  researchers:"The program's lab rigor is the model; the frontier is ecology: longer lessons, real classrooms, diverse learners, and the expertise-reversal question of when supports for novices become drag for the advanced. The emotional-design strand — when appealing visuals help rather than seduce — is genuinely unsettled and worth your cohort's attention."},
 reasoning:{
  notice:["Where attention actually goes during your media — if students are reading the slide while you talk, the two verbal streams are colliding, and one of them is losing.","Decorative images versus explanatory graphics: one fills space, the other carries causal structure. Your deck knows which it collects.","Whether any video you assign has interaction points, or is passivity with production values.","The stitching cost in your materials: explanations here, diagrams there, and working memory paying the courier fees."],
  assume:["That polish equals learning — production values and instructional value are uncorrelated until design principles connect them.","That engagement equals comprehension: the seductive-details literature exists because interest and learning routinely part ways.","That principles apply uniformly — experts can be slowed by the very supports novices need (expertise reversal), and some content needs practice, not better presentation."],
  decide:["Redesign one deck this week: cut the decoration, delete text that duplicates narration, integrate labels, add signals for what matters.","Segment every video beyond a few minutes, and embed a retrieval prompt at each seam.","Choose narration with graphics as the default; reserve on-screen text for what must be studied, not heard.","Test your materials the honest way: what could a student reconstruct afterward — not how did the deck feel in the room?"],
  avoid:["Reading slides aloud verbatim — the redundancy effect is the most violated finding in professional life.","Seductive details: the hilarious meme, the dramatic stock photo, the tangent video — each purchased with capacity the content needed.","Wall-of-text slides as speaker notes made public.","Assigning watch-this-video as if exposure were instruction; presentation without retrieval is the front half of a lesson."]},
 competing:[
  {scenario:"The beautifully produced video taught almost nothing.", thisView:"Audit the design: redundant text, seductive decoration, no signaling, no segmentation — the message violated the channels it traveled on. Fix the design and the same content lands.", other:"Desirable Difficulties (Bjork)", otherView:"Even a perfectly designed message is still presentation — encoding without retrieval decays on schedule. The video's problem isn't its design; it's that watching is the first half of learning, and nothing scheduled the second half.", agree:"Sequential, not rival: design the message so it arrives (Mayer), then engineer the retrieval so it stays (Bjork). A media plan that does one without the other is half a plan."},
  {scenario:"But my students LOVE the funny, dramatic, meme-rich materials.", thisView:"The seductive-details effect is one of the program's most replicated findings: emotionally interesting, conceptually irrelevant material reliably harms learning of the content it decorates. Cut it.", other:"Interest & emotional design research (Um, Plass)", otherView:"Blanket asceticism overshoots: appealing visual design can induce positive affect that improves learning, and for disengaged learners the on-ramp matters — an interest triggered is not a detail wasted.", agree:"The synthesis is emerging, not settled: aesthetics integrated WITH the content (warm colors, appealing relevant graphics) can help; decoration ALONGSIDE the content hurts. Design for appeal inside the message, not stapled to it."}],
 research:{
  questions:["Which principles hold in long-form, authentic classroom instruction — and at what effect sizes outside the lab?","Where does expertise reversal begin for each principle?","When does emotional/aesthetic design help learning rather than seduce attention?","What generative additions (pauses, prompts, drawing) turn passive media into active processing?"],
  methods:"Controlled experiments comparing message variants — the program's signature, across dozens of replications; eye-tracking for attention allocation; transfer tests as the learning criterion; classroom extensions and meta-analyses by principle.",
  variables:"Retention and transfer performance, cognitive-load ratings, attention allocation, learner prior knowledge, and design factors manipulated one principle at a time.",
  support:"One of the most systematic experimental programs in educational psychology: multimedia, coherence, redundancy, contiguity, signaling, segmenting — each supported across many studies with respectable effect sizes. Honest limits: predominantly short lab lessons with novice (often college) learners; classroom effects attenuate; principles interact with expertise and motivation; and the emotional-design nuance is genuinely rewriting the seductive-details story's edges."},
 reflect:["Open your most-used slide deck right now. How many slides would survive a redundancy-and-coherence audit — and what's the loveliest thing you'd have to delete?","When you present, are your students listening, reading, or trying to do both? What have you chosen for them?","Which video do you assign as instruction — and where are its retrieval points, if it has any?","What message-design accidents are your handouts and LMS pages committing that your slides already stopped?","When did decoration last win over clarity in something you made because you loved it — and who paid the capacity bill?"],
 constellation:{builds:["infoprocessing","cogload"],complements:["udl","desirable"],pairs:["digital_writing"]},
 origins:"Paivio's dual coding theory (verbal and imaginal systems) plus working-memory research grounded Mayer's decades of experiments on multimedia messages, yielding evidence-based principles (coherence, contiguity, modality, redundancy, signaling) that govern slide, video, and e-learning design.",
 claims:["Humans process information through separate visual/pictorial and auditory/verbal channels (dual channels).","Each channel has limited capacity; overload in either impairs learning.","Meaningful learning requires actively selecting, organizing, and integrating words and images.","Design principles (e.g., coherence, signaling, contiguity) reliably reduce extraneous processing."],
 constructs:[
  {term:"Dual coding", def:"Verbal and non-verbal information are encoded in distinct but interconnected systems (Paivio)."},
  {term:"Coherence principle", def:"Exclude interesting-but-irrelevant material; seductive details harm learning."},
  {term:"Contiguity principles", def:"Place corresponding words and pictures near each other in space and time."},
  {term:"Modality principle", def:"Present words as narration rather than on-screen text when paired with graphics."},
  {term:"Redundancy principle", def:"Narration plus identical on-screen text can overload the verbal channel."},
  {term:"Signaling", def:"Cues (highlights, outlines) that guide attention to essential material."}],
 applications:["Designing lecture slides, instructional video, and e-learning modules.","Evaluating edtech products against evidence-based principles.","Improving accessibility choices (narration, captioning trade-offs).","Common framework for EdD studies of online instruction quality."],
 critiques:["Most evidence comes from short lab lessons with college students; classroom transfer is weaker.","Principles interact with prior knowledge (expertise reversal) and motivation.","Focus on efficiency of message design, not curriculum or culture."],
 related:["infoprocessing","cogload","desirable"],
 refs:["Mayer, R. E. (2021). Multimedia learning (3rd ed.). Cambridge University Press.","Paivio, A. (1986). Mental representations: A dual coding approach. Oxford University Press.","Mayer, R. E., & Moreno, R. (2003). Nine ways to reduce cognitive load in multimedia learning. Educational Psychologist, 38(1), 43–52."],
 compare:{learner:"A dual-channel processor with limited capacity per channel", mechanism:"Selecting, organizing, integrating words and images into models", instructor:"Message designer applying evidence-based multimedia principles", knowledge:"Integrated verbal–pictorial mental models", critique:"Lab-based evidence; boundary conditions with expertise and motivation"}
},
{
 id:"desirable", name:"Desirable Difficulties & the Testing Effect", discipline:"Learning Theory", depth:"deep",
 theorists:"Robert & Elizabeth Bjork; Henry Roediger III & Jeffrey Karpicke; Hermann Ebbinghaus (forerunner)",
 tagline:"Conditions that make practice feel harder and slower — spacing, interleaving, retrieval — produce more durable, flexible learning than fluent, massed study.",
 problem:"The student rereads her notes until they feel familiar, walks in confident, and blanks — the studying felt like learning precisely because it wasn't. The lesson ran smoothly, every practice problem landed, and by the unit test it had all evaporated. Cramming works Friday and fails forever, and everyone keeps choosing it anyway. This literature exists to explain education's cruelest joke: the practice that feels best works worst, performance during learning systematically misleads both student and teacher, and the conditions that create durable learning — spacing, interleaving, retrieval — feel like failure while they work.",
 asks:["Why is performance during practice such a poor predictor of learning?","Which difficulties help learning, which just impede it, and what marks the difference?","Why do learners (and teachers) reliably choose the strategies that work worst?","What conditions actually produce learning that lasts and travels?"],
 iftrue:{
  teachers:"Convert review time into retrieval time: brain dumps, low-stakes quizzing, and closed-book recall beat rereading by margins that should embarrass the highlighter industry. Space and interleave deliberately — bring back last month's material on purpose, mix related problem types so students must choose the method, not just execute it. And teach students WHY it feels worse, with their own data, or they will revert the moment you stop watching.",
  coaches:"Watch for fluency theater: the lesson that runs perfectly smooth is often optimized for performance-during-practice, the metric that predicts least. Help teachers redesign review cycles around retrieval and spacing, and give them the professional cover to let practice look messier — a coach who praises struggle-with-success is repricing the classroom's currency.",
  leaders:"Build the calendar the science implies: cumulative assessment by design, spiral review baked into curriculum maps, homework policy oriented to retrieval rather than completion. And examine what your walkthrough rubrics reward — if smoothness scores well, you are institutionally purchasing the illusion of competence.",
  researchers:"The lab effects are among psychology's most replicated; the frontier is translation: boundary conditions in real classrooms (feedback timing, material complexity, prior knowledge), and the metacognitive-illusion problem — interventions that get learners to actually adopt strategies their own judgment argues against."},
 reasoning:{
  notice:["Confidence after rereading paired with failure after delay — the fluency illusion performing live.","Massed-practice success curves that crash at the delayed test: Friday's mastery was retrieval strength, not storage strength.","Who the difficulty serves: interleaving and spacing pay off for learners with some footing; total novices may just drown (the CLT boundary).","Your own judgments: how much of your sense of 'they've got it' is based on performance at the moment of maximum accessibility?"],
  assume:["That struggle is always productive — a difficulty is desirable only when the learner can succeed through effort; unreachable difficulty is just failure with a theory.","That telling students the evidence changes their habits: the illusion is experiential, so the counter-evidence must be too.","That performance equals learning — the field's founding distinction, and the one educators forget weekly."],
  decide:["Install retrieval routines: opening brain dumps, exit recall, weekly cumulative low-stakes quizzes.","Space it on the calendar — the review of unit 2 belongs inside unit 4, by design, not by guilt.","Interleave related problem types so discrimination (WHICH method?) gets practiced, not just execution.","Run the class experiment once: half study by rereading, half by self-testing, everyone sees the delayed results. Their own data converts better than your speech."],
  avoid:["Difficulty as virtue-signaling — hard-for-hard's-sake with no reachable success.","Effortful retrieval before any schema exists: manage load during acquisition, add difficulty for durability (the sequencing your cognitive-load entry maps).","High-stakes retrieval — grading every recall attempt teaches students to hide ignorance rather than surface it.","Judging your own teaching by in-lesson smoothness; you are grading the illusion."]},
 competing:[
  {scenario:"Practice went beautifully; the test three weeks later went badly.", thisView:"Exactly as predicted: massed, fluent practice inflated retrieval strength while storage strength lagged. The smoothness WAS the warning sign — space it, test it, mix it, and tolerate the wobble.", other:"Cognitive Load Theory (Sweller)", otherView:"Check the acquisition phase first: if schemas were never solidly built, no amount of clever difficulty will consolidate what doesn't exist. Smooth practice may have been shallow encoding, not over-fluency.", agree:"Fully reconciled by phase: manage load while building (worked examples, low extraneous load), then add desirable difficulties to make it durable. The expert question is always 'which phase is this learner in?'"},
  {scenario:"Students know the evidence and still won't use retrieval and spacing.", thisView:"The fluency illusion is doing the choosing: rereading feels productive, self-testing feels like exposure to failure. Give them the experiential counter-evidence — their own quiz-versus-reread data — and normalize errors as the mechanism.", other:"Self-Determination Theory (Deci & Ryan)", otherView:"Effortful strategies with delayed payoffs are exactly what controlled motivation abandons: without rationale, choice in how to apply them, and safety around error, the strategies feel imposed and get dropped.", agree:"Mandating study strategies fails by both accounts. Evidence students generate themselves, plus autonomy-supportive framing and low-stakes conditions, is the joint prescription — and it's how the strategies survive contact with real students."}],
 research:{
  questions:["What are the boundary conditions of testing and spacing effects in classrooms — feedback timing, material complexity, learner knowledge?","How can learners' metacognitive illusions be corrected durably, not just informed?","How do desirable difficulties interact with load management across a learning sequence?","Which implementations (quiz frequency, spacing gaps, interleaving ratios) optimize real course outcomes?"],
  methods:"The classic lab paradigms (study-test versus study-study, spacing manipulations, interleaved versus blocked practice) plus a maturing classroom-experiment literature; judgments-of-learning designs for the metacognitive strand.",
  variables:"Retention across delays, transfer to new problems, judgments of learning versus actual performance (calibration), practice schedule parameters, and stakes/feedback conditions.",
  support:"About as strong as educational psychology gets: the testing and spacing effects are century-deep, meta-analyzed, and ranked top-utility in the Dunlosky review; interleaving is younger but consistent. Classroom effects run smaller than lab effects and boundary conditions are real — complexity, feedback, and prior knowledge all moderate — but no serious reading of this literature leaves rereading and highlighting as defensible study advice."},
 reflect:["What do your students actually do when told to study — and who taught them those rituals? (Be prepared for the answer to include you.)","Where in your course does review mean re-exposure rather than retrieval — and what would the retrieval version of that same time look like?","When your lesson runs perfectly smoothly, what exactly is being optimized — and for which date?","What would it cost you to let practice look worse in the short term — and who in your building would need to understand why?","Your own doctoral studying: reread-and-highlight, or spaced self-testing? What does your answer say about how deep the illusion runs?"],
 constellation:{builds:["infoprocessing"],complements:["cogload","srl"],pairs:["transfer","mindset"]},
 origins:"Ebbinghaus documented forgetting curves and spacing benefits in 1885. A century later, Bjork's 'new theory of disuse' distinguished retrieval strength from storage strength, and Roediger and Karpicke's 2006 studies showed testing outperforms restudy — launching the applied science of durable learning.",
 claims:["Performance during practice is a poor index of learning; fluency illusions mislead learners and teachers.","Retrieval practice (testing) strengthens memory more than re-exposure.","Spacing and interleaving practice slow acquisition but improve retention and transfer.","Difficulties are desirable only when learners can succeed with effort — otherwise they are just difficulties."],
 constructs:[
  {term:"Testing effect", def:"The act of retrieving information enhances long-term retention more than additional study."},
  {term:"Spacing effect", def:"Distributed practice across time outperforms massed practice (cramming)."},
  {term:"Interleaving", def:"Mixing related topics or problem types improves discrimination and transfer versus blocking."},
  {term:"Storage vs. retrieval strength", def:"How well learned versus how accessible now; current accessibility misleads judgments of learning."},
  {term:"Fluency illusion", def:"Mistaking ease of processing (rereading, highlighting) for learning."}],
 applications:["Low-stakes retrieval routines: brain dumps, quizzes, flashcards (like this app's deck).","Spiral curriculum and cumulative exams; spaced homework design.","Teaching students to replace rereading/highlighting with self-testing.","Faculty development on evidence-based study strategies."],
 critiques:["Effects vary with feedback, retention interval, and material complexity.","Classroom implementations show smaller effects than lab studies.","Overzealous difficulty harms struggling learners; requires calibration to expertise."],
 related:["infoprocessing","cogload","srl"],
 refs:["Bjork, R. A., & Bjork, E. L. (1992). A new theory of disuse and an old theory of stimulus fluctuation. In A. Healy, S. Kosslyn, & R. Shiffrin (Eds.), From learning processes to cognitive processes (Vol. 2, pp. 35–67). Erlbaum.","Roediger, H. L., III, & Karpicke, J. D. (2006). Test-enhanced learning: Taking memory tests improves long-term retention. Psychological Science, 17(3), 249–255.","Dunlosky, J., Rawson, K. A., Marsh, E. J., Nathan, M. J., & Willingham, D. T. (2013). Improving students' learning with effective learning techniques. Psychological Science in the Public Interest, 14(1), 4–58."],
 compare:{learner:"A memory system that strengthens through effortful retrieval", mechanism:"Spaced, interleaved retrieval builds storage strength and transfer", instructor:"Architect of practice schedules and low-stakes testing", knowledge:"Durable, accessible memory built through effortful practice", critique:"Boundary conditions matter; too much difficulty backfires"}
