{
 id:"infoprocessing", name:"Cognitive Information Processing", discipline:"Learning Theory", depth:"deep",
 theorists:"Richard Atkinson & Richard Shiffrin; George A. Miller; Alan Baddeley",
 tagline:"The mind works like a processing system: information flows through sensory, working, and long-term memory, constrained by attention and capacity.",
 problem:"They knew it Friday. By Monday it's gone — not hazy, gone. A teacher delivers a beautifully clear lesson and discovers most of it never arrived: attention was elsewhere, capacity was full, or the material touched nothing already known and evaporated on contact. Students reread and highlight for hours and call it studying while retaining almost nothing. The information-processing framework exists to explain the pipeline every lesson must survive — attention, working memory, encoding, retrieval — and why teaching that ignores any stage of it produces the illusion of learning followed by the reality of forgetting.",
 asks:["How does information become memory — and where along the pipeline is it lost?","What limits how much a learner can take in at once?","Why does retrieval fail for things that were once demonstrably known?","What makes knowledge not just stored but usable?"],
 iftrue:{
  teachers:"Manage attention as the scarce resource it is: one focus at a time, competing stimuli cut, the important thing signaled as important. Chunk new material and hook it to what students already know — elaboration is encoding. Build automaticity in the tools (math facts, decoding, notation) so working memory is free for the thinking. And measure learning where it lives: days later, not at the exit ticket, because Friday's performance is a rented feeling.",
  coaches:"Give teams the pipeline as a lesson-autopsy tool: when a lesson didn't stick, walk it stage by stage — did attention land? was working memory overloaded? was there any encoding work, or just exposure? is there a retrieval plan? Most 'reteaching' decisions change once the failure is located rather than assumed.",
  leaders:"Attention economics scale up: initiative overload, PA interruptions, and fragmented schedules are pipeline problems at the organizational level. Favor curricula with built-in spaced review over coverage sprints, and treat 'we taught it' as the beginning of a claim, not the end of one.",
  researchers:"The framework supplies education's most portable dependent measures — retention over delay, transfer, automaticity — and its analytic tool of choice, cognitive task analysis: what must be held, retrieved, and processed, when, for this task? Model the pipeline explicitly and instrument each stage."},
 reasoning:{
  notice:["What students actually attended to — ask them what the lesson was about and compare it with what you taught; the gap is the attention audit.","Overload signals: instructions repeated, first steps missed, 'what do we do?' seconds after directions.","The Friday-to-Monday cliff: schedule a delayed check and let the forgetting curve report honestly.","Automaticity gaps taxing higher work — the writer counting letter formation has no capacity left for argument."],
  assume:["That attention given is attention received; presence is not processing.","That storage equals retrieval — much 'forgetting' is retrieval failure, which practice-testing repairs and rereading doesn't.","That understanding today predicts memory next month; without consolidation work, it predicts almost nothing."],
  decide:["Open with attention architecture: clear signal of what matters, noise removed, one channel at a time.","Chunk and sequence to capacity; connect every new chunk to a known one out loud.","Ask elaborative questions ('why would that be true?') as the encoding event, not the enrichment.","Build automaticity deliberately, and calendar spaced retrieval as part of the curriculum, not a teacher hobby."],
  avoid:["Coverage sprints that maximize exposure and minimize encoding.","Stacking simultaneous novel demands — new content, new format, new tool, same Tuesday.","Reading the exit ticket as learning; it measures performance at peak accessibility.","Blessing rereading-and-highlighting rituals your own entry on desirable difficulties exists to end."]},
 competing:[
  {scenario:"They knew it Friday and it's gone by Monday.", thisView:"A consolidation-and-retrieval failure, fully predicted: single exposure, no encoding work, no retrieval practice. The fix is the pipeline's back half — elaboration, spacing, testing.", other:"Situated Learning (Lave & Wenger)", otherView:"The knowledge wasn't 'stored then lost' — it was competence in a Friday-shaped practice (that worksheet, that room) and never existed outside it. Change what students participate in, not just how often they retrieve.", agree:"Both condemn one-shot exposure teaching, and both prescriptions — varied retrieval across contexts, authentic re-engagement — converge on the same classroom moves from different metaphysics."},
  {scenario:"Is the mind really a computer?", thisView:"The architecture is a working model, not a metaphysics: stores, limits, and flows that predict real phenomena — capacity effects, forgetting curves, automaticity — and generate reliable design guidance.", other:"Embodied & distributed cognition", otherView:"Cognition runs through bodies, gestures, tools, and rooms — the boundaries of the 'processor' are wrong, and thinking offloaded to a notebook or a partner is still thinking.", agree:"Both are right at their level: the pipeline predicts individual learning phenomena better than anything else available, AND smart classrooms deliberately distribute cognition onto anchor charts, partners, and tools. Use the model; don't worship the metaphor."}],
 research:{
  questions:["Where along the pipeline do specific learning failures occur, and how can instruction target the stage?","How does working-memory capacity interact with instructional design across development?","What builds automaticity most efficiently, and what does it free capacity for?","How do encoding conditions (elaboration, generation, spacing) shape long-term retention?"],
  methods:"The experimental memory tradition: controlled encoding-retrieval paradigms, delayed testing, working-memory span measures, dual-task studies, and cognitive task analysis applied to school content.",
  variables:"Attention allocation, working-memory load and span, encoding condition, retention across delays, retrieval success under varied cues, and speed/accuracy signatures of automaticity.",
  support:"Foundational and vast — the memory science underneath cognitive load, multimedia learning, retrieval practice, and reading models all lives here, replicated for seventy years. Honest limits: the multi-store model is a simplification (working memory proved multi-component, processing depth matters as much as location), the computer metaphor understates emotion, embodiment, and context — and the framework describes the machinery, leaving motivation to explain why anyone switches it on."},
 reflect:["Autopsy your last lesson that didn't stick: attention, capacity, encoding, or retrieval — where did it actually die?","What do your students believe studying is? Would the memory science endorse any of it — and who taught them those rituals?","Which tool skills in your subject still aren't automatic for your students, and what higher thinking is paying that tax daily?","What does your course do — structurally, on the calendar — to fight the forgetting curve between units?","If your principal audited your school's schedule as an attention economy, what would the findings be?"],
 constellation:{complements:["cogload","multimedia","desirable"],contrasts:["situated"],pairs:["svr","schema","transfer"]},
 origins:"The cognitive revolution of the 1950s–60s replaced the behaviorist black box with computational models of mind. Atkinson and Shiffrin's (1968) multi-store model and Miller's (1956) capacity findings established the architecture educational psychologists still use, refined by Baddeley's working memory model.",
 claims:["Learning is the encoding, storage, and retrieval of information across memory systems.","Working memory is severely limited (roughly 4–7 chunks); long-term memory is effectively unlimited.","Deeper, more elaborate processing produces more durable, retrievable memory.","Automaticity frees working-memory resources for higher-order thinking."],
 constructs:[
  {term:"Working memory", def:"The limited-capacity workspace where information is consciously held and manipulated (Baddeley: phonological loop, visuospatial sketchpad, central executive, episodic buffer)."},
  {term:"Chunking", def:"Grouping discrete elements into meaningful units to overcome capacity limits (Miller's 'magical number seven')."},
  {term:"Encoding & retrieval", def:"Processes that move information into long-term memory and reconstruct it later; retrieval strength differs from storage strength."},
  {term:"Schema", def:"Organized knowledge structure in long-term memory that guides perception, comprehension, and recall."},
  {term:"Automaticity", def:"Fluent, low-effort execution of well-practiced processes (e.g., decoding), freeing working memory."}],
 applications:["Break instruction into manageable chunks; use advance organizers.","Build fluency/automaticity in foundational skills (math facts, decoding) before complex tasks.","Use elaboration, dual coding, and meaningful connection to strengthen encoding.","Design assessments that practice retrieval, not just recognition."],
 critiques:["The computer metaphor understates embodiment, emotion, and social context.","Describes architecture more than pedagogy; needs bridging theories (e.g., cognitive load) for design.","Multi-store model is oversimplified; memory systems interact more dynamically than serial stages suggest."],
 related:["cogload","multimedia","desirable","schema"],
 refs:["Atkinson, R. C., & Shiffrin, R. M. (1968). Human memory: A proposed system and its control processes. In K. W. Spence & J. T. Spence (Eds.), The psychology of learning and motivation (Vol. 2, pp. 89–195). Academic Press.","Baddeley, A. D., & Hitch, G. (1974). Working memory. In G. H. Bower (Ed.), The psychology of learning and motivation (Vol. 8, pp. 47–89). Academic Press.","Miller, G. A. (1956). The magical number seven, plus or minus two. Psychological Review, 63(2), 81–97."],
 compare:{learner:"A processor with limited working memory and vast long-term memory", mechanism:"Encoding into and retrieval from long-term memory; schema construction", instructor:"Manager of attention and memory load; sequences and chunks input", knowledge:"Organized representations (schemas) stored in long-term memory", critique:"Mechanistic metaphor neglects culture, motivation, and embodiment"}
},
{
 id:"cogload", dis:true, name:"Cognitive Load Theory", discipline:"Learning Theory", depth:"deep",
 theorists:"John Sweller; Paul Ayres; Fred Paas (1980s–present)",
 tagline:"Instruction succeeds or fails by how it manages the limited capacity of working memory relative to the learner's existing schemas.",
 problem:"A teacher explains a procedure clearly, checks for nods, releases the class to practice — and problem one produces blank stares. Students who know every component skill drown when the skills combine. A beautifully rich, 'engaging' lesson yields nothing on Friday's check. Cognitive Load Theory exists to explain a maddening pattern: learners failing at tasks whose parts they demonstrably know. Its answer is that the bottleneck is not intelligence, effort, or even the content — it is the collision between limited working memory and how the material was presented.",
 asks:["Why do learners fail at whole tasks when they know all the parts?","How much of a task's difficulty comes from the content itself, and how much from how it is presented?","When does support help learning, and when does the same support start hurting it?","How should instruction change as learners move from novice toward expert?"],
 iftrue:{
  teachers:"Audit lessons for removable load before blaming students: split-attention layouts, redundant narration-plus-text, decorative complexity, and four new elements at once are design choices, not rigor. Front-load worked examples, fade to completion problems, then independent practice; teach one interacting element at a time; and reserve the beautiful messy application task for after schemas exist.",
  coaches:"Observe for load, not engagement theater. In a debrief, the question 'where in this lesson did working memory overflow, and for whom?' is more useful than 'were they on task?' Help teachers sequence element interactivity across a unit, and give them permission for 'less, but learned' over 'covered, but lost.'",
  leaders:"Load is an adoption criterion: choose curriculum materials with integrated visuals and coherent design, not the busiest page. And apply the theory to adults — an in-service that firehoses six initiatives is extraneous load at the organizational scale. Initiative overload is cognitive overload with a budget line.",
  researchers:"Manipulate one load source at a time; measure load directly (dual-task or validated self-report), not just outcomes; stratify by prior knowledge, because the expertise reversal effect will otherwise average your treatment into nothing."},
 reasoning:{
  notice:["Errors clustering mid-procedure — a signature of working-memory overflow rather than conceptual misunderstanding.","Students re-reading directions repeatedly or asking 'what do we do first?' minutes after instructions: the instructions exceeded storage.","Success on parts, collapse on the whole — element interactivity outrunning capacity.","WHO a given support helps: the same worked example that rescues novices can bore or impair your advanced students (expertise reversal)."],
  assume:["That the struggle is overload — rule out missing prior knowledge and motivation before redesigning materials.","That your expert judgment of 'simple' matches novice reality: experts chunk; novices count every element (the expert blind spot).","That the load you see is extraneous (removable by design) rather than intrinsic (manageable only by sequencing and prior knowledge)."],
  decide:["Replace initial problem-solving practice with worked examples and completion problems; fade support as accuracy rises.","Physically integrate explanations into diagrams; delete text that repeats narration; cut seductive details however charming.","Sequence content from low to high element interactivity, and pre-teach component skills to automaticity before combining them.","Differentiate supports by expertise: scaffold novices, strip supports for the advanced, and re-check who counts as which every unit."],
  avoid:["Adding decorative 'engagement' to already-hard content — interest bought with extraneous load is learning sold.","Assigning full-complexity authentic problems as the FIRST exposure for novices.","One-size-fits-all scaffolds that ignore expertise reversal.","Confusing overload with desirable difficulty: retrieval and spacing strengthen consolidation AFTER schemas exist; overload prevents schemas from forming at all. The difference decides whether hard is good."]},
 competing:[
  {scenario:"Students flounder during an open-ended inquiry task.", thisView:"Novice working memory is overwhelmed by unguided search; provide worked examples, direct guidance, and structure first — inquiry is for consolidating knowledge, not discovering it from scratch.", other:"Problem-Based Learning (Hmelo-Silver)", otherView:"The failure is scaffolding quality, not inquiry itself: well-designed PBL distributes load through hard and soft scaffolds while building motivation and self-directed learning that direct instruction never touches.", agree:"Both condemn unguided discovery for novices. The real debate is narrower than the rhetoric: how much structure, provided when, faded how fast."},
  {scenario:"Practice feels smooth and easy — and students forget it all by next month.", thisView:"Smooth acquisition suggests load was well managed; the design did its job for initial learning.", other:"Desirable Difficulties (Bjork)", otherView:"Fluent practice is the illusion of competence: without effortful retrieval, spacing, and interleaving, easy learning evaporates. Performance during practice was never the point.", agree:"Fully compatible once timing is explicit: manage load while schemas are being BUILT; introduce desirable difficulties to make them DURABLE. The expert move is knowing which phase you are in."}],
 research:{
  questions:["Which specific design changes (integration, redundancy removal, signaling, sequencing) improve learning, for whom, and by how much?","Where is the boundary of the expertise reversal effect in real classrooms?","Can germane load be measured independently, or is the three-part model two parts?","Do load-managed acquisition and desirable-difficulty consolidation combine additively?"],
  methods:"Randomized experiments comparing instructional variants — the field's signature method; dual-task paradigms and subjective load ratings (Paas scale); expertise-stratified and aptitude-treatment-interaction designs; increasingly, classroom-based replications of lab effects.",
  variables:"Learning and transfer performance, cognitive load ratings, time to mastery, error patterns, and prior-knowledge level as the universal moderator.",
  support:"Among the strongest experimental literatures in educational psychology: the worked-example, split-attention, redundancy, and modality effects have replicated for decades across domains. Honest limits: load measurement remains contested, germane load was folded back into the model after falsifiability critiques, and classroom effects run smaller than laboratory ones."},
 reflect:["Take your next lesson plan and count what a novice must hold in mind simultaneously at its hardest moment. What is that number — honestly?","Which supports in your classroom exist because students need them, and which exist because they have always been there? Who has outgrown what?","When your students struggled last week, was it overload, missing prior knowledge, or motivation — and what evidence distinguishes those for you?","What is one 'engaging' element you cherish that might be costing more working memory than it earns?","Where in your unit does managed, supported acquisition end and deliberately effortful consolidation begin?"],
 constellation:{builds:["infoprocessing"],complements:["multimedia","desirable"],contrasts:["pbl","discovery","math_rme"],pairs:["svr","transfer"]},
 origins:"Sweller's studies of problem solving in the 1980s showed that conventional problem practice can overload working memory and impede schema acquisition. CLT grew into one of the most researched instructional-design frameworks, generating effects such as worked examples, split-attention, and expertise reversal.",
 claims:["Working memory limits are the central bottleneck of instruction; long-term memory schemas circumvent them.","Total load = intrinsic (task complexity relative to expertise) + extraneous (poor design) + germane (schema-building effort).","Reducing extraneous load and managing intrinsic load frees resources for learning.","Effective techniques change with expertise: supports that help novices can hinder experts (expertise reversal effect)."],
 constructs:[
  {term:"Intrinsic load", def:"Load from element interactivity inherent to the material, relative to prior knowledge."},
  {term:"Extraneous load", def:"Load imposed by suboptimal instructional design (e.g., split attention, redundancy)."},
  {term:"Germane load", def:"Effort devoted to schema construction and automation — the productive load."},
  {term:"Worked-example effect", def:"Novices learn more from studying worked solutions than from unsupported problem solving."},
  {term:"Expertise reversal effect", def:"Guidance beneficial for novices becomes redundant or harmful for advanced learners."},
  {term:"Split-attention effect", def:"Learning is impaired when learners must mentally integrate spatially or temporally separated sources."}],
 applications:["Use worked examples and completion problems early; fade to independent practice.","Integrate text with diagrams; eliminate redundant, decorative, or split-source material.","Sequence from low to high element interactivity; pre-teach component skills.","Differentiate scaffolds by learner expertise rather than one-size-fits-all supports."],
 critiques:["Germane load has been criticized as unfalsifiable and was later folded into intrinsic load.","Measuring load types independently remains difficult.","Focuses on efficiency of acquisition, saying little about motivation, identity, or culture; can favor direct instruction over inquiry in contested ways (Kirschner, Sweller, & Clark, 2006 debate)."],
 related:["infoprocessing","multimedia","desirable","math_cra"],
 refs:["Sweller, J. (1988). Cognitive load during problem solving: Effects on learning. Cognitive Science, 12(2), 257–285.","Sweller, J., Ayres, P., & Kalyuga, S. (2011). Cognitive load theory. Springer.","Kirschner, P. A., Sweller, J., & Clark, R. E. (2006). Why minimal guidance during instruction does not work. Educational Psychologist, 41(2), 75–86."],
 compare:{learner:"A novice-to-expert whose working memory is the bottleneck", mechanism:"Schema acquisition and automation when load is well managed", instructor:"Instructional designer who minimizes extraneous and manages intrinsic load", knowledge:"Domain schemas held in long-term memory", critique:"Efficiency focus can undervalue inquiry, motivation, and culture"}
},
{
 id:"piaget", name:"Cognitive Constructivism", discipline:"Learning Theory", depth:"deep",
 theorists:"Jean Piaget (1896–1980)",
 tagline:"Children actively construct knowledge through interaction with the world, progressing through qualitatively distinct stages of thought.",
 problem:"A child insists the taller glass holds more water — every child that age insists, with total conviction, using the same reasoning. A class recites the rule perfectly on Tuesday and applies it nowhere by Thursday: words without the concept underneath, what Piaget called empty verbalism. Children's wrong answers turn out to be systematic, coherent, and shared — which means they aren't carelessness; they're evidence of how thinking itself is built. Piaget's theory exists to explain that construction: why children reason differently in kind, not just amount, and why understanding can only be built by the learner, never installed by the teller.",
 asks:["How does thinking itself develop — where do logical structures come from?","Why are children's errors systematic and shared rather than random?","What drives conceptual growth, and what merely decorates it?","What is the role of the learner's own action in building knowledge?"],
 iftrue:{
  teachers:"Interview before you remediate: 'how do you know?' is the most Piagetian sentence in teaching, and the reasoning behind a wrong answer tells you what structure the student is actually using. Expect systematic misconceptions and treat them as data. Sequence concrete to abstract with the links made explicit — manipulatives that never connect to symbols stay toys — and engineer disequilibrium on purpose: the discrepant event that breaks a confident wrong scheme is worth ten explanations.",
  coaches:"Teach teachers the clinical interview as a coaching tool: five minutes of probing one student's reasoning changes how a teacher sees the whole class. Help teams analyze error patterns across a grade — same wrong answer everywhere means structure, not effort. And balance the readiness sensitivity Piaget brings with the Vygotskian corrective: honor development without waiting passively for it.",
  leaders:"Developmental appropriateness is a curriculum-adoption criterion, most urgently in early childhood: play IS cognitive work in K–2, and pushing formal abstraction ever earlier without conceptual foundations buys test-adjacent verbalism at the price of understanding. Protect the concrete years from becoming worksheet years.",
  researchers:"The clinical method remains the gift: semi-structured interviews around tasks, following the child's reasoning wherever it goes. Modern designs go microgenetic — dense observation during change itself — and domain-specific, since development turned out to move at different speeds in different territories."},
 reasoning:{
  notice:["Systematic wrong answers shared across students — the signature of a developmental structure at work, not thirty coincidences of carelessness.","Self-correction in real time: a student pausing mid-answer as two schemes collide is equilibration made visible; protect that moment.","Reliance on appearance over logic (the taller glass, the spread-out row) marking where conservation hasn't consolidated.","Whether manipulatives are connecting to symbols or just occupying hands — the bridge is the lesson."],
  assume:["That age equals stage: the variation within any classroom spans years, and the stages are more domain-specific than the labels suggest.","That hands-on automatically builds concepts — action without reflection is just activity; the abstraction has to be drawn out of the doing.","That told equals learned: a recited rule is assimilation's costume, and the application task is where you find out if accommodation happened."],
  decide:["Diagnose by interview: probe three students' reasoning before reteaching anything to thirty.","Design discrepant events that make the current scheme fail publicly and safely — cognitive conflict is the engine, discomfort the fuel gauge.","Run concrete → representational → abstract sequences with explicit linking moves at each handoff.","Give construction time: the concept assembled slowly by the learner outlives the rule delivered quickly by the teacher."],
  avoid:["Verbal rules without conceptual foundations — fluent recitation is the most convincing costume misunderstanding owns.","Rushing formal abstraction because the pacing guide says so.","Dismissing systematic errors as laziness; they're your best diagnostic data.","Waiting passively for readiness — the Vygotskian corrective stands: good instruction can pull development, if it meets the structure where it is."]},
 competing:[
  {scenario:"Students recite the rule perfectly and fail every novel application.", thisView:"Assimilation without accommodation: the words were absorbed into existing structures that never reorganized. No structure, no transfer — the concept must be constructed through action and conflict, not received.", other:"Cognitive Load Theory (Sweller)", otherView:"The schema was simply never completed: insufficient worked examples, overloaded practice, missing prerequisites. Build it explicitly and efficiently — construction doesn't require discovery.", agree:"Both agree recitation isn't understanding and robust mental structures are the goal. The dispute is the route — engineered conflict and construction versus explicit, load-managed instruction — and the honest answer is that each route wins for different content and expertise levels."},
  {scenario:"Should instruction wait for readiness or pull development forward?", thisView:"Development leads learning: instruction that outruns the child's operational structures produces empty verbalism. Readiness is real, and respecting it is rigor, not softness.", other:"Sociocultural Theory (Vygotsky)", otherView:"Learning leads development: what the child does with assistance today becomes independent function tomorrow. Waiting for readiness forfeits the very instruction that creates it.", agree:"Both are constructivists who reject passive reception. A century later the field's synthesis is roughly: respect the structure (Piaget) while teaching into its leading edge with support (Vygotsky) — assess what's built AND what's buildable."}],
 research:{
  questions:["How domain-general versus domain-specific is cognitive development?","What experiences actually drive structural change — and can training accelerate it durably?","How do children's systematic misconceptions form, persist, and yield?","What do infants and young children know earlier than classic tasks suggested?"],
  methods:"The clinical interview (semi-structured probing around tasks) and the classic conservation and reasoning tasks; modern work adds microgenetic designs capturing change as it happens, violation-of-expectation infant paradigms, and cross-cultural comparisons.",
  variables:"Task performance with justifications (the reasoning is the data), consistency across domains, response to training, and age-by-task interaction patterns.",
  support:"A monumental descriptive legacy: the phenomena — conservation errors, egocentrism, the concrete-to-formal arc — replicate everywhere, and constructivism became the field's default epistemology. The revisions are equally established: infants know far more than the theory allowed, stages are domain-specific and trainable at the margins, culture and instruction matter more than Piaget granted, and equilibration itself has proven hard to test directly. The observations outlived the mechanism."},
 reflect:["When did you last ask a student 'how do you know?' and follow the answer for three more questions? What structure did you find?","What systematic wrong answer does your class share right now — and what would a discrepant event that breaks it look like?","Where in your teaching do manipulatives or examples fail to connect to the abstractions they were meant to build?","Which topic do you currently teach as a verbal rule that your students' development suggests should still be a construction project?","Where do you wait for readiness that instruction could be creating — and where do you push abstraction that structure can't yet hold?"],
 constellation:{complements:["conceptualchange","math_cra","constructionism"],contrasts:["vygotsky","behaviorism"],pairs:["discovery","math_rme"]},
 origins:"Piaget's genetic epistemology asked how knowledge itself develops. Decades of clinical observation of children (including his own) yielded a stage theory of cognitive development and the equilibration model of how understanding changes — foundational to constructivist education.",
 claims:["Learners construct knowledge by acting on the world, not by passively receiving it.","Cognitive development proceeds through stages: sensorimotor, preoperational, concrete operational, formal operational.","New experience is assimilated into existing schemes or forces accommodation of those schemes.","Disequilibrium — cognitive conflict — is the engine of conceptual growth."],
 constructs:[
  {term:"Schema (scheme)", def:"An organized pattern of thought or action used to interpret experience."},
  {term:"Assimilation", def:"Fitting new information into existing schemes."},
  {term:"Accommodation", def:"Modifying schemes when new information will not fit."},
  {term:"Equilibration", def:"The self-regulating balance of assimilation and accommodation that drives development."},
  {term:"Conservation", def:"Understanding that quantity remains constant despite changes in appearance — a hallmark of concrete operations."},
  {term:"Formal operations", def:"Abstract, hypothetical-deductive reasoning emerging in adolescence."}],
 applications:["Developmentally appropriate practice: match tasks to learners' operational level.","Discovery and inquiry approaches that provoke cognitive conflict.","Use of concrete manipulatives before abstract symbols in math and science.","Readiness considerations in curriculum sequencing."],
 critiques:["Underestimated young children's competence and overestimated stage universality.","Neglects social and cultural mediation of learning (Vygotsky's central objection).","Stage transitions are more gradual and domain-specific than the theory implies."],
 related:["vygotsky","conceptualchange","schema","math_rme"],
 refs:["Piaget, J. (1952). The origins of intelligence in children (M. Cook, Trans.). International Universities Press.","Piaget, J. (1970). Genetic epistemology (E. Duckworth, Trans.). Columbia University Press.","Inhelder, B., & Piaget, J. (1958). The growth of logical thinking from childhood to adolescence. Basic Books."],
 compare:{learner:"An active little scientist constructing understanding through action", mechanism:"Equilibration: assimilation and accommodation resolving cognitive conflict", instructor:"Provider of rich environments and provocations matched to development", knowledge:"Individually constructed structures that develop in stages", critique:"Understates social/cultural mediation and children's early competence"}
},
{
 id:"vygotsky", dis:true, name:"Sociocultural Theory", discipline:"Learning Theory", depth:"deep",
 theorists:"Lev Vygotsky (1896–1934); elaborated by James Wertsch, Barbara Rogoff",
 tagline:"Higher mental functions originate in social interaction and are mediated by cultural tools — above all, language.",
 problem:"Every teacher has seen it: a student who cannot do the task alone does it beautifully with a well-timed prompt — and a student who explained an idea confidently in discussion loses it completely on the solo assessment. Traditional views treated these as measurement noise around a fixed ability. Vygotsky treated them as the main event. The theory exists to explain where higher thinking comes from in the first place — and why what a learner can do with help today is the best predictor of what they will do alone tomorrow.",
 asks:["Where do higher mental functions — reasoning, planning, voluntary attention — actually come from?","Why can learners do more with a knowledgeable partner than alone, and what does that gap mean?","What role do language, tools, and cultural practices play in shaping thought itself?","What should assessment measure: independent performance, or assisted potential?"],
 iftrue:{
  teachers:"Treat structured interaction as the mechanism of learning, not a management problem around it. Model thinking aloud so invisible reasoning becomes visible and imitable; teach at the edge of what students can do with support, then deliberately fade that support; design academic talk (roles, protocols, sentence frames) as seriously as you design tasks, because the talk is where the learning happens.",
  coaches:"Watch lessons for who is doing the cognitive work. Help teachers plan scaffolds with removal dates attached — a scaffold without a fade plan is a permanent crutch. Use co-planning and co-teaching as ZPD structures for adults: teachers, too, internalize practices first experienced alongside someone more expert.",
  leaders:"Schedule and staff for mediated instruction: small-group structures, intervention blocks, and peer collaboration are not luxuries in this view — they are the delivery system. Evaluate classrooms by the quality of interaction, not by silence. And recognize PLCs for what they can be: a zone of proximal development for teachers, which only works with genuine expertise in the room.",
  researchers:"Measure assisted performance, not only independent performance — dynamic assessment (test–teach–retest) operationalizes the ZPD. Analyze classroom discourse as data: uptake, contingency of support, and shifts in who holds the thinking over time are the observable traces of internalization."},
 reasoning:{
  notice:["Students who succeed with one prompt but not alone — that is the ZPD announcing itself, not evidence of failure.","Who initiates and who sustains the thinking in classroom exchanges: teacher-dominated recitation and genuine dialogue look similar from the hallway.","Private self-talk during hard tasks — learners talking themselves through a problem are internalizing regulation, right on schedule.","The gap between a student's discussion performance and solo written performance: it maps what still needs mediation."],
  assume:["That the support offered is actually contingent — calibrated to the learner's current attempt — rather than doing the thinking for them.","That the student truly cannot do it alone; sometimes learned helplessness or task framing, not capability, produces the request for help.","That peer partners actually hold the needed expertise: collaboration without a more knowledgeable other (person or well-designed tool) can pool confusion."],
  decide:["Plan the fade before you plan the scaffold: decide what support disappears next week, and tell students the plan.","Structure academic talk deliberately — assigned roles, talk moves, rehearsal before writing — rather than hoping discussion happens.","Use dynamic assessment when a score seems wrong: teach briefly inside the assessment and see what the learner does with it.","Pair and group by what expertise the task needs, not only by friendship or convenience."],
  avoid:["Scaffolds that never fade — permanent sentence starters and forever-graphic-organizers produce dependence, not development.","Mistaking quiet, independent seatwork for rigor; in this view, silence during initial learning is often the absence of the mechanism.","Grading only solo performance while teaching collaboratively — the assessment contradicts the pedagogy and hides growth.","'Helping' that removes the productive struggle: taking the pencil, finishing the sentence, answering your own question."]},
 competing:[
  {scenario:"A student solves problems in the small group but fails the individual quiz.", thisView:"The group performance is real and developmentally meaningful — assisted performance today predicts independent performance tomorrow, provided support fades deliberately.", other:"Cognitive Load Theory (Sweller)", otherView:"Group success may be borrowed cognition: if teammates carried the working-memory burden, the student built little schema of their own. Check what THIS learner processed, not what the group produced.", agree:"Both agree support must be calibrated and eventually removed, and that independent competence is the end goal — they disagree about how much learning the assisted phase itself produces."},
  {scenario:"Should instruction wait for readiness or pull students forward?", thisView:"Learning leads development: good teaching aims just beyond current independent ability and drags development along behind it.", other:"Cognitive Constructivism (Piaget)", otherView:"Development leads learning: instruction that outruns the learner's operational structures produces empty verbalism — words without concepts. Readiness matters.", agree:"Both are constructivist to the core: the learner's activity builds understanding, and passive reception builds little. The dispute is over timing and the engine of change."}],
 research:{
  questions:["How does the contingency of teacher (or tutor) support affect learning and independence?","What discourse patterns — uptake, dialogic talk, revoicing — predict achievement gains?","Does dynamic assessment identify learning potential that static tests miss, and for whom?","How do collaborative structures change participation over time, and does changed participation predict changed individual performance?"],
  methods:"Discourse and interaction analysis of classroom talk; microgenetic studies tracking change during learning; dynamic assessment designs (test–teach–retest); sociocultural case studies and design-based research following participation across weeks or months.",
  variables:"Contingency of support (did help adjust to the learner's response?), assisted-versus-independent performance gap, quality and distribution of student talk, uptake of ideas across turns, and shifts in participation roles over time.",
  support:"Enormous descriptive and qualitative support, and specific claims now have quantitative footing: scaffolding contingency predicts outcomes (van de Pol's reviews), dialogic-talk interventions show achievement effects, and dynamic assessment shows incremental validity. The honest weakness: the ZPD itself is hard to operationalize precisely, so the theory's center remains more framework than measured variable."},
 reflect:["Think of your most recent lesson: at any given moment, who was doing the cognitive work — and how do you know?","Name one scaffold currently living in your classroom. What is its fade date? What would students need to be able to do for it to disappear?","When a student fails an assessment, how would you find out what they can do WITH support before deciding what they cannot do at all?","Where in your week do students hear expert thinking made audible — anyone's reasoning process, out loud, mistakes included?","If talk is where learning happens, what does the talk in your classroom actually sound like on an ordinary Tuesday?"],
 constellation:{complements:["situated","funds","crp"],contrasts:["piaget","cogload"],pairs:["socialcognitive","wtl","pbl"]},
 origins:"Working in post-revolutionary Russia, Vygotsky argued that development cannot be separated from its social and historical context. Suppressed for decades, his work reached the West in the 1960s–70s and reshaped literacy, teaching, and learning research.",
 claims:["Every higher psychological function appears first between people (interpsychological), then within the child (intrapsychological).","Learning leads development: instruction in the zone of proximal development pulls development forward.","Cultural tools and signs — especially language — mediate and transform thinking.","Thought and language merge developmentally; inner speech becomes the medium of self-regulation."],
 constructs:[
  {term:"Zone of proximal development (ZPD)", def:"The distance between what a learner can do alone and what they can do with guidance from a more knowledgeable other."},
  {term:"Mediation", def:"Thinking is shaped through cultural tools, signs, and symbol systems."},
  {term:"More knowledgeable other (MKO)", def:"A teacher, peer, or tool that supports performance within the ZPD."},
  {term:"Internalization", def:"The transformation of social, external activity into internal mental processes."},
  {term:"Private/inner speech", def:"Self-directed talk that regulates behavior and becomes internalized verbal thought."},
  {term:"Scaffolding", def:"Temporary, contingent support withdrawn as competence grows (term from Wood, Bruner, & Ross, 1976, building on Vygotsky)."}],
 applications:["Guided participation, reciprocal teaching, and instructional conversations.","Dynamic assessment: measuring assisted performance, not just independent performance.","Collaborative learning structured so peers mediate one another's thinking.","Framing dissertation work: sociocultural lenses for classroom discourse, coaching, and mentoring studies."],
 critiques:["Vygotsky died at 37; the theory is programmatic and unevenly specified.","ZPD is often trivialized in practice as generic 'help'.","Less attention to individual biological constraints and to power relations within interactions."],
 related:["piaget","situated","socialcognitive","funds","writing_sociocultural"],
 refs:["Vygotsky, L. S. (1978). Mind in society: The development of higher psychological processes (M. Cole, V. John-Steiner, S. Scribner, & E. Souberman, Eds.). Harvard University Press.","Vygotsky, L. S. (1986). Thought and language (A. Kozulin, Trans.). MIT Press.","Wood, D., Bruner, J. S., & Ross, G. (1976). The role of tutoring in problem solving. Journal of Child Psychology and Psychiatry, 17(2), 89–100."],
 compare:{learner:"A social being whose thinking is formed in cultural interaction", mechanism:"Internalization of socially mediated activity within the ZPD", instructor:"More knowledgeable other who scaffolds within the ZPD", knowledge:"Culturally and historically constituted; carried by tools and language", critique:"Programmatic and incomplete; ZPD often applied loosely"}
},
{
 id:"socialcognitive", dis:true, name:"Social Cognitive Theory", discipline:"Learning Theory", depth:"deep",
 theorists:"Albert Bandura (1925–2021)",
 tagline:"People learn by observing others and regulate their own behavior through beliefs about their capabilities — self-efficacy.",
 problem:"Students arrive having learned a thousand things nobody explicitly taught them — including some you wish they hadn't — because they watch. Meanwhile a demonstrably capable student won't attempt the essay: not can't, won't, because somewhere she concluded 'I'm not someone who can do this.' And the teacher at the front narrates content fluently while keeping the actual thinking — the false starts, the strategy choices, the recovery from confusion — completely hidden. Social cognitive theory exists to explain the watching and the believing: how observation becomes capability, and why beliefs about capability predict behavior almost as strongly as capability itself.",
 asks:["How do people learn from models — and what turns watching into doing?","Why does self-efficacy predict effort and persistence beyond measured ability?","Where do capability beliefs come from, and which sources move them most?","How do people steer their own behavior — and how is that steering learned?"],
 iftrue:{
  teachers:"Model deliberately, thinking aloud — and prefer coping models to mastery models: watching someone struggle and recover teaches more than watching flawlessness, because it shows the strategies AND makes success look reachable. Build efficacy the way the evidence says it's built: structured mastery experiences — real success on genuinely challenging work — beats praise by a mile. Use peer models students see themselves in, and credit strategies in your feedback so success is replicable rather than magical.",
  coaches:"Teacher efficacy is your working material, and it obeys the same source hierarchy: one authentic mastery experience in a coaching cycle outweighs a semester of pep talks. Design cycles so the teacher succeeds at something hard and knows exactly why. Video of similar colleagues succeeding is vicarious gold; persuasion works only when credible and paired with real support.",
  leaders:"Collective efficacy — a faculty's shared belief it can move its students — correlates with achievement as strongly as almost anything measurable, and it is built, not announced: visible team wins, attributed to the team's actions, publicly. Be the coping model yourself: a leader who exposes their own strategy-and-recovery under difficulty licenses the whole building to learn out loud.",
  researchers:"Measure efficacy task-specifically or lose the prediction — global confidence scales are noise by comparison. The four sources invite intervention designs (which source, which dose?), reciprocal determinism demands longitudinal cross-lagged models, and collective efficacy's causal direction — belief to achievement or achievement to belief — remains the field's productive fight."},
 reasoning:{
  notice:["Who your students watch and imitate — the actual models operating in your room, sanctioned or not.","Efficacy talk in the wild: 'I can't do essays' is a task-specific belief with a history; find the failures that wrote it.","Avoidance as data: students protect themselves from tasks they expect to fail publicly; the dodge maps the doubt.","Whether your demonstrations expose reasoning or only results — answers teach content; visible thinking teaches capability."],
  assume:["That confidence equals efficacy: the swagger is global, the belief that matters is task-specific and can be low underneath.","That watching equals learning — observation requires attention, retention, production practice, and motivation; the middle two are where classroom modeling usually leaks.","That failure always lowers efficacy — it depends on the attribution; strategy-blamed failure can leave efficacy intact (the attribution entry is this theory's neighbor for a reason)."],
  decide:["Install think-aloud routines for every new skill — including the deliberate coping version where you err and recover.","Engineer graduated challenge with visible wins, and narrate the causal link: 'you did X, which is why Y worked.'","Deploy similar-peer models strategically; similarity is what converts observation into 'so I could too.'","Use persuasion sparingly and credibly, always attached to actual support — belief without means curdles fast."],
  avoid:["Flawless-expert-only modeling that makes competence look like sorcery.","Empty praise inflating nothing — efficacy runs on evidence, and students audit ruthlessly.","Public failure formats that spend a year of efficacy in a minute.","Assuming a skill demonstrated once is learnable without production practice — watching was step one of four."]},
 competing:[
  {scenario:"A capable student simply won't attempt the work.", thisView:"Low task-specific efficacy: expectation of failure makes avoidance rational self-protection. Rebuild through the sources — mastery experiences first, similar models second.", other:"Expectancy-Value Theory (Eccles & Wigfield)", otherView:"Run the full choice equation: expectancy may be fine while value is absent or cost too high — 'I could, but why would I?' is a different diagnosis demanding value-building, not efficacy repair.", agree:"Expectancy-value's 'can I succeed?' term is essentially self-efficacy wearing a different name — the theories share a chamber of the engine. The joint diagnostic: check the can-belief AND the worth-belief before intervening on either."},
  {scenario:"A behavior is spreading through the class without any direct teaching.", thisView:"Vicarious learning: students watched the model, watched the consequences, abstracted the rule. The classroom is a broadcast system whether or not you're programming it.", other:"Behaviorism (Skinner)", otherView:"Look for the direct contingencies: each imitator is being reinforced individually — attention, laughter, status. No cognitive machinery needed beyond the reinforcement operating on each actor.", agree:"Bandura's Bobo doll findings forced the synthesis: observation transmits the behavior, consequences govern its performance — vicarious reinforcement is literally both theories in one mechanism. Manage the models AND the payoffs."}],
 research:{
  questions:["Which efficacy sources move beliefs most, for whom, at what dose?","Does efficacy cause achievement, follow it, or spiral with it — and same for collective teacher efficacy?","What modeling features (coping vs. mastery, similarity, think-aloud density) drive observational learning?","How do self-efficacy and self-regulation develop together?"],
  methods:"The classic modeling experiments (Bobo doll lineage), task-specific efficacy scales paired with performance measures, longitudinal cross-lagged panel designs for reciprocal determinism, and intervention studies manipulating the four sources.",
  variables:"Task-specific efficacy ratings, choice/persistence/effort measures, performance, model characteristics, and attributional mediators.",
  support:"Massive: self-efficacy is among educational psychology's most reliable predictors, meta-analyzed across domains, with the source hierarchy (mastery first) repeatedly confirmed; teacher and collective efficacy findings are strong correlationally. Honest limits: the theory's breadth strains falsifiability, efficacy is self-reported, collective efficacy's causal arrow is genuinely contested, and popularized versions ('top influence' rankings) outrun what the underlying studies can carry."},
 reflect:["When did your students last watch you struggle with something real and recover? What did your fluency-only performances teach them about what ability looks like?","Name one student whose 'won't' you've been reading as 'can't' — or vice versa. What task-specific belief is actually operating, and what wrote it?","What was the last mastery experience you deliberately engineered — success on something genuinely hard, with the cause made visible? For a student? For a colleague?","Who are the visible models in your classroom's broadcast system right now, and what are they teaching?","What does your faculty collectively believe it can and cannot accomplish with its students — and what win, attributed correctly, would move that belief?"],
 constellation:{builds:["behaviorism"],complements:["srl","mindset","attribution","sdt"],pairs:["vygotsky","ericsson"]},
 origins:"Bandura's Bobo doll experiments (1961–63) showed children learn aggression through observation without reinforcement, breaking behaviorism's grip. The theory matured from 'social learning' into social cognitive theory, with self-efficacy (1977) and human agency at its center.",
 claims:["Learning occurs vicariously through observing models, their behavior, and its consequences.","Behavior, personal factors, and environment influence one another reciprocally (triadic reciprocal determinism).","Self-efficacy beliefs strongly predict effort, persistence, and achievement.","People exercise agency through forethought, self-regulation, and self-reflection."],
 constructs:[
  {term:"Observational learning", def:"Learning via attention, retention, production, and motivation while watching models."},
  {term:"Self-efficacy", def:"Belief in one's capability to organize and execute the actions required for a task; sources: mastery experience, vicarious experience, social persuasion, physiological states."},
  {term:"Triadic reciprocal determinism", def:"Mutual causation among behavior, personal cognition/affect, and environment."},
  {term:"Modeling", def:"Live, symbolic, or verbal demonstration from which observers abstract rules of behavior."},
  {term:"Outcome expectations", def:"Beliefs about the consequences of actions, distinct from efficacy beliefs."},
  {term:"Vicarious reinforcement", def:"Seeing a model rewarded or punished alters the observer's behavior."}],
 applications:["Teacher and peer modeling with think-alouds; worked demonstrations.","Building learner self-efficacy through structured mastery experiences and credible feedback.","Teacher self-efficacy research — a major EdD literature in school improvement.","Media and mentorship effects; symbolic modeling in professional development."],
 critiques:["So comprehensive it can be hard to falsify.","Underplays unconscious, affective, and cultural-structural determinants.","Self-efficacy measures are task-specific, complicating generalization."],
 related:["behaviorism","vygotsky","srl","mindset","sdt"],
 refs:["Bandura, A. (1977). Self-efficacy: Toward a unifying theory of behavioral change. Psychological Review, 84(2), 191–215.","Bandura, A. (1986). Social foundations of thought and action: A social cognitive theory. Prentice-Hall.","Bandura, A. (1997). Self-efficacy: The exercise of control. W. H. Freeman."],
 compare:{learner:"An agentic observer who models others and appraises own capability", mechanism:"Observational learning plus self-regulatory and efficacy processes", instructor:"Model and efficacy-builder; demonstrates and persuades credibly", knowledge:"Cognitive representations abstracted from observed and enacted behavior", critique:"Breadth limits falsifiability; culture and affect underspecified"}
},
{
 id:"situated", name:"Situated Learning & Communities of Practice", discipline:"Learning Theory", depth:"deep",
 theorists:"Jean Lave & Étienne Wenger (1991); John Seely Brown, Allan Collins, Paul Duguid",
 tagline:"Learning is not the transmission of abstract knowledge but increasing participation in communities of practice — knowing is doing in context.",
 problem:"A student aces the safety test and then handles the equipment dangerously. A new teacher arrives with excellent methods coursework and flounders until colleagues teach her 'how we actually do it here.' Workshop learning stays at the workshop. The knowledge was all delivered — so where did it go? Situated learning arose from watching how people actually become competent outside classrooms — tailors, midwives, navigators — and noticing that they learn by doing real work at the edge of a community, not by receiving decontextualized content. The theory exists to explain why knowledge separated from practice so often goes inert, and what the apprenticeship pattern knows that schooling forgot.",
 asks:["What if learning is fundamentally participation in practice rather than acquisition of content?","How do newcomers actually become full members of a community of practice — and what speeds or blocks the journey?","Why does knowledge learned out of context so often fail to appear in context?","What does identity — becoming a certain kind of person — have to do with learning?"],
 iftrue:{
  teachers:"Give students legitimate roles in real work, not just rehearsal for later: authentic audiences, consequential tasks, apprentice-like responsibilities that grow. Make your own expert practice visible — think aloud, show drafts, expose the messy middle — because in this view students learn what they can watch and gradually take over. And notice what identity your classroom invites: every routine tells students what kind of person does this subject, and whether they could be one.",
  coaches:"Coaching is legitimate peripheral participation engineered for adults: co-plan, co-teach, then hand over gradually — the trajectory from watching to owning is the design. Build teacher communities around genuine joint work (real student work, real problems, shared artifacts), because contrived PLC agendas produce contrived participation. And mind what the community actually practices: newcomer teachers learn the building's real norms in the workroom, not the handbook.",
  leaders:"Design induction as a trajectory, not an orientation packet: what legitimate, low-stakes contributions do first-year teachers make, with access to whose expertise, en route to what full participation? Audit your PLCs for the three ingredients — mutual engagement, joint enterprise, shared repertoire — because meeting on a schedule is none of them. And remember communities transmit dysfunction as efficiently as excellence; the expertise actually present in the room is the ceiling on what gets reproduced.",
  researchers:"Take changing participation as the unit of analysis: who does what, with whom, with what artifacts, over time. Ethnography and longitudinal case study are the home methods; discourse and social-network analysis operationalize trajectories. Resist outcome-only designs — this theory's phenomena live in the process data."},
 reasoning:{
  notice:["The gap between test performance and performance in authentic activity — the theory's founding observation, visible in any classroom.","Who newcomers actually watch and copy: that is the building's real curriculum, whatever the handbook says.","Whether students hold any legitimate role in real work, or only ever rehearse for a 'later' that never arrives in school.","The identity messages of your routines: who talks, who is named as capable, what kind of person your subject appears to belong to."],
  assume:["That participation automatically teaches the right things — communities reproduce bad practice with the same efficiency as good.","That authenticity is always the answer: some abstraction and decomposed practice is efficient (the transfer and cognitive-load traditions have receipts), and 'real-world' framing can't substitute for foundations.","That peripheral means passive — legitimate peripherality is active, sanctioned, low-risk contribution, not spectating."],
  decide:["Create real roles with real stakes scaled to competence — the classroom analog of the apprentice's first small, consequential tasks.","Deploy cognitive apprenticeship deliberately: model, coach, scaffold, then fade toward articulation and independent exploration.","Connect coursework to the discipline's actual community — real scientists' practices, real audiences for writing, real users for designs.","Structure mentoring and induction as graduated responsibility with guaranteed access to expert practice."],
  avoid:["Simulated busy-ness — 'hands-on' activity with no legitimate stake in anything teaches mostly compliance.","Leaving newcomers peripheral indefinitely: access to fuller participation is the whole point, and blocked trajectories breed the disengagement they're blamed for.","Blaming individuals ('they should ask more questions') when the access structures — time with experts, permission to try — are missing.","Romanticizing immersion when a novice needs explicit, decomposed instruction; participation and direct teaching are allies, not rivals."]},
 competing:[
  {scenario:"Students can't use school knowledge outside school.", thisView:"There is no mystery: 'school knowledge' was a practice of its own — answering questions in classrooms — and students learned exactly that practice. Competence is bound to the activity system in which it develops; change the practice, not just the content.", other:"Transfer of Learning (Perkins & Salomon)", otherView:"Knowledge can travel — but only when instruction abstracts the principle (bridging) and practices it near the target contexts (hugging). The failure is a design failure, not proof that portable knowledge is a myth.", agree:"Both demolish the default assumption that application happens automatically. Their prescriptions even meet in the middle: authentic contexts plus explicit abstraction beats either alone."},
  {scenario:"A new teacher with strong coursework is drowning in her first year.", thisView:"Teaching is learned in practice: she needs legitimate peripheral participation — co-teaching, observation of experts, gradually increasing responsibility inside a functioning community.", other:"Cognitive Load Theory (Sweller)", otherView:"Full-immersion novicehood is overload by design: a first-year teacher juggling everything at once needs decomposed skills, worked examples of routines, and reduced complexity before integration.", agree:"Both condemn sink-or-swim induction. Residency models are the practical synthesis: authentic participation with deliberately managed complexity and expert support — apprenticeship with load control."}],
 research:{
  questions:["How does participation change over time, and what access structures accelerate newcomer trajectories?","What makes communities of practice effective vehicles for professional learning — and when do they entrench the status quo?","How do identity trajectories relate to persistence and achievement in a discipline?","Which elements of cognitive apprenticeship carry the learning effects?"],
  methods:"Ethnography and longitudinal case study built the theory; current work adds discourse analysis, social-network analysis of participation, and design research on apprenticeship-structured instruction and induction models.",
  variables:"Participation patterns (roles, contributions, centrality over time), access to expert practice, identity measures, artifacts produced, and — in professional settings — practice change and retention.",
  support:"A rich descriptive foundation with targeted experimental support: cognitive-apprenticeship components (modeling, scaffolding, articulation) test well, and community-based PD shows practice change when groups have genuine expertise and joint work. Honest limits: the strong anti-abstraction claims did not survive scrutiny (the Anderson–Reder–Simon exchange), and 'community of practice' is now used so loosely that many studies measure meetings, not communities."},
 reflect:["What do students in your class have a legitimate, consequential role in — anything at all — or is everything rehearsal?","Trace your own professional learning honestly: how much came from courses, and how much from watching, copying, and gradually doing alongside colleagues? What does that imply for how you structure others' learning?","Who are the 'old-timers' your newest colleagues actually learn from — and is that the curriculum you'd choose?","What identity does your classroom offer students who don't yet see themselves in your subject — and what would widen the doorway?","Where in your context is someone stuck at the periphery — sanctioned to watch but never granted the next level of participation? What blocks the trajectory?"],
 constellation:{builds:["vygotsky","dewey"],complements:["kolb","funds","agency"],contrasts:["cogload","transfer"],pairs:["knowles","schon","dbr"]},
 origins:"Anthropological studies of apprenticeship (tailors, midwives, meat cutters) led Lave and Wenger to reframe learning as changing participation in social practice. Brown, Collins, and Duguid's 'situated cognition' (1989) argued knowledge is inseparable from the activity and culture in which it develops.",
 claims:["Knowledge is fundamentally situated in activity, context, and culture.","Learning is a trajectory from legitimate peripheral participation toward full participation in a community of practice.","Identity formation — becoming a kind of person — is inseparable from learning.","Abstract, decontextualized instruction often produces inert knowledge that fails to transfer."],
 constructs:[
  {term:"Community of practice", def:"A group sharing a domain, mutual engagement, and a repertoire of practices (Wenger: mutual engagement, joint enterprise, shared repertoire)."},
  {term:"Legitimate peripheral participation", def:"Newcomers' sanctioned, low-stakes participation at the edge of practice that grows toward the center."},
  {term:"Cognitive apprenticeship", def:"Making expert thinking visible through modeling, coaching, scaffolding, articulation, reflection, exploration (Collins, Brown, & Newman)."},
  {term:"Inert knowledge", def:"Knowledge that can be recited but not used — a symptom of decontextualized instruction (Whitehead's term)."},
  {term:"Identity trajectory", def:"Learning as becoming — a changing identity within a community."}],
 applications:["Practicum, residency, and induction design in educator preparation.","Professional learning communities and teacher networks.","Authentic, project- and problem-based tasks anchored in real practice.","Analyzing online communities and workplace learning in dissertations."],
 critiques:["Communities can reproduce exclusion, hierarchy, and bad practice as easily as expertise.","Weak account of how deliberate, decontextualized instruction sometimes accelerates learning.","Anderson, Reder, and Simon (1996) challenged strong claims that transfer requires situated instruction."],
 related:["vygotsky","kolb","connectivism","bourdieu"],
 refs:["Lave, J., & Wenger, E. (1991). Situated learning: Legitimate peripheral participation. Cambridge University Press.","Wenger, E. (1998). Communities of practice: Learning, meaning, and identity. Cambridge University Press.","Brown, J. S., Collins, A., & Duguid, P. (1989). Situated cognition and the culture of learning. Educational Researcher, 18(1), 32–42."],
 compare:{learner:"A newcomer moving from periphery to full participation", mechanism:"Increasing participation and identity change within authentic practice", instructor:"Old-timer/master who grants access and makes practice visible", knowledge:"Distributed across people, tools, and activity; inseparable from context", critique:"Communities can entrench exclusion; underplays direct instruction's value"}
},
{
 id:"kolb", name:"Experiential Learning Theory", discipline:"Learning Theory", depth:"deep",
 theorists:"David A. Kolb (b. 1939); roots in John Dewey, Kurt Lewin",
 tagline:"Learning is the process whereby knowledge is created through the transformation of experience, cycling through experiencing, reflecting, conceptualizing, and experimenting.",
 problem:"The field trip was wonderful and taught nothing. The lab was completed by every group and understood by none. The veteran has twenty years of experience that look suspiciously like one year repeated twenty times. Experience is supposed to be the great teacher — so why does so much of it leave no trace? Kolb's answer: experience alone teaches nothing. Learning happens only when experience is transformed — reflected upon, converted into portable ideas, and tested again. The theory exists to explain what completes that loop, and why programs rich in activity and poor in reflection produce motion without learning.",
 asks:["How exactly does raw experience become usable knowledge?","Why do some people learn enormously from experience while others merely accumulate it?","What has to surround an activity — before and after — for the activity to teach?","Where do concrete doing and abstract understanding meet, and what bridges them?"],
 iftrue:{
  teachers:"Never let the activity be the ending. Budget as much design attention for what follows the experience as for the experience itself: structured debrief (what happened → so what → now what), a named, portable principle in students' own words, and a planned next experiment that tests it. Reflection is not a journal-shaped mood; it is the machine that converts doing into knowing.",
  coaches:"Your coaching cycle is the Kolb cycle wearing a lanyard: the observed lesson is the concrete experience, the debrief is reflective observation, the principle you extract together is abstract conceptualization, and next week's adjusted lesson is active experimentation. Coach the full loop — and audit classrooms for the signature imbalance: activity-rich, reflection-poor.",
  leaders:"If the schedule funds the experience but not the processing, you are purchasing entertainment: field trips, labs, and PBL all require protected reflection time to pay off. Design PD as complete cycles that span sessions — try it in your classroom (experience), bring the evidence back (reflection), refine the principle (conceptualization), commit to the next attempt (experimentation) — instead of single-session events that end at inspiration.",
  researchers:"Measure learning from experience, not satisfaction with it: pre/post conceptual measures, quality codes on reflection (descriptive versus analytic), and downstream performance. Treat cycle completeness as a testable variable. And let the learning-styles inventory rest — the cycle survived peer review; the style typology did not."},
 reasoning:{
  notice:["Students who completed the activity but cannot state what it demonstrated — the cycle stalled at concrete experience.","Reflection that stays descriptive ('first we did… then we did…') versus analytic ('which suggests… because…'): the difference is the whole game.","Experience repeating without practice changing — in students or colleagues — the signature of a loop with no experimentation phase.","Your own defaults: most educators habitually favor two of the four modes and quietly skip the others; your lesson designs inherit your skips."],
  assume:["That the experience was educative at all — Dewey's warning stands: experiences can mis-educate, and a chaotic lab may teach mostly that science is chaos.","That reflection happens naturally if time is provided; unstructured 'reflection time' reliably produces recaps and feelings, not principles.","That style labels describe real constraints — matching instruction to diagnosed styles has repeatedly failed evidentiary tests, including for Kolb's own inventory."],
  decide:["Install the four moves as your default lesson architecture around any experience: do → what happened → what principle → what next test.","Require a one-sentence portable principle from every student after every major experience — the artifact that proves conceptualization happened.","Plan the 'next experiment' explicitly: where will students apply the principle within the week?","Use debrief protocols with analytic stems ('the evidence that…', 'this would fail if…') rather than open 'thoughts?'"],
  avoid:["Treating engagement as the outcome ('they loved it') — delight is lovely and orthogonal to learning.","Reflection prompts that only harvest feelings.","Grouping or labeling students by learning style — it wastes design effort the debrief needed.","Skipping the debrief when time runs short; if something must go, shrink the activity, never the processing."]},
 competing:[
  {scenario:"An engaging, hands-on lab produced almost no measurable learning.", thisView:"The cycle was amputated: experience without reflective observation and conceptualization is stimulation, not learning. Add the debrief and principle-naming, and the same lab teaches.", other:"Cognitive Load Theory (Sweller)", otherView:"The lab overloaded working memory from the first minute — novices managing equipment, procedure, and concept simultaneously encode almost nothing. Restructure the input: pre-teach components, use worked examples, then run the activity.", agree:"Both reject 'doing = learning.' The synthesis is sequencing: manage load going in, complete the reflective cycle coming out — the theories govern different ends of the same lab."},
  {scenario:"A twenty-year veteran's practice hasn't changed in a decade.", thisView:"Experience without reflection and experimentation doesn't compound: the loop closed years ago and now merely repeats. Restart it with structured observation of her own practice and one small experiment.", other:"Deliberate Practice (Ericsson)", otherView:"Experience was never the active ingredient — targeted effort at the edge of ability, with feedback, is. Years of comfortable repetition predict exactly this plateau; design practice, not more experience.", agree:"Near-total convergence: raw accumulation improves no one. Both prescribe feedback-rich, deliberately structured cycles — Kolb names the reflective machinery, Ericsson names the difficulty calibration."}],
 research:{
  questions:["Does structured reflection reliably increase learning from experience — and which structures work best?","Is cycle completeness (all four modes) a real predictor of learning outcomes?","What debrief designs maximize learning in simulation, clinical, and field settings?","Can reflective capacity itself be taught and transferred?"],
  methods:"Quasi-experiments in experiential and professional programs; the strongest strand is simulation-debriefing research in medical and clinical education, including randomized comparisons of debrief structures; analysis of reflective writing with quality rubrics.",
  variables:"Reflection quality codes (descriptive → analytic → critical), conceptual change measures, subsequent performance and transfer, and program design features (timing, protocol, facilitation).",
  support:"Split verdict, stated plainly: the cycle as a design prescription has solid indirect support — debriefing meta-analyses in simulation education show substantial effects, and reflection-structure studies favor guided over open reflection. The learning-styles half of the theory has failed psychometrically and predictively, and the field has moved on. Use the cycle; retire the inventory."},
 reflect:["Take your best activity of the year. What did students do afterward to transform it — and if the honest answer is 'a worksheet,' what would a real debrief look like?","What portable principle would your students say last week's lab or project proved? Would their answers match yours — or exist at all?","Which of the four modes do you personally skip — and where does that skip show up in your teaching?","Think of your own most transformative professional experience. What surrounded it that made it teach — and do you build that surround for others?","What experience does your school fund generously while starving its processing time? What would rebalancing cost, and what is the current imbalance costing?"],
 constellation:{builds:["dewey"],complements:["schon","knowles","mezirow"],contrasts:["behaviorism"],pairs:["situated","practitioner","dbr"]},
 origins:"Synthesizing Dewey's experiential continuum, Lewin's action research, and Piaget, Kolb (1984) proposed a four-mode learning cycle and derived learning-style types from preferences within it. It became a dominant framework in higher, adult, and professional education.",
 claims:["Effective learning cycles through concrete experience, reflective observation, abstract conceptualization, and active experimentation.","Knowledge results from the combination of grasping experience and transforming it.","Learners develop preferences (styles) for particular modes of the cycle.","Education should integrate experience with structured reflection rather than deliver content alone."],
 constructs:[
  {term:"Concrete experience (CE)", def:"Full, open involvement in a new experience."},
  {term:"Reflective observation (RO)", def:"Observing and reflecting on experience from multiple perspectives."},
  {term:"Abstract conceptualization (AC)", def:"Forming concepts and generalizations that integrate observations."},
  {term:"Active experimentation (AE)", def:"Testing concepts in new situations, generating new experience."},
  {term:"Learning styles", def:"Preferred combinations of modes (diverging, assimilating, converging, accommodating)."}],
 applications:["Design of internships, simulations, labs, service learning, and study abroad with built-in reflection.","Debriefing protocols after clinical or field experiences.","Adult and executive education program design.","Reflective journals and portfolios as the RO/AC bridge."],
 critiques:["The style typology has weak psychometric support; 'learning styles' matching lacks evidence.","The tidy cycle oversimplifies messy, concurrent learning processes.","Underplays social, cultural, and power dimensions of experience (later addressed by critical experiential scholars)."],
