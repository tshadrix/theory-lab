{
 id:"freire", name:"Critical Pedagogy", discipline:"Education & Pedagogy", depth:"deep",
 theorists:"Paulo Freire (1921–1997); bell hooks, Henry Giroux, Peter McLaren",
 tagline:"Education is never neutral: it either domesticates or liberates. Learning should be dialogic praxis through which people read the word and the world.",
 origins:"Freire's literacy work with Brazilian peasants, and his exile after the 1964 coup, produced Pedagogy of the Oppressed (1970). Rejecting 'banking' education, he founded a tradition linking literacy, consciousness, and social transformation that shaped critical pedagogy worldwide.",
 claims:["Banking education — depositing knowledge into passive students — reproduces oppression.","Genuine education is problem-posing: dialogic co-investigation of the world.","Conscientização (critical consciousness) develops as learners perceive contradictions and act on them.","Praxis — reflection and action together — is the goal; word and world are read jointly."],
 constructs:[
  {term:"Banking model", def:"Teacher deposits, students receive: a metaphor for transmissive, oppressive education."},
  {term:"Problem-posing education", def:"Curriculum built from learners' generative themes, examined dialogically."},
  {term:"Conscientização", def:"Critical consciousness: perceiving social, political, economic contradictions and taking action against oppressive elements."},
  {term:"Praxis", def:"Reflection and action upon the world in order to transform it."},
  {term:"Generative themes", def:"Issues drawn from learners' lives that carry existential and political significance."},
  {term:"Dialogue", def:"Horizontal, loving, humble communication as the method of education."}],
 applications:["Adult and community literacy programs; participatory action research (a common EdD methodology pairing).","Curriculum built from students' lived experience and community issues.","Critical media literacy and civic education.","Equity-focused leadership and school transformation frameworks."],
 critiques:["Abstract prescriptions; little concrete guidance for classroom management or skills instruction.","Critics allege political imposition can replace one orthodoxy with another.","Feminist and postcolonial scholars (e.g., Ellsworth, hooks) pushed back on its universalism and rationalism."],
 related:["mezirow","crp","vygotsky","bourdieu"],
 refs:["Freire, P. (1970). Pedagogy of the oppressed (M. B. Ramos, Trans.). Herder and Herder.","Freire, P. (1998). Pedagogy of freedom: Ethics, democracy, and civic courage. Rowman & Littlefield.","hooks, b. (1994). Teaching to transgress: Education as the practice of freedom. Routledge."],
 compare:{learner:"A subject capable of reading and transforming their world", mechanism:"Dialogic problem-posing that develops critical consciousness", instructor:"Co-learner and problem-poser, never a depositor", knowledge:"Co-constructed, political, and tied to action", critique:"Programmatically thin; risk of substituting new orthodoxies"}
},
{
 id:"crp", name:"Culturally Relevant & Responsive Pedagogy", discipline:"Education & Pedagogy", depth:"deep",
 theorists:"Gloria Ladson-Billings (1995); Geneva Gay (2000); Django Paris (culturally sustaining, 2012)",
 tagline:"Teaching that leverages students' cultures as assets, pursuing academic success, cultural competence, and critical consciousness together.",
 origins:"Ladson-Billings' studies of successful teachers of African American students yielded culturally relevant pedagogy's three pillars. Gay elaborated responsive teaching practice; Paris and Alim extended it to sustaining students' linguistic and cultural pluralism rather than merely referencing it.",
 claims:["Culture is central, not incidental, to learning; deficit framings of students are both wrong and harmful.","Effective teaching produces academic success AND cultural competence AND critical consciousness.","Curriculum and instruction should connect to students' funds of knowledge and community realities.","Schools should sustain — not subtract — students' languages and cultures."],
 constructs:[
  {term:"Academic success", def:"Non-negotiable intellectual growth; high expectations are a pillar, not an add-on."},
  {term:"Cultural competence", def:"Fluency in one's own culture and at least one other; identity affirmed in school."},
  {term:"Sociopolitical/critical consciousness", def:"Ability to critique social inequities that shape students' lives."},
  {term:"Deficit thinking", def:"Attributing school failure to students' cultures/families rather than to systems — the stance CRP rejects."},
  {term:"Culturally sustaining pedagogy", def:"Paris & Alim's extension: sustain linguistic and cultural pluralism as an explicit goal."}],
 applications:["Curriculum audits for representation and asset framing.","Family/community partnership designs drawing on funds of knowledge.","Professional development on expectations, discourse, and discipline disparities.","A leading conceptual framework for equity-focused EdD dissertations."],
 critiques:["Ladson-Billings (2014) herself critiqued shallow 'remix' implementations that celebrate culture but drop critical consciousness.","Operationalizing and measuring the three pillars is difficult.","Risk of essentializing cultures as static traits of groups."],
 related:["freire","funds","bourdieu","vygotsky"],
 refs:["Ladson-Billings, G. (1995). Toward a theory of culturally relevant pedagogy. American Educational Research Journal, 32(3), 465–491.","Gay, G. (2018). Culturally responsive teaching: Theory, research, and practice (3rd ed.). Teachers College Press.","Paris, D., & Alim, H. S. (Eds.). (2017). Culturally sustaining pedagogies: Teaching and learning for justice in a changing world. Teachers College Press."],
 compare:{learner:"A culturally located learner whose heritage is an asset", mechanism:"Learning through connection to culture, community, and critique", instructor:"Warm demander who affirms identity and insists on excellence", knowledge:"Includes community knowledge; curriculum is culturally situated", critique:"Often implemented shallowly; pillars hard to measure"}
},
{
 id:"udl", name:"Universal Design for Learning", discipline:"Education & Pedagogy", depth:"deep",
 theorists:"David Rose & Anne Meyer (CAST, 1990s–present)",
 tagline:"Design learning environments with flexible options from the start — multiple means of engagement, representation, and action/expression — so barriers, not learners, are remediated.",
 origins:"Borrowing universal design from architecture (curb cuts) and grounded in neuroscience of affective, recognition, and strategic brain networks, CAST developed UDL to move accessibility from retrofit accommodation to proactive curriculum design. It is codified in U.S. policy (ESSA, HEOA).",
 claims:["Learner variability is the norm; the 'average learner' is a myth.","Barriers reside in inflexible curricula, not in students.","Providing options for engagement, representation, and expression benefits all learners, not only those with disabilities.","Expert learning — purposeful, resourceful, strategic — is the goal of design."],
 constructs:[
  {term:"Multiple means of engagement", def:"Options for recruiting interest, sustaining effort, and self-regulation (the 'why' of learning)."},
  {term:"Multiple means of representation", def:"Options for perception, language, and comprehension (the 'what')."},
  {term:"Multiple means of action & expression", def:"Options for physical action, communication, and executive function (the 'how')."},
  {term:"Learner variability", def:"Predictable, systematic diversity in how people learn, mapped to brain networks."},
  {term:"Expert learner", def:"UDL's aim: learners who know how to learn — motivated, resourceful, goal-directed."}],
 applications:["Course and lesson design offering flexible materials, supports, and assessment formats.","Digital accessibility decisions (captions, text-to-speech, multiple formats).","District MTSS and inclusion frameworks.","EdD studies of implementation fidelity and outcomes in inclusive settings."],
 critiques:["Empirical evidence for whole-framework effects lags behind adoption enthusiasm.","Checklist-style implementation can add options without removing real barriers.","Demands significant design time and resources; scalability concerns."],
 related:["multimedia","cogload","sdt"],
 refs:["Meyer, A., Rose, D. H., & Gordon, D. (2014). Universal design for learning: Theory and practice. CAST Professional Publishing.","Rose, D. H., & Meyer, A. (2002). Teaching every student in the digital age: Universal design for learning. ASCD.","CAST. (2018). Universal design for learning guidelines version 2.2. https://udlguidelines.cast.org"],
 compare:{learner:"A variable learner whose barriers are environmental, not personal", mechanism:"Flexible pathways let each learner engage, perceive, and express", instructor:"Proactive designer who removes barriers before they appear", knowledge:"Reachable through multiple representations and demonstrable in multiple forms", critique:"Framework-level evidence still thin relative to adoption"}
},
{
 id:"mindset", dis:true, name:"Mindset Theory (Implicit Theories of Intelligence)", discipline:"Education & Pedagogy", depth:"deep",
 theorists:"Carol Dweck (b. 1946)",
 tagline:"Beliefs about whether ability is fixed or malleable shape goals, responses to failure, and ultimately achievement.",
 origins:"Dweck's attribution research on learned helplessness in the 1970s evolved into implicit theories: entity (fixed) versus incremental (growth) beliefs about intelligence. Popularized by Mindset (2006), it became one of education's most influential — and most debated — ideas.",
 claims:["Learners holding a growth mindset pursue learning goals, embrace challenge, and persist after setbacks.","Fixed-mindset learners favor performance goals and interpret effort and failure as evidence of low ability.","Praise for process (strategies, effort) fosters growth mindset; praise for ability fosters fixed mindset.","Mindsets are domain-specific beliefs that interventions can shift, modestly."],
 constructs:[
  {term:"Entity theory (fixed mindset)", def:"Belief that ability is a fixed trait; failure signals lack of it."},
  {term:"Incremental theory (growth mindset)", def:"Belief that ability grows through effort and strategy."},
  {term:"Learning vs. performance goals", def:"Seeking to develop competence versus to demonstrate it (with Elliott & Leggett)."},
  {term:"Process praise", def:"Feedback targeting strategy and effort rather than person or talent (Mueller & Dweck, 1998)."},
  {term:"Helpless vs. mastery-oriented responses", def:"Characteristic reactions to failure under each mindset."}],
 applications:["Feedback and grading language in classrooms.","Brief, targeted mindset interventions for students at transition points.","Teacher beliefs about students — arguably more consequential than student mindsets.","Framing for studies of persistence, gatekeeper courses, and equity gaps."],
 critiques:["Large replications (e.g., Sisk et al., 2018) find small average effects, concentrated among at-risk students.","'Mindset culture' can slide into blaming students while ignoring structures.","Measurement and intervention fidelity vary widely; publication-bias debates continue (though Yeager's 2019 national study found targeted benefits)."],
 related:["attribution","sdt","socialcognitive","expectancyvalue"],
 refs:["Dweck, C. S. (2006). Mindset: The new psychology of success. Random House.","Dweck, C. S., & Leggett, E. L. (1988). A social-cognitive approach to motivation and personality. Psychological Review, 95(2), 256–273.","Yeager, D. S., et al. (2019). A national experiment reveals where a growth mindset improves achievement. Nature, 573, 364–369.","Sisk, V. F., Burgoyne, A. P., Sun, J., Butler, J. L., & Macnamara, B. N. (2018). To what extent and under which circumstances are growth mind-sets important to academic achievement? Psychological Science, 29(4), 549–571."],
 compare:{learner:"A believer whose implicit theory of ability filters every setback", mechanism:"Beliefs shape goals, effort attributions, and persistence", instructor:"Shaper of belief through process feedback and challenge framing", knowledge:"Competence seen as expandable through strategy and effort", critique:"Replication effects are small; risk of ignoring structural causes"}
},
{
 id:"expectancyvalue", name:"Expectancy-Value Theory", discipline:"Education & Pedagogy", depth:"deep",
 theorists:"Jacquelynne Eccles & Allan Wigfield (1983–present); roots in John Atkinson",
 tagline:"Achievement choices and persistence are driven by two questions: Can I do this? and Do I want to — is it worth it?",
 origins:"Developed to explain gendered differences in math course-taking, the Eccles et al. model linked expectancies for success and subjective task values to choices, showing how socializers and cultural stereotypes shape both. It is now a workhorse model of academic motivation and STEM persistence.",
 claims:["Expectancies for success and subjective task value jointly predict achievement choices, effort, and persistence.","Task value has four components: intrinsic, attainment, utility, and cost.","Expectancies and values are shaped by socializers, stereotypes, prior experience, and self-schemas.","Perceived cost (effort, lost alternatives, psychological risk) can veto otherwise valued pursuits."],
 constructs:[
  {term:"Expectancy for success", def:"Belief about how well one will do on an upcoming task (close cousin of self-efficacy)."},
  {term:"Intrinsic value", def:"Enjoyment gained from doing the task."},
  {term:"Attainment value", def:"Importance of doing well for one's identity."},
  {term:"Utility value", def:"Usefulness of the task for future goals — the most intervention-friendly component."},
  {term:"Cost", def:"Perceived effort, emotional toll, and foregone alternatives of engagement."}],
 applications:["Utility-value interventions ('write how this connects to your life') improving STEM outcomes.","Advising and program design addressing cost, not just interest.","Explaining course-taking, major choice, and career pipelines in EdD research.","Family and counselor messaging as socializer levers."],
 critiques:["Expectancy and value measures correlate highly, complicating unique effects.","Model breadth makes full tests rare; most studies examine slices.","Cultural generalizability of value components is still under study (situated expectancy-value revision, 2020, addresses context)."],
 related:["sdt","mindset","attribution","socialcognitive"],
 refs:["Eccles, J. S., et al. (1983). Expectancies, values, and academic behaviors. In J. T. Spence (Ed.), Achievement and achievement motivation (pp. 75–146). W. H. Freeman.","Wigfield, A., & Eccles, J. S. (2000). Expectancy–value theory of achievement motivation. Contemporary Educational Psychology, 25(1), 68–81.","Eccles, J. S., & Wigfield, A. (2020). From expectancy-value theory to situated expectancy-value theory. Contemporary Educational Psychology, 61, 101859."],
 compare:{learner:"A chooser weighing 'Can I?' against 'Is it worth it?'", mechanism:"Expectancies and task values, shaped by socializers, drive choices", instructor:"Builder of success expectancy and salient task value", knowledge:"Pursued when valued and attainable; cost can veto", critique:"Constructs intercorrelate; full-model tests are rare"}
},
{
 id:"attribution", name:"Attribution Theory", discipline:"Education & Pedagogy", depth:"deep",
 theorists:"Bernard Weiner (b. 1935); roots in Fritz Heider",
 tagline:"How learners explain success and failure — by causes varying in locus, stability, and controllability — determines emotion, expectancy, and future effort.",
 origins:"Heider's common-sense psychology and Weiner's achievement research produced a taxonomy of causal attributions. Ability, effort, task difficulty, and luck differ along three dimensions that predict distinct emotional and motivational consequences, informing feedback and re-attribution training.",
 claims:["After outcomes, people search for causes; the dimensions of those causes drive consequences.","Stable attributions for failure (low ability) lower expectancy; unstable ones (effort, strategy) preserve it.","Controllability shapes emotion: guilt (controllable) mobilizes; shame (uncontrollable) demobilizes.","Teacher feedback communicates attributions — sometimes unintentionally (pity can signal low ability)."],
 constructs:[
  {term:"Locus", def:"Whether a cause is internal (ability, effort) or external (task, luck)."},
  {term:"Stability", def:"Whether a cause is fixed or variable over time; drives expectancy change."},
  {term:"Controllability", def:"Whether the cause is subject to volitional influence; drives guilt/shame and social judgments."},
  {term:"Learned helplessness", def:"Passivity following repeated uncontrollable failure (Seligman); attributionally reformulated by Abramson et al."},
  {term:"Attributional retraining", def:"Interventions shifting failure explanations toward controllable, unstable causes (strategy, effort)."}],
 applications:["Feedback that attributes failure to strategy rather than ability.","Attributional retraining programs for struggling college students.","Understanding demoralization and re-engagement in turnaround schools.","Analysis of teacher expectation effects and sympathy cues."],
 critiques:["Attributions are measured post hoc and are culturally variable (self-serving bias differs across cultures).","Classroom emotions involve more than attribution (control-value theory extends it).","Overlaps substantially with mindset and self-efficacy constructs."],
 related:["mindset","socialcognitive","expectancyvalue","srl"],
 refs:["Weiner, B. (1985). An attributional theory of achievement motivation and emotion. Psychological Review, 92(4), 548–573.","Weiner, B. (2010). The development of an attribution-based theory of motivation: A history of ideas. Educational Psychologist, 45(1), 28–36.","Abramson, L. Y., Seligman, M. E. P., & Teasdale, J. D. (1978). Learned helplessness in humans: Critique and reformulation. Journal of Abnormal Psychology, 87(1), 49–74."],
 compare:{learner:"A sense-maker explaining every success and failure", mechanism:"Causal dimensions (locus, stability, controllability) shape emotion and expectancy", instructor:"Feedback-giver whose cues signal attributions to students", knowledge:"Beliefs about causes of performance guide future engagement", critique:"Post hoc measurement; heavy overlap with adjacent theories"}
},
{
 id:"backward", name:"Backward Design (Understanding by Design)", discipline:"Education & Pedagogy", depth:"deep",
 theorists:"Grant Wiggins & Jay McTighe (1998); kin to Ralph Tyler's rationale (1949)",
 tagline:"Plan curriculum backward: identify desired understandings first, determine acceptable evidence second, and only then design learning experiences.",
 origins:"Tyler's 1949 rationale established objectives-first curriculum thinking. Wiggins and McTighe's Understanding by Design operationalized it against 'coverage' and 'activity-oriented' teaching, defining understanding through six facets and organizing units around big ideas and essential questions.",
 claims:["Curriculum should be planned from outcomes backward, not from textbooks or activities forward.","Understanding is revealed through transfer — applying learning to new situations — not recall alone.","Assessment evidence must be determined before instruction is designed (Stage 2 before Stage 3).","Big ideas and essential questions give coherence and priority to content decisions."],
 constructs:[
  {term:"Three stages", def:"1) Identify desired results; 2) Determine acceptable evidence; 3) Plan learning experiences."},
  {term:"Six facets of understanding", def:"Explanation, interpretation, application, perspective, empathy, self-knowledge."},
  {term:"Essential questions", def:"Open, recurring questions that provoke inquiry into big ideas."},
  {term:"Transfer goals", def:"Long-term abilities to apply learning autonomously in new contexts."},
  {term:"Twin sins", def:"Activity-oriented and coverage-oriented design — engaging or thorough but purposeless."}],
 applications:["Unit and course design templates; curriculum mapping across programs.","Performance-task assessment design (GRASPS).","Program review and accreditation alignment work.","A practical companion framework for EdD improvement projects."],
 critiques:["Objectives-first logic can constrain emergent, learner-driven inquiry.","Time-intensive; fidelity often reduces to filling templates.","Inherits critiques of Tyler rationale: technical rationality and whose objectives count."],
 related:["bloom","udl","freire"],
 refs:["Wiggins, G., & McTighe, J. (2005). Understanding by design (Expanded 2nd ed.). ASCD.","Tyler, R. W. (1949). Basic principles of curriculum and instruction. University of Chicago Press.","McTighe, J., & Wiggins, G. (2013). Essential questions: Opening doors to student understanding. ASCD."],
 compare:{learner:"A performer who must transfer understanding to new situations", mechanism:"Alignment of outcomes, evidence, and experience produces understanding", instructor:"Designer working backward from desired results", knowledge:"Organized around big ideas; proven through transfer", critique:"Technical-rational; can suppress emergent curriculum"}
},
{
 id:"svr", name:"Simple View of Reading & Scarborough's Rope", discipline:"Literacy", depth:"deep",
 theorists:"Philip Gough & William Tunmer (1986); Hollis Scarborough (2001)",
 tagline:"Reading comprehension is the product of decoding and language comprehension — and each strand is itself a braid of teachable skills.",
 origins:"Gough and Tunmer proposed RC = D × LC to clarify debates about reading disability, distinguishing dyslexia (decoding deficit) from comprehension-specific difficulty. Scarborough's rope visualized the strands — word recognition becoming automatic, language comprehension becoming strategic — and became an icon of the 'science of reading' movement.",
 claims:["Reading comprehension requires both decoding and linguistic comprehension; neither alone suffices (multiplicative, not additive).","Word-recognition strands (phonological awareness, decoding, sight recognition) must become increasingly automatic.","Language-comprehension strands (background knowledge, vocabulary, syntax, verbal reasoning, literacy knowledge) must become increasingly strategic.","Reading difficulties can be classified and targeted by profile: decoding-weak, comprehension-weak, or mixed."],
 constructs:[
  {term:"Decoding (D)", def:"Efficient word recognition via grapheme–phoneme mapping; the print-specific component."},
  {term:"Language comprehension (LC)", def:"Understanding spoken language: vocabulary, background knowledge, syntax, inference."},
  {term:"RC = D × LC", def:"If either factor is zero, comprehension is zero — the multiplicative claim."},
  {term:"Phonological awareness", def:"Sensitivity to the sound structure of language, a precursor of decoding."},
  {term:"Orthographic mapping", def:"Binding spellings to pronunciations and meanings so words are recognized instantly (Ehri)."},
  {term:"Automaticity & fluency", def:"Effortless word recognition freeing capacity for comprehension (LaBerge & Samuels)."}],
 applications:["Screening and intervention systems that diagnose by component profile.","Structured literacy and systematic phonics for the decoding strand.","Knowledge-rich curriculum and vocabulary work for the LC strand.","Policy analysis of state reading legislation — a live EdD topic."],
 critiques:["Critics argue two factors oversimplify (motivation, executive function, fluency as separate contributor — the Active View of Reading, Duke & Cartwright, 2021).","'Science of reading' policy applications sometimes outrun the model's scope.","Product formulation fits English; transparency of orthography moderates it."],
 related:["chall","schema","infoprocessing","nls"],
 refs:["Gough, P. B., & Tunmer, W. E. (1986). Decoding, reading, and reading disability. Remedial and Special Education, 7(1), 6–10.","Scarborough, H. S. (2001). Connecting early language and literacy to later reading (dis)abilities. In S. B. Neuman & D. K. Dickinson (Eds.), Handbook of early literacy research (pp. 97–110). Guilford Press.","Duke, N. K., & Cartwright, K. B. (2021). The science of reading progresses: Communicating advances beyond the simple view of reading. Reading Research Quarterly, 56(S1), S25–S44."],
 compare:{learner:"A reader whose comprehension is bounded by decoding × language", mechanism:"Automatizing word recognition while growing strategic comprehension", instructor:"Diagnostician targeting the weak strand with explicit instruction", knowledge:"Componential skills that braid into skilled reading", critique:"Two factors omit motivation, executive function, and fluency's role"}
},
{
 id:"schema", name:"Schema Theory of Comprehension", discipline:"Literacy", depth:"deep",
 theorists:"Frederic Bartlett (1932); Richard C. Anderson & P. David Pearson (1984)",
 tagline:"Comprehension is the interaction of text with the reader's organized prior knowledge — no schema, no understanding.",
 origins:"Bartlett showed recall is reconstructive, shaped by cultural schemas. In the 1970s–80s, Anderson, Pearson, and the Center for the Study of Reading made schema theory the dominant account of reading comprehension, explaining classic findings like the 'washing clothes' passage that is incomprehensible without its title.",
 claims:["Readers understand text by mapping it onto existing knowledge structures (schemas).","Schemas guide attention, enable inference, and shape both encoding and recall.","Comprehension failure often reflects missing or unactivated schema, not decoding failure.","Background knowledge is a primary driver of comprehension differences — with equity implications for curriculum."],
 constructs:[
  {term:"Schema activation", def:"Bringing relevant prior knowledge online before and during reading."},
  {term:"Slot filling & default values", def:"Schemas supply expected elements, letting readers infer what texts omit."},
  {term:"Reconstructive recall", def:"Memory rebuilt through schemas, producing systematic distortions (Bartlett's 'War of the Ghosts')."},
  {term:"Inference generation", def:"Bridging and elaborative inferences knit text into a coherent situation model (Kintsch's construction–integration extends this)."},
  {term:"Knowledge-based equity gap", def:"Comprehension differences track opportunity to build knowledge, motivating knowledge-rich curricula."}],
 applications:["Activating and building background knowledge before reading.","Knowledge-rich, content-integrated literacy curricula (e.g., ELA units built on science/history).","Text selection and pre-teaching decisions for multilingual learners.","Explaining assessment bias when passages presume culturally specific knowledge."],
 critiques:["Vague about how schemas are represented and acquired; hard to falsify.","Superseded in psychology by more specified models (construction–integration) though it survives in practice.","Overemphasis on activation can shortchange text-based and word-level work."],
 related:["infoprocessing","svr","rosenblatt","piaget"],
 refs:["Bartlett, F. C. (1932). Remembering: A study in experimental and social psychology. Cambridge University Press.","Anderson, R. C., & Pearson, P. D. (1984). A schema-theoretic view of basic processes in reading comprehension. In P. D. Pearson (Ed.), Handbook of reading research (pp. 255–291). Longman.","Kintsch, W. (1998). Comprehension: A paradigm for cognition. Cambridge University Press."],
 compare:{learner:"A knowledge-holder who builds meaning from text plus schema", mechanism:"Mapping text onto activated knowledge structures; inference fills gaps", instructor:"Activator and builder of background knowledge", knowledge:"Organized structures that make new text intelligible", critique:"Underspecified mechanism; can eclipse decoding and text evidence"}
},
{
 id:"rosenblatt", name:"Transactional / Reader-Response Theory", discipline:"Literacy", depth:"deep",
 theorists:"Louise Rosenblatt (1904–2005)",
 tagline:"Meaning is not in the text or the reader but in the transaction between them; readers adopt stances from efferent (information-taking) to aesthetic (lived-through experience).",
 origins:"First articulated in Literature as Exploration (1938) and elaborated in The Reader, the Text, the Poem (1978), Rosenblatt's transactional theory countered New Criticism's text-only formalism, insisting that the 'poem' is an event created anew in each reading. It grounds response-based literature pedagogy.",
 claims:["Reading is a transaction: reader and text condition each other in a particular time and context.","The same reader can adopt an efferent stance (carrying away information) or an aesthetic stance (attending to the lived-through experience); most readings blend both.","Interpretations vary legitimately, but the text constrains valid readings — response is disciplined, not anything-goes.","Literature education should cultivate personal response and democratic dialogue about texts."],
 constructs:[
  {term:"Transaction", def:"Mutual shaping of reader and text (borrowed from Dewey & Bentley), against one-way 'interaction'."},
  {term:"Efferent stance", def:"Reading to extract and retain information for afterward."},
  {term:"Aesthetic stance", def:"Attention to what is being lived through during reading — feeling, imagery, association."},
  {term:"The poem as event", def:"The literary work exists as an experience evoked in a reader, not as marks on a page."},
  {term:"Selective attention", def:"Stance directs which aspects of textual experience come forward."}],
 applications:["Response journals, literature circles, and discussion-based ELA pedagogy.","Balancing test-driven efferent reading with aesthetic engagement.","Choice reading programs and identity-relevant text selection.","Framework for studies of engagement and literary discussion quality."],
 critiques:["Poststructural critics find the reader/text 'transaction' still too tidy about where meaning lives.","Classroom application can drift into unmoored personal reaction without textual warrant.","Stance continuum is hard to operationalize for research."],
 related:["schema","nls","dewey","literary_crit"],
 refs:["Rosenblatt, L. M. (1938). Literature as exploration. Appleton-Century.","Rosenblatt, L. M. (1978). The reader, the text, the poem: The transactional theory of the literary work. Southern Illinois University Press.","Rosenblatt, L. M. (2005). Making meaning with texts: Selected essays. Heinemann."],
 compare:{learner:"A meaning-maker transacting with text from a chosen stance", mechanism:"Transaction between reader's resources and textual cues", instructor:"Curator of texts and facilitator of disciplined response", knowledge:"An evoked experience/interpretation constrained by text", critique:"Hard to operationalize; can license unanchored response"}
},
{
 id:"nls", dis:true, name:"New Literacy Studies & Multiliteracies", discipline:"Literacy", depth:"deep",
 theorists:"Brian Street; James Paul Gee; Shirley Brice Heath; the New London Group (1996)",
 tagline:"Literacy is not one neutral cognitive skill but many social practices, embedded in power, identity, and context — and now multiplied across modes and media.",
 origins:"Street's ethnography in Iran distinguished 'autonomous' from 'ideological' models of literacy; Heath's Ways with Words documented community-specific literacy practices; Gee tied literacy to Discourses and identity. The New London Group's multiliteracies manifesto extended the frame to multimodal, digital, and globalized communication.",
 claims:["Literacy practices are plural, situated, and ideological — inseparable from social relations and power.","The 'autonomous model' (literacy as neutral skill with universal cognitive effects) is empirically and politically misleading.","People command primary and secondary Discourses; school literacy is one specialized Discourse among many.","Pedagogy should span situated practice, overt instruction, critical framing, and transformed practice (multiliteracies)."],
 constructs:[
  {term:"Ideological vs. autonomous model", def:"Street's contrast between literacy as situated social practice and literacy as neutral technical skill."},
  {term:"Literacy events & practices", def:"Observable occasions involving text (events) and the patterned, value-laden ways groups use them (practices) — Heath, Barton & Hamilton."},
  {term:"Discourse (big D)", def:"Gee's identity kit: ways of talking, acting, valuing, and using texts that mark membership."},
  {term:"Multiliteracies", def:"Competence across linguistic, visual, audio, gestural, and spatial modes and across cultural contexts."},
  {term:"Design", def:"The New London Group's term for meaning-making as active (re)design of available resources."}],
 applications:["Ethnographic and case-study literacy research designs (common in EdD work).","Valuing home and community literacies; bridging them to academic Discourse.","Digital/media literacy curriculum and multimodal composition.","Critique of one-size-fits-all literacy policy and assessment."],
 critiques:["Risk of relativism: if all practices are equal, what warrants teaching dominant forms? (Delpit's power-codes argument complicates it.)","Ethnographic methods limit causal claims and scalability.","Brandt and Clinton note it can overlocalize, missing how literacy technologies travel across contexts."],
 related:["freire","crp","vygotsky","rosenblatt","funds"],
 refs:["Street, B. V. (1984). Literacy in theory and practice. Cambridge University Press.","Gee, J. P. (2015). Social linguistics and literacies: Ideology in discourses (5th ed.). Routledge.","Heath, S. B. (1983). Ways with words: Language, life, and work in communities and classrooms. Cambridge University Press.","New London Group. (1996). A pedagogy of multiliteracies: Designing social futures. Harvard Educational Review, 66(1), 60–92."],
 compare:{learner:"A member of communities with distinct literacy practices and Discourses", mechanism:"Socialization into, and redesign of, situated literacy practices", instructor:"Bridge-builder between community literacies and powerful Discourses", knowledge:"Plural literacies; always value-laden and contextual", critique:"Relativism risk; hard to scale or test causally"}
},
{
 id:"chall", name:"Stages of Reading Development", discipline:"Literacy", depth:"deep",
 theorists:"Jeanne Chall (1921–1999)",
 tagline:"Reading develops through qualitatively different stages — from pre-reading through decoding and fluency to reading to learn, multiple viewpoints, and construction.",
 origins:"Chall's Learning to Read: The Great Debate (1967) weighed code-emphasis against meaning-emphasis instruction, favoring systematic phonics early. Her 1983 stage model gave the field a developmental map, including the much-cited shift from 'learning to read' to 'reading to learn' and the 'fourth-grade slump'.",
 claims:["Reading proficiency develops in ordered stages with different instructional needs (Stages 0–5).","Early code-emphasis instruction better serves Stage 1 decoding than meaning-first approaches.","Around Stage 3, the task shifts from learning to read toward reading to learn unfamiliar content.","Readers who lack fluency or knowledge stall at the transition — the fourth-grade slump, concentrated among low-income students."],

 id:"transfer", name:"Transfer of Learning", discipline:"Learning Theory", depth:"deep", dis:true,
 theorists:"David Perkins & Gavriel Salomon; John Bransford & Daniel Schwartz; Anne Beaufort (writing transfer); Edward Thorndike (origins)",
 tagline:"The central problem of education: when, why, and how does learning in one context carry over to new contexts — and why does it so often fail to?",
 origins:"Thorndike's identical-elements studies (1901) punctured claims that Latin 'trains the mind,' launching a century of transfer research. Perkins and Salomon systematized the field's distinctions (near/far, low road/high road); Bransford and Schwartz reframed transfer as preparation for future learning; Beaufort and Wardle brought the problem to writing studies, where it anchors your problem of practice.",
 claims:["Transfer is not automatic; it occurs reliably only under specific conditions of learning and instruction.","Low-road transfer rides on well-practiced, automatized skill triggered by perceptual similarity; high-road transfer requires mindful abstraction of principles and deliberate connection-making.","Teaching for transfer requires hugging (making learning resemble the transfer context) and bridging (explicitly abstracting and applying principles across contexts).","Traditional transfer tests understate what learners carry forward; the better question is whether prior learning prepares people to learn in the new situation (PFL).","In writing, transfer depends on knowledge of discourse community, genre, rhetorical situation, writing process, and subject matter — not generalized 'writing skill' alone (Beaufort)."],
 constructs:[
  {term:"Near vs. far transfer", def:"Carrying learning to closely similar contexts versus remote, dissimilar ones — far transfer is rare without explicit support."},
  {term:"Low road / high road", def:"Perkins & Salomon: automatic triggering of practiced routines vs. mindful abstraction and application of principles."},
  {term:"Hugging & bridging", def:"The two instructional levers: design tasks near the target context (hug) and explicitly abstract principles across contexts (bridge)."},
  {term:"Preparation for future learning (PFL)", def:"Bransford & Schwartz: transfer as readiness to learn from new resources, measured with learning opportunities rather than sequestered problem solving."},
  {term:"Adaptive expertise", def:"Expertise balancing efficiency with innovation — flexibility when routines fail (Hatano & Inagaki)."},
  {term:"Identical elements", def:"Thorndike's claim that transfer occurs only where situations share components — the historical baseline all later theories answer."},
  {term:"Bounded vs. expansive framing", def:"Engle: framing lessons as connected to students' pasts and futures increases transfer."}],

 critiques:["Persistent debate over how much far transfer is achievable at all (Detterman's skepticism vs. Perkins & Salomon's optimism).","Situated cognition theorists argue 'transfer' misframes the phenomenon — knowledge is tied to activity systems, so the unit of analysis should be participation (Lave; Greeno).","Measurement disputes: sequestered problem solving may miss transfer that PFL designs reveal.","Writing-transfer research is young; Beaufort-style longitudinal cases are rich but small-n."],

 tagline:"A methodology that designs interventions in real classrooms and studies them through iterative cycles — advancing usable theory and improved practice simultaneously.",
 origins:"Ann Brown and Allan Collins, frustrated that laboratory findings died in real classrooms, proposed 'design experiments' in 1992: engineer innovations in messy authentic settings and treat each iteration as both intervention and investigation. Cobb and colleagues, the DBR Collective, and McKenney and Reeves matured it into a methodology now central to practice-focused doctorates like the EdD.",

 applications:["The methodology of your dissertation: iterating an HCD4EDU-based writing intervention across cycles while studying transfer of argumentation.","Conjecture maps as the bridge from framework (HCD4EDU) to measurable mediating processes.","Curriculum and edtech development projects requiring evidence plus usability.","Research–practice partnerships between districts and universities."],

{
 id:"barkley", name:"Executive Function Model of ADHD", discipline:"Learning & ADHD", depth:"deep",
 theorists:"Russell Barkley (1997, 2012); Edmund Sonuga-Barke; Erik Willcutt (meta-analytic evidence)",
 tagline:"ADHD is not a knowledge problem but a performance problem: a difference in self-regulation and executive function that makes doing what you know inconsistent — and that responds to externalized structure, not willpower.",
 origins:"Barkley's 1997 unifying theory recast ADHD as a disorder of behavioral inhibition that cascades into four executive functions: nonverbal working memory, internalized speech, self-regulation of affect and motivation, and reconstitution (planning). This reframing moved intervention from 'try harder' toward engineering the environment at the point of performance, and it explains patterns familiar to many adult learners: brilliance on interesting tasks, stalling on important-but-boring ones.",
 claims:["ADHD centrally involves self-regulation and executive function, with attention as a downstream symptom.","It is a performance disorder, not a knowledge or ability disorder — the gap is between knowing and reliably doing.","Working memory and time perception differences produce 'time blindness': the future feels less real, so distant deadlines exert weak pull.","Interventions work best at the point of performance — externalizing time, motivation, and information in the environment where the task happens — rather than through insight alone.","EF profiles vary: meta-analytically, EF-test deficits appear in only a subset of people with ADHD, so individual strategy-fitting beats one-size-fits-all."],
 constructs:[
  {term:"Behavioral inhibition", def:"The capacity to pause before responding — Barkley's foundation on which the other EFs depend."},
  {term:"Executive functions", def:"Self-directed actions (working memory, self-talk, emotion/motivation regulation, planning) that enable goal pursuit across time."},
  {term:"Time blindness", def:"Weakened sense of future time; deadlines gain force only when near — arguing for artificial nearness (mini-deadlines, visible timers)."},
  {term:"Point of performance", def:"The place and moment a behavior should occur — where supports (timers, checklists, visible cues) actually change outcomes."},
  {term:"Externalization", def:"Moving working memory and motivation out of the head: visible plans, alarms, accountability structures, written next-actions."},
  {term:"Performance vs. knowledge gap", def:"'ADHD is not a disorder of knowing what to do, but of doing what you know' — the design principle behind every effective support."}],
 applications:["Doctoral-study design: break the dissertation into visible mini-deadlines with external accountability (advisor check-ins, writing groups).","Externalize everything: one visible task list, timers you can see, next-action notes left where you'll resume work.","Work at the point of performance: set up tomorrow's writing session tonight — document open, one sentence of instructions to yourself.","Instructional design lens: EF-aware course design (chunking, frequent low-stakes deadlines) is UDL for executive function."],
 critiques:["Competing models: Brown emphasizes activation/arousal; Sonuga-Barke's dual-pathway adds a motivational (delay-aversion) route independent of inhibition.","EF tests only modestly predict real-world functioning; ecological measures diverge from lab measures.","Deficit language is contested — neurodiversity perspectives emphasize context-fit and strengths (interest-driven engagement) alongside impairment."],
 related:["adhd_strategies","implementation","dualpathway_adhd","srl","sdt","udl"],
 refs:["Barkley, R. A. (1997). Behavioral inhibition, sustained attention, and executive functions: Constructing a unifying theory of ADHD. Psychological Bulletin, 121(1), 65–94.","Barkley, R. A. (2012). Executive functions: What they are, how they work, and why they evolved. Guilford Press.","Willcutt, E. G., Doyle, A. E., Nigg, J. T., Faraone, S. V., & Pennington, B. F. (2005). Validity of the executive function theory of attention-deficit/hyperactivity disorder: A meta-analytic review. Biological Psychiatry, 57(11), 1336–1346."],

const SCENARIOS = [
{scene:"A third-grade teacher gives points redeemable for prizes whenever students turn in homework. Completion jumps immediately — but when the point system ends in spring, completion falls below where it started. Which pair of theories best explains BOTH the rise and the fall?",
 options:["Behaviorism explains the rise; Self-Determination Theory explains the fall","Cognitive Load Theory explains the rise; Schema Theory explains the fall","Sociocultural Theory explains both","Expectancy-Value Theory explains the rise; Bloom's Taxonomy explains the fall"],
 answer:0, why:"Operant reinforcement predicts the immediate increase (behavior followed by reward is strengthened). SDT's undermining effect predicts the crash: contingent extrinsic rewards can crowd out whatever intrinsic or internalized motivation existed, so removal leaves less motivation than before."},
{scene:"A doctoral student can recite the definition of 'zone of proximal development' perfectly but cannot recognize it operating in a classroom video. Which concept best names this problem?",
 options:["Inert knowledge (situated learning)","Extraneous cognitive load","A fixed mindset","Efferent stance (Rosenblatt)"],
 answer:0, why:"Situated learning theorists call knowledge that can be recited but not used 'inert' — a predicted result of learning concepts apart from authentic activity. The remedy is applying concepts within practice, exactly what this scenario tab is for."},
{scene:"A middle-school math teacher demonstrates a new procedure while students watch, then has them study several fully worked solutions before trying problems on their own. Struggling students improve markedly. Which framework most directly predicts this result?",
 options:["Cognitive Load Theory (worked-example effect)","Critical pedagogy","Connectivism","Transformative learning"],
 answer:0, why:"CLT's worked-example effect: novices learn more from studying worked solutions than from unsupported problem solving, because problem search overloads working memory before schemas exist. Note the expertise reversal effect predicts this support should fade as students advance."},
{scene:"After a unit on seasons, most students still explain that summer is warmer because Earth moves closer to the sun — despite having been told otherwise twice. Which theory best explains the persistence, and what does it prescribe?",
 options:["Conceptual change theory: create dissatisfaction with the misconception and offer an intelligible, plausible, fruitful alternative","Behaviorism: reinforce correct answers more consistently","Andragogy: adults need to know why they are learning","Simple View of Reading: improve decoding first"],
 answer:0, why:"Intuitive theories resist mere telling. Posner and colleagues argue accommodation requires dissatisfaction (e.g., a discrepant event — both hemispheres would be close simultaneously) plus a more fruitful alternative (axial tilt), not just repetition."},
{scene:"A principal notices that students labeled 'low readers' in September receive fewer open-ended questions and less wait time all year, and end further behind. Which sociological lens most directly names this dynamic?",
 options:["Labeling and the self-fulfilling prophecy (symbolic interactionism)","Loss aversion (prospect theory)","The testing effect","Genre as social action"],
 answer:0, why:"Symbolic interactionism and labeling theory (Becker; Rist's classic classroom study) describe how institutional labels alter treatment and expectations, producing the very outcomes they predict. Attribution and expectation research supplies the micro-mechanisms."},
{scene:"An EdD student designs professional development where teachers first try a new discussion protocol with their own students, then meet to reflect, extract principles, and plan a revised attempt next month. Which framework did she build the cycle on?",
 options:["Kolb's experiential learning cycle","Bloom's taxonomy","The Simple View of Reading","Dual-process theory"],
 answer:0, why:"Concrete experience (trying the protocol) → reflective observation (debrief) → abstract conceptualization (principles) → active experimentation (revised plan): Kolb's four modes in sequence, applied to adult professional learning."},
{scene:"A fifth grader decodes a passage about cricket fluently but comprehends almost nothing; a classmate who just arrived from another country understands cricket deeply but stumbles on the words. Which framework best distinguishes their needs?",
 options:["Simple View of Reading: comprehension = decoding × language/knowledge, so each child has a different weak factor","Growth mindset: both need process praise","Communities of practice: both need legitimate peripheral participation","Backward design: start from desired results"],
 answer:0, why:"RC = D × LC. The first child has strong D but weak background knowledge/schema for cricket (LC side); the newcomer has strong LC for this topic but needs decoding support. Schema theory explains the first child's failure; the multiplicative model explains why each needs a different intervention."},
{scene:"A university simplifies its aid-renewal form from twelve steps to three and sends two text reminders before the deadline. Renewals among first-generation students rise noticeably. Which framework does this intervention apply?",
 options:["Nudge theory / choice architecture — reducing friction (sludge)","Cognitive dissonance — insufficient justification","Culturally sustaining pedagogy","Metacognitive calibration"],
 answer:0, why:"Removing friction and adding timely salience are classic choice-architecture moves (Thaler & Sunstein; Castleman & Page's summer-melt studies). No preferences were changed — the path to an intended action was cleared."},
{scene:"Two students fail the same statistics exam. One says, 'I'm just not a math person.' The other says, 'I only did massed rereading — I should space my practice and self-test.' Which pair of theories best captures the difference in their explanations?",
 options:["Attribution theory (stable/uncontrollable vs. unstable/controllable causes) and mindset theory","Prospect theory and flow theory","Schema theory and genre theory","Andragogy and connectivism"],
 answer:0, why:"Weiner: 'not a math person' is internal, stable, uncontrollable — it lowers expectancy and invites helplessness. The strategy attribution is unstable and controllable, preserving expectancy. The contrast also maps onto Dweck's fixed vs. growth mindsets, and the second student happens to be citing desirable difficulties correctly."},
{scene:"A teacher-education program moves methods courses into partner schools, where candidates begin by leading small-group routines alongside mentor teachers before gradually taking on whole-class instruction. Which theory most directly informs this design?",
 options:["Situated learning: legitimate peripheral participation in a community of practice","Multimedia learning: the modality principle","Prospect theory: reference dependence","Chall's stages: reading to learn"],
 answer:0, why:"Lave and Wenger: newcomers learn by sanctioned, low-stakes participation at the edge of authentic practice, moving centripetally toward full participation — precisely the residency logic, with mentors as old-timers granting access."},
{scene:"An instructional designer's training video shows dense on-screen text while a narrator reads the identical words aloud over decorative stock footage. Learners perform worse than with a simpler version. Which principles were violated?",
 options:["Redundancy and coherence principles (multimedia learning)","The testing and spacing effects","Scaffolding within the ZPD","Warrant and backing (Toulmin)"],
 answer:0, why:"Mayer: narration plus identical on-screen text overloads the verbal channel (redundancy), and decorative footage adds seductive details that harm learning (coherence). The fix: graphics with narration alone, minus the decoration."},
{scene:"A veteran teacher in a doctoral seminar reads equity audit data from her own school that contradicts her belief that 'discipline here is colorblind.' Shaken, she begins questioning assumptions she has held for twenty years, discussing them intensely with critical friends, and ultimately redesigns her referral practices. Which theory best describes this arc?",
 options:["Transformative learning: disorienting dilemma → critical reflection → discourse → action","Behaviorism: stimulus generalization","Cognitive load: expertise reversal","Simple View of Reading"],
 answer:0, why:"Mezirow's sequence exactly: a disorienting dilemma (the data), critical premise reflection, rational discourse with peers, and reintegration through action. Festinger's dissonance names the discomfort; Freire would push the outcome toward collective action."},
{scene:"Students write lab reports that earn high marks in biology but are marked down in chemistry for 'wrong format,' though the writing quality seems identical. Which framework best explains what the students still need to learn?",
 options:["Genre theory: each discipline's report is a distinct genre serving a distinct discourse community","Maslow's hierarchy: unmet safety needs","Flow theory: challenge–skill imbalance","The spacing effect"],
 answer:0, why:"Genres are typified social actions of particular discourse communities (Miller; Swales). 'Good writing' is community-relative: the students have general skills but lack genre knowledge — the purposes, moves, and conventions each discipline's community expects."},
{scene:"Designing her dissertation study, an EdD candidate must justify why she will use interviews to explore how first-year teachers 'make meaning' of mentoring, rather than running an experiment. Which foundation must she articulate?",
 options:["Her epistemological paradigm — an interpretivist/constructivist stance on what counts as knowledge","Her reinforcement schedule","The coherence principle","Her deck's spacing interval"],
 answer:0, why:"Methodology follows epistemology. Studying constructed meaning presumes knowledge is contextual and co-constructed (interpretivism), warranting qualitative interviews; a positivist stance would warrant controlled measurement. Committees expect this alignment argued explicitly."},
{scene:"A high school revises its American history course so students corroborate conflicting primary sources about the same strike, asking who wrote each account, when, and why — instead of memorizing the textbook narrative. Which shift does this represent?",
 options:["From an 'encyclopedia' epistemology toward disciplinary historical thinking (sourcing, contextualization, corroboration)","From aesthetic to efferent reading","From germane to extraneous load","From relatedness to autonomy"],
 answer:0, why:"Wineburg's heuristics define the move: treating texts as evidence authored by positioned humans rather than as neutral information. It is also an epistemological shift — from certain, given knowledge to evaluativist judgment among competing accounts."},
{scene:"Students write strong Toulmin-style arguments in English class, but their posts in a civics forum and their science conclusions show none of that structure. Their teacher starts having them abstract the claim–evidence–warrant principle explicitly, then forecast where else they will use it — and assigns argument tasks in three different classes. Which framework names her two moves?",
 options:["Transfer of learning: bridging (mindful abstraction) and hugging (practicing near the target contexts)","Cognitive dissonance: insufficient justification","Maslow: deficiency needs before growth needs","The redundancy principle"],
 answer:0, why:"Perkins and Salomon's high-road/low-road account prescribes exactly this pair: bridging builds mindful abstraction of the principle for far transfer, while hugging makes practice resemble the civic and scientific target contexts for near transfer. This is the core of a problem of practice about transfer of argumentation across writing contexts."},

const store={

  set(k,v){ try{ localStorage.setItem('tl_'+k, JSON.stringify(v)); }catch(e){} }
};
const DAY=86400000, BOX_DAYS=[0,1,3,7,14,30,60];
function today(){ return new Date().toISOString().slice(0,10); }
function bumpStats(){
  const s=store.get('stats',{total:0,last:'',streak:0});
  const t=today();
  if(s.last!==t){
    const y=new Date(Date.now()-DAY).toISOString().slice(0,10);
    s.streak=(s.last===y)?s.streak+1:1; s.last=t;
  }
  s.total++; store.set('stats',s); return s;
}
function grade(key,good){
  const rec=store.get('srs',{});
  const r=rec[key]||{box:0};
  if(good){ r.box=Math.min(r.box+1,BOX_DAYS.length-1); r.due=Date.now()+BOX_DAYS[r.box]*DAY; }
  else{ r.box=1; r.due=Date.now(); }
  rec[key]=r; store.set('srs',rec); bumpStats();
}

function matches(t,q){

}

/* --- flashcards --- */
let deck=[], deckPos=0, seen=0, flipped=false;
function fcPool(){
  const disc=$('#fc-disc').value, mode=$('#fc-mode').value;
  const pool=[];
  THEORIES.filter(t=>disc==='All'||t.discipline===disc).forEach(t=>{
    if(mode==='construct') (t.constructs||[]).forEach(c=>pool.push({f:`${c.term}\n\n(${t.name})`, b:c.def, k:`c|${t.id}|${c.term}`}));
    if(mode==='theorist') pool.push({f:`Who is most associated with:\n\n${t.name}?`, b:t.theorists, k:`t|${t.id}`});
    if(mode==='claim') (t.claims||[]).slice(0,2).forEach((cl,i)=>pool.push({f:`Which theory claims:\n\n“${cl}”`, b:`${t.name} — ${t.theorists}`, k:`cl|${t.id}|${i}`}));
  });
  return pool;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildDeck(){
  const dsel=$('#fc-disc');
  if(!dsel.options.length){ dsel.innerHTML=['All',...DISCS].map(d=>`<option>${esc(d)}</option>`).join(''); dsel.addEventListener('change',buildDeck); $('#fc-mode').addEventListener('change',buildDeck); $('#fc-size').addEventListener('change',buildDeck); }
  const pool=fcPool(), n=+$('#fc-size').value, now=Date.now(), rec=store.get('srs',{});
  const due=[], fresh=[], later=[];
  pool.forEach(c=>{ const r=rec[c.k]; if(!r) fresh.push(c); else if(r.due<=now) due.push(c); else later.push(c); });
  shuffle(due); shuffle(fresh); shuffle(later);
  const ordered=[...due,...fresh,...later];
  deck=n?ordered.slice(0,n):ordered; deckPos=0; seen=0;
  const s=store.get('stats',{total:0,streak:0});
  $('#fc-stats').textContent=`Due now: ${due.length} · New: ${fresh.length} · Streak: ${s.streak||0} day${s.streak===1?'':'s'} · ${s.total||0} lifetime reviews`;
  renderCard();
}
function renderCard(){
  const area=$('#fc-area'); flipped=false;
  if(!deck.length){area.innerHTML='<div class="empty">No cards for this filter.</div>';return;}
  if(deckPos>=deck.length){area.innerHTML=`<div class="empty">Deck done — ${seen} reviews. That's a real win; retrieval now beats rereading later. 🎓<br><br><button class="rellink" onclick="buildDeck()">New round</button></div>`;return;}
  const c=deck[deckPos];
  area.innerHTML=`
    <div class="fcstage"><div class="fcard" id="fc">
      <div class="face front"><div class="lbl">Prompt — tap to flip</div><div class="txt">${esc(c.f).replace(/\n/g,'<br>')}</div></div>
      <div class="face back"><div class="lbl">Answer</div><div class="txt">${esc(c.b)}</div></div>
    </div></div>
    <div class="fcbtns">
      <button class="again">↺ Again</button>
      <button class="good">✓ Got it</button>
    </div>
    <div class="fcmeta">Card ${Math.min(deckPos+1,deck.length)} of ${deck.length}</div>`;
  $('#fc').addEventListener('click',()=>{flipped=!flipped;$('#fc').classList.toggle('flip');});
  area.querySelector('.again').addEventListener('click',()=>{seen++; grade(c.k,false); deck.push(deck[deckPos]); deckPos++; renderCard();});
  area.querySelector('.good').addEventListener('click',()=>{seen++; grade(c.k,true); deckPos++; renderCard();});
}

/* --- scenarios --- */
let sIdx=0, sScore=0, sAnswered=0;
function renderScenario(){
  const area=$('#scen-area');
  if(sIdx>=SCENARIOS.length){
    const best=Math.max(sScore,store.get('scenBest',0)); store.set('scenBest',best);
    area.innerHTML=`<div class="scen"><div class="stext">Round complete: <b>${sScore} / ${SCENARIOS.length}</b> correct. Personal best: <b>${best}</b>.</div>
    <div class="scen-nav"><span class="scorepill">Repetition builds transfer — run it again.</span><button onclick="sIdx=0;sScore=0;sAnswered=0;renderScenario()">Restart</button></div></div>`;
    return;
  }
  const s=SCENARIOS[sIdx];
  area.innerHTML=`<div class="scen">
    <div class="scorepill" style="margin-bottom:8px;">Scenario ${sIdx+1} of ${SCENARIOS.length} · Score ${sScore}</div>
    <div class="stext">${esc(s.scene)}</div>
    ${s.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}
    <div id="why"></div>
    <div class="scen-nav"><span></span><button id="nextS" disabled>Next →</button></div>
  </div>`;
  let done=false;
  area.querySelectorAll('.opt').forEach(btn=>btn.addEventListener('click',()=>{
    if(done) return; done=true;
    const i=+btn.dataset.i;
    if(i===s.answer){btn.classList.add('correct'); sScore++;}
    else{btn.classList.add('wrong'); area.querySelector(`.opt[data-i="${s.answer}"]`).classList.add('correct');}
    $('#why').innerHTML=`<div class="why"><b>Why:</b> ${esc(s.why)}</div>`;
    $('#nextS').disabled=false;
  }));
  $('#nextS').addEventListener('click',()=>{sIdx++;renderScenario();});
}

function renderIndex(){
  const area=$('#index-area');
  let builtT=0, allT=0, html='';
  const CATS=[...DISCS, ...Object.keys(STUBS).filter(k=>!DISCS.includes(k))];
  CATS.forEach(d=>{
    const built=THEORIES.filter(t=>t.discipline===d);
    const stubs=STUBS[d]||[];
    builtT+=built.length; allT+=built.length+stubs.length;
    html+=`<div class="idx"><h3>${esc(d)}<span>${built.length} of ${built.length+stubs.length} built</span></h3>`;
    html+=built.map(t=>`<button class="idx-item built" data-id="${t.id}">✓ ${esc(t.name)}${t.dis?' ★':''}</button>`).join('');
    html+=stubs.map(s=>`<div class="idx-item stub"><b>${esc(s[0])}</b> — ${esc(s[1])}</div>`).join('');
    html+='</div>';
  });
  area.innerHTML=`<p class="note" style="text-align:left;margin:0 0 10px;">The full map of the Lab: <b>${builtT} theories built</b> (tap ✓ to open; ★ = in your Research Matrix) and <b>${allT-builtT} more on the horizon</b> — a curated landscape, since no finished list of all theories exists anywhere. Want one built out? Ask Claude and re-upload the app.</p>`+html;
  area.querySelectorAll('.idx-item.built').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active', x.dataset.tab==='library'));
    ['library','cards','compare','scenarios','index'].forEach(t=>$('#tab-'+t).classList.toggle('hidden', t!=='library'));
    currentTab='library';
    showDetail(b.dataset.id);
  }));
}
