{
 id:"backward", name:"Backward Design (Understanding by Design)", discipline:"Education & Pedagogy", depth:"deep",
 theorists:"Grant Wiggins & Jay McTighe (1998); kin to Ralph Tyler's rationale (1949)",
 tagline:"Plan curriculum backward: identify desired understandings first, determine acceptable evidence second, and only then design learning experiences.",
 problem:"Two units, two failures, one cause. In the first, the class 'finished chapter seven' — coverage achieved, understanding unknown, the test written Sunday night to ask whatever was easy to grade. In the second, students built dioramas they loved and learned almost nothing anyone could name. Wiggins and McTighe called these the twin sins — coverage-orientation and activity-orientation — and diagnosed the shared root: design that starts from content or fun instead of from the destination. Backward design exists to reverse the sequence: decide what understanding looks like, decide what would count as evidence of it, and only then plan the teaching.",
 asks:["What should design start from — content, activity, or evidence of understanding?","What actually counts as understanding, beyond correct answers on familiar tasks?","How would you know it happened — before you plan how to teach it?","How do you plan for transfer instead of coverage?"],
 iftrue:{
  teachers:"Hold the stage order like a discipline: desired results, then acceptable evidence, then — only then — learning experiences. Draft the performance task before the lessons; write essential questions that are genuinely open, recurring, and arguable; and widen your evidence beyond explanation using the six facets — can students interpret, apply, shift perspective, empathize, self-assess? A student who can only explain may only be reciting.",
  coaches:"Anchor unit-planning protocols in the stage order, and use the twin sins as gentle audit language — 'is this unit organized around evidence or around activities?' lands softer than 'this diorama teaches nothing.' Help teams separate standards coverage from understanding goals: a list of standards is an inventory, not a destination.",
  leaders:"UbD is front-loaded work — protect real design time or get template compliance instead of thinking. Structure curriculum maps and program review around alignment (goals–evidence–plan), and schedule PLC time for designing assessments together before units begin, which is where the framework pays or doesn't.",
  researchers:"Design frameworks resist trials — you can't randomize a philosophy — so the tractable studies are componential: do transfer-goal clarity, pre-designed performance assessment, and essential questions each move learning? Alignment measurement and implementation fidelity (template-filling versus actual backward reasoning) are the instruments this literature still needs."},
 reasoning:{
  notice:["Assessments written after the teaching — they reliably test what was mentioned, not what mattered.","Days of activity with no connection to any evidence of understanding: engaging, consuming, unaccountable.","Whether students can say what they're learning toward — 'we're doing a poster' is an activity answer to a purpose question.","Essential questions that are neither: closed, answerable by Friday, or just objectives wearing question marks."],
  assume:["That coverage is learning — 'we got through it' describes the teacher's journey, not the students'.","That engagement is purpose: the twin sins are both engaging; that's what makes them durable.","That objectives-first kills creativity — stage three is where creativity lives, now bounded by a destination; purposeless activity isn't creativity, it's drift."],
  decide:["Draft the performance task first and let it discipline everything upstream.","Write two to four essential questions worth arguing about all year — open, recurring, transfer-bearing.","Check every planned activity against the evidence it serves; orphaned activities get adopted by a purpose or cut.","Build at least one genuine transfer task per unit: the understanding performed in a context nobody practiced."],
  avoid:["Template compliance — boxes filled, thinking skipped; UbD's own authors call this its most common corruption.","Both twin sins, including the rigorous-looking one: relentless coverage is as purposeless as relentless fun.","Essential questions manufactured by adding question marks to objectives.","Assessing only what grades easily — the evidence decision, made lazily, quietly rewrites the goals."]},
 competing:[
  {scenario:"The unit everyone loved produced learning nobody can find.", thisView:"Activity-orientation: no evidence chain connected the fun to any understanding goal. Redesign backward — name the understanding, define its evidence, and keep only the beloved activities that serve it.", other:"Experiential Learning (Kolb)", otherView:"The experience was fine; the cycle was amputated — no structured reflection, no concept-naming, no next experiment. Complete the loop and the same activity teaches.", agree:"Both refuse to blame the activity itself, and both add missing architecture — UbD upstream (purpose and evidence), Kolb downstream (reflection and abstraction). A great unit usually needs both ends built."},
  {scenario:"Doesn't fixing outcomes in advance foreclose genuine inquiry?", thisView:"Transfer goals and essential questions fix a horizon, not a route: 'students will evaluate evidence like historians' leaves enormous room for where inquiry wanders — purpose and emergence aren't enemies.", other:"Emergent inquiry (the Deweyan/Reggio tradition)", otherView:"The deepest learning follows questions students actually raise, which no planner anticipated; pre-specified understandings, however broad, still center the designer's map over the learner's curiosity.", agree:"Both despise aimless activity and both want inquiry with intellectual integrity. The workable peace: backward-design the enduring understandings loosely enough that student questions can steer the route — and revisit stage one when the room discovers a better destination."}],
 research:{
  questions:["Do backward-designed units outperform forward-designed ones on transfer measures?","Which components — transfer goals, pre-built assessments, essential questions — carry the effects?","What distinguishes genuine backward reasoning from template compliance, and how is each detected?","How does performance assessment quality mediate the framework's value?"],
  methods:"Quasi-experimental unit comparisons; alignment analyses of goals, evidence, and activities; implementation studies distinguishing fidelity of thinking from fidelity of paperwork; performance-assessment validation work.",
  variables:"Alignment indices, transfer-task performance, assessment quality ratings, teacher design-reasoning measures, and the coverage/activity/evidence orientation of enacted units.",
  support:"Enormous adoption, modest direct evidence — the honest pattern for design frameworks. The components stand on solid ground borrowed from adjacent literatures: goal clarity, aligned assessment, and transfer-oriented tasks are each well supported. What's thin is whole-framework causal proof, and what's documented is the corruption mode: templates filled without the reasoning they were built to force. The framework's value is exactly as real as the thinking it manages to cause."},
 reflect:["Take your favorite unit: was it designed forward from content, forward from a beloved activity, or backward from evidence? What would redesigning it backward change first?","What is your current unit's answer to a student who asks 'why are we doing this?' — and is it a purpose or an itinerary?","Write your discipline's best essential question — open, recurring, arguable. Would your students recognize it as the question your course keeps asking?","Where does your assessment test what was easy to grade rather than what you claimed to value?","Which understanding in your course deserves a transfer task — performed in a context nobody practiced — and what's stopping you from building it?"],
 constellation:{builds:["bloom","dewey"],complements:["udl","transfer"],pairs:["hcd","wtl"]},
 origins:"Tyler's 1949 rationale established objectives-first curriculum thinking. Wiggins and McTighe's Understanding by Design operationalized it against 'coverage' and 'activity-oriented' teaching, defining understanding through six facets and organizing units around big ideas and essential questions.",
 claims:["Curriculum should be planned from outcomes backward, not from textbooks or activities forward.","Understanding is revealed through transfer — applying learning to new situations — not recall alone.","Assessment evidence must be determined before instruction is designed (Stage 2 before Stage 3).","Big ideas and essential questions give coherence and priority to content decisions."],
 constructs:[
  {term:"Three stages", def:"1) Identify desired results; 2) Determine acceptable evidence; 3) Plan learning experiences."},
  {term:"Six facets of understanding", def:"Explanation, interpretation, application, perspective, empathy, self-knowledge."},
  {term:"Essential questions", def:"Open, recurring questions that provoke inquiry into big ideas."},
  {term:"Transfer goals", def:"Long-term abilities to apply learning autonomously in new contexts."},
  {term:"Twin sins", def:"Activity-oriented and coverage-oriented design — engaging or thorough but purposeless."}],
 applications:["Unit and course design templates; curriculum mapping across programs.","Performance-task assessment design (GRASPS).","Program review and accreditation alignment work.","A practical companion framework for EdD improvement projects."],
 critiques:["Objectives-first logic can constrain emergent, learner-driven inquiry.","Time-intensive; fidelity often reduces to filling templates.","Inherits critiques of Tyler rationale: technical rationality and whose objectives count."],
 related:["bloom","udl","freire"],
 refs:["Wiggins, G., & McTighe, J. (2005). Understanding by design (Expanded 2nd ed.). ASCD.","Tyler, R. W. (1949). Basic principles of curriculum and instruction. University of Chicago Press.","McTighe, J., & Wiggins, G. (2013). Essential questions: Opening doors to student understanding. ASCD."],
 compare:{learner:"A performer who must transfer understanding to new situations", mechanism:"Alignment of outcomes, evidence, and experience produces understanding", instructor:"Designer working backward from desired results", knowledge:"Organized around big ideas; proven through transfer", critique:"Technical-rational; can suppress emergent curriculum"}

{
 id:"svr", name:"Simple View of Reading & Scarborough's Rope", discipline:"Literacy", depth:"deep",
 theorists:"Philip Gough & William Tunmer (1986); Hollis Scarborough (2001)",
 tagline:"Reading comprehension is the product of decoding and language comprehension — and each strand is itself a braid of teachable skills.",
 problem:"A fifth grader reads the passage aloud flawlessly and can't answer a single question about it. Two rooms away, a classmate stumbles through every third word but discusses the read-aloud like a graduate student. Both get labeled 'struggling readers' and sent to the same intervention — where one gets phonics she mastered years ago and the other gets comprehension strategies for a decoding problem. The Simple View exists to end this diagnostic malpractice: reading failure is not one thing, comprehension is not a skill you drill directly, and the multiplication sign in RC = D × LC is a claim about why teaching to the wrong factor buys nothing.",
 asks:["What are the necessary and separable components of reading comprehension?","Why do different readers fail differently — and why does one intervention not fit all?","Is comprehension a teachable skill in its own right, or the product of other things?","What should screening and intervention actually target?"],
 iftrue:{
  teachers:"Diagnose the profile before choosing the treatment: listening comprehension is your cheapest diagnostic — a student who understands the text read aloud has a decoding-side problem; one who doesn't has a language-and-knowledge problem no phonics can touch. Build the LC factor deliberately: vocabulary, background knowledge, and complex syntax are reading instruction, whatever subject you teach. And put fluency work where it belongs — as the bridge that frees capacity for meaning.",
  coaches:"Bring the two-factor lens to every data meeting: sort the intervention list by which factor each program actually targets, then sort the students the same way, and watch the mismatches surface. Help content-area colleagues see themselves accurately: every science and history teacher is a language-comprehension teacher — the LC factor is built in their rooms or not at all.",
  leaders:"Buy screening that separates the components; a single 'reading level' hides exactly what you need to know. Align purchased interventions to actual student profiles, not to what the vendor bundled. And bring nuance to reading policy: the science of reading is not phonics-only — the same evidence base says knowledge-rich curriculum IS comprehension instruction, which makes curriculum adoption your biggest literacy decision.",
  researchers:"Measure componentially and model multiplicatively; test where the product formulation holds and bends (orthography, age, bilingual profiles). The Active View's additions — fluency as bridge, executive function, motivation — are the live research frontier: which additions earn their variance, and which are D and LC wearing costumes?"},
 reasoning:{
  notice:["The fluent-but-lost reader: accurate, quick, comprehending nothing — a pure LC profile hiding in plain sight because oral reading sounds fine.","The laborious-but-smart reader: slow, effortful decoding with strong understanding of anything heard — a decoding/fluency profile.","Comprehension that swings wildly by topic: that's knowledge, not 'reading level,' doing the work.","What happens with read-alouds: the fastest profile diagnostic a classroom teacher owns."],
  assume:["That 'poor comprehender' names one condition — the model's entire point is that it names at least two, requiring opposite treatments.","That comprehension-strategy instruction can substitute for knowledge and vocabulary; strategies help briefly and plateau fast.","That the job ends when decoding is secured — the LC ceiling rises for life, and so must the instruction that builds it."],
  decide:["Match intervention to profile: decoding-weak students get systematic word-level work; LC-weak students get knowledge, vocabulary, and syntax; mixed profiles get both, deliberately.","Run knowledge-rich, topic-coherent units — the comprehension intervention that compounds.","Keep read-alouds and discussion above students' decoding level so LC grows while decoding catches up.","Schedule fluency routines (repeated and wide reading) as the capacity-freeing bridge."],
  avoid:["Generic 'reading groups' that mix opposite failure profiles into one treatment.","The strategy-of-the-week carousel as the whole comprehension plan.","A leveled-text-only diet that caps knowledge exposure at decoding level for years.","Declaring victory after the phonics battle — half the model remains, and it's the half that never ends."]},
 competing:[
  {scenario:"A middle schooler reads aloud beautifully and comprehends almost nothing.", thisView:"A language-comprehension deficit: vocabulary, background knowledge, or syntax — decoding multiplied by near-zero LC yields near-zero comprehension, and the treatment is years of knowledge and language building.", other:"New Literacy Studies (Gee, Street)", otherView:"Ask whose language and whose knowledge the school's texts presume: the student may command rich literacies the assessment never samples. The 'deficit' partly describes a mismatch between his literacies and the school's, not an absence.", agree:"Both agree decoding isn't the problem and word-level intervention would be malpractice. The productive synthesis: build the academic register and knowledge (SVR) while recognizing and bridging from the literacies the student already owns (NLS)."},
  {scenario:"A district relitigates the reading wars over its early-literacy adoption.", thisView:"The evidence is two-handed: systematic, explicit decoding instruction early — non-negotiable — AND relentless knowledge and language building throughout. Phonics-only and phonics-never are both half a program.", other:"Whole Language (Goodman)", otherView:"Reading is meaning-first: immerse children in authentic texts and the code follows naturally, as it does in speech; skill drills fragment a meaningful act.", agree:"On the psycholinguistic-guessing model, the evidence ruled: it lost, and 'cueing' instruction is fading from policy. But whole language was right that volume, authentic texts, and engagement matter — the modern consensus keeps its library and replaces its theory of the code."}],
 research:{
  questions:["Is the D × LC relation truly multiplicative, and where does it bend (age, orthography, bilingualism)?","What are the prevalences of the distinct struggling-reader profiles, and do they respond differentially to matched intervention?","Which LC components — vocabulary, knowledge, syntax, inference — carry the most weight, when?","What do the Active View's additions (fluency, executive function, motivation) explain beyond D and LC?"],
  methods:"Longitudinal componential batteries with regression and SEM; profile-based classification studies; randomized component-targeted intervention trials; cross-linguistic comparisons exploiting orthographic differences.",
  variables:"Word-reading accuracy and efficiency, pseudo-word decoding, listening comprehension, vocabulary depth, background knowledge, fluency, and reading comprehension as the criterion.",
  support:"Among the most replicated frameworks in reading science: D and LC jointly explain the lion's share of comprehension variance across ages and languages, and profile-matched intervention logic follows directly. Honest boundaries: transparent orthographies shift the weights, the two factors interweave developmentally rather than sitting cleanly apart, and the field's own update (the Active View) argues the simple model is true but incomplete."},
 reflect:["Picture your three weakest readers. For each: decoding problem, language-and-knowledge problem, or both — and what evidence do you actually have?","What does your school's intervention menu target, factor by factor? Now overlay your students' actual profiles. Where are the mismatches?","If you teach a content area: what did your students' language comprehension gain from your class this month — vocabulary, syntax, knowledge — and was any of it deliberate?","What would change in your building if every 'reading level' was replaced by a two-factor profile?","Where has comprehension-strategy practice been standing in for knowledge that was never built?"],
 constellation:{builds:["infoprocessing"],complements:["schema","chall","wtl"],contrasts:["nls"],pairs:["cogload","transfer"]},
 origins:"Gough and Tunmer proposed RC = D × LC to clarify debates about reading disability, distinguishing dyslexia (decoding deficit) from comprehension-specific difficulty. Scarborough's rope visualized the strands — word recognition becoming automatic, language comprehension becoming strategic — and became an icon of the 'science of reading' movement.",
 claims:["Reading comprehension requires both decoding and linguistic comprehension; neither alone suffices (multiplicative, not additive).","Word-recognition strands (phonological awareness, decoding, sight recognition) must become increasingly automatic.","Language-comprehension strands (background knowledge, vocabulary, syntax, verbal reasoning, literacy knowledge) must become increasingly strategic.","Reading difficulties can be classified and targeted by profile: decoding-weak, comprehension-weak, or mixed."],
 constructs:[
  {term:"Decoding (D)", def:"Efficient word recognition via grapheme–phoneme mapping; the print-specific component."},
  {term:"Language comprehension (LC)", def:"Understanding spoken language: vocabulary, background knowledge, syntax, inference."},
  {term:"RC = D × LC", def:"If either factor is zero, comprehension is zero — the multiplicative claim."},
  {term:"Phonological awareness", def:"Sensitivity to the sound structure of language, a precursor of decoding."},
  {term:"Orthographic mapping", def:"Binding spellings to pronunciations and meanings so words are recognized instantly (Ehri)."},
  {term:"Automaticity & fluency", def:"Effortless word recognition freeing capacity for comprehension (LaBerge & Samuels)."}],
 applications:["Screening and intervention systems that diagnose by component profile.","Structured literacy and systematic phonics for the decoding strand.","Knowledge-rich curriculum and vocabulary work for the LC strand.","Policy analysis of state reading legislation — a live EdD topic."],
 critiques:["Critics argue two factors oversimplify (motivation, executive function, fluency as separate contributor — the Active View of Reading, Duke & Cartwright, 2021).","'Science of reading' policy applications sometimes outrun the model's scope.","Product formulation fits English; transparency of orthography moderates it."],
 related:["chall","schema","infoprocessing","nls"],
 refs:["Gough, P. B., & Tunmer, W. E. (1986). Decoding, reading, and reading disability. Remedial and Special Education, 7(1), 6–10.","Scarborough, H. S. (2001). Connecting early language and literacy to later reading (dis)abilities. In S. B. Neuman & D. K. Dickinson (Eds.), Handbook of early literacy research (pp. 97–110). Guilford Press.","Duke, N. K., & Cartwright, K. B. (2021). The science of reading progresses: Communicating advances beyond the simple view of reading. Reading Research Quarterly, 56(S1), S25–S44."],
 compare:{learner:"A reader whose comprehension is bounded by decoding × language", mechanism:"Automatizing word recognition while growing strategic comprehension", instructor:"Diagnostician targeting the weak strand with explicit instruction", knowledge:"Componential skills that braid into skilled reading", critique:"Two factors omit motivation, executive function, and fluency's role"}

{
 id:"schema", name:"Schema Theory of Comprehension", discipline:"Literacy", depth:"deep",
 theorists:"Frederic Bartlett (1932); Richard C. Anderson & P. David Pearson (1984)",
 tagline:"Comprehension is the interaction of text with the reader's organized prior knowledge — no schema, no understanding.",
 problem:"Hand the same passage to thirty students and get thirty different comprehensions — and the pattern isn't 'reading level.' In the famous study, weak readers who knew baseball out-comprehended strong readers who didn't; the knowledge beat the skill. Meanwhile classrooms drill comprehension strategies for years with plateauing returns, and test passages quietly reward the students whose home experiences happen to match the content. Schema theory exists to explain the uncomfortable truth beneath all of this: meaning is not extracted from the page — it is constructed from what the reader already knows, which makes knowledge itself the hidden curriculum of comprehension.",
 asks:["Where does meaning actually come from, if the page underdetermines it?","Why does topic knowledge routinely trump measured 'reading skill'?","How do readers fill the gaps every text leaves — and why do they misfill them so coherently?","If comprehension runs on knowledge, what is comprehension instruction?"],
 iftrue:{
  teachers:"Activate before reading, but be honest about the limits: activation is a pump, and a pump needs a well — for many texts the real intervention is building knowledge over weeks, not warming it up for five minutes. Teach in coherent, connected units where each text feeds the next; pre-teach the two or three load-bearing concepts rather than ten vocabulary words; and treat coherent-but-wrong answers as diagnostic gold — a schema override tells you exactly which knowledge the reader used instead.",
  coaches:"Move teams toward a balanced diet: comprehension-strategy instruction pays off quickly and plateaus quickly; knowledge-building pays slowly and compounds. Audit text selection with one question — what does this text assume the reader already knows? — and treat cross-disciplinary planning (science and social studies feeding ELA) as comprehension instruction by other means.",
  leaders:"Curriculum coherence is a literacy intervention: a content-rich, sequenced curriculum where knowledge accumulates across years is the district-scale version of schema-building, and its comprehension effects arrive on a multi-year clock — protect the sequence long enough to collect them. Apply the equity lens to assessment: passage topics are knowledge lotteries, and 'neutral' comprehension tests are anything but.",
  researchers:"The classic manipulations (ambiguous passages, perspective shifts, knowledge-crossed designs) established the effect; the frontier is curricular — do knowledge-building curricula move comprehension at scale, over years, for whom? Situation-model measures beat literal recall as outcomes, and the knowledge-by-strategy interaction is the study the field keeps needing."},
 reasoning:{
  notice:["Comprehension that varies by topic more than by student: the same child is your strongest reader on one passage and lost on the next — knowledge, not ability, is moving.","Wrong answers that are internally coherent — the reader built a sensible model from the wrong schema; find which one and you've found the lesson.","Which texts light up which students: the room's distributed expertise is a map of available schemas (and an asset — see funds of knowledge).","Inference failures that trace to missing knowledge rather than missing skill: the bridge wasn't there to build."],
  assume:["That students 'have no background knowledge' — they have oceans of it; the question is whether school texts and tests happen to draw on theirs.","That activating is sufficient when the schema doesn't exist to activate.","That strategies transfer across content: strategy use is knowledge-hungry, and 'find the main idea' works only when you know enough to recognize one."],
  decide:["Sequence units so knowledge accumulates — text sets on one topic beat unrelated excellent texts, because volume on a topic builds the schema that makes the next text easier.","Pre-teach concepts that carry the text's structure, not lists of glossary words.","Make connections explicit: 'remember what we learned about X — watch how this text assumes it.'","Choose read-alouds and shared texts partly FOR the knowledge they deposit toward future reading."],
  avoid:["The random text-a-day diet, which ensures no schema ever compounds.","Strategy worksheets divorced from rich content — practicing extraction on texts about nothing.","Reaching for the 'struggling reader' label when the text presumed an experience the student was never given.","Cutting content-area minutes to buy more 'reading skill' minutes — it liquidates the asset that pays comprehension's bills."]},
 competing:[
  {scenario:"A student keeps missing inference questions.", thisView:"The bridge material is missing: inferences are built from knowledge the text assumes, and no inference-making routine can span a gap with nothing to build from. Diagnose which knowledge, then build it.", other:"Strategy instruction (comprehension-strategies tradition)", otherView:"Inference is a teachable move: model it, name it, practice self-questioning and monitoring — decades of studies show strategy instruction lifts comprehension, especially for struggling readers.", agree:"Both are right on different clocks: a small set of strategies taught briefly delivers quick, real gains — then plateaus; knowledge pays slowly and compounds for years. The mature program teaches strategies briefly and builds knowledge relentlessly."},
  {scenario:"Comprehension scores split along demographic lines.", thisView:"Passage topics are knowledge lotteries: tests sample experiences unevenly distributed by opportunity, so part of the gap is measurement artifact — and part is real, buildable knowledge difference schools can address with content-rich curriculum.", other:"Cultural Capital (Bourdieu)", otherView:"The deeper pattern: assessments reward the dominant class's knowledge and call it skill; the 'neutral' test is an instrument of reproduction, and fixing passages doesn't fix whose knowledge counts.", agree:"Complete agreement that comprehension tests are not knowledge-neutral. The responses stack rather than compete: build broad knowledge deliberately (schema), diversify whose knowledge appears in curriculum and assessment (CRP/funds), and stay honest about what scores mean."}],
 research:{
  questions:["How large are knowledge effects on comprehension relative to decoding and general skill?","Do knowledge-building curricula improve comprehension at scale, and on what timeline?","How do knowledge and strategy instruction interact — substitutes, complements, or sequenced?","What passage-knowledge demands create differential validity in assessments?"],
  methods:"The classic experimental paradigms (ambiguous passages, perspective manipulation, expertise-crossed designs like the baseball study); modern curriculum-level longitudinal and randomized studies; think-alouds and situation-model measures; content analyses of assessment passages.",
  variables:"Topic knowledge (measured, not assumed), recall and situation-model quality, inference generation, strategy use, and comprehension outcomes across matched high- and low-knowledge texts.",
  support:"The core effect is among the most robust in reading research — knowledge powerfully shapes comprehension, recall, and inference, replicated for fifty years. Honest limits: 'schema' itself proved too vague for cognitive science, which moved to situation-model theories (Kintsch); and curriculum-scale evidence, while promising (recent multi-year content-rich curriculum studies), is younger than the classroom enthusiasm it needs to justify."},
 reflect:["Think of your weakest comprehender. On what topic would they out-comprehend your strongest? What does that tell you the label is hiding?","Map your last month of texts: did any two feed each other, or was every reading a cold start?","What knowledge does next week's key text silently assume — and who in your room wasn't issued it?","Where does your school spend more on extracting meaning than on depositing the knowledge meaning is made from?","Whose knowledge does your favorite assessment reward — and what would a passage look like that drew on your students' funds instead?"],
 constellation:{builds:["infoprocessing"],complements:["svr","funds","wtl"],pairs:["chall","transfer","conceptualchange"]},
 origins:"Bartlett showed recall is reconstructive, shaped by cultural schemas. In the 1970s–80s, Anderson, Pearson, and the Center for the Study of Reading made schema theory the dominant account of reading comprehension, explaining classic findings like the 'washing clothes' passage that is incomprehensible without its title.",
 claims:["Readers understand text by mapping it onto existing knowledge structures (schemas).","Schemas guide attention, enable inference, and shape both encoding and recall.","Comprehension failure often reflects missing or unactivated schema, not decoding failure.","Background knowledge is a primary driver of comprehension differences — with equity implications for curriculum."],
 constructs:[
  {term:"Schema activation", def:"Bringing relevant prior knowledge online before and during reading."},
  {term:"Slot filling & default values", def:"Schemas supply expected elements, letting readers infer what texts omit."},
  {term:"Reconstructive recall", def:"Memory rebuilt through schemas, producing systematic distortions (Bartlett's 'War of the Ghosts')."},
  {term:"Inference generation", def:"Bridging and elaborative inferences knit text into a coherent situation model (Kintsch's construction–integration extends this)."},
  {term:"Knowledge-based equity gap", def:"Comprehension differences track opportunity to build knowledge, motivating knowledge-rich curricula."}],
 applications:["Activating and building background knowledge before reading.","Knowledge-rich, content-integrated literacy curricula (e.g., ELA units built on science/history).","Text selection and pre-teaching decisions for multilingual learners.","Explaining assessment bias when passages presume culturally specific knowledge."],
 critiques:["Vague about how schemas are represented and acquired; hard to falsify.","Superseded in psychology by more specified models (construction–integration) though it survives in practice.","Overemphasis on activation can shortchange text-based and word-level work."],
 related:["infoprocessing","svr","rosenblatt","piaget"],
 refs:["Bartlett, F. C. (1932). Remembering: A study in experimental and social psychology. Cambridge University Press.","Anderson, R. C., & Pearson, P. D. (1984). A schema-theoretic view of basic processes in reading comprehension. In P. D. Pearson (Ed.), Handbook of reading research (pp. 255–291). Longman.","Kintsch, W. (1998). Comprehension: A paradigm for cognition. Cambridge University Press."],
 compare:{learner:"A knowledge-holder who builds meaning from text plus schema", mechanism:"Mapping text onto activated knowledge structures; inference fills gaps", instructor:"Activator and builder of background knowledge", knowledge:"Organized structures that make new text intelligible", critique:"Underspecified mechanism; can eclipse decoding and text evidence"}

{
 id:"rosenblatt", name:"Transactional / Reader-Response Theory", discipline:"Literacy", depth:"deep",
 theorists:"Louise Rosenblatt (1904–2005)",
 tagline:"Meaning is not in the text or the reader but in the transaction between them; readers adopt stances from efferent (information-taking) to aesthetic (lived-through experience).",
 problem:"The poem died at 9:14 a.m., killed by a comprehension question. Students trained by years of quizzes read everything — sonnets, novels, their own hearts' favorites — the same way they read a bus schedule: mining for extractable answers. Meanwhile the opposite classroom fails differently: 'how did it make you feel?' floats free of any text at all, and interpretation becomes a mood. Rosenblatt's theory exists to dissolve the false choice: the literary work is an event that happens between a reader and a text, stance decides what kind of event, and response can be both genuinely personal and rigorously disciplined by the words on the page.",
 asks:["Where does the literary work actually exist — page, reader, or the transaction between?","What changes when a reader shifts from information-taking to living-through — and who teaches readers that stance is a choice?","What makes an interpretation valid if there is no single correct meaning?","Can personal response and textual rigor require each other rather than compete?"],
 iftrue:{
  teachers:"Teach stance explicitly: run the same text through an efferent task and an aesthetic one, and let students feel the difference — most have never been told the choice exists, having been trained by assessment into permanent mining. Protect aesthetic reading's airspace: evocation first, then the disciplined return to the text. And hold the validity line at warrants: interpretations are plural but argued — 'show me the words that did that to you.'",
  coaches:"Observe literature discussions for stance: is this room experiencing a text or strip-mining it? Help teams design assessments that don't force efferent-only reading — a unit whose every measure is extraction teaches extraction as what literature is FOR. Response protocols with textual-warrant norms give discussion both freedom and a floor.",
  leaders:"Watch the diet: test-prep reading regimes are efferent monocultures with documented engagement costs, and the students who most need reading lives are fed the least nourishing version. Resource choice reading with substance, and build assessment literacy about what literature classes actually cultivate — which no passage-and-items instrument fully samples.",
  researchers:"Stance remains the operationalization challenge — self-report, task design, and discourse markers all approximate it imperfectly. The strongest adjacent evidence is the discussion literature: dialogic, response-based approaches move comprehension and interpretive quality. Langer's envisionment-building line is the tradition's most developed empirical descendant."},
 reasoning:{
  notice:["Stance defaults: students who mine every text identically have been taught that reading IS extraction — by us.","The moment a text dies: asked for its theme before it was allowed to be an experience.","Response quality's two failure modes: floating (personal but text-free) and parroting (textual but experience-free) — each needs different coaching.","Whose evocations get validated in discussion, and whose lived-through readings are corrected toward yours."],
  assume:["That aesthetic means soft: the lived-through experience is the literary datum — analysis without it analyzes nothing — and disciplining response against text is rigorous work.","That plural means infinite: the text constrains; some readings are unwarranted, and saying so is the discipline.","That response and analysis compete — evocation is the material analysis works ON; sequence them and both improve."],
  decide:["Label tasks by stance and say why: 'read this efferently for the argument; read this aesthetically first, analysis tomorrow.'","Response journals before discussion — private evocation before public negotiation.","Install warrant norms as the discussion floor: text-anchored, plural, contestable.","Revisit key texts across stances so students experience the same words becoming different events."],
  avoid:["Quizzing the life out of texts — comprehension checks on poems teach that poems are containers.","Anything-goes response with no return to the page: freedom without discipline curdles into mood-sharing.","Efferent monoculture under test pressure, especially for the students with the fewest reading lives outside school.","Dismissing emotional response as off-task; it is the transaction announcing itself."]},
 competing:[
  {scenario:"The class produces wildly divergent interpretations of the same story.", thisView:"As expected: different readers, different transactions, legitimately different evocations. Validity is warranted plurality — argued from the text, constrained but not unique — and the divergence is the seminar, not the problem.", other:"New Criticism (the formalist tradition)", otherView:"The text's structure — its tensions, images, unity — constrains meaning far more tightly than transaction talk implies; readings that ignore the words' discipline are error, and reader feeling is the affective fallacy.", agree:"Closer than the old wars suggest: Rosenblatt's 'the text constrains' IS the formalist inheritance, and close reading serves both. The residual fight — where meaning lives — matters less in practice than the shared demand: warrant everything from the words."},
  {scenario:"Two accounts of what the reader brings.", thisView:"Stance and lived experience: the reader's attention is directed toward information or toward the experience being lived through, and that choice — plus everything the reader is — co-creates the work.", other:"Schema Theory (Anderson)", otherView:"Knowledge structures: comprehension is the text assimilated into prior knowledge, and 'what the reader brings' is measurable schemas that predict recall and inference.", agree:"Complementary layers of the same anti-extraction insight — cognitive machinery (schema) and experiential orientation (stance) both shape the meaning made. Rich literature pedagogy builds knowledge AND teaches stance; either alone reads half the reader."}],
 research:{
  questions:["Can stance be operationalized and observed — and does stance instruction change reading?","Do response-based, discussion-rich approaches improve comprehension and interpretive quality?","What distinguishes disciplined response from unmoored reaction in student talk and writing?","What do efferent-monoculture diets (test-prep regimes) cost engagement and reading identity?"],
  methods:"Analysis of response journals and discussion transcripts (the Purves/Beach tradition); Langer's envisionment-building studies; quasi-experiments on discussion-based instruction — the Applebee/Langer/Nystrand line linking dialogic discussion to achievement; stance manipulation in task design.",
  variables:"Stance markers in talk and writing, evocation quality, warrant use (text-anchoring of claims), interpretive complexity, engagement and reading identity measures.",
  support:"The strongest empirical plank is borrowed but sturdy: discussion-based, response-honoring approaches predict comprehension and writing gains in large multi-site studies. The transactional core is philosophically robust and pedagogically generative but hard to test directly — stance resists clean measurement, and the theory functions best as a design discipline for literature teaching. Honest verdict: a framework whose classroom descendants are well supported even where its central construct stays partly qualitative."},
 reflect:["What did assessment train YOU to do to texts — and when did you last read something beautiful without mining it?","Watch your next literature discussion: are students negotiating an experience or auditioning answers? What did your questions make inevitable?","Which text in your curriculum dies every year at the same question — and what would teaching it aesthetically-first look like?","Where is the floating-response student and where is the parroting student in your room, and what different coaching does each need?","If literature class is where students learn what reading is FOR, what is yours currently teaching?"],
 constellation:{builds:["dewey"],complements:["schema","literary_crit","eisner"],pairs:["nls","wtl"]},
 origins:"First articulated in Literature as Exploration (1938) and elaborated in The Reader, the Text, the Poem (1978), Rosenblatt's transactional theory countered New Criticism's text-only formalism, insisting that the 'poem' is an event created anew in each reading. It grounds response-based literature pedagogy.",
 claims:["Reading is a transaction: reader and text condition each other in a particular time and context.","The same reader can adopt an efferent stance (carrying away information) or an aesthetic stance (attending to the lived-through experience); most readings blend both.","Interpretations vary legitimately, but the text constrains valid readings — response is disciplined, not anything-goes.","Literature education should cultivate personal response and democratic dialogue about texts."],
 constructs:[
  {term:"Transaction", def:"Mutual shaping of reader and text (borrowed from Dewey & Bentley), against one-way 'interaction'."},
  {term:"Efferent stance", def:"Reading to extract and retain information for afterward."},
  {term:"Aesthetic stance", def:"Attention to what is being lived through during reading — feeling, imagery, association."},
  {term:"The poem as event", def:"The literary work exists as an experience evoked in a reader, not as marks on a page."},
  {term:"Selective attention", def:"Stance directs which aspects of textual experience come forward."}],
 applications:["Response journals, literature circles, and discussion-based ELA pedagogy.","Balancing test-driven efferent reading with aesthetic engagement.","Choice reading programs and identity-relevant text selection.","Framework for studies of engagement and literary discussion quality."],
 critiques:["Poststructural critics find the reader/text 'transaction' still too tidy about where meaning lives.","Classroom application can drift into unmoored personal reaction without textual warrant.","Stance continuum is hard to operationalize for research."],
 related:["schema","nls","dewey","literary_crit"],
 refs:["Rosenblatt, L. M. (1938). Literature as exploration. Appleton-Century.","Rosenblatt, L. M. (1978). The reader, the text, the poem: The transactional theory of the literary work. Southern Illinois University Press.","Rosenblatt, L. M. (2005). Making meaning with texts: Selected essays. Heinemann."],
 compare:{learner:"A meaning-maker transacting with text from a chosen stance", mechanism:"Transaction between reader's resources and textual cues", instructor:"Curator of texts and facilitator of disciplined response", knowledge:"An evoked experience/interpretation constrained by text", critique:"Hard to operationalize; can license unanchored response"}
},
{
 id:"nls", dis:true, name:"New Literacy Studies & Multiliteracies", discipline:"Literacy", depth:"deep",
 theorists:"Brian Street; James Paul Gee; Shirley Brice Heath; the New London Group (1996)",
 tagline:"Literacy is not one neutral cognitive skill but many social practices, embedded in power, identity, and context — and now multiplied across modes and media.",
 problem:"The student failing English runs a fan-fiction account with two hundred readers, manages the diplomacy of three group chats, and can parse a 40-page game guide — while his file says 'struggling reader, low motivation.' The school samples one literacy, finds it weak, and issues a verdict about the child. New Literacy Studies exists to name what happened there: literacy is not one neutral skill people have more or less of, but many social practices — each with its own norms, purposes, and politics — and 'school literacy' is one specialized practice among them, enforced as if it were the whole of reading and writing.",
 asks:["Is literacy one neutral cognitive skill, or many situated social practices?","What do literacy practices DO socially — for identity, membership, and power?","Why does competence travel so badly between home, community, and school literacies?","What happens when one culture's literacy practice is enforced as the universal standard?"],
 iftrue:{
  teachers:"Inventory what your students actually read and write when nobody assigns it — the fan-fiction writer, the sports-stats analyst, the group-chat diplomat are all in your room, unlabeled. Bridge deliberately: import their commanded genres as objects of analysis, then teach the academic register explicitly as a second dialect to acquire — an addition with a purpose, never a replacement with a verdict. And name school literacy's norms as norms: conventions with histories, not nature.",
  coaches:"Run literacy audits that look beyond test scores: what does this 'struggling reader' read and write by choice, and what does that competence tell us? Help teachers hear the deficit reflex in labels, and treat disciplinary literacy as NLS applied — each department is a Discourse community whose reading and writing norms need explicit apprenticeship, not assumed osmosis.",
  leaders:"Practice assessment humility in public: say clearly what your measures sample and what they cannot see. Reframe family literacy programs as reciprocal — households have literacies to teach as well as receive. And carry the nuance into policy conversations, because one-size literacy mandates flatten exactly the differences your teachers must work with.",
  researchers:"The home methods are ethnographic: literacy events observed, practices inferred, meaning traced — the Heath and Street tradition. Discourse analysis (Gee) operationalizes identity-in-language; multimodal analysis extends it to composing across media. The tradition's gap is also its invitation: bridging pedagogies exist in cases and need designs that travel."},
 reasoning:{
  notice:["The literacies students command out of school: length, audience-awareness, genre control, revision — often exceeding anything they produce for you, and diagnostic of what the school version is failing to invite.","Who code-switches between registers effortlessly and who gets punished for the home discourse — the classroom's language politics, visible daily.","School tasks that are literacy events with no meaning beyond compliance: reading logs nobody reads, journals written for the checkmark.","Identity talk: the student who says 'I'm not a reader' while reading constantly — the label has sampled the wrong shelf."],
  assume:["That school literacy is neutral and universal — it is a specific practice with a specific history, which explains why it privileges those raised inside it.","That valuing home literacies means abandoning academic ones: the tradition's own resolution (with Delpit) is bridge-and-add — access to powerful codes PLUS respect for owned ones.","That digital practices are lesser versions of print ones; they are different economies of audience, speed, and authority, with their own sophistications and their own traps."],
  decide:["Asset-map literacy practices at intake: what do you read, write, make, and moderate when it's yours?","Design bridge assignments: analyze the commanded genre with academic tools, then write the academic genre about the commanded world.","Teach the academic Discourse explicitly — its moves, registers, and reasons — as learnable convention.","Compose multimodally for real audiences, because audience is what most school writing never has."],
  avoid:["Deficit readings of difference — the founding sin the field exists to end.","Literacy shaming: correcting home discourse as error rather than teaching register as choice.","Romanticizing home literacies into curricular ghettos while gatekeeper codes go untaught — access delayed is access denied.","Treating multimodality as decoration on 'real' (print) literacy."]},
 competing:[
  {scenario:"A student fails reading assessments while thriving in text-heavy online communities.", thisView:"Different Discourses: the school samples one specialized practice and calls the result 'reading ability.' His competence is real, situated elsewhere — the bridge, not the deficit, is the design problem.", other:"Simple View of Reading (Gough & Tunmer)", otherView:"Check the components before the sociology: if decoding or academic-register language comprehension is genuinely weak, no reframing helps him read the chemistry textbook — skills are real, measurable, and buildable.", agree:"Fully compatible layers, argued from both entries: skills operate WITHIN practices. Diagnose componentially AND honor what the out-of-school evidence proves he can do; either alone misreads the child."},
  {scenario:"Should school teach 'proper English' — and what do we tell students about their home dialects?", thisView:"'Appropriateness' discourses rank dialects socially, not linguistically — every dialect is rule-governed and complete, and the ranking is power wearing a grammar costume (the raciolinguistic extension sharpens this).", other:"The power-codes position (Delpit; genre pedagogy)", otherView:"Meanwhile the gatekeepers exist, and children denied explicit mastery of dominant codes pay the toll their whole lives; withholding the code in the name of respect is a luxury position.", agree:"The synthesis is additive bidialectalism, taught honestly: master the code of power AND learn its politics — 'here is the register, here is when it rules, here is why, and here is what your own language does that it can't.'"}],
 research:{
  questions:["What literacy practices do communities and youth actually maintain, and how do they work?","How does identity form and travel through literacy practices — who gets to be 'a reader' or 'a writer'?","Do bridging pedagogies (home-to-academic) improve academic literacy outcomes?","How do digital and multimodal practices restructure audience, authority, and composing?"],
  methods:"Ethnography of literacy events and practices (the Heath/Street lineage), discourse analysis in Gee's tradition, case studies of youth literacies, and multimodal analysis of composing across media; intervention studies of bridging pedagogy are the emerging quantitative strand.",
  variables:"Literacy events and their social functions, register and code-switching patterns, identity positioning in talk and text, participation across in- and out-of-school settings, and academic outcomes where bridging designs are tested.",
  support:"Ethnographically, among the richest bodies of work in literacy research — Heath's decade in the Carolinas and Street's ideological model reshaped the field's self-understanding permanently. Honest limits: the tradition is descriptive by design, causal and scaled studies of bridging pedagogies remain scarce, and critics fairly note (Brandt and Clinton's point) that local practices connect to technologies and institutions the ethnographic lens can under-see. The corrective conversation with skills-based reading science is ongoing and, at its best, additive."},
 reflect:["Pick your most 'reluctant' reader or writer. What do they read, write, or moderate by choice — and have you ever seen it?","Which of your classroom's literacy norms are conventions with reasons, and which are just inherited? Could you explain each one's purpose to a skeptical fourteen-year-old?","Where does your feedback correct home discourse as error rather than teach register as informed choice?","What would a bridge assignment look like between your students' strongest owned genre and your discipline's most gatekept one?","What does your school's assessment regime literally cannot see — and who pays for that blindness?"],
 constellation:{builds:["vygotsky"],complements:["funds","crp","digital_writing"],contrasts:["svr"],pairs:["writing_sociocultural","freire"]},
 origins:"Street's ethnography in Iran distinguished 'autonomous' from 'ideological' models of literacy; Heath's Ways with Words documented community-specific literacy practices; Gee tied literacy to Discourses and identity. The New London Group's multiliteracies manifesto extended the frame to multimodal, digital, and globalized communication.",
 claims:["Literacy practices are plural, situated, and ideological — inseparable from social relations and power.","The 'autonomous model' (literacy as neutral skill with universal cognitive effects) is empirically and politically misleading.","People command primary and secondary Discourses; school literacy is one specialized Discourse among many.","Pedagogy should span situated practice, overt instruction, critical framing, and transformed practice (multiliteracies)."],
 constructs:[
  {term:"Ideological vs. autonomous model", def:"Street's contrast between literacy as situated social practice and literacy as neutral technical skill."},
  {term:"Literacy events & practices", def:"Observable occasions involving text (events) and the patterned, value-laden ways groups use them (practices) — Heath, Barton & Hamilton."},
  {term:"Discourse (big D)", def:"Gee's identity kit: ways of talking, acting, valuing, and using texts that mark membership."},
  {term:"Multiliteracies", def:"Competence across linguistic, visual, audio, gestural, and spatial modes and across cultural contexts."},
  {term:"Design", def:"The New London Group's term for meaning-making as active (re)design of available resources."}],
 applications:["Ethnographic and case-study literacy research designs (common in EdD work).","Valuing home and community literacies; bridging them to academic Discourse.","Digital/media literacy curriculum and multimodal composition.","Critique of one-size-fits-all literacy policy and assessment."],
 critiques:["Risk of relativism: if all practices are equal, what warrants teaching dominant forms? (Delpit's power-codes argument complicates it.)","Ethnographic methods limit causal claims and scalability.","Brandt and Clinton note it can overlocalize, missing how literacy technologies travel across contexts."],
 related:["freire","crp","vygotsky","rosenblatt","funds"],
 refs:["Street, B. V. (1984). Literacy in theory and practice. Cambridge University Press.","Gee, J. P. (2015). Social linguistics and literacies: Ideology in discourses (5th ed.). Routledge.","Heath, S. B. (1983). Ways with words: Language, life, and work in communities and classrooms. Cambridge University Press.","New London Group. (1996). A pedagogy of multiliteracies: Designing social futures. Harvard Educational Review, 66(1), 60–92."],
 compare:{learner:"A member of communities with distinct literacy practices and Discourses", mechanism:"Socialization into, and redesign of, situated literacy practices", instructor:"Bridge-builder between community literacies and powerful Discourses", knowledge:"Plural literacies; always value-laden and contextual", critique:"Relativism risk; hard to scale or test causally"}
},
{
 id:"chall", name:"Stages of Reading Development", discipline:"Literacy", depth:"deep",
 theorists:"Jeanne Chall (1921–1999)",
 tagline:"Reading develops through qualitatively different stages — from pre-reading through decoding and fluency to reading to learn, multiple viewpoints, and construction.",
 problem:"A third grader who tested proficient becomes a sixth grader who reads 'below grade level' — nobody taught him worse; the target moved. Schools celebrate early-literacy victories, then watch a slump arrive around fourth grade, concentrated among their least-resourced students. Meanwhile a high school hands novels to adolescents still consolidating decoding, and an elementary school drills phonics into children who needed knowledge and vocabulary years ago. Chall's stage model exists to explain why reading development changes in kind, not just amount — and why instruction mismatched to a reader's current stage fails no matter how good it is.",
 asks:["Does reading develop through qualitatively different phases, each with its own work?","Why doesn't early success guarantee later success — what re-sorts readers at the transitions?","What drives the fourth-grade slump, and why does it fall hardest on low-income students?","What is the developmentally right emphasis at each point — and who is responsible for the later stages?"],
 iftrue:{
  teachers:"Locate each reader in the arc before choosing the work: unfinished decoding needs finishing (at any age, with dignity); grades 2–3 fluency consolidation is the bridge everything later crosses; and from grade 4 onward the game becomes vocabulary, knowledge, and expository structures — plan for that shift before it arrives. Secondary teachers: you inherit Stage 3+ readers by definition; disciplinary reading instruction is not remediation, it is your stage's curriculum.",
  coaches:"Build early-warning routines around the Stage 3 transition — the readers who will slump are visible in grade 3 fluency and vocabulary data before the slump prints. Help secondary teams reframe 'they can't read' as a stage diagnosis: fluent-with-narrative-lost-in-exposition is a different problem than can't-decode, and each has a treatment.",
  leaders:"K–2 investment is necessary and insufficient: resource the grade 4–8 years where knowledge and vocabulary demands explode, because that is where early gains go to die. Track your slump cohort explicitly in longitudinal data. And treat adolescent readers stuck at decoding as an emergency deserving age-respecting intervention — nothing in the building costs more than a tenth grader reading at Stage 1 and being handed Hamlet.",
  researchers:"The transitions are the phenomena: what predicts who stalls at each handoff, and which mechanism drives the slump — fluency, vocabulary, knowledge, motivation, or their braid? Cross-linguistic work matters here too, since stage timing bends with orthography and language experience."},
 reasoning:{
  notice:["The reader whose scores dipped at grade 4 without any change in effort or instruction — the demands shifted; the skills didn't.","Secondary students fluent with story and lost in textbook prose: narrative carried them across Stage 2; exposition is a different country.","Error patterns as stage markers: laborious decoding attempts, skipped hard words, or smooth reading with empty recall each place the reader differently.","The gap between what a student can decode and what they can discuss — the space where read-alouds and knowledge work belong."],
  assume:["That the stages are crisp: they blur, overlap, and vary by reader — the model is a map of emphases, not a staircase with locked doors.","That early proficiency is permanent; every transition re-sorts the cohort, which is why 'we fixed K–2' is never the end of the story.","That grade level equals stage: any middle-school room spans three stages, and whole-class instruction pitched at one misses the rest."],
  decide:["Stage-diagnose before intervening — the same low score means different work for different readers.","Protect deliberate fluency-building in grades 2–3 (and for older readers who missed it): it is the toll bridge to reading-to-learn.","Front-load academic vocabulary and expository text structures from grade 3 onward, before the slump, not after.","Give older stalled readers efficient, dignified word-level intervention paired with age-appropriate content by ear."],
  avoid:["Novels-only diets for readers whose decoding is unfinished — exposure is not instruction.","Recycling phonics for students long past it because the intervention bin only has one tool.","Treating the slump as a motivation problem; disengagement is usually the receipt, not the cause.","Assuming reading is 'done' by middle school — Stages 4 and 5 (multiple viewpoints, critical construction) are precisely what secondary and doctoral study demand."]},
 competing:[
  {scenario:"Scores sag in fourth grade across the district.", thisView:"A predictable stage transition: texts pivot from familiar narrative to knowledge-dense exposition, and readers who haven't consolidated fluency and accumulated vocabulary hit the wall on schedule.", other:"Simple View of Reading (Gough & Tunmer)", otherView:"Nothing mystical happened: the language-comprehension factor was always the ceiling, and easy early texts simply never tested it. Grade 4 is when D × LC starts multiplying by the smaller number.", agree:"The frameworks interlock rather than compete — Chall describes when the demands shift; SVR explains which factor gets exposed. Both prescribe the same expensive medicine: years of knowledge and vocabulary building, started early."},
  {scenario:"An eighth grader is failing everything, and 'he can't read' is the explanation.", thisView:"Find the stage: often these readers decode adequately but never consolidated fluency, so every page costs triple. Stage-matched work — fluency routines plus expository scaffolds — beats both phonics recycling and strategy worksheets.", other:"New Literacy Studies (Gee, Street)", otherView:"Also ask what literacies he DOES command — gaming guides, lyrics, group chats may show sophisticated practice the school never counts. A definition of reading narrow enough to miss his competence is narrow enough to destroy his identity as a learner.", agree:"Both reject the flat label. The workable synthesis: rigorous stage-appropriate skill work delivered through materials and identities that respect who the reader already is."}],
 research:{
  questions:["What measured factors in grades 1–3 predict who slumps at Stage 3?","Which mechanism carries the slump — fluency, vocabulary, knowledge, motivation — and in what mixture?","How do stage timings shift across orthographies and language backgrounds?","What interventions move stalled adolescent readers, and at what dose?"],
  methods:"Longitudinal cohort studies following readers across the transitions (the tradition Chall, Jacobs, and Baldwin founded); componential assessment batteries repeated over years; intervention studies targeted at specific stage transitions.",
  variables:"Decoding efficiency, oral reading fluency, vocabulary breadth and depth, exposure to expository text, comprehension by text type, and SES as the moderator the slump literature cannot ignore.",
  support:"The developmental arc and the slump are well documented — the deceleration among low-income students in the grade 4 transition replicated widely and drives much modern policy attention to the 'knowledge gap.' Honest limits: stage boundaries are fuzzier than the labels, timing varies by language and orthography, and the model's individual-cognitive framing says little about the social side of adolescent reading identity."},
 reflect:["Map five of your students onto the stages right now. How many are where their grade level assumes — and what is each one's actual next piece of work?","If you teach older students: what do you do, concretely, for the reader who decodes but was never made fluent? Is 'nothing' the honest answer?","Where does your school's investment curve peak — and does it match where your readers actually stall?","What would age-respecting Stage 1–2 intervention look like for a fifteen-year-old in your building? Does it exist?","Your doctoral reading is Stage 5 work — constructing knowledge from contested sources. When did anyone teach you that stage, and who is teaching it to your students?"],
 constellation:{builds:["infoprocessing"],complements:["svr","schema"],pairs:["wtl","nls"]},
 origins:"Chall's Learning to Read: The Great Debate (1967) weighed code-emphasis against meaning-emphasis instruction, favoring systematic phonics early. Her 1983 stage model gave the field a developmental map, including the much-cited shift from 'learning to read' to 'reading to learn' and the 'fourth-grade slump'.",
 claims:["Reading proficiency develops in ordered stages with different instructional needs (Stages 0–5).","Early code-emphasis instruction better serves Stage 1 decoding than meaning-first approaches.","Around Stage 3, the task shifts from learning to read toward reading to learn unfamiliar content.","Readers who lack fluency or knowledge stall at the transition — the fourth-grade slump, concentrated among low-income students."],
 constructs:[
  {term:"Stage 0 — Prereading", def:"Emergent literacy: oral language, print concepts, letter knowledge (birth–6)."},
  {term:"Stage 1 — Initial reading/decoding", def:"Cracking the alphabetic code (grades 1–2)."},
  {term:"Stage 2 — Confirmation & fluency", def:"Consolidating decoding into fluent reading of familiar text (grades 2–3)."},
  {term:"Stage 3 — Reading to learn", def:"Using reading to gain new information; vocabulary and knowledge demands jump (grades 4–8)."},
  {term:"Stages 4–5 — Multiple viewpoints & construction", def:"Handling competing perspectives (high school), then constructing knowledge critically and selectively (college/adult)."},
  {term:"Fourth-grade slump", def:"Achievement decline when text demands outstrip fluency, vocabulary, and knowledge."}],
 applications:["Matching instructional emphasis (phonics, fluency, knowledge, critique) to stage.","Early-warning systems around the grade 3–4 transition.","Adolescent and disciplinary literacy program rationale.","Historical grounding for today's reading-policy debates."],
