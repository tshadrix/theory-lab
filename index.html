{
 id:"flowerhayes", dis:true, name:"Cognitive Process Theory of Writing", discipline:"Writing", depth:"deep",
 theorists:"Linda Flower & John R. Hayes (1981)",
 tagline:"Writing is not a linear sequence of stages but a set of recursive thinking processes — planning, translating, reviewing — orchestrated under the constraints of task and memory.",
 problem:"A student who can argue brilliantly out loud produces two thin paragraphs. Another 'revises' by fixing commas and calls it done. A teacher assigns the neat sequence — outline Monday, draft Wednesday, publish Friday — and gets formula instead of thinking. Teachers see only products, but products conceal everything that matters: where the composing actually broke down. Flower and Hayes put think-aloud microphones on writers and found no tidy stages at all — just recursive, effortful problem-solving under brutal memory constraints. The theory exists to explain what writers actually do, why experts and novices differ so sharply, and where in the invisible process each struggling writer is actually stuck.",
 asks:["What do writers actually do while composing — as opposed to what the posters say?","Why do expert and novice writers differ so dramatically, and in which processes?","Where does writing break down — planning, translating, or reviewing — for a given writer?","How is composing a form of thinking, and what follows for teaching it?"],
 iftrue:{
  teachers:"Teach the processes, not just the product: planning as goal-setting (not only outlining), translating with temporary supports (oral rehearsal before drafting), revision as global re-seeing against goals rather than error-hunting. Model your own composing aloud — including the false starts — because students have almost never witnessed expert writing happen. And diagnose before you intervene: the student who won't start, the one who stalls mid-sentence, and the one who won't revise are stuck in three different rooms.",
  coaches:"Reframe writing conferences around process: 'show me your plan' and 'walk me through what you did when you got stuck' reveal what the draft conceals. For teams wanting evidence-backed structure, SRSD (self-regulated strategy development) is this theory operationalized — explicit strategy instruction for planning and revising, with some of the largest effect sizes in writing research. Help content teachers see that a thin lab conclusion is usually a planning problem, not a grammar problem.",
  leaders:"Composing must happen where instruction can reach it: writing assigned entirely as homework makes the process invisible and uncoachable — schedule in-class composing time. Build assessment structures that honor process: drafts that count, revision that moves grades, rubrics with a planning dimension. And fund writing PD beyond ELA, because the process model applies wherever anyone composes anything.",
  researchers:"The methods are the legacy: think-aloud protocols, and now keystroke logging and screen capture, make the invisible observable. Expert–novice comparisons remain productive; intervention studies targeted at single subprocesses (planning vs. revising) yield the cleanest effects; and the working-memory strand (Kellogg, Berninger) connects composing to cognitive load with testable precision."},
 reasoning:{
  notice:["Writers who start typing the instant the prompt lands: no planning repertoire — the goals never got set, so retrieval runs the show (knowledge-telling).","Revision that never leaves the surface: the writer lacks evaluation criteria or the global diagnosis skills to see structural problems.","The fluent talker who freezes at the page: often a translating bottleneck — transcription cost, not thinking cost.","Where drafts stall: sentence boundaries (translating), openings (planning), or 'it's done' after one pass (reviewing) each localize the instruction needed."],
  assume:["That stalls are motivation problems — most are missing process strategies, and no exhortation installs one.","That planning means outlines: goal-setting ('what do I want this to do to the reader?') is the planning that distinguishes experts.","That the process is linear because the poster is: real composing loops constantly, and teaching lockstep stages actively misteaches it."],
  decide:["Teach planning as three separable moves — generating, organizing, goal-setting — with strategies for each.","Scaffold translating temporarily: oral rehearsal, dictation, sentence frames that later fade.","Teach revision as compare-diagnose-operate against explicit goals and criteria, on structure before sentences.","Confer at the point of process breakdown rather than marking the product's symptoms."],
  avoid:["Stage-lockstep schedules that grade the calendar instead of the composing.","Grading first drafts as finals — it abolishes the process you claim to teach.","Conflating transcription struggles (handwriting, spelling, typing) with thinking struggles; they need different help.","Assigning 'the writing process' without teaching any strategy for any part of it — the empty ritual SRSD was built to replace."]},
 competing:[
  {scenario:"A student's essays are thin — three sentences where three paragraphs should be.", thisView:"Knowledge-telling: with no rhetorical goals set, the writer retrieves-and-types until retrieval runs dry. Teach goal-setting and planning strategies, and the same knowledge organizes into substance.", other:"Genre & Sociocultural Theories (Miller, Swales)", otherView:"The writer lacks genre knowledge: no sense of what this kind of text is FOR, who reads it, or what moves it makes. Thin writing reflects a thin map of the social action — apprentice them into the genre.", agree:"Both reject 'more grammar' as the cure, and mature accounts (Beaufort's writing-transfer framework) explicitly require both: process strategies AND genre-community knowledge. The thin essay usually needs the two together."},
  {scenario:"Revision instruction isn't improving anyone's drafts.", thisView:"Novices can't revise what they can't see: they lack evaluation criteria and global diagnosis, so they proofread instead. Teach the compare-diagnose-operate cycle against explicit goals, and revision becomes possible.", other:"Cognitive Load Theory (Sweller)", otherView:"Revising while holding the whole text, the goals, and the fixes in working memory is overload by design. Separate the passes, externalize criteria into checklists, and offload the text into visible structure first.", agree:"Convergent prescription: staged, criteria-guided revision with reduced simultaneous demands — one pass for structure, one for paragraphs, one for sentences, each against a visible standard."}],
 research:{
  questions:["Which subprocess interventions (planning vs. translating vs. revising) yield the largest writing gains, for whom?","How do working-memory constraints shape composing, and what supports offload them?","What do keystroke and pause patterns reveal about developing writers' processes?","How do process strategies interact with genre knowledge in producing quality?"],
  methods:"Think-aloud protocol analysis (the founding method), keystroke logging and screen capture, expert–novice comparative designs, and intervention research — most prominently the SRSD experimental literature.",
  variables:"Pause locations and durations, planning time and artifacts, revision types (surface vs. meaning-changing), text quality ratings, and working-memory measures.",
  support:"The recursive-process account displaced the stage model decisively, and its instructional operationalization — SRSD — carries some of the largest, most replicated effect sizes in writing research (often d ≈ .9+ across dozens of studies). Honest limits: think-alouds may distort the very process they record; the 1981 model needed its own revision (Hayes later added affect, motivation, and the social environment); and the account remains centered on individual cognition — which is exactly where the sociocultural theories pick up."},
 reflect:["Watch one struggling writer compose for five minutes this week. Where exactly does the process stall — before words, between words, or after them?","When did your students last see YOU compose anything live, false starts included? What did it cost you to be watched — and what did it teach them?","What do your rubrics grade: the thinking processes or their residue? What would one process criterion look like?","Which of your writers are stuck at transcription — and are they getting thinking help for a typing problem?","In your own doctoral writing, which process do you avoid — planning, drafting, or global revision — and what strategy would you prescribe a student doing the same?"],
 constellation:{builds:["infoprocessing"],complements:["wtl","writing_sociocultural","srl"],pairs:["transfer","toulmin","digital_writing"]},
 origins:"Using think-aloud protocol analysis, Flower and Hayes modeled what writers actually do, displacing the stage model (prewrite → write → rewrite). Their account of the task environment, long-term memory, and monitored subprocesses launched modern writing-process research and pedagogy.",
 claims:["Writing comprises recursive processes — planning (generating, organizing, goal-setting), translating, and reviewing (evaluating, revising) — under a monitor's control.","Writers construct their own rhetorical problem; better writers build richer representations of audience and purpose.","Composing is goal-directed: writers generate networks of goals and sub-goals that guide content.","Expert–novice differences lie in planning depth, goal networks, and revision quality more than in grammar."],
 constructs:[
  {term:"Task environment", def:"The rhetorical problem (topic, audience, exigency) plus the text produced so far."},
  {term:"Planning", def:"Generating ideas, organizing, and setting goals — often the biggest expert–novice gap."},
  {term:"Translating", def:"Turning ideas into linear written language, constrained by working memory."},
  {term:"Reviewing", def:"Evaluating and revising text against goals; experts revise globally, novices locally."},
  {term:"The monitor", def:"Executive control that switches among processes recursively."},
  {term:"Knowledge-telling vs. knowledge-transforming", def:"Bereiter & Scardamalia's allied contrast: novices retrieve-and-write; experts rework ideas for rhetorical goals."}],
 applications:["Process pedagogy: explicit strategy instruction in planning and revising (basis for SRSD, which has strong effect sizes).","Writing-center and feedback practices targeting global revision.","Protocol and screen-capture methods for studying composing.","Diagnosing student difficulties as process problems, not just product errors."],
 critiques:["Early model underplayed affect, context, and social dimensions — Hayes (1996) revised it; sociocultural theorists went further.","Think-aloud data may distort the very processes observed.","Centered on individual cognition of relatively skilled adult writers."],
 related:["writing_sociocultural","infoprocessing","srl","vygotsky"],
 refs:["Flower, L., & Hayes, J. R. (1981). A cognitive process theory of writing. College Composition and Communication, 32(4), 365–387.","Hayes, J. R. (1996). A new framework for understanding cognition and affect in writing. In C. M. Levy & S. Ransdell (Eds.), The science of writing (pp. 1–27). Erlbaum.","Bereiter, C., & Scardamalia, M. (1987). The psychology of written composition. Erlbaum."],
 compare:{learner:"A problem-solver juggling goals, memory, and emerging text", mechanism:"Recursive planning, translating, and reviewing under a monitor", instructor:"Strategy coach for planning and global revision", knowledge:"Rhetorical problem representations and composing strategies", critique:"Individual-cognitive focus; early neglect of context and affect"}
},
{
 id:"writing_sociocultural", dis:true, name:"Genre & Sociocultural Theories of Writing", discipline:"Writing", depth:"deep",
 theorists:"Carolyn Miller; John Swales; Charles Bazerman; Steve Graham (writer(s)-within-community)",
 tagline:"Writing is social action: genres are typified responses to recurring situations, learned within communities whose purposes, tools, and histories shape every text.",
 problem:"The A-essay student writes a lab report that reads like a personal narrative with data in it — because nobody told her the rules changed at the classroom door. The 'good writing' commandments she memorized (never use I; always five paragraphs; state your thesis last sentence, first paragraph) turn out to be one community's habits, exported as universal law and failing everywhere else. Meanwhile the five-paragraph template, taught as training wheels, has fused to the bicycle. Genre theory exists to explain what 'good writing' actually is: not one standard but many social actions — each genre a community's typified response to a recurring situation — and to insist that teaching writing means teaching what texts DO, for whom, and why.",
 asks:["What is a genre, if not a format — and what does it mean that texts ACT?","How do communities decide what counts as good writing, and why do the verdicts differ?","How do writers actually acquire new genres — immersion, instruction, or both?","Why do writing skills travel so badly between contexts, and what would help them travel?"],
 iftrue:{
  teachers:"Teach genres as social actions: before the format, the function — what does this kind of text do, for whom, in what recurring situation? Analyze real exemplars for their moves AND the reasons behind the moves; a move without its why ossifies into template. Write for real audiences in real genres whenever possible, and teach conventions honestly as community choices with histories — including where the community disagrees with the worksheet.",
  coaches:"Your disciplinary colleagues hold expert genre knowledge they cannot articulate — they know a good lab report on sight and can't say why. Surface it: mentor-text protocols, move-naming sessions, rubric revision from generic 'organization' toward genre-specific moves. That tacit-to-explicit work is some of the highest-value coaching in a secondary building.",
  leaders:"Honor disciplinary difference structurally: one universal writing rubric mandated everywhere flattens exactly what students need to learn — that communities differ. Fund publication venues and authentic audiences for student writing, and audit how much of your school's writing exists in the school-essay monoculture, a genre with no readers anywhere else on earth.",
  researchers:"The Swales move-analysis tradition gives you a method that scales from research articles to lab reports; the Sydney school supplies intervention evidence (explicit genre pedagogy, strongest for multilingual writers); the writing-transfer line (Beaufort, Wardle) connects genre awareness to the portability question; and Graham's writer(s)-within-community model is the integrative framework awaiting tests."},
 reasoning:{
  notice:["Template-following without purpose-understanding: the five-paragraph ghost haunting every genre a student writes.","Rules carried across genres where they fail — 'never use I' colliding with the methods section of every modern science paper.","Expert tacit knowledge in your building: colleagues who judge genre instantly and explain never.","The genres students already command that school never sees — the NLS point, arriving from the writing side."],
  assume:["That good writing is one thing: the theory's founding denial — 'good' is community-relative, which is why the A-essayist can fail the lab report honestly.","That teaching the format teaches the genre: moves without purposes produce mimicry that shatters at the first untypical situation.","That students absorb genres implicitly given enough reading: some do — the ones raised inside the community; explicit instruction is the equity move (the Sydney school's whole argument)."],
  decide:["Run genre-analysis routines: collect exemplars, name the moves, ask why each exists and what happens without it.","Assign the same content across two genres — the lab finding as report and as public explainer — and debrief what changed and why; that comparison IS transfer instruction.","Get real audiences: genre knowledge stays theoretical until a reader who isn't paid to read it responds.","Plan rhetorically before drafting: audience, purpose, situation — the questions that make format choices reasoned."],
  avoid:["Format worship: CER, five-paragraph, RACE as universal solvents rather than situated scaffolds with expiration dates.","Genre policing without genre teaching — grading conventions nobody explicitly taught.","'Never' and 'always' rules presented as nature rather than negotiated, shifting community agreements.","Audience-less writing forever: a diet of texts that act on no one teaches that writing does nothing."]},
 competing:[
  {scenario:"A teacher marks every use of 'I' wrong in science writing.", thisView:"The convention is community property, and the community moved: modern science writing uses first person routinely. Teach conventions with their reasons, their histories, and their current state — not as frozen law.", other:"The prescriptive tradition", otherView:"Shared standards exist for clarity and fairness: students need stable rules before nuance, and 'it depends on the community' dissolves into anything-goes for developing writers who need floors.", agree:"Both want conventions taught — the fight is over their epistemic status. The teachable synthesis: here is the convention, here is who holds it and why, here is where it's shifting — rules as community agreements students can master AND question."},
  {scenario:"How should genres be taught — explicit instruction or authentic immersion?", thisView:"(The new-rhetoric worry:) genres are so situated that classroom versions become dead specimens — formula risk is real, and genre knowledge divorced from genuine exigence ossifies on contact.", other:"The Sydney school (Martin, Rose)", otherView:"Implicit acquisition is a privilege: students from text-rich homes absorb the genres of power invisibly while everyone else is graded on what nobody taught. Explicit modeling and joint construction is the equity engine, with intervention evidence behind it.", agree:"The field's genuine live debate, best resolved in sequence: explicit scaffolds inside authentic situations with real audiences — visible teaching of moves, deployed where the genre actually acts. Formula is what happens when either half is dropped."}],
 research:{
  questions:["What are the moves of the genres students must write, discipline by discipline — and which are teachable with what effect?","Does explicit genre pedagogy improve writing quality and access, and for whom (the multilingual-writer evidence is strongest)?","Does genre awareness predict writing transfer across contexts?","How do community, cognition, and text interact in composing (the writer-within-community test)?"],
  methods:"Move analysis in the Swales tradition; intervention studies of explicit genre pedagogy (the Sydney school's teaching-learning cycle); longitudinal writing-transfer studies following writers across courses and workplaces; text analysis linking genre features to community uptake.",
  variables:"Move presence and quality, genre awareness measures, audience adaptation, writing quality by community-relevant criteria, and transfer performance in unfamiliar genres.",
  support:"Solid where it's been tested: explicit genre instruction shows consistent positive effects, with the strongest evidence for multilingual and marginalized writers — the equity argument has receipts. Move analysis is a mature, replicable method. Honest limits: the formula-ossification risk is documented, not hypothetical; transfer-via-genre-awareness is promising but young; and the grand integrative models (writer-within-community) remain frameworks more than findings. The practical floor is firm: teach moves with purposes, and audiences change everything."},
 reflect:["Which format do you teach as universal that is actually one community's habit — and what happens to your students the first time it fails them?","Pick your discipline's most important genre: can you name its moves and the reason each exists? If not, who in your building can — and have you asked?","When did a student of yours last write something a real audience actually read and answered?","What did the five-paragraph essay do FOR you and TO you as a writer — and where is your teaching repeating the trade?","Your dissertation is a genre with moves, gatekeepers, and a history: which of its conventions have you mastered, and which have you only obeyed?"],
 constellation:{builds:["vygotsky","situated"],complements:["wtl","flowerhayes","nls"],pairs:["transfer","digital_writing","toulmin"]},
 origins:"Miller's 'Genre as Social Action' (1984) redefined genre from form to social action; Swales analyzed discourse communities and research-article moves; Bazerman traced how genres system-atize activity. Graham's writer(s)-within-community model (2018) integrates cognitive and social strands into one framework — writing is simultaneously shaped by community and by writers' cognition.",
 claims:["Genres are typified rhetorical actions arising from recurrent social situations — knowing a genre is knowing social purpose, not just format.","Writing develops through participation in discourse communities with shared goals, norms, and tools.","Writing and its teaching are always situated: what counts as 'good writing' varies by community and activity system.","Cognitive processes and social context jointly and simultaneously shape composing (Graham's WWC model)."],
 constructs:[
  {term:"Genre as social action", def:"Miller's redefinition: genres respond to recurring exigencies; form follows social purpose."},
  {term:"Discourse community", def:"Swales: a group with common goals, mechanisms of communication, and specific genres and lexis."},
  {term:"Rhetorical moves", def:"Conventional steps within genres (e.g., CARS model for research introductions)."},
  {term:"Activity system / genre set", def:"Bazerman: interlocking genres coordinating work within institutions (e.g., the dissertation's genre ecology)."},
  {term:"Writer(s)-within-community", def:"Graham's model uniting community (purposes, members, tools) with writers' long-term memory, control, and production processes."}],
 applications:["Explicit genre pedagogy and disciplinary writing instruction (writing in the disciplines, WAC).","Mentoring doctoral writers into the dissertation and journal-article genres.","Analyzing school writing tasks as genre ecologies.","Designing authentic audiences and purposes for student writing."],
 critiques:["Explicit genre teaching risks formula and template-following (the 'genre as straitjacket' worry).","Community concepts can obscure conflict, power, and gatekeeping within communities.","Integrative models (WWC) are recent and still accumulating direct empirical tests."],
 related:["flowerhayes","nls","situated","vygotsky"],
 refs:["Miller, C. R. (1984). Genre as social action. Quarterly Journal of Speech, 70(2), 151–167.","Swales, J. M. (1990). Genre analysis: English in academic and research settings. Cambridge University Press.","Bazerman, C. (2004). Speech acts, genres, and activity systems. In C. Bazerman & P. Prior (Eds.), What writing does and how it does it (pp. 309–339). Erlbaum.","Graham, S. (2018). A revised writer(s)-within-community model of writing. Educational Psychologist, 53(4), 258–279."],
 compare:{learner:"An apprentice writer joining discourse communities", mechanism:"Participation in genres as typified social actions", instructor:"Genre guide making community conventions explicit", knowledge:"Genre knowledge: purpose, audience, moves, and community norms", critique:"Can drift into formula; power within communities underexamined"}

{
 id:"transfer", name:"Transfer of Learning", discipline:"Learning Theory", depth:"deep", dis:true, v3:true,
 theorists:"David Perkins & Gavriel Salomon; John Bransford & Daniel Schwartz; Anne Beaufort (writing transfer); Edward Thorndike (origins)",
 tagline:"The central problem of education: when, why, and how does learning in one context carry over to new contexts — and why does it so often fail to?",
 problem:"Every teacher has watched it: students who aced Tuesday's grammar quiz write Thursday's lab report as if commas were never invented; students who argue skillfully in English class post evidence-free claims in the civics forum an hour later. Schools are built on a promise — that what is learned here will be used elsewhere — and transfer theory exists because that promise fails far more often than anyone wants to admit. It arose from a practical dispute with real budget consequences: does Latin 'train the mind'? Thorndike's data said no, and the field has been working out what actually does travel, and under what conditions, ever since.",
 asks:["Why do skills demonstrated in one class fail to appear in the next classroom, subject, or year?","What must instruction do differently if application in new contexts — not performance on familiar ones — is the goal?","Is transfer a property of what was learned, how it was learned, or how the new situation is framed?","How would we even know transfer happened — what should count as evidence?"],
 iftrue:{
  teachers:"Stop treating application as something that happens after learning, and start teaching the connection itself: name the principle out loud, ask 'where else could this work?', practice the skill inside at least two different contexts, and frame lessons expansively ('you'll use this claim-evidence move in science and in arguments with your parents') rather than boundedly ('for Friday's test').",
  coaches:"Diagnose 'they can't do X' complaints as possible transfer failures before skill failures — the skill may exist in another room. Build cross-department bridges deliberately: shared academic vocabulary, common argument structures, co-planned assignments where the same thinking move appears in two subjects the same week.",
  leaders:"Audit the master schedule and curriculum maps for transfer architecture: are the school's highest-priority skills (argumentation, evidence use, revision) taught as portable and revisited across departments, or does each course own a private, non-transferring version? Protect cross-curricular planning time — transfer across classrooms requires teachers who know what happens in each other's classrooms.",
  researchers:"Measure transfer as your outcome, not just acquisition: include a genuinely new context, delay the measure, and consider PFL designs (can students learn the new thing faster?) rather than only sequestered tests. Specify which kind of transfer you claim — near/far, low/high road — because interventions that produce one routinely fail to produce the other."},
 reasoning:{
  notice:["Students performing well on the practiced format but failing when surface features change (word problems reworded, argument moved to a new genre).","Skills appearing in one class but not another — evidence the knowledge exists but is welded to its original context.","Students spontaneously saying 'this is like what we did in…' — the single cheapest indicator that bridging is happening.","What YOUR assessments actually measure: retention of the taught version, or use in an untaught situation?"],
  assume:["That the skill was actually learned in the first place (a transfer problem presumes acquisition — check that first).","That the two contexts really share a deep principle (some 'transfer failures' are teachers seeing similarity students have no reason to see).","That students recognize the new situation as an occasion for the old learning — recognition, not ability, is often the missing piece."],
  decide:["Teach the abstraction explicitly: have students state the principle in their own words and forecast two places they'll reuse it (bridging).","Vary practice contexts systematically rather than drilling one format (hugging the range of target contexts).","Design 'same thinking, new clothes' assessments — familiar principle, unfamiliar surface — and treat them as instruction, not just measurement.","Coordinate with colleagues so the same move (e.g., claim-evidence-reasoning) is named identically across subjects."],
  avoid:["Assuming a skill taught once is a skill available everywhere — the default is non-transfer, not transfer.","Blaming students ('lazy', 'didn't study') for what is structurally a context-binding problem.","Teaching test-identical practice only — it maximizes tomorrow's score and minimizes portability.","Promising far transfer from generic 'brain training' or single-course critical-thinking fixes; the evidence is against it."]},
 competing:[
  {scenario:"A student writes strong arguments in English but evidence-free posts in civics.", thisView:"The argumentation schema is context-bound: it was learned welded to English-class cues, and nothing taught the student to abstract and re-apply it — a bridging failure.", other:"Situated Learning (Lave & Wenger)", otherView:"There is no failure: 'arguing in English class' and 'posting in the civics forum' are different social practices with different norms and identities. The question isn't why the skill didn't move — it's why we expected one practice to appear inside a different community.", agree:"Both reject the idea that knowledge is a substance that automatically travels; both predict that authentic participation in the target context is part of the answer."},
  {scenario:"Students can't apply last month's math procedure to this month's science graph.", thisView:"High-road transfer required mindful abstraction that instruction never provided — students needed the principle named and practiced across both contexts.", other:"Cognitive Load Theory (Sweller)", otherView:"The procedure may never have been schematized at all: if working memory was overloaded during initial learning, there is no durable schema TO transfer. Fix acquisition (worked examples, load management) before diagnosing transfer.", agree:"Both agree that robust, well-organized initial learning is a precondition — you cannot transfer what was never consolidated."}],
 research:{
  questions:["Under what instructional conditions does argumentation (or any target skill) transfer across writing contexts, genres, or disciplines?","Does expansive framing / explicit bridging increase spontaneous transfer relative to business-as-usual instruction?","What knowledge domains (genre, discourse community, rhetorical situation) predict successful writing transfer?","Do PFL-style assessments reveal transfer that sequestered post-tests miss?"],
  methods:"Experimental and quasi-experimental designs with transfer tasks as outcomes; longitudinal qualitative case studies following writers across contexts (Beaufort; Wardle); design-based research iterating transfer-oriented instruction — your study's pairing of DBR with transfer measures sits squarely in this tradition.",
  variables:"Transfer task performance (near/far, immediate/delayed), spontaneous vs. prompted transfer, quality of abstraction (can students state the principle?), uptake speed in PFL designs, and coded evidence of bridging talk in classroom discourse.",
  support:"Strong and replicated for the core negative finding (transfer is hard and non-automatic) and for specific levers: spacing/varied practice, expansive framing (Engle), and Teaching-for-Transfer curricula (Yancey et al.). Far-transfer interventions remain contested; effect sizes shrink as distance grows. Overall: a mature literature with reliable design principles and honest unresolved debates."},
 reflect:["Think of the last skill you taught well. Where, outside your room, did you actually see a student use it — and if you never have, what would you need to change to find out?","When a student 'can't do' something in your class, how would you check whether the skill exists in another context before concluding it doesn't exist at all?","What is the deep principle beneath your next unit — and can YOU state it in one sentence that would make sense in a different subject's classroom?","Whose job is transfer in your building right now? If the honest answer is 'nobody's,' what would it look like for it to become somebody's?","Does your grading reward performance on the practiced version or use in new situations? What does that teach students about why they're learning?"],
 constellation:{builds:["behaviorism","infoprocessing"],complements:["desirable","srl","wtl","expectancyvalue"],contrasts:["situated"],pairs:["flowerhayes","writing_sociocultural","toulmin","dbr","hcd"]},
 origins:"Thorndike's identical-elements studies (1901) punctured claims that Latin 'trains the mind,' launching a century of transfer research. Perkins and Salomon systematized the field's distinctions (near/far, low road/high road); Bransford and Schwartz reframed transfer as preparation for future learning; Beaufort and Wardle brought the problem to writing studies, where it anchors your problem of practice.",
 claims:["Transfer is not automatic; it occurs reliably only under specific conditions of learning and instruction.","Low-road transfer rides on well-practiced, automatized skill triggered by perceptual similarity; high-road transfer requires mindful abstraction of principles and deliberate connection-making.","Teaching for transfer requires hugging (making learning resemble the transfer context) and bridging (explicitly abstracting and applying principles across contexts).","Traditional transfer tests understate what learners carry forward; the better question is whether prior learning prepares people to learn in the new situation (PFL).","In writing, transfer depends on knowledge of discourse community, genre, rhetorical situation, writing process, and subject matter — not generalized 'writing skill' alone (Beaufort)."],
 constructs:[
  {term:"Near vs. far transfer", def:"Carrying learning to closely similar contexts versus remote, dissimilar ones — far transfer is rare without explicit support."},
  {term:"Low road / high road", def:"Perkins & Salomon: automatic triggering of practiced routines vs. mindful abstraction and application of principles."},
  {term:"Hugging & bridging", def:"The two instructional levers: design tasks near the target context (hug) and explicitly abstract principles across contexts (bridge)."},
  {term:"Preparation for future learning (PFL)", def:"Bransford & Schwartz: transfer as readiness to learn from new resources, measured with learning opportunities rather than sequestered problem solving."},
  {term:"Adaptive expertise", def:"Expertise balancing efficiency with innovation — flexibility when routines fail (Hatano & Inagaki)."},
  {term:"Identical elements", def:"Thorndike's claim that transfer occurs only where situations share components — the historical baseline all later theories answer."},
  {term:"Bounded vs. expansive framing", def:"Engle: framing lessons as connected to students' pasts and futures increases transfer."}],
 applications:["Designing writing instruction that bridges across academic, civic, and digital contexts — the heart of your problem of practice.","Building metacognitive routines where students abstract rhetorical principles and forecast where they will reuse them.","Assessment design: PFL-style measures instead of one-shot sequestered tasks.","Evaluating whether critical-thinking and argumentation instruction produces context-crossing skill or context-bound performance."],
 critiques:["Persistent debate over how much far transfer is achievable at all (Detterman's skepticism vs. Perkins & Salomon's optimism).","Situated cognition theorists argue 'transfer' misframes the phenomenon — knowledge is tied to activity systems, so the unit of analysis should be participation (Lave; Greeno).","Measurement disputes: sequestered problem solving may miss transfer that PFL designs reveal.","Writing-transfer research is young; Beaufort-style longitudinal cases are rich but small-n."],
 related:["desirable","situated","flowerhayes","wtl","fallacies","socialcognitive"],
 refs:["Perkins, D. N., & Salomon, G. (1992). Transfer of learning. In International encyclopedia of education (2nd ed., Vol. 11, pp. 6452–6457). Pergamon.","Salomon, G., & Perkins, D. N. (1989). Rocky roads to transfer: Rethinking mechanisms of a neglected phenomenon. Educational Psychologist, 24(2), 113–142.","Bransford, J. D., & Schwartz, D. L. (1999). Rethinking transfer: A simple proposal with multiple implications. Review of Research in Education, 24(1), 61–100.","Beaufort, A. (2007). College writing and beyond: A new framework for university writing instruction. Utah State University Press.","Engle, R. A., Lam, D. P., Meyer, X. S., & Nix, S. E. (2012). How does expansive framing promote transfer? Educational Psychologist, 47(3), 215–231."],
 compare:{learner:"A traveler whose knowledge must cross contexts to matter", mechanism:"Automatized skill (low road) or mindful abstraction (high road) carried to new situations", instructor:"Designer of hugging and bridging; framer of expansive contexts", knowledge:"Principles and skills whose value lies in portability", critique:"Far transfer is contested; situated theorists reject the framing itself"}

{
 id:"hcd", name:"Design Thinking & Human-Centered Design in Education", discipline:"Education & Pedagogy", depth:"deep", dis:true,
 theorists:"Tim Brown & David Kelley (IDEO); Stanford d.school; Razzouk & Shute; Carroll et al.; Herbert Simon (intellectual root)",
 tagline:"A human-centered, iterative methodology — empathize, define, ideate, prototype, test — repurposed from product design as a way to solve educational problems and teach flexible thinking.",
 problem:"The initiative was designed in an office, launched at a faculty meeting, and dead by November — because it solved a problem the classrooms didn't have, elegantly. The new platform sits unused because nobody asked the people who would use it. A team 'surveyed stakeholders once' and called it understanding. Education is littered with solutions in search of problems and problems defined by whoever wasn't in the room. Human-centered design exists as a discipline against all of this: understand the users first, frame the right problem before generating answers, and test small before betting big — because the most expensive mistake in design is solving the wrong problem well.",
 asks:["Whose problem is actually being solved — and who defined it?","How do you discover the right problem before committing to an answer?","When does iteration beat planning, and how small can a first test be?","What do users' words, behaviors, and needs each reveal that the others hide?"],
 iftrue:{
  teachers:"Treat your students as users of the learning you design: shadow the experience, interview the confused, watch where the work actually stalls — empathy work before unit design finds the barriers your expertise has stopped seeing. Prototype small: one lesson, one class, one revision before scaling to the whole semester. And read student confusion as design feedback, not user error.",
  coaches:"Impose the define-stage discipline gently: teams leap from complaint to solution in one breath, and your highest-leverage question is 'what problem are we solving, and how do we know?' Run coaching cycles as design cycles — observed need, framed problem, small prototype, evidence, revision. Prototype your PD formats too; facilitators are designers with users.",
  leaders:"Give initiatives a genuine discovery phase with teachers as the users — journey-map the actual experience of your building's last rollout and learn why it died. Pilot, iterate, then scale; mandate-wide launches are untested prototypes with maximum blast radius. And guard against the method's decorative failure mode: sticky-note workshops without power-sharing are theater, and everyone in the room knows it.",
  researchers:"The education-specific evidence base is young — which is an invitation: process-fidelity measures (was empathy work real? was the problem reframed?), comparisons with participatory design traditions, and outcome studies beyond satisfaction. The writing-instruction line (Purdy, Leverenz, Wible) shows the pattern: rich conceptual work, classroom studies just beginning."},
 reasoning:{
  notice:["Whose voice shaped the current solution — and whose absence explains its failure pattern.","Solutions in search of problems: the purchased platform, the inherited program, the initiative with a name before a need.","The gaps between what users say, what they do, and what they need — all three diverge, and each is data.","Premature convergence in meetings: the first plausible solution ending discovery ten minutes in."],
  assume:["That you are the user — the designer's oldest error; your fluency makes you the worst judge of the beginner's experience.","That the first framing is the right framing: 'students won't revise' and 'revision costs too much and pays too little here' generate entirely different solutions.","That disagreement is obstruction — in discovery, it's the cheapest user research you'll ever get."],
  decide:["Schedule discovery before design: interviews, shadowing, journey maps — with a deliverable (a problem statement users validate).","Write the problem statement and test IT before testing any solution.","Prototype the smallest version that can teach you something, and instrument the feedback before launch.","Set revision criteria in advance: what evidence sends this back, forward, or to the shredder?"],
  avoid:["Empathy theater — performative listening en route to the predetermined answer; users detect it instantly and withdraw the honesty you needed.","Infinite ideation with no commitment: divergence is a phase, not a lifestyle.","Pilot purgatory — projects that neither scale nor die, consuming goodwill indefinitely.","Confusing novelty with value; the boring redesign that removes one real barrier beats the innovative one that photographs well."]},
 competing:[
  {scenario:"The initiative keeps failing in classrooms.", thisView:"It was designed without its users: restart discovery with teachers — what problem do THEY have, what does the rollout feel like from inside a classroom day, what would they prototype first?", other:"Policy Enactment (Ball, Braun & Maguire)", otherView:"All policy is remade in enactment — schools don't implement, they interpret, translate, and reconstruct with the actors and resources they have. Design for adaptation and sense-making support, because 'fidelity' to an office's design was never on offer.", agree:"Both bury the transmission model. Co-design plus adaptive implementation is one prescription in two vocabularies: build it with the people who must live it, and expect them to keep redesigning it — that's not failure, that's enactment."},
  {scenario:"A doctoral student needs a rigorous way to study an intervention she's designing for her own school.", thisView:"HCD supplies the design moves — empathy research to find the real problem, framing discipline, prototyped iterations that keep the intervention honest to its users.", other:"Design-Based Research (Brown, Cobb)", otherView:"DBR supplies the research architecture — theoretical conjectures, instrumented cycles, evidence standards, and claims that survive a committee. Design moves without research discipline is product development, not scholarship.", agree:"This is a marriage, not a fight: HCD tells you how to design and for whom; DBR tells you how to learn from it defensibly. Frameworks pairing them (like HCD4EDU with DBR) exist precisely because each is half of a dissertation."}],
 research:{
  questions:["Does design-thinking instruction develop measurable problem-framing and iteration skills — and do they transfer?","What distinguishes authentic HCD implementation from decorative workshop use?","How do HCD-designed educational interventions compare with expert-designed ones for adoption and outcomes?","What does empathy work contribute beyond conventional needs assessment?"],
  methods:"Case studies of design processes in schools; classroom studies of design-thinking pedagogy (the Wible line); process-tracing with fidelity rubrics; comparative and participatory-design studies; emerging measurement work on design-thinking competencies.",
  variables:"Problem-framing quality, iteration counts and revision rationales, user-involvement depth, adoption and sustained use, and learner outcomes where design thinking is the pedagogy.",
  support:"Candidly: enthusiasm still outruns evidence. Component practices stand on adjacent foundations — user research and iterative testing from HCI and design research, problem-finding from creativity research — and the conceptual case (Razzouk & Shute) is strong. But education-specific trials are scarce, measurement of design-thinking skill is immature, and the method's fiercest critics are right that without power-sharing it decorates decisions already made. The research frontier is exactly where practitioner-scholars work."},
 reflect:["Think of your school's last failed initiative. Who was it designed by, for whom, and when did its users first touch it?","What problem are you currently solving that you've never validated with the people who have it — and what would ten minutes of shadowing reveal?","Where are you the wrong judge of an experience because your own fluency blinds you to the beginner's version of it?","What is sitting in pilot purgatory in your world right now — and what evidence would honestly send it forward or to the shredder?","In your own research design: which parts are HCD (designing well) and which are DBR (learning defensibly) — and is either half missing?"],
 constellation:{builds:["dewey"],complements:["dbr","pbl","constructionism"],pairs:["agency","funds"]},
 origins:"Simon's The Sciences of the Artificial framed design as a distinct mode of inquiry; IDEO and the Stanford d.school popularized design thinking as an innovation method, and IDEO's Field Guide plus efforts like the Teachers Guild carried it into schools. In education it operates twice over: as a way educators design learning experiences (the lineage of your HCD4EDU framework) and as a pedagogy students engage in themselves.",
 claims:["Effective solutions begin with empathy — deep understanding of users' (students', teachers') experiences and needs rather than expert assumption.","Problem framing is as important as problem solving; defining the right problem is a design act.","Rapid prototyping and iteration outperform extended up-front planning under uncertainty; failure is data.","Design thinking cultivates transferable dispositions: ambiguity tolerance, cognitive flexibility, collaborative ideation, and bias toward action (Razzouk & Shute)."],
 constructs:[
  {term:"Empathize–Define–Ideate–Prototype–Test", def:"The d.school's canonical (nonlinear) phase model of human-centered design."},
  {term:"Empathy research", def:"Interviews, observation, and immersion that surface user needs — kin to teacher-as-ethnographer in funds of knowledge."},
  {term:"Problem framing / point-of-view statement", def:"Synthesizing needs into an actionable, human-centered problem definition."},
  {term:"Prototype & iterate", def:"Low-fidelity, fast, testable versions that convert ideas into feedback."},
  {term:"Wicked problems", def:"Rittel & Webber: ill-structured problems without definitive formulations — education's natural habitat, and design thinking's claimed niche."},
  {term:"Designerly ways of knowing", def:"Cross's argument that design constitutes a third culture of knowledge alongside sciences and humanities."}],
 applications:["Frameworks like your HCD4EDU: structuring teacher learning and instructional design around empathy, framing, and iteration.","Design challenges as pedagogy for student critical thinking and argumentation (define a problem, prototype a case, test it on an audience).","School improvement processes that start from student experience rather than compliance mandates.","Natural methodological partner to design-based research: HCD supplies the design moves, DBR supplies the research architecture."],
 critiques:["Educational evidence base is thin relative to enthusiasm; Razzouk & Shute note measurement of design-thinking skill is underdeveloped.","Critics see a corporate import that can trivialize equity work into sticky-note workshops ('design thinking is a rebrand of things educators already do').","Empathy phases can extract from communities without shifting power — participatory design traditions push further.","Phase models risk becoming lockstep recipes, contradicting the iterative spirit."],
 related:["dbr","dewey","constructionism","pbl","funds","transfer"],
 refs:["Brown, T. (2009). Change by design: How design thinking transforms organizations and inspires innovation. Harper Business.","IDEO.org. (2015). The field guide to human-centered design. IDEO.org.","Razzouk, R., & Shute, V. (2012). What is design thinking and why is it important? Review of Educational Research, 82(3), 330–348.","Carroll, M., Goldman, S., Britos, L., Koh, J., Royalty, A., & Hornstein, M. (2010). Destination, imagination and the fires within: Design thinking in a middle school classroom. International Journal of Art & Design Education, 29(1), 37–53.","Simon, H. A. (1996). The sciences of the artificial (3rd ed.). MIT Press."],
 compare:{learner:"A designer who empathizes, frames problems, and iterates toward solutions", mechanism:"Cycles of empathy, framing, prototyping, and testing under ambiguity", instructor:"Design coach and co-designer centering user experience", knowledge:"Actionable understanding built through making and testing", critique:"Evidence lags adoption; risk of shallow, extractive implementation"}
},
{
 id:"dbr", name:"Design-Based Research (DBR)", discipline:"Research & Methodology", depth:"deep", dis:true,
 theorists:"Ann Brown (1992); Allan Collins; Paul Cobb et al.; Design-Based Research Collective; Susan McKenney & Thomas Reeves; William Sandoval (conjecture mapping)",
 tagline:"A methodology that designs interventions in real classrooms and studies them through iterative cycles — advancing usable theory and improved practice simultaneously.",
 problem:"Educational research has a death valley: interventions that flourish in controlled studies and die on contact with actual schools — real schedules, real interruptions, thirty real students. Meanwhile practitioners who want to study their own settings are told rigor requires standing outside them. Ann Brown named the problem from inside it: she was a rigorous lab scientist whose findings kept failing to survive the trip to classrooms. DBR exists to dissolve the rigor-versus-relevance dilemma — to make the messy, authentic setting the laboratory, the iterations the method, and usable knowledge the product. For practitioner-scholars, it is the methodology that refuses to choose between improving your context and studying it.",
 asks:["Can research improve practice while studying it, without collapsing into anecdote?","How is rigor achieved in settings that cannot and should not be controlled?","What kind of theory should education research produce — universal laws, or humble, usable design knowledge?","What is the researcher's role when the researcher built the thing being studied?"],
 iftrue:{
  teachers:"As a partner in DBR, your classroom becomes a design lab and your craft knowledge becomes data: expect iterations rather than a fixed program, document what you adapt and why (your adaptations are findings, not deviations), and claim your seat in interpreting results — the methodology is built on the premise that practitioners know things researchers need.",
  coaches:"DBR-lite is a disciplined coaching stance: state the conjecture ('if we add sentence-level revision conferences, argument quality improves because…'), design the move, gather modest evidence, revise, repeat. Documenting cycles across several teachers turns coaching from serial advice-giving into the building of local design principles a whole department can use.",
  leaders:"Run improvement initiatives as design cycles instead of one-shot rollouts: explicit conjectures about why the change should work, planned revision points with criteria, evidence gathered at the mediating steps rather than only the year-end outcome. Resource the timeline honestly — iteration is not failure to launch; it is the method — and you inherit a cousin discipline (improvement science) with tools for exactly this.",
  researchers:"Draw the conjecture map before cycle one: high-level conjecture → design features embodying it → mediating processes → outcomes, with instrumentation planned for the middle boxes, because that is where DBR earns its claims. Pre-specify what would count as disconfirming evidence. Build your positionality defenses now — memo trail, critical friends, deliberate hunts for contrary data — and keep claims humble: you are producing design principles under conditions, not universal laws."},
 reasoning:{
  notice:["Where enactment diverges from design — the divergence is not noise; it is among your most important data about both the design and the setting.","Which conjectures your evidence actually touches: cycles drift, and instruments planned for conjecture A quietly end up measuring conjecture C.","Practitioners' unprompted modifications — each one is either a design flaw exposed or local wisdom worth absorbing into the next iteration.","Your own desire for the design to work, arriving disguised as interpretation."],
  assume:["That a failed cycle means a failed theory — implementation, dosage, and context each need ruling out first.","That iteration licenses changing everything: unprincipled churn between cycles destroys your ability to say what mattered.","That embeddedness only threatens validity — it also grants access, trust, and interpretive insight no outsider gets; the practitioner-inquiry tradition holds that insider knowledge is an asset to be disciplined, not a contaminant to be removed."],
  decide:["Write the conjecture map first and let it dictate instrumentation — especially of mediating processes, not just outcomes.","Schedule revision decisions with stated criteria before the cycle starts, so changes are principled rather than reactive.","Keep a design memo trail from day one; your dissertation's audit trail and your Chapter 5 are both hiding in it.","Change few things between cycles, and log every change against its reason."],
  avoid:["Adjusting multiple design features untracked between cycles, then narrating a clean causal story afterward.","Reporting only the cycles that worked — survivorship editing is the methodology's characteristic sin.","'Going objective' by withdrawing from the setting mid-study, which sacrifices the access that justified the method.","Claiming generality a single-site design cannot bear; the honest export is design principles with their conditions attached."]},
 competing:[
  {scenario:"We want to know whether this intervention works.", thisView:"First learn what 'it' even is in real conditions: iterate the design in context until it is stable and theorized, producing usable principles and a refined intervention — that is knowledge production, not pilot housekeeping.", other:"The experimental tradition (RCT)", otherView:"Causal claims require controlled comparison; continuous revision confounds the treatment, and without randomization you cannot separate design effects from enthusiasm, selection, and drift.", agree:"Less rivalry than sequence: design-and-develop through DBR, then test efficacy experimentally — the mainstream research pipeline now assumes exactly this division of labor. The fight is only over which phase deserves the word 'rigor,' and the answer is both."},
  {scenario:"A school wants to improve a stubborn process — say, ninth-grade course failure.", thisView:"Frame conjectures from learning theory, embody them in a designed intervention, and study the mediating processes across iterative cycles: the product is instructional theory you can use.", other:"Improvement Science (Bryk)", otherView:"See the system, not just the intervention: map variation ('what works for whom, under what conditions'), run rapid PDSA cycles against measurable aims, and scale through networked communities. The product is reliable processes, not theory.", agree:"Siblings, openly: both iterate in context with practitioners as partners. Choose by product — instructional theory (DBR) versus dependable organizational process (improvement science) — and many dissertations sensibly borrow tools from both."}],
 research:{
  questions:["How can claims from design cases be warranted — what distinguishes strong DBR from documented tinkering?","Do conjecture maps improve the transparency and testability of design studies?","How should evidence accumulate across cycles and across sites?","What does rigorous practitioner-positioned DBR require beyond outsider designs?"],
  methods:"DBR is itself the methodology: iterative design-enact-analyze-redesign cycles in authentic settings; mixed data streams (student work, observation, discourse, assessments) instrumented against a conjecture map; retrospective analysis across the full trajectory; positionality and audit-trail practices imported from practitioner inquiry.",
  variables:"Enactment fidelity and principled divergence, mediating processes named in the conjecture map, proximal learning outcomes, design revisions with rationales, and contextual conditions that qualify every claim.",
  support:"As a methodology, thoroughly institutionalized: a founding literature (Brown; Collins), canonical successes in the learning sciences, dedicated handbooks, and standard tools (conjecture mapping) that answered the early 'anything goes' critique. Honest limits remain structural: generalization is argued through design principles rather than sampling, rigor varies widely across published studies, and the dual designer-researcher role demands the defenses it is too often reported without."},
 reflect:["State your study's central conjecture in one sentence: if we design ___, then ___ will happen, because ___. Which part is weakest right now — the design, the outcome, or the because?","What evidence would genuinely disconfirm your design's theory — and is anything in your plan capable of catching it?","Where will your closeness to the setting help your study, and where will it need disciplining? Name one concrete defense for each.","What happened in your context's last failed initiative — and would a conjecture map have caught the flaw before year two?","If your findings must travel as design principles with conditions attached, what conditions of your site should every reader know?"],
 constellation:{builds:["dewey"],complements:["hcd","practitioner","schon"],contrasts:["behaviorism"],pairs:["transfer","wtl","kolb"]},
 origins:"Ann Brown and Allan Collins, frustrated that laboratory findings died in real classrooms, proposed 'design experiments' in 1992: engineer innovations in messy authentic settings and treat each iteration as both intervention and investigation. Cobb and colleagues, the DBR Collective, and McKenney and Reeves matured it into a methodology now central to practice-focused doctorates like the EdD.",
 claims:["Educational phenomena must be studied in ecologically valid settings, not stripped-down labs.","Design and research are joint products: each iteration tests theoretical conjectures embodied in the designed intervention.","DBR yields humble, contextual theory — domain-specific instructional theories and design principles, not universal laws.","Progressive refinement across cycles (design → enact → analyze → redesign) is the engine of both rigor and relevance.","Researchers work as partners with practitioners, which is a feature for relevance and a threat to manage for validity."],
 constructs:[
  {term:"Iterative cycles", def:"Repeated design–enactment–analysis–redesign loops; the analytic unit is the trajectory across cycles."},
  {term:"Conjecture mapping", def:"Sandoval's tool linking high-level conjectures → embodiment in design features → mediating processes → outcomes."},
  {term:"Ecological validity", def:"Findings grounded in the buzzing complexity of real classrooms (Brown's 'Hawthorne effect' worry inverted)."},
  {term:"Design principles", def:"The transferable output: heuristic statements of what works, for whom, under what conditions."},
  {term:"Humble theory", def:"Cobb et al.: theory accountable to the activity of design — modest, domain-specific, revisable."},
  {term:"Mixed-methods integration", def:"Quantitative outcome measures interwoven with qualitative process data across cycles — the typical EdD DBR architecture."}],
 applications:["The methodology of your dissertation: iterating an HCD4EDU-based writing intervention across cycles while studying transfer of argumentation.","Conjecture maps as the bridge from framework (HCD4EDU) to measurable mediating processes.","Curriculum and edtech development projects requiring evidence plus usability.","Research–practice partnerships between districts and universities."],
 critiques:["Dual designer/researcher role invites confirmation bias; requires explicit positionality and disconfirming-evidence strategies (your matrix's practitioner-research gap).","Generalizability is limited and must be argued through design principles, not sampling logic.","Under-specified standards: critics call some DBR 'anything goes'; conjecture mapping and pre-registration of cycles respond.","Resource-intensive; iteration timelines collide with school calendars and IRB constraints."],
 related:["practitioner","hcd","vygotsky","transfer","epistemology"],
 refs:["Brown, A. L. (1992). Design experiments: Theoretical and methodological challenges in creating complex interventions in classroom settings. Journal of the Learning Sciences, 2(2), 141–178.","Cobb, P., Confrey, J., diSessa, A., Lehrer, R., & Schauble, L. (2003). Design experiments in educational research. Educational Researcher, 32(1), 9–13.","Design-Based Research Collective. (2003). Design-based research: An emerging paradigm for educational inquiry. Educational Researcher, 32(1), 5–8.","McKenney, S., & Reeves, T. C. (2019). Conducting educational design research (2nd ed.). Routledge.","Sandoval, W. (2014). Conjecture mapping: An approach to systematic educational design research. Journal of the Learning Sciences, 23(1), 18–36."],
 compare:{learner:"A participant in an evolving, designed learning ecology", mechanism:"Iterative design cycles test theory embodied in interventions", instructor:"Co-designer/researcher refining the intervention each cycle", knowledge:"Humble, contextual theory plus workable design principles", critique:"Researcher-designer bias and limited generalizability must be managed"}
},
{
 id:"wtl", name:"Writing to Learn & Writing Across the Curriculum", discipline:"Writing", depth:"deep", dis:true,
 theorists:"Janet Emig (1977); James Britton; Arthur Applebee & Judith Langer; Steve Graham & Dolores Perin; George Hillocks",
 tagline:"Writing is not just a way to display learning but a unique mode of learning — and it belongs in every discipline, taught through environments of inquiry rather than lecture alone.",
 problem:"In most schools, writing lives in one department and everywhere else it is a grading burden — assigned rarely, mostly as summary, mostly at the end, mostly to prove learning already happened. Meanwhile teachers everywhere face the same frustration: students who 'covered' the content but cannot explain it, discussions that sparkle while written reasoning stays thin, and understanding that evaporates because it was never constructed by the student in the first place. Writing-to-learn theory exists to flip the arrangement: composing is not the receipt for learning — it is one of the most powerful ways learning happens.",
 asks:["Is writing a record of learning or a means of it — and what changes if it is the latter?","Why does the act of composing transform understanding in ways listening and re-reading do not?","Which writing tasks actually produce learning, and which just produce paper?","Whose job is writing in a school where every discipline thinks in text?"],
 iftrue:{
  teachers:"Install short, frequent, low-stakes writing in every subject — explain the concept to a confused friend, justify the prediction, defend the answer you almost chose. Design prompts that force transformation (compare, argue, apply) rather than retelling, because knowledge-telling produces paper while knowledge-transforming produces learning. And read the writing as evidence of thinking to act on, not primarily as prose to correct.",
  coaches:"Your biggest obstacle is an equation in teachers' heads: writing = essays = a weekend of grading. Break it with structures — three-minute quickwrites, claim-and-justify exit slips, ungraded explanation warm-ups — and co-design tasks in each discipline's authentic genres, so the science teacher is teaching science notebooks, not borrowed English essays.",
  leaders:"Writing across the curriculum fails as a memo and works as structure: shared expectations, protected time, and respect for disciplinary difference (mandating one universal rubric flattens exactly what matters). Start with an honest audit — national data suggest students do shockingly little sustained composing — and treat minutes-of-actual-writing as a leading indicator worth tracking.",
  researchers:"Task design is the interesting variable: writing-to-learn effects hinge on prompt type, metacognitive framing, and discipline. Compare task structures against each other, not writing against no-writing, and mind the time-on-task confound that haunts this literature."},
 reasoning:{
  notice:["What student writing reveals that discussion concealed: the misconception that surfaces mid-paragraph is formative gold.","The gap between talk quality and written reasoning — it locates exactly where understanding is still borrowed from the group.","How much classroom 'writing' is actually copying, filling blanks, or summarizing — versus composing ideas the student had to assemble.","Which students freeze at transcription: sometimes the thinking is fine and the bottleneck is the physical act of getting words down."],
  assume:["That weak writing means weak thinking — transcription load, second-language processing, or genre unfamiliarity can strangle good reasoning on its way to the page.","That any writing helps: the meta-analyses are clear that task design is the moderator, and retell prompts buy little.","That everything written must be graded — the belief that kills the practice; most writing-to-learn should be read, used, and never scored."],
  decide:["Adopt two or three brief routines and run them relentlessly: entrance explanations, claim–evidence–justify exits, predict-then-defend before labs.","Put writing BEFORE discussion — two silent minutes of composing raises the floor of who can contribute and what the talk builds on.","Anchor prompts in the discipline's real genres: the lab conclusion, the historical argument from sources, the justified solution path.","Respond selectively to ideas — one margin question beats ten corrections — and let most low-stakes writing simply do its cognitive work unmarked."],
  avoid:["Assigning writing only as end-of-unit assessment, which guarantees students meet ideas in writing exactly once.","Summary-only prompts when transformation is the goal.","Grading mechanics on thinking-writing — it teaches students that risk is punished and shuts down exactly the exploratory composing that produces learning.","Letting writing-to-learn become an ELA initiative with visitors' privileges elsewhere; the theory's whole claim is that composing belongs to every discipline."]},
 competing:[
  {scenario:"Students write constantly in this class, but content learning is flat.", thisView:"Look at the prompts: retell and summary tasks invite knowledge-telling, which recycles what students already have. Transformation prompts — argue, compare, apply to a new case — are what drive the learning effect.", other:"Cognitive Load Theory (Sweller)", otherView:"For novices, composing and mastering content simultaneously can overload working memory — the writing may be consuming the very capacity the content needs. Build initial schemas first, or scaffold the writing's structure so composing costs less.", agree:"Both point to the same fix from different directions: short, structured, well-designed tasks matched to learners' current knowledge — not more writing, better-designed writing."},
  {scenario:"Whose job is teaching writing — and is 'good writing' one thing?", thisView:"Writing is every discipline's learning tool; generic strategies (summarize, explain, justify) travel usefully across subjects and put composing to work for content everywhere.", other:"Genre & Sociocultural Theories (Miller, Swales)", otherView:"There is no generic 'good writing' — a lab report and a historical argument are different social actions of different communities, and teaching writing means apprenticing students into each discipline's actual genres.", agree:"Both reject outsourcing writing to English class. In practice they combine: generic writing-to-learn routines for building understanding, genre-specific instruction for producing the discipline's real texts."}],
 research:{
  questions:["Which task features (transformation demands, metacognitive prompts, length, frequency) moderate writing-to-learn effects?","Do effects differ by discipline — and do discipline-authentic genres outperform generic prompts?","Does writing before discussion improve the discussion and the subsequent learning?","How do argumentation-based writing tasks affect content learning compared with summary tasks?"],
  methods:"Meta-analysis of intervention studies; quasi-experiments embedded in content classrooms comparing task designs; design-based research iterating prompts and routines; text analysis linking features of student writing to learning outcomes.",
  variables:"Content achievement (immediate and delayed), task type and prompt structure, dosage and frequency, presence of metacognitive framing, and quality codes on the writing itself (transformation vs. telling).",
  support:"Reliable but honest-sized: meta-analyses find average effects around g ≈ .26–.30 for school writing-to-learn interventions, roughly doubling when tasks include metacognitive prompts. The pattern is consistent across sciences, social studies, and math. Translation: writing-to-learn is a dependable, inexpensive lever whose payoff is decided almost entirely by task design."},
 reflect:["In your class this week, how many minutes did students spend composing ideas — not copying, not filling in — and are you comfortable with that number?","Take your most recent writing prompt: could a student succeed on it by retelling? What one change would force transformation?","What did you learn about a student's thinking from the last piece of their writing you read — and what did you DO with that knowledge?","What would your grading load look like if two-thirds of student writing was never scored — and what stops that from being true now?","Which of your discipline's authentic genres do your students actually get to write — and which do they only ever read?"],
 constellation:{builds:["flowerhayes"],complements:["writing_sociocultural","toulmin","desirable"],contrasts:["cogload"],pairs:["transfer","srl","wineburg"]},
 origins:"Emig's landmark essay argued that writing uniquely integrates hand, eye, and brain, enacting learning principles (doing, connecting, feedback) in one act. Britton's language-across-the-curriculum work in Britain and the WAC movement in U.S. universities institutionalized the idea; Applebee and Langer's national snapshots and Graham and Perin's Writing Next meta-analysis supplied the evidence base — and documented how little extended writing schools actually assign.",
 claims:["Writing is epistemic: composing transforms understanding, it does not merely record it (knowledge-transforming, not knowledge-telling).","Writing about content improves learning of that content across disciplines (meta-analytic support: Bangert-Drowns et al.; Graham et al.).","Despite this, extended writing is rare in secondary classrooms — most 'writing' is fill-in and summary (Applebee & Langer's 'snapshot').","Effective writing instruction is 'environmental' (Hillocks): structured inquiry tasks and materials outperform both free-writing and lecture on form.","Specific practices — strategy instruction, summarization, collaborative writing, clear product goals — have strong effect sizes for adolescents (Writing Next)."],
 constructs:[
  {term:"Writing to learn vs. learning to write", def:"Short, exploratory writing that deepens content understanding vs. instruction in composing itself; WAC programs pursue both."},
  {term:"Epistemic writing", def:"Emig/Britton: composing as a process that generates and restructures knowledge."},
  {term:"WAC / WID", def:"Writing across the curriculum (general) and writing in the disciplines (genre- and discipline-specific) program models."},
  {term:"Environmental mode", def:"Hillocks' meta-analytic winner: inquiry-based tasks, clear objectives, and structured peer interaction."},
  {term:"Knowledge-transforming", def:"Bereiter & Scardamalia's expert pattern: reworking ideas to meet rhetorical goals — the mechanism WTL exploits."},
  {term:"Extended vs. mechanical writing", def:"Applebee & Langer's distinction exposing how little sustained composing schools assign."}],
 applications:["Arguing the significance of your problem of practice: writing is where critical thinking becomes visible and learnable across contexts.","Designing content-area writing tasks (science notebooks, historical arguments, math justifications) as thinking routines.","Professional development helping disciplinary teachers see writing as their work, not ELA's alone.","Selecting high-effect practices (strategy instruction, inquiry tasks, collaborative writing) for intervention design."],
 critiques:["WTL effects are reliable but modest and depend heavily on task design and metacognitive prompts.","WAC programs struggle with sustainability and disciplinary buy-in ('a moment, not a movement' worry).","Generic WTL can ignore genre and community specificity — WID and genre theory push back.","Measuring 'learning through writing' separately from time-on-task is methodologically tricky."],
 related:["flowerhayes","writing_sociocultural","transfer","toulmin","desirable"],
 refs:["Emig, J. (1977). Writing as a mode of learning. College Composition and Communication, 28(2), 122–128.","Applebee, A. N., & Langer, J. A. (2011). A snapshot of writing instruction in middle schools and high schools. English Journal, 100(6), 14–27.","Graham, S., & Perin, D. (2007). Writing next: Effective strategies to improve writing of adolescents in middle and high schools. Alliance for Excellent Education.","Hillocks, G. (1986). Research on written composition: New directions for teaching. National Conference on Research in English.","Bangert-Drowns, R. L., Hurley, M. M., & Wilkinson, B. (2004). The effects of school-based writing-to-learn interventions on academic achievement: A meta-analysis. Review of Educational Research, 74(1), 29–58."],
